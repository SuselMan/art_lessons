<button id="run">Run mode specialization A/B</button><pre id="result"></pre><script type="module">import{runFieldSpecialization}from"./run.js";document.querySelector("button").onclick=async()=>{document.querySelector("button").disabled=true;try{window.result=await runFieldSpecialization();document.querySelector("pre").textContent=JSON.stringify(window.result,null,2)}catch(e){document.querySelector("pre").textContent=e.stack}finally{document.querySelector("button").disabled=false}}</script>
