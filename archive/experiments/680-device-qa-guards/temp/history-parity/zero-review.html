<!doctype html><meta charset="utf-8"><div id="holder"></div><script type="module">
import {PencilEngine} from '/src/engine/index.ts';
let e,c,stages=[],pending=[],brush=0;const sleep=t=>new Promise(r=>setTimeout(r,t));
const sha=async a=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',a))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function idle(){const t=performance.now();while(e._settle||e._opQueue.length||e._rebuildJobs.size||e._pendingRebuilds.size||e._washReveals.size){if(performance.now()-t>120000)throw Error('idle120');await sleep(16)}}
function fields(s){const g=e.gl,old=g.getParameter(g.FRAMEBUFFER_BINDING),rows=[];try{for(const[tile,x]of s.tileEntries()){const row={size:[tile.width,tile.height],fields:{}};for(const k of ['inkLoad','inkColor','coverage','solventLoad','foreignSolventLoad']){const b=x[k];if(!b)continue;const a=new Uint8Array(b.width*b.height*4);g.bindFramebuffer(g.FRAMEBUFFER,b.fbo);g.readPixels(0,0,b.width,b.height,g.RGBA,g.UNSIGNED_BYTE,a);const nz=new Uint32Array(a.buffer).some(x=>x!==0);row.fields[k]={nonzero:nz};pending.push(sha(a).then(hash=>row.fields[k].sha=hash))}rows.push(row)}}finally{g.bindFramebuffer(g.FRAMEBUFFER,old)}return rows}
async function fresh(skip,capture=true){e?.destroy();c?.remove();c=document.createElement('canvas');c.width=640;c.height=480;holder.append(c);e=new PencilEngine(c,{pageWidth:640,pageHeight:480,paper:'fine',userId:'zero-qa'});await e.paperReady();e.initLayer('L');e.setActiveLayer('L');e.setCompositeOrder([{id:'L',opacity:1}]);e.setViewport(320,240,1,0);e._wcZeroPigmentContacts=skip;brush=0;stages=[];pending=[];const old=e._watercolorPasses.brushPass.bind(e._watercolorPasses);e._watercolorPasses.brushPass=(...a)=>{brush++;return old(...a)};const prep=e._settlePlan.prepare.bind(e._settlePlan);e._settlePlan.prepare=(...a)=>{const before=brush,t=performance.now(),job=prep(...a);if(job){const finish=job.finish;job.finish=()=>{finish();stages.push({skip:!!a[11],sourceZero:a[0].pigmentInputsKnownZero,brush:brush-before,ms:performance.now()-t,fields:capture?fields(a[0]):undefined})}}return job}}
function journal(kind){const now=Date.now()-5000,dabs=(size,n,y)=>Array.from({length:n},(_,i)=>({x:250+140*i/(n-1),y,pressure:.8,tiltX:0,tiltY:0,size,aspectRatio:1,angle:0,opacity:1,t:i*16}));const ops=[];const put=(id,preset,size,n,y,wash,wet)=>ops.push({type:'stroke',id,userId:'zero-qa',layerId:'L',tool:'watercolor',preset,color:[.22,0,.6],strokeId:id,washId:wash,timestamp:now+ops.length*100,seq:ops.length,dabs:dabs(size,n,y),wet:wet.repeat(n)});if(kind==='painted')put('oldpaint','normal:0:70:PB29:round',64,8,240,'old','0');put('water','normal:100:0:PB29:round',kind.includes('400')?400:80,15,220,'water','0');if(kind==='dense400'){const ds=ops.at(-1).dabs;for(let i=0;i<ds.length;i++){ds[i].x=250+(i%2)*140;ds[i].y=180+i*8}}put('paint','normal:100:70:PB29:round',64,8,240,kind==='foreign'?'new':'water','f');return ops}
async function png(){const b=await e.exportPNG(true),i=await createImageBitmap(b),c=document.createElement('canvas');c.width=i.width;c.height=i.height;const g=c.getContext('2d');g.drawImage(i,0,0);i.close();const a=g.getImageData(0,0,c.width,c.height).data;const painted=new Uint32Array(a.buffer).filter(x=>x!==0).length;const hash=await sha(a);const data=await new Promise(r=>{const f=new FileReader;f.onload=()=>r(f.result);f.readAsDataURL(b)});c.width=c.height=0;return{hash,painted,data}}
async function run(ops,skip,capture=true){await fresh(skip,capture);const phases=[];for(const op of ops){const t=performance.now();e.appendOperation(op,'remote');await idle();phases.push({id:op.id,ms:performance.now()-t,png:await png()})}e.appendOperation({id:'dry',type:'paper_dry',userId:'zero-qa',timestamp:Date.now(),seq:ops.length},'remote');await idle();const dry=await png();e._rebuildLayer('L');await idle();const rebuild=await png();await Promise.all(pending);const g=e.gl,x=g.getExtension('WEBGL_debug_renderer_info');return{phases,dry,rebuild,stages,brush,gl:g.getError(),lost:g.isContextLost(),renderer:x?g.getParameter(x.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER)}}
window.zeroReview={journal,run};
</script>
