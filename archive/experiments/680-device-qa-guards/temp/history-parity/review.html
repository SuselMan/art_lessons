<!doctype html><meta charset="utf-8"><title>728: native/history oracle</title><div id="holder"></div><script type="module">
import {PencilEngine} from '/src/engine/index.ts';
import {DAB_VERT,DAB_FRAG} from '/src/engine/src/raster/shaders.ts';
import {createProgram,getUniforms} from '/src/engine/src/raster/utils.ts';
let e,canvas,phase='init',stages=[],pngMetrics=[];const sleep=t=>new Promise(r=>setTimeout(r,t));
async function idle(){const start=performance.now();while(e._settle||e._opQueue.length||e._rebuildJobs.size||e._pendingRebuilds.size||e._washReveals.size){if(performance.now()-start>90000)throw Error('idle90s '+phase);await sleep(16)}}
function digest(a){let h=2166136261;for(const v of a)h=Math.imul(h^v,16777619);return(h>>>0).toString(16)}
function capture(scratch,args){const ctx=scratch.finishContext;if(!ctx)return;const g=e.gl,previous=g.getParameter(g.FRAMEBUFFER_BINDING);const fields=[];try{for(const [tile,entry] of scratch.tileEntries()){const row={size:[tile.width,tile.height],fields:{}};for(const key of ['original','inkLoad','inkColor','coverage','strokeInk','strokeColor','solventLoad','strokeSolvent','inkDry','colorDry']){const b=entry[key];if(!b)continue;const x=Math.min(420,Math.max(0,b.width-128)),top=Math.min(130,Math.max(0,b.height-96));row.fields[key]=[];for(const y of [...new Set([top,b.height-top-96])]){const a=new Uint8Array(128*96*4);g.bindFramebuffer(g.FRAMEBUFFER,b.fbo);g.readPixels(x,y,128,96,g.RGBA,g.UNSIGNED_BYTE,a);let nonzero=0;const sums=[0,0,0,0];for(let k=0;k<a.length;k+=4){nonzero+=a[k]+a[k+1]+a[k+2]+a[k+3]>0;for(let c=0;c<4;c++)sums[c]+=a[k+c]}row.fields[key].push({rect:[x,y,128,96],hash:digest(a),nonzero,sums,bytes:['original','inkLoad','inkColor','coverage','solventLoad'].includes(key)?btoa(String.fromCharCode(...a)):undefined})}}fields.push(row)}}finally{g.bindFramebuffer(g.FRAMEBUFFER,previous)}stages.push({phase,args,gesture:scratch.gesture,ctx:{bounds:ctx.bounds,radiusPx:ctx.radiusPx,fieldSeed:ctx.fieldSeed,color:ctx.color,opacity:ctx.opacity,landedWet:ctx.landedWet,wetPeak:ctx.wetPeak,dwellMs:ctx.dwellMs,composite:scratch._composite,direction:scratch._dir,preset:ctx.preset,profile:ctx.profile},fields,gl:g.getError()})}
async function fresh(){e?.destroy();canvas?.remove();canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;document.querySelector('#holder').append(canvas);e=new PencilEngine(canvas,{pageWidth:640,pageHeight:480,paper:'fine',userId:'history-qa'});await e.paperReady();e.initLayer('tone');e.setActiveLayer('tone');e.setCompositeOrder([{id:'tone',opacity:1}]);e.setViewport(320,240,1,0);e.setTool('watercolor');e.setSize(64);e.setColor([.22,0,.6]);const finish=e._finishRibbonStroke.bind(e);e._finishRibbonStroke=(scratch,...args)=>{capture(scratch,args);return finish(scratch,...args)}}
function pointer(x,y,t,p=.75){return{x,y,pressure:p,tiltX:0,tiltY:0,speed:.4,pointerType:'pen',timeStamp:t}}
async function draw(preset,x0,x1){e.setPencil(preset);const t=performance.now();e._onStart(pointer(x0,180,t));for(let i=1;i<=12;i++){e._onMove(pointer(x0+(x1-x0)*i/12,180,t+i*16));await sleep(16)}e._onEnd(pointer(x1,180,t+13*16,0));await idle()}
async function png(){const blob=await e.exportPNG(true);if(!blob)throw Error('PNG absent');const bitmap=await createImageBitmap(blob),c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;const g=c.getContext('2d');g.drawImage(bitmap,0,0);bitmap.close();const a=g.getImageData(0,0,c.width,c.height).data;let painted=0;for(let k=3;k<a.length;k+=4)painted+=a[k]>0;pngMetrics.push({phase,painted,width:c.width,height:c.height});c.width=c.height=0;if(phase!=='undo'&&!painted)throw Error('empty canonical '+phase);return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}
async function dry(record){if(record)e.appendOperation({type:'paper_dry',id:'dry-'+e._log.entries.length,userId:'history-qa',seq:e._log.entries.length,timestamp:Date.now()},'remote');else e.watercolorDryAll();await idle()}
async function run(kind){stages=[];pngMetrics=[];phase='native';await fresh();await draw(kind==='singleWet'?'normal:100:70:PB29:round':'normal:0:70:PB29:round',360,520);await dry(kind==='recordedDry');if(kind!=='singlePigment'&&kind!=='singleWet'){await draw('normal:100:0:PB29:round',120,280);await draw('normal:100:0:PB29:round',360,520);await dry(kind==='recordedDry')}const native=await png(),journal=JSON.parse(JSON.stringify(e._log.entries.map(x=>x.op)));const checkpoints=e._checkpoints.all().map(c=>({opIds:c.opIds,carried:!!c.washes,tiles:c.tiles.length}));phase='defaultRebuild';e._rebuildLayer('tone');await idle();const defaultRebuild=await png();phase='fullRebuild';const best=e._checkpoints.best;e._checkpoints.best=()=>null;try{e._rebuildLayer('tone')}finally{e._checkpoints.best=best}await idle();const rebuild=await png();phase='undo';const undone=e.undo();await idle();const undo=await png();phase='redo';const redone=e.redo();await idle();const redo=await png();phase='repeatRebuild';e._rebuildLayer('tone');await idle();const repeat=await png();const out={kind,native,defaultRebuild,rebuild,undo,redo,repeat,journal,checkpoints,stages,pngMetrics,undone:!!undone,redone:!!redone,gl:e.gl.getError(),lost:e.gl.isContextLost(),renderer:(()=>{const x=e.gl.getExtension('WEBGL_debug_renderer_info');return x?e.gl.getParameter(x.UNMASKED_RENDERER_WEBGL):e.gl.getParameter(e.gl.RENDERER)})()};return out}
async function replay(journal,old){stages=[];pngMetrics=[];phase='replayAB';await fresh();if(old){const frag=DAB_FRAG.replace(/      if \(coverage < 0\.004\) \{[\s\S]*?        discard;\n      \}/,'      if (coverage < 0.004) discard;');if(frag===DAB_FRAG)throw Error('old shader replacement failed');const sp=e._stamps,prog=createProgram(e.gl,DAB_VERT,frag);e.gl.deleteProgram(sp.dabProg);sp.dabProg=prog;sp.dabUni=getUniforms(e.gl,prog,Object.keys(sp.dabUni));sp.dabPosLoc=e.gl.getAttribLocation(prog,'a_position')}for(const op of journal)e.appendOperation(op,'remote');await idle();e.watercolorDryAll();await idle();return{png:await png(),stages,gl:e.gl.getError(),lost:e.gl.isContextLost()}}
window.historyReview={run,replay};
</script>
