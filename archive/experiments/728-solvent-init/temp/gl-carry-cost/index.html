<!doctype html><meta charset="utf-8"><title>GL dead colour snapshot gate</title><pre id="prototype-output"></pre><div id="surface"></div><script type="module">import{GpuMethodTimer}from './timer.mjs';import*as engine from './run.js';import{runColourSnapshot,runColourSnapshotArm,runCarryBaselineArm}from'./colour-comparison.mjs';window.runColourSnapshot=options=>runColourSnapshot(engine,options);window.runColourSnapshotArm=options=>runColourSnapshotArm(engine,options);window.runCarryBaselineArm=()=>runCarryBaselineArm(engine);window.runCarryWholeArm=async enabled=>{try{return await engine.runPrototype({backend:'webgl2',scenario:'mixed400',paper:'fine',pageWidth:2048,verifyUndo:false,carryMrt:enabled})}finally{engine.disposePrototype()}};window.runCarryTimed=async()=>{let timer;try{const report=await engine.runPrototype({backend:'webgl2',scenario:'mixed400',paper:'fine',pageWidth:2048,verifyUndo:false,carryMrt:true,onPaintPhase:(phase,probe)=>{if(phase==='start'){timer=new GpuMethodTimer(probe.gl,{everyNth:1,maxPending:256});timer.wrap(probe._watercolorPasses,['fieldOp','carryPair'])}else for(const restore of timer?.restores.splice(0)??[])restore()}});for(let i=0;i<100&&timer.pending.length;i++){timer.poll();await new Promise(r=>setTimeout(r,16))}timer.poll();return{report,timer:timer.report()}}finally{timer?.dispose();engine.disposePrototype()}}</script>
