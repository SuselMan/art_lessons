<!doctype html><meta charset="utf-8"><title>Водяной тон: изолированный стенд</title><body><p>Вода на бумаге и поверх сухой краски.</p><div id="canvas"></div><script type="module">
import {PencilEngine} from '/src/engine/index.ts';
import {DISPLAY_VERT,PAPER_COMPOSE_FRAG as candidate} from '/src/engine/src/raster/shaders.ts';
import {createProgram,getUniforms} from '/src/engine/src/raster/utils.ts';
import {PAPER_COMPOSE_FRAG as baseline} from '/src/engine/src/raster/shaders-tone-baseline.ts';
let e,canvas;const sleep=t=>new Promise(r=>setTimeout(r,t));
async function idle(){const t=performance.now();while(e._settle||e._opQueue.length||e._rebuildJobs.size||e._pendingRebuilds.size||e._washReveals.size){if(performance.now()-t>60000)throw Error('idle60s');await sleep(16)}}
async function fresh(variant){e?.destroy();canvas?.remove();canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;document.querySelector('#canvas').append(canvas);const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false,antialias:false});const native=gl.shaderSource.bind(gl);gl.shaderSource=(shader,source)=>{if(source.includes('WC_WET_PAPER_TONE_SHARE'))source=variant==='baseline'?baseline:source.replace('WC_WET_PAPER_TONE_SHARE = 0.35','WC_WET_PAPER_TONE_SHARE = '+(variant==='mild'?'0.5':'0.35')).replace('WC_WET_PAINT_TONE_SHARE = 0.12','WC_WET_PAINT_TONE_SHARE = '+(variant==='mild'?'0.2':'0.12'));native(shader,'// cold-tone-'+Date.now()+'-'+Math.random()+'\n'+source)};window.__coldLinks=[];const link=gl.linkProgram.bind(gl);gl.linkProgram=p=>{link(p);__coldLinks.push({ok:gl.getProgramParameter(p,gl.LINK_STATUS),log:gl.getProgramInfoLog(p)})};e=new PencilEngine(canvas,{pageWidth:640,pageHeight:480,paper:'fine',userId:'wet-tone-qa'});await e.paperReady();e.initLayer('tone');e.setActiveLayer('tone');e.setCompositeOrder([{id:'tone',opacity:1}]);e.setViewport(320,240,1,0);e.setTool('watercolor');e.setSize(64);e.setColor([.22,0,.6]);return true}
function pointer(x,y,t,pressure=.75){return{x,y,pressure,tiltX:0,tiltY:0,speed:.4,pointerType:'pen',timeStamp:t}}
async function draw(preset,x0,x1){e.setPencil(preset);const t=performance.now();e._onStart(pointer(x0,180,t));for(let i=1;i<=12;i++){e._onMove(pointer(x0+(x1-x0)*i/12,180,t+i*16));await sleep(16)}e._onEnd(pointer(x1,180,t+13*16,0));}
async function png(){const blob=await e.exportPNG(true);return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}
function screen(){e._display();return canvas.toDataURL('image/png')}
function selectTone(variant){const gl=e.gl;const frag=variant==='baseline'?baseline:candidate.replace('WC_WET_PAPER_TONE_SHARE = 0.35','WC_WET_PAPER_TONE_SHARE = '+(variant==='mild'?'0.5':'0.35')).replace('WC_WET_PAINT_TONE_SHARE = 0.12','WC_WET_PAINT_TONE_SHARE = '+(variant==='mild'?'0.2':'0.12'));const previous=e._paperComposeProg;e._paperComposeProg=createProgram(gl,DISPLAY_VERT,frag);e._paperComposeUni=getUniforms(gl,e._paperComposeProg,['u_accumulation','u_paperMap','u_paperColor','u_paperScale','u_paperTexSize','u_dstSize','u_srcSize','u_matrixInv','u_screenToWorld','u_sharpResample','u_pageRect','u_deskColor','u_wetMap','u_wetRect','u_wetPeak']);e._paperComposePosLoc=gl.getAttribLocation(e._paperComposeProg,'a_position');gl.deleteProgram(previous)}
async function run(){await fresh('candidate');await draw('normal:0:70:PB29:round',360,520);e.watercolorDryAll();await idle();const dryBefore=await png(),screenBefore=screen();await draw('normal:100:0:PB29:round',120,280);await draw('normal:100:0:PB29:round',360,520);await idle();screen();const peak=e._paperWet.peak(performance.now()),update=e._updateWetTexture,peakFn=e._paperWet.peak;e._updateWetTexture=()=>{};e._paperWet.peak=()=>peak;const cases=[];try{for(const variant of ['baseline','mild','candidate']){selectTone(variant);cases.push({variant,screenWet:screen(),exportWhileWet:await png(),gl:e.gl.getError()})}}finally{e._updateWetTexture=update;e._paperWet.peak=peakFn}selectTone('candidate');e.watercolorDryAll();await idle();const dryAfter=await png();await e._syncBuffersToLog();await idle();const rebuild=await png();const undoOp=e.undo();await idle();const undo=await png();const redoOp=e.redo();await idle();const redo=await png();selectTone('baseline');await e._syncBuffersToLog();await idle();const baselineRebuild=await png();e.undo();await idle();e.redo();await idle();const baselineRedo=await png();return{baselineRebuild,baselineRedo,cases,dryBefore,screenBefore,dryAfter,rebuild,undo,redo,undoOp:!!undoOp,redoOp:!!redoOp,ops:e.getOperations(),wetPeak:peak,gl:e.gl.getError(),lost:e.gl.isContextLost(),renderer:(()=>{const d=e.gl.getExtension('WEBGL_debug_renderer_info');return d?e.gl.getParameter(d.UNMASKED_RENDERER_WEBGL):e.gl.getParameter(e.gl.RENDERER)})()}}
window.toneReview={run,idle,get engine(){return e}};
</script>
