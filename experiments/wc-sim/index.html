<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Акварель: песочница симуляции</title>
<style>
  :root { --bg: #e9e6df; --panel: #faf9f6; --ink: #222; --muted: #777; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #side { width: 250px; flex: none; background: var(--panel); padding: 10px 12px; overflow-y: auto; border-right: 1px solid #d8d4cc; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-width: 0; }
  canvas { touch-action: none; display: block; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.15); cursor: crosshair; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  label.r { display: grid; grid-template-columns: 1fr 44px; gap: 2px 6px; align-items: center; margin: 4px 0; }
  label.r input { grid-column: 1 / 3; width: 100%; }
  label.r span.v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; padding: 7px 10px; min-height: 36px; border: 1px solid #c9c4ba; background: #fff; border-radius: 6px; cursor: pointer; }
  button.on { background: #333; color: #fff; border-color: #333; }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw.on { border-color: #222; }
  #hud { position: absolute; top: 8px; right: 10px; background: rgba(255,255,255,.85); padding: 6px 8px; border-radius: 6px; font: 12px/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; }
  #err { color: #b00; white-space: pre-wrap; }
  select { font: inherit; width: 100%; }
  details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }
  @media (max-width: 700px) { #side { position: absolute; z-index: 2; height: 100%; transform: translateX(-100%); } #side.open { transform: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Акварель — физическая модель</h1>
    <div id="err"></div>
    <h2>Краска</h2>
    <div class="swatches" id="swatches"></div>
    <div id="pigName" style="color:var(--muted);margin-top:4px"></div>
    <h2>Кисть</h2>
    <label class="r">Размер <span class="v" id="v-size"></span><input id="size" type="range" min="3" max="80" step="1"></label>
    <label class="r">Вода <span class="v" id="v-water"></span><input id="water" type="range" min="0" max="1" step="0.01"></label>
    <label class="r">Пигмент <span class="v" id="v-pigment"></span><input id="pigment" type="range" min="0" max="1" step="0.01"></label>
    <h2>Холст</h2>
    <div class="btns">
      <button id="clear">Очистить</button>
      <button id="dry">Высушить всё</button>
      <button id="pause">Пауза</button>
      <button id="script">Тестовые мазки</button>
    </div>
    <label class="r">Шагов на кадр <span class="v" id="v-sub"></span><input id="sub" type="range" min="1" max="32" step="1"></label>
    <label class="r">Вид
      <select id="view" style="grid-column:1/3">
        <option value="0">краска</option><option value="1">вода на поверхности</option>
        <option value="2">вода в бумаге</option><option value="3">маска мокрого (размытая)</option>
        <option value="4">пигмент во взвеси</option>
      </select></label>
    <details id="phys"><summary>Физика (для подстройки)</summary><div id="physBody"></div></details>
  </div>
  <div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
