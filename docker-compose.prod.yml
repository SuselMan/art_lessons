# Production stack (#111) — postgres + the Fastify/Socket.io server only.
# apps/web is NOT a container here: it's a static build (`npm run build
# --workspace=apps/web`) served directly by the host's nginx (see
# deploy/nginx.conf), which also reverse-proxies /api and /socket.io to the
# `server` service below on 127.0.0.1 — matching the exact same same-origin
# shape apps/web/vite.config.ts's dev proxy already uses, just via nginx
# instead of Vite. No Redis (single server process, see CLAUDE.md); no
# object storage (Postgres bytea is enough at this scale, see #114).
#
# Secrets (POSTGRES_PASSWORD, JWT_SECRET) come from a .env file living only
# on the VPS (see deploy/README.md) — never committed here.
#
# server's image (#199) is built in CI, not here — the VPS was getting
# OOM-killed running that build itself on top of the already-live containers.
# (Коробка с тех пор выросла: на 2026-08-10 это 2 vCPU / 3.9 ГБ / 2 ГБ свопа,
# а не 1 vCPU / 1 ГБ / без свопа, как здесь было написано с #199. Сборка всё
# равно остаётся в CI — она там не из-за нехватки памяти, а потому что деплою
# нечего делать с исходниками.) SERVER_IMAGE is set by deploy.sh (from the
# workflow's own build job output — see deploy/README.md); `docker compose
# pull` fetches it, `up -d` recreates the container whenever the resolved
# image reference actually changed.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: art_lessons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: art_lessons
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U art_lessons"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE must be set, e.g. ghcr.io/suselman/art-lessons-server:<sha>}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://art_lessons:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/art_lessons
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # (#177) Unlike the two above, these are optional and come from the
      # deploy invocation rather than the VPS's .env — the workflow passes
      # them alongside SERVER_IMAGE (see deploy.yml). A DSN is a write-only
      # ingest key, not a credential: it can be used to send events to the
      # project and to do nothing else, which is why it lives in a repo
      # variable instead of a secret. Empty means the server simply doesn't
      # report, which is also what happens on a box that has never been
      # deployed to by CI.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # (#316) Sign-in mails the person a one-time code, so this is not an
      # optional notification channel: with no key, nobody can log in. It
      # travels the same way as the DSN above — from the deploy invocation,
      # not from the VPS's .env, so CI never has to rewrite the file that
      # holds POSTGRES_PASSWORD. Unlike the DSN it *is* a credential (it can
      # send mail as us), hence a repo secret rather than a variable.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Sender address. Empty falls back to Resend's shared onboarding domain,
      # which only ever delivers to the account owner — enough to smoke-test a
      # box, not enough to release. Set once a real domain is verified.
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      # Bound to loopback only — nginx on the host is the sole public entry
      # point (see deploy/nginx.conf), same reasoning as any reverse-proxied
      # backend never being directly internet-reachable on its own port.
      - "127.0.0.1:4000:4000"
    # (#415, трек #314 §1) Потолок памяти контейнера. До него `memory.max`
    # был буквально `max`: жертву при исчерпании выбирал kernel OOM killer, а
    # он выбирает по размеру — то есть с равным успехом мог убить Postgres,
    # превратив «сервер съел память» в «база упала посреди урока». С лимитом
    # умирает только тот контейнер, который память и съел, и `restart:
    # unless-stopped` поднимает его сам.
    #
    # 2 ГБ из 3.9 ГБ коробки: Postgres держит ~470 МБ и растёт с данными, ещё
    # ~200 МБ уходит на систему и docker. Остаток сознательно оставлен
    # страничному кэшу — он и есть скорость Postgres, и стоит больше, чем
    # запас по числу комнат, которого и так хватает с избытком (замер ниже).
    mem_limit: 2g
    # Своп контейнеру запрещён (лимит свопа = лимиту памяти): 2 ГБ свопа на
    # хосте спасали процесс от OOM ценой того, что живой урок уезжал на диск
    # — с точки зрения учителя это неотличимо от зависания, только дольше.
    memswap_limit: 2g

volumes:
  postgres_data:
