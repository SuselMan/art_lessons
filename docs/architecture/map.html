ted to other people.\n  invitedBy       User     @relation(fields: [invitedByUserId], references: [id])\n  createdAt       DateTime @default(now())\n\n  // Re-inviting an address already on the list is a no-op, not a second row —\n  // and the check \"is this address invited to this room\" is this index.\n  @@unique([roomId, email])\n}","truncated":false}],"RoomJoinRequest":[{"path":"packages/shared/src/room.ts","line":229,"kind":"type","snippet":"/** Someone waiting for the owner to let them in. `email` is included — unlike\n *  on `RoomAccessParticipant` below — because this person is actively asking\n *  the owner for a decision, and the address they are asking with is the\n *  minimum needed to make it a real one rather than a coin flip on a display\n *  name. Only reachable by someone signed in (a guest gets `login_required`),\n *  so it is never null in practice; typed nullable because `User.email` is. */\nexport type RoomJoinRequest = {\n  id: string\n  userId: string\n  name: string\n  email: string | null\n  requestedAt: string\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":503,"kind":"model","snippet":"// (#224) Someone who wants into an `invite_only` room and isn't on its\n// allow-list. The owner sees these as a queue and approves or denies.\n//\n// One row per (room, user), not one per request: a denial that spawned a fresh\n// row every time would let anyone holding the link grow this table without\n// limit, and the owner's queue with it. A repeat ask therefore flips the same\n// row back to `pending` (see #226's endpoints), which also keeps \"this person\n// was already denied once\" visible instead of laundering it into a new\n// request.\n//\n// `name` is what the asker typed on the join screen, snapshotted here rather\n// than read from User.name: a guest's row often has no name at all, and the\n// owner needs something to recognize them by while deciding.\nmodel RoomJoinRequest {\n  id          String                @id @default(uuid())\n  roomId      String\n  room        Room                  @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  userId      String\n  user        User                  @relation(fields: [userId], references: [id], onDelete: Cascade)\n  name        String\n  status      RoomJoinRequestStatus @default(pending)\n  requestedAt DateTime              @default(now())\n  resolvedAt  DateTime?\n\n  @@unique([roomId, userId])\n  // The owner-facing read is always \"pending requests for this room\".\n  @@index([roomId, status])\n}","truncated":false}],"RoomJoinRequestStatus":[{"path":"apps/server/prisma/schema.prisma","line":556,"kind":"enum","snippet":"enum RoomJoinRequestStatus {\n  pending\n  approved\n  denied\n}","truncated":false}],"RoomLayerSnapshot":[{"path":"apps/server/prisma/schema.prisma","line":379,"kind":"model","snippet":"// Client-baked snapshot of ONE layer's pixels as of `seq` (#149 epic, made\n// per-layer by #370). `data` is the gzip-compressed output of the engine's\n// `encodeLayerTiles` — raw RGBA tiles, no image codec anywhere in the path.\n//\n// One row per layer rather than one bundle per room, and that is the whole\n// point (#369). A bundle forced every bake to re-read every layer, which is\n// O(layers) of synchronous GPU readback every SNAPSHOT_SEQ_INTERVAL\n// operations; worse, a layer the baking client couldn't produce was simply\n// left out, and since operations were withheld from clients by a single\n// room-wide `latestSnapshotSeq`, a layer missing from the bundle lost its\n// content outright. Per-layer rows make the seq a property of the layer:\n// `coveredSeq(layer)` is the newest row for it, and everything after that\n// stays replayable from the operation log. Not sending a layer then costs\n// nothing but a missed optimisation.\n//\n// `hash` is sha256 of the *decompressed* `data` — used both to dedup (a\n// second upload for a (layer, seq) this room already has is discarded) and,\n// when SNAPSHOT_VERIFY_DETERMINISM is on, to detect a same-seq upload whose\n// pixels don't match what's already stored (a cross-device determinism\n// violation — see rooms.ts's saveSnapshot).\nmodel RoomLayerSnapshot {\n  id           String   @id @default(uuid())\n  roomId       String\n  room         Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  layerId      String\n  seq          Int\n  data         Bytes\n  hash         String\n  createdAt    DateTime @default(now())\n  // (#289 epic, reliable history spec v0.2 §13) Whether this snapshot has\n  // been independently corroborated. `unverified` on arrival; `verified`\n  // once a second, independently-produced bake of the same seq matched this\n  // one's hash; `disputed` if one didn't. Only a `verified` snapshot may\n  // ever justify deleting the raw operations it claims to cover — see\n  // rooms.ts's pruneOperationsBeforeSnapshot, which now refuses to prune\n  // against anything else. `disputed` is deliberately terminal and never\n  // auto-resolved: nothing here can tell which of two disagreeing bakes is\n  // the correct one, so both stay and the raw operations stay too.\n  verification String   @default(\"unverified\")\n\n  @@unique([roomId, layerId, seq])\n  // Every read is \"the newest row for this layer\" (coveredSeq) or \"the newest\n  // row for each layer of this room\" (restore) — both are this index.\n  @@index([roomId, layerId, seq])\n}","truncated":false}],"RoomLayerState":[{"path":"apps/server/prisma/schema.prisma","line":417,"kind":"model","snippet":"// The structural half of a snapshot (#370): which layers exist, their order,\n// names, opacity and visibility, as of `seq`.\n//\n// It used to travel inside each snapshot bundle, because a room-wide seq made\n// \"pixels and structure as of the same moment\" a single fact. With per-layer\n// coverage there is no room-wide moment left to attach it to, so it becomes\n// what it always was underneath: one current value per room, last write wins.\n//\n// Kept as a convenience rather than a source of truth. Every operation that\n// changes it is structural, and structural operations are resident for a\n// room's whole life (see rooms.ts's RESIDENT_OP_TYPES), so a client can\n// always rederive this by folding the log — this only saves it the walk.\nmodel RoomLayerState {\n  id        String   @id @default(uuid())\n  roomId    String   @unique\n  room      Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  seq       Int\n  state     Json\n  updatedAt DateTime @updatedAt\n}","truncated":false}],"RoomPalette":[{"path":"apps/server/prisma/schema.prisma","line":431,"kind":"model","snippet":"// One row per room (#190 epic) — kept separate from `Room` rather than a\n// JSON column on it, since `Room` is otherwise write-once after creation\n// (like Operation/RoomLayerSnapshot, everything that actually mutates during a\n// session lives in its own table); see packages/shared's DEFAULT_PALETTE_COLORS\n// doc comment for why this isn't part of the Operation log instead.\nmodel RoomPalette {\n  id        String   @id @default(uuid())\n  roomId    String   @unique\n  room      Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  colors    String[]\n  updatedAt DateTime @updatedAt\n}","truncated":false}],"RoomParticipant":[{"path":"apps/server/prisma/schema.prisma","line":285,"kind":"model","snippet":"// Persisted join history — one row per (room, user) ever, so \"Мои уроки\"\n// (#116) can list rooms a user was invited into, not just ones they own.\nmodel RoomParticipant {\n  id            String      @id @default(uuid())\n  roomId        String\n  room          Room        @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  userId        String\n  user          User        @relation(fields: [userId], references: [id], onDelete: Cascade)\n  firstJoinedAt DateTime    @default(now())\n  lastActiveAt  DateTime    @updatedAt\n  // (#226) What this person called themselves the last time they joined *this\n  // room*. Not derivable from `User.name`, which is null for all but a handful\n  // of rows: the display name is typed on the join screen and until now lived\n  // only in the live in-memory Participant, so it died with the session. The\n  // access panel lists everyone who has ever been in the room, including\n  // whoever is offline right now, and \"remove that one\" is not a decision\n  // anybody can make against a column of blank names and uuids.\n  //\n  // Per room rather than promoted to `User`, because that is the fact we\n  // actually have: someone can be \"Аня\" in their teacher's lesson and\n  // \"Guest-4821\" in a room they opened once from a shared link, and neither is\n  // more true than the other. Null only for rows written before this column\n  // existed.\n  name          String?\n  // (#211 epic) This room's folder placement for *this* user — folders are\n  // per-user organization, not a property of Room, and RoomParticipant is\n  // already one row per (room, user) for both owner and guest (see\n  // rooms.ts's persistParticipant, called for both). `null` = root level.\n  // SetNull on folder delete: folders are pure organizational metadata and\n  // never own room data (see RoomFolder below) — deleting one un-files its\n  // contents rather than touching the room/participation itself.\n  folderId      String?\n  folder        RoomFolder? @relation(fields: [folderId], references: [id], onDelete: SetNull)\n\n  @@unique([roomId, userId])\n}","truncated":false}],"RoomsAtFolder":[{"path":"packages/shared/src/rest.ts","line":75,"kind":"interface","snippet":"/** (#211, #215) One level of the folder tree: its folders and its rooms. */\nexport interface RoomsAtFolder {\n  folders: RoomFolder[]\n  rooms: Room[]\n}","truncated":false}],"RoomThumbnail":[{"path":"apps/server/prisma/schema.prisma","line":445,"kind":"model","snippet":"// One row per room (#209), same \"kept separate from `Room`\" reasoning as\n// RoomPalette above — a downscaled composite PNG the client periodically\n// POSTs (see thumbnailRoutes.ts) purely so \"Мои уроки\" room cards (#116) can\n// show a preview. Not to be confused with RoomLayerSnapshot (#149 epic): those are\n// opaque per-layer tile blobs for fast rejoin, this is a single flat image\n// meant to be displayed directly.\nmodel RoomThumbnail {\n  id          String   @id @default(uuid())\n  roomId      String   @unique\n  room        Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  data        Bytes\n  // (#595) PNG for every row written before ADR 015; the cheap live preview\n  // (engine.bakePreview) uploads WebP where the browser can encode it.\n  contentType String   @default(\"image/png\")\n  updatedAt   DateTime @updatedAt\n}","truncated":false}],"sanitizeClientEnvironment":[{"path":"packages/shared/src/admin.ts","line":212,"kind":"function","snippet":"/** Keeps the known keys whose values have the right type, and nothing else.\n *  The payload comes from a browser we do not control and is stored as Json,\n *  so this is the whole of its validation: unknown keys cannot grow the row,\n *  strings cannot be essays, numbers cannot be NaN. */\nexport function sanitizeClientEnvironment(raw: unknown): ClientEnvironment {\n  const out: Record\u003cstring, string | number | boolean> = {}\n  if (typeof raw !== 'object' || raw === null) return out\n  for (const [key, kind] of Object.entries(ENV_FIELDS)) {\n    const value: unknown = (raw as Record\u003cstring, unknown>)[key]\n    if (kind === 'string' && typeof value === 'string') out[key] = value.slice(0, MAX_ENV_STRING)\n    else if (kind === 'number' && typeof value === 'number' && Number.isFinite(value)) out[key] = value\n    else if (kind === 'boolean' && typeof value === 'boolean') out[key] = value\n  }\n  return out\n}","truncated":false}],"sanitizeEnabledTools":[{"path":"packages/shared/src/toolset.ts","line":63,"kind":"function","snippet":"/** Reads an arbitrary value — a socket payload, a REST body, a column written\n *  by an older build — into a toolset, or into `undefined` meaning \"no\n *  restriction\".\n *\n *  Three things it enforces, in this order, and each of them is the answer to\n *  a way the feature could quietly break a room:\n *\n *  - unknown ids are dropped rather than rejected, so a room created by a\n *    build that had one more tool than this one still opens (with that tool\n *    simply not offered) instead of failing to parse;\n *  - the result is deduped and reordered into `TOGGLEABLE_TOOLS` order, so a\n *    toolset compares as data rather than as the order someone clicked;\n *  - a list with no material left in it is *not* a toolset. A room nobody can\n *    draw in is read-only, which is its own setting (`closedAt`), and arriving\n *    at it by unchecking boxes would be an accident, never a decision. Such a\n *    list — and an empty one — reads as no restriction.\n *\n *  \"No restriction\" is deliberately `undefined` rather than a spelled-out list\n *  of all fifteen: the next tool this app ships has to appear in every room\n *  whose owner never restricted anything, and a stored full list would keep it\n *  out of all of them forever.\n */\nexport function sanitizeEnabledTools(value: unknown): ToggleableTool[] | undefined {\n  if (!Array.isArray(value)) return undefined\n  const picked = new Set(value.filter(isToggleableTool))\n  if (picked.size === 0) return undefined\n  const ordered = TOGGLEABLE_TOOLS.filter(tool => picked.has(tool))\n  if (!ordered.some(tool => TOOLSET_MATERIAL_TOOLS.includes(tool))) return undefined\n  // Every tool enabled is not a restriction, it is the default spelled out —\n  // store it as the default so a later-added tool is not excluded by it.\n  if (ordered.length === TOGGLEABLE_TOOLS.length) return undefined\n  return ordered\n}","truncated":false}],"SelectionShape":[{"path":"packages/shared/src/areaOperations.ts","line":31,"kind":"type","snippet":"/** (#446) A closed polygon in the same space layer pixels live in — canvas\n *  pixels for a bounded room, world units for an infinite one, exactly what\n *  `Dab.x/y` and `LayerTransformOperation.matrix` already use. Flat\n *  `[x0, y0, x1, y1, ...]` rather than `Array\u003c{x, y}>` because a freehand\n *  lasso records a point per pointer sample and this rides in the permanent\n *  operation log: the flat form is ~2.5x smaller as JSON and needs no\n *  decoding on the replay path.\n *\n *  One polygon, not a list of them: a v1 selection is a single region, and\n *  add/subtract (which is what would need several sub-paths, with a fill rule\n *  to go with them) is deliberately out of scope. The three ways to draw one\n *  — rectangle, point-by-point lasso, freehand lasso — differ only in how the\n *  UI collects the points, and a rectangle is simply its four corners; none\n *  of them reaches the wire as its own kind, which is why nothing downstream\n *  branches on how a selection was made.\n *\n *  The closing edge is implicit (last point back to first) and self-\n *  intersection is legal — the rasterizer fills by nonzero winding, so a\n *  lasso that crosses itself has a defined result rather than a rejected one.\n *\n *  Note the space: these are *layer* coordinates, never screen ones. The\n *  viewport is per-user local state (CLAUDE.md), so a selection recorded in\n *  screen pixels would land somewhere else on every other participant's\n *  canvas. */\nexport type SelectionShape = {\n  points: number[]\n}","truncated":false}],"SendResult":[{"path":"packages/shared/src/protocol.ts","line":191,"kind":"type","snippet":"// Result of sending one `Operation` to the server (#289 epic — reliable\n// history spec v0.2). Replaces the old \"ack always receives the stamped\n// copy\" contract: every operation now gets an explicit verdict, including\n// ones previously rejected in total silence (room/participant freeze,\n// owner-lock — see isOperationAllowed in rooms.ts, which used to just\n// `return` with no ack at all, indistinguishable from a dropped packet).\n// `duplicate: true` on an `ok` result means this exact `Operation.id` had\n// already been recorded (see rooms.ts's dedup) — the sender's own retry\n// raced its earlier attempt's ack, not a new operation.\nexport type SendResult =\n  | { ok: true; seq: number; duplicate?: boolean }\n  | { ok: false; reason: RejectReason }","truncated":false}],"ServerToClientEvents":[{"path":"packages/shared/src/protocol.ts","line":258,"kind":"type","snippet":"export type ServerToClientEvents = {\n  // `latestSnapshotSeq` is null until anyone has stored a snapshot for this\n  // room (short rooms) — `tailOperations` is then simply the room's entire\n  // history, same shape/behavior as before the #149 epic. Once non-null the\n  // caller is expected to fetch the stored snapshots itself\n  // (GET /api/rooms/:id/snapshots/index, then one blob per layer — #427); the\n  // seq is the structure's own, and is what a history backfill anchors on.\n  //\n  // (#372) What `tailOperations` leaves out is decided per layer, against each\n  // layer's own stored coverage, not by one room-wide seq. A room-wide floor\n  // is what lost drawing in #369: a layer missing from a snapshot had no\n  // pixels *and* was refused the operations that would have rebuilt it.\n  //\n  // Only *pure* pixel operations are ever omitted (stroke/image_import/\n  // layer_clear on a layer covered at or past their seq) — the heavy ones,\n  // where all the saving is. Operations carrying pixels *and* something else\n  // — `layer_merge` (also structure) and `layer_transform` (several layers at\n  // once) — always arrive, because the client needs their other half, and it\n  // skips their pixel effect itself against the coverage it actually restored\n  // (#374). That coverage travels with the snapshots themselves, per layer, so\n  // nothing about it needs saying here: deciding it from what this client\n  // really has is what makes a snapshot landing mid-join harmless rather than\n  // a double-paint.\n  room_state: (state: {\n    room: Room; latestSnapshotSeq: number | null; tailOperations: Operation[]; participants: Participant[]\n    palette: string[]\n    // (#254/#255 epic) Room-wide freeze, live in-memory only (never\n    // persisted — see rooms.ts's RoomRecord.roomFrozen) — included in the\n    // join/reconnect snapshot so a reconnecting client sees the current\n    // status immediately, same reasoning as `participants`/`palette` above.\n    frozen: boolean\n    // (#176, ADR 014) The lesson this board is a page of, its board strip and\n    // the teacher's current board. `participants` above are the *lesson's*,\n    // each carrying the board they are on. A client that receives this for a\n    // board id it reached by URL learns the lesson id here and redirects.\n    lesson: LessonState\n  }) => void\n  // The single channel that drives painting into every client's confirmed\n  // buffer — including the author's own (unlike the old `peer_operation`,\n  // which `socket.to()` deliberately excluded the sender from). Broadcast\n  // via `io.to(roomId)`, one emit per accepted operation, in the exact\n  // order the server accepted them — WebSocket/TCP guarantees a single\n  // connection never reorders its own message stream, so this is already a\n  // strictly seq-ordered feed with no separate reorder buffer needed on the\n  // client (reliable history spec v0.2, §11). `seq` is carried at the top\n  // level (not just inside `operation`, where it's optional until stamped)\n  // so logging/replay/gap-detection never has to reach into the union.\n  operation_confirmed: (msg: { seq: number; operation: Operation }) => void\n  // (#429) A peer's in-progress stroke, relayed as it is drawn — see\n  // StrokeLiveData. Sent via `socket.to`, not `io.to`: unlike\n  // operation_confirmed, the author gains nothing from receiving their own\n  // (their own ink is already on their own layer, painted at pen time).\n  peer_stroke_live: (data: StrokeLiveData & { userId: string }) => void\n  peer_stroke_live_end: (data: { userId: string; strokeId: string }) => void\n  peer_cursor: (data: CursorMoveData & { userId: string }) => void\n  peer_joined: (participant: Participant) => void\n  peer_left: (userId: string) => void\n  // Broadcast to every participant (including the one who triggered it) after\n  // palette_add_color/palette_remove_color is accepted — see\n  // DEFAULT_PALETTE_COLORS' doc comment in room.ts for why this isn't an\n  // Operation. Always the full current list, not a delta: this is a handful\n  // of hex strings, not worth reconciling incrementally.\n  palette_updated: (data: { palette: string[] }) => void\n  // (#254/#256 epic) Broadcast to the whole room (including the owner who\n  // triggered it, same `io.to` reasoning as palette_updated above) whenever\n  // `set_room_frozen` is accepted.\n  room_frozen_changed: (data: { frozen: boolean }) => void\n  // (#548) Broadcast to the whole room after `set_room_tools` is accepted —\n  // `io.to`, like the two events above, because the owner who made the change\n  // is also a person holding a tool that may have just been taken away.\n  //\n  // It has to be live rather than something a client learns on its next join:\n  // the toolset is a teaching control (\"today we work in pencil\"), and a\n  // control that lands only after everyone reloads is one nobody will reach\n  // for mid-lesson. `undefined` is the unrestricted room, same as on `Room`.\n  room_tools_changed: (data: { enabledTools?: ToggleableTool[] }) => void\n  // (#254/#257 epic) Broadcast to the whole room whenever `set_participant_frozen`\n  // is accepted — every participant needs this, not just the target, so\n  // ParticipantsPanel can show the frozen indicator for everyone else too.\n  participant_frozen_changed: (data: { userId: string; frozen: boolean }) => void\n  // (#222) Broadcast to everyone in the room when its closed-for-editing\n  // state is toggled. The toggle itself is REST, not a socket event (see\n  // roomRoutes.ts): it is owner-only, persisted, and reachable from the\n  // lesson list where there is no socket for that room at all. This event\n  // exists so people already *inside* the room find out at the moment it\n  // happens rather than on the rejection of their next stroke.\n  // ISO timestamp while closed, null once reopened — the same shape the\n  // wire `Room.closedAt` carries.\n  room_closed_changed: (data: { closedAt: string | null }) => void\n  // (#227) The three live halves of access control. Everything durable about\n  // it is REST (#226) and every decision is re-made from Postgres on the next\n  // join (#225) — these exist so nobody has to reload a page to find out\n  // something already happened to them.\n  //\n  // Unlike every event above, these are addressed to a *person*, not to a\n  // room: the owner may be looking at their lesson list rather than sitting in\n  // the room, and someone waiting for approval was refused entry and is in no\n  // socket.io room at all. Each socket therefore also joins a channel of its\n  // own userId (see socketHandlers.ts's userChannel), and these are emitted\n  // there — which also means every tab that person has open hears it.\n\n  // Sent to the room's owner when someone asks to be let in. Carries the\n  // request itself so the panel can render the new row without refetching;\n  // `roomId` because an owner with several lessons open needs to know which.\n  join_request_created: (data: { roomId: string; request: RoomJoinRequest }) => void\n  // Sent when a request is decided — including when the decision was made\n  // implicitly, by inviting the address they were queued under. On `approved`\n  // the client finishes the join it was refused (it re-emits `join_room`); the\n  // server holds nothing open in the meantime, so a client that missed this\n  // event while offline simply gets in on its next attempt.\n  //\n  // (#387) Two audiences, one payload: the asker, whose join screen resolves\n  // itself, and the *owner*, whose waiting queue (#380) has to lose the row.\n  // The owner needs it because the decision is not always theirs to observe\n  // locally — answering from the lesson list, or from a second device, leaves\n  // the room's queue showing someone who is already in. `requestId` is what\n  // makes that removal exact: without it the receiver knows a request was\n  // answered but not which, and can only re-read the whole queue.\n  join_request_resolved: (data: { roomId: string; requestId: string; approved: boolean }) => void\n  // Sent to someone being removed from a room they are currently in, right\n  // before the server takes them out of it. Not a disconnect: their connection\n  // stays up so the client can navigate away (and keep working elsewhere)\n  // rather than reconnect into a room it is no longer in.\n  kicked: (data: { roomId: string }) => void\n\n  // (#176, ADR 014) Boards. Every event below is *social* and travels on the\n  // lesson channel, so everyone in the lesson hears it whichever board they\n  // are on — same as `peer_joined`/`peer_left`, freeze, tools, closed and\n  // palette, which moved to that channel with this epic. Content events\n  // (`operation_confirmed`, `peer_stroke_*`, `peer_cursor`) stay on the\n  // board's own channel and reach only the sockets on that board.\n\n  // Someone in the lesson moved to another board (a `join_room` on their live\n  // socket). Sent to everyone else in the lesson; the mover already knows.\n  peer_board_changed: (data: { userId: string; boardId: string }) => void\n  // The owner moved (`set_active_board`) — or the active board was deleted,\n  // in which case `boardId` is null and means the lesson's own first board.\n  // A following student switches on this; the owner never follows.\n  active_board_changed: (data: { boardId: string | null }) => void\n  // Board CRUD, each the live half of one boardRoutes.ts call. Sent to the\n  // whole lesson, the owner who made the change included — they need the same\n  // list everyone else ends up with.\n  board_created: (data: { board: BoardSummary }) => void\n  board_renamed: (data: { boardId: string; name: string }) => void\n  // The full strip order, lesson first, not a delta: a handful of ids.\n  boards_reordered: (data: { order: string[] }) => void\n  // Hard delete, content and all. A socket that was on it has already been\n  // moved to the lesson's own board by the server and handed a fresh\n  // `room_state` for it before this arrives; the client is free to `join_room`\n  // whichever board it would rather be on.","truncated":true}],"setColor":[{"path":"apps/web/src/engine/index.ts","line":759,"kind":"method","snippet":"  setColor(rgb: [number, number, number]): void","truncated":false}],"setSize":[{"path":"apps/web/src/engine/index.ts","line":758,"kind":"method","snippet":"  setSize(px: number): void","truncated":false}],"setTool":[{"path":"apps/web/src/engine/index.ts","line":756,"kind":"method","snippet":"  setTool(tool: ToolType): void","truncated":false}],"setUserId":[{"path":"apps/web/src/engine/index.ts","line":753,"kind":"method","snippet":"  setUserId(id: string): void","truncated":false}],"setViewport":[{"path":"apps/web/src/engine/index.ts","line":832,"kind":"method","snippet":"  setViewport(cx: number, cy: number, zoom: number, angle: number): void","truncated":false}],"setWatercolorDebugView":[{"path":"apps/web/src/engine/index.ts","line":1010,"kind":"method","snippet":"  /** (#536) Dev-only single-term view of the watercolor composite. */\n  setWatercolorDebugView(view: 0 | 1 | 2 | 3 | 4): void","truncated":false}],"SHAPE_STROKE_ALIGNS":[{"path":"packages/shared/src/shapes.ts","line":41,"kind":"const","snippet":"/** Where a stroke of finite width sits relative to the contour it follows.\n *  Not cosmetic: a 400×300 frame stroked 10 wide is 400×300 only with\n *  `inside`, and drawing a frame of an exact size is half of why the tool\n *  exists. */\nexport const SHAPE_STROKE_ALIGNS = ['inside', 'center', 'outside'] as const","truncated":false}],"SHAPE_STROKE_JOINS":[{"path":"packages/shared/src/shapes.ts","line":54,"kind":"const","snippet":"/** How a stroke turns a corner. Distinct from a shape's own `cornerRadius`,\n *  which changes the *contour*: a mitre on a rounded rectangle is a\n *  contradiction in terms, a round join on a sharp one is not.\n *\n *  Two, not the usual three: `bevel` is absent because the rasterizer draws a\n *  stroke as the region between two contours (#527), and a bevel is the one\n *  join that is neither of them — it needs the corner cut by a chord, which is\n *  a third contour construction for a rarely-used join. Adding it later widens\n *  this union without touching anything already recorded, since nothing can\n *  have written a value that did not exist. */\nexport const SHAPE_STROKE_JOINS = ['miter', 'round'] as const","truncated":false}],"ShapeFill":[{"path":"packages/shared/src/shapes.ts","line":171,"kind":"type","snippet":"/** `null` means \"no fill\". Its own type rather than a bare colour so that a\n *  fill can gain properties (a texture, a gradient) without every shape\n *  operation ever recorded having to be reinterpreted. */\nexport type ShapeFill = {\n  color: [number, number, number]\n}","truncated":false}],"ShapeFrame":[{"path":"packages/shared/src/shapes.ts","line":150,"kind":"type","snippet":"/** Where the shape sits, in the same layer space as `Dab.x/y` and\n *  `AreaFillOperation`'s rect (canvas coordinates in a bounded room, world\n *  coordinates in an infinite one).\n *\n *  `width`/`height` are **signed**, and that is not sloppiness left over from\n *  a drag: a line from the top-left corner to the bottom-right one and a line\n *  from the top-right to the bottom-left occupy the same rectangle, and the\n *  sign is the only thing that tells them apart. Shapes that are symmetric\n *  about both axes simply ignore it.\n *\n *  `angle` rotates the frame about its own centre. Rotation only — no skew and\n *  no projective term, unlike `LayerTransformMatrix`: a sheared frame has no\n *  single stroke width, and shearing a shape after the fact is what the\n *  transform tool is for. */\n// (`type`, not `interface`, for this and the two below — deliberately. An\n// operation is written to a Prisma JSON column, and Prisma's InputJsonValue is\n// an index-signature type: TypeScript gives type aliases an implicit index\n// signature and interfaces none, so an interface here fails to typecheck at\n// persistOperation with an error that names Prisma and says nothing about\n// shapes.)\nexport type ShapeFrame = {\n  x: number\n  y: number\n  width: number\n  height: number\n  angle: number\n}","truncated":false}],"ShapeGeometry":[{"path":"packages/shared/src/shapes.ts","line":78,"kind":"type","snippet":"/** What the shape *is*, in the frame's own normalized space — everything here\n *  is independent of where the shape was put and how big it is, which is what\n *  lets `ShapeFrame` carry placement alone and lets an annotation reuse this\n *  type later without inheriting a layer-space rectangle.\n *\n *  Angles are radians, measured from +X and increasing clockwise on screen\n *  (layer space has Y pointing down, so clockwise is what a positive angle\n *  looks like). The UI shows degrees; the wire keeps radians, like every other\n *  angle in the protocol. */\nexport type ShapeGeometry =\n  /** `cornerRadius` in layer units, clamped by the rasterizer to half the","truncated":false}],"ShapeOperation":[{"path":"packages/shared/src/shapes.ts","line":188,"kind":"type","snippet":"/** One shape, laid down in one gesture, into one layer.\n *\n *  A pure single-layer pixel operation like the four `area_*` ops (areaOperations.ts), so a\n *  layer snapshot can stand in for it (`COVERABLE_OP_TYPES` on the server).\n *\n *  One operation for the whole gesture, including everything that happened\n *  after the pen came up: a shape stays editable until it is confirmed (Enter,\n *  a click past it, or switching tools — the transform tool's contract, see\n *  #528), and only the confirmed result is recorded. Nothing about that\n *  editing session reaches the log, which is why one shape is one undo.\n *\n *  A shape with neither stroke nor fill is not emitted at all — it would be an\n *  operation that provably paints nothing, and the log is permanent. */\nexport type ShapeOperation = OperationBase & {\n  type: 'shape'\n  layerId: string\n  geometry: ShapeGeometry\n  frame: ShapeFrame\n  stroke: ShapeStroke | null\n  fill: ShapeFill | null\n}","truncated":false}],"ShapeStroke":[{"path":"packages/shared/src/shapes.ts","line":161,"kind":"type","snippet":"/** `null` on the operation means \"no stroke\" — the explicit absence the UI\n *  shows as a crossed-out swatch, not a zero width. Width is in layer units,\n *  like everything else here. */\nexport type ShapeStroke = {\n  color: [number, number, number]\n  width: number\n  align: ShapeStrokeAlign\n  join: ShapeStrokeJoin\n}","truncated":false}],"ShapeStrokeAlign":[{"path":"packages/shared/src/shapes.ts","line":42,"kind":"type","snippet":"export type ShapeStrokeAlign = (typeof SHAPE_STROKE_ALIGNS)[number]","truncated":false}],"ShapeStrokeJoin":[{"path":"packages/shared/src/shapes.ts","line":55,"kind":"type","snippet":"export type ShapeStrokeJoin = (typeof SHAPE_STROKE_JOINS)[number]","truncated":false}],"SNAPSHOT_SEQ_INTERVAL":[{"path":"packages/shared/src/protocol.ts","line":180,"kind":"const","snippet":"// (#149 epic) Every SNAPSHOT_SEQ_INTERVAL operations (by the room's global,\n// server-assigned seq — see Operation.seq), any client that's caught up to\n// that point independently bakes and uploads a full-room pixel+layerState\n// snapshot; the server just dedups by (roomId, seq), first arrival wins (see\n// apps/server/src/rooms/rooms.ts's saveSnapshot). Shared so both the client\n// (deciding when to bake) and the server (validating an upload actually\n// lands on a real boundary) agree on the same points without coordination.\n//\n// This bounds *operation count*, not bytes — a fine proxy when most ops are\n// small, but a room with few, huge strokes (a long fill/scribble — see\n// engine/index.ts's STROKE_DAB_CHUNK_LIMIT) can carry tens of MB in far\n// fewer than 300 ops, never crossing even one checkpoint and paying full-\n// history replay on every join no matter how big it gets (a real, observed\n// case: a room's own load hanging for minutes on 25MB of history in just\n// 117 ops). Lowered from 300 to 100 so heavy-content rooms hit a checkpoint\n// much sooner; still coarse for a genuinely pathological room, which is why\n// Room/index.tsx's handleRoomState now also bakes once, retroactively, the\n// first time any client fully catches up a room that has never had a\n// snapshot at all — see its own comment.\nexport const SNAPSHOT_SEQ_INTERVAL = 100","truncated":false}],"SnapshotIndex":[{"path":"packages/shared/src/rest.ts","line":106,"kind":"interface","snippet":"/** (#427) Everything a joining client needs to plan its restore. `layerState`\n *  is what a client uploaded, stored as JSON the server never reads — so it is\n *  `unknown` on the wire, and the client narrows it where it restores it. */\nexport interface SnapshotIndex {\n  seq: number\n  layerState: unknown\n  layers: SnapshotIndexEntry[]\n}","truncated":false}],"SnapshotIndexEntry":[{"path":"packages/shared/src/rest.ts","line":96,"kind":"interface","snippet":"export interface SnapshotIndexEntry {\n  layerId: string\n  seq: number\n  /** sha256 of the layer's decompressed pixels — also the blob's ETag. */\n  hash: string\n}","truncated":false}],"SnapshotTile":[{"path":"apps/web/src/engine/src/oplog/snapshotCodec.ts","line":19,"kind":"interface","snippet":"export interface SnapshotTile {\n  originX: number\n  originY: number\n  width: number\n  height: number\n  pixels: Uint8Array // RGBA8, exactly width*height*4 bytes\n}","truncated":false}],"strokeDabs":[{"path":"packages/shared/src/dabCodec.ts","line":125,"kind":"function","snippet":"/** The dabs of a stroke operation, whichever way it happens to carry them.\n *  Every consumer must go through this rather than reading `dabs` or\n *  `dabsPacked` — an operation from before #366 has only the former and one\n *  recorded since has only the latter, and both replay forever.\n *\n *  Decodes on each call rather than caching: replay paints an operation's\n *  dabs once and moves on, and the one caller that reads the same operation\n *  repeatedly (a peer's live-stroke reveal, which walks the array as time\n *  passes) holds its own reference to the result. */\nexport function strokeDabs(op: StrokeOperation): Dab[] {\n  if (op.dabs) return op.dabs\n  return op.dabsPacked ? unpackDabs(op.dabsPacked) : []\n}","truncated":false}],"StrokeDebugStats":[{"path":"apps/web/src/engine/index.ts","line":429,"kind":"interface","snippet":"export interface StrokeDebugStats {\n  moveEvents: number      // real pointer samples (post-getCoalescedEvents) in this stroke\n  durationMs: number      // wall-clock stroke length, pointerdown to pointerup\n  avgGapMs: number        // average time between consecutive move samples\n  maxGapMs: number        // largest gap between consecutive move samples (spikes = stalls/drops)\n  dabCount: number        // dabs painted this stroke\n  renderMsTotal: number   // total time spent in _paintDabs + _display across the stroke\n  avgRenderMsPerDab: number\n  // #104: real end-to-end latency, PointerEvent.timeStamp of the sample\n  // whose position was just painted → performance.now() right after that\n  // paint. Always reflects DabSystem's normal 1-event-lag path (the\n  // committed segment painted into the real layer buffer), regardless of\n  // liveTipSegment.\n  avgE2eLatencyMs: number\n  maxE2eLatencyMs: number\n  // #104: same measurement, but for the liveTipSegment scratch preview\n  // (PointerEvent.timeStamp of the *current* sample → its own paint) — runs\n  // roughly one inter-event gap below avgE2eLatencyMs/maxE2eLatencyMs,\n  // since it skips the \"wait for the next event's tangent\" step entirely.\n  // 0 if liveTipSegment was explicitly forced off.\n  avgTipLatencyMs: number\n  maxTipLatencyMs: number\n  // Real requestAnimationFrame-anchored latency: PointerEvent.timeStamp of\n  // the last move sample that fed a given _scheduleDisplay() coalesced\n  // batch → performance.now() at the top of that batch's rAF callback,\n  // right before _display() actually runs. rAF callbacks fire immediately\n  // before the browser's next paint for that frame, so this is the\n  // closest proxy to real screen latency available without a forced\n  // gl.finish()/readPixels stall — unlike avgE2eLatencyMs/avgTipLatencyMs\n  // (which only measure up to the moment JS finished *submitting* GL\n  // commands, not when the GPU/compositor actually presented anything),\n  // this also covers whatever queues up between submission and the\n  // browser's next paint. Still doesn't cover actual GPU execution time or\n  // OS-level compositor/vsync after the rAF callback returns — the true\n  // photon-to-photon number needs hardware most users can't measure with\n  // either. 0 if no move produced a coalesced display this stroke (e.g. a\n  // single-dab tap, which paints via the direct _onStart/_onEnd _display()\n  // calls this metric doesn't cover).\n  avgFrameLatencyMs: number\n  maxFrameLatencyMs: number\n}","truncated":false}],"StrokeLiveData":[{"path":"packages/shared/src/protocol.ts","line":114,"kind":"type","snippet":"/** (#429) One packet of an in-progress stroke, streamed to the room while the\n *  pen is still down.\n *\n *  This is deliberately **not** an Operation and never enters the log: it is\n *  not assigned a `seq`, not persisted, not acknowledged, and not replayed on\n *  join. The gesture's authoritative record is still the StrokeOperation(s)\n *  emitted at pen-up (and at every STROKE_DAB_CHUNK_LIMIT boundary along the\n *  way) through the ordinary `operation` path. This carries the same dabs\n *  early, so peers can watch the mark appear instead of waiting out the whole\n *  gesture and then watching it replay at its recorded pace — see #428 for the\n *  latency arithmetic that motivated it.\n *\n *  Because the dabs here are the *same* dabs the eventual operation carries —\n *  the engine bakes them once, at paint time — the handoff from streamed ink to\n *  committed ink is exact. That is the difference from the abandoned #37\n *  attempt, which approximated the stroke from cursor positions and visibly\n *  snapped when the real operation landed.\n *\n *  `packetSeq` counts packets within one gesture from 0, so a receiver can tell\n *  \"I have every packet so far\" from \"I missed one\". Within a single socket\n *  connection a gap is impossible (TCP does not reorder or drop inside one\n *  connection), so a gap means the connection broke — the same conclusion, and\n *  the same full-resync response, that a gap in `operation_confirmed` already\n *  triggers. It is not a reason to reorder or wait.\n *\n *  Sent reliably, not `volatile`: a receiver paints these dabs straight into\n *  the real layer, so a silently dropped packet would leave a permanently wrong\n *  layer rather than a momentary glitch. Backpressure is handled where it\n *  belongs — the sender coalesces dabs into one packet per interval instead of\n *  emitting per frame. */\nexport type StrokeLiveData = {\n  strokeId: string\n  layerId: string\n  tool: ToolType\n  preset: string\n  color: [number, number, number]\n  packetSeq: number\n  /** Same packing as StrokeOperation.dabsPacked — see packDabs/unpackDabs. */\n  dabsPacked: string\n  /** (#468) The wash this gesture belongs to, mirroring StrokeOperation.washId.\n   *\n   *  Only watercolor sets it, and it exists because a wash is the one thing in\n   *  this engine that spans *several* strokes: they share one accumulation, so\n   *  a peer that groups them differently from the author paints a different\n   *  picture. The author decides the grouping (using wall-clock timing a peer\n   *  must never see) and stamps the answer here and on the operation, so every\n   *  receiver reproduces the decision instead of re-taking it.\n   *\n   *  It has to ride the *live* packet and not only the operation. A peer paints\n   *  from this stream while the pen is still down, and by the time the\n   *  operation arrives the stream has usually delivered the whole stroke — so\n   *  the operation paints nothing and the grouping it carries is never read.\n   *  Measured before this field existed: 84.6% of the mark differed between\n   *  author and peer, up to 64/255 per channel. */\n  washId?: string\n\n  /** (#536) Mirrors StrokeOperation.wet, and for exactly the reason washId is\n   *  here: a peer paints the mark from this stream while the pen is still down,\n   *  and the operation that follows usually paints nothing. Wetness the author\n   *  saw is not derivable on the peer — its own copy of the live field is its\n   *  own — so it has to arrive with the dabs or the two draw different marks.\n   *\n   *  Grows as the stroke does: each packet carries the profile so far, and a\n   *  later packet's is a prefix-extension of an earlier one. */\n  wet?: string\n  /** (#432) When the author sent this packet, on the *server's* clock (see\n   *  lib/observability/serverClock.ts on the web side). Participants' clocks are not in step\n   *  with each other, but each can estimate its offset to the server, so a\n   *  peer can take \"ink on my screen, server time\" minus this and get the\n   *  send-to-ink path. Absent until the author's clock has synced once. */\n  sentAt?: number\n  /** (#432) How long the oldest dab in this packet had been under the pen\n   *  when it was sent — the last dab's `t` minus the first's. Added to the\n   *  send-to-ink path it gives pen-to-ink for the worst dab of the packet. */\n  penAgeMs?: number\n}","truncated":false}],"StrokeOperation":[{"path":"packages/shared/src/stroke.ts","line":44,"kind":"type","snippet":"export type StrokeOperation = OperationBase & {\n  type: 'stroke'\n  layerId: string\n  tool: ToolType\n  // 'HB'/'2B' etc for pencil, the liner's own size label, `${nib}:${size}`\n  // for marker, 'vine'/'willow'/'compressed' for charcoal (ADR 005 §1 — the\n  // three charcoal types ride this existing field rather than needing one of\n  // their own, exactly as pencil's hardness grades already do).\n  preset: string\n  color: [number, number, number] // baked at record time, so replay/undo never repaints with today's live color\n  // (#366) Exactly one of these two carries the stroke's dabs — read them\n  // through `strokeDabs(op)` rather than either field directly.\n  //\n  // `dabsPacked` is what every newly recorded stroke uses (see packDabs for\n  // why: a dab is ~250 bytes as JSON and ~53 packed, and the count scales\n  // with a stroke's *world* length, so low zoom makes single strokes\n  // megabytes). `dabs` is the original plain form, kept because the\n  // Operation Log is permanent — every stroke recorded before this existed\n  // is still in Postgres and in every room's history, and must keep\n  // replaying. Neither field is going away; this is a format that gained a\n  // second encoding, not one that migrated.\n  dabs?: Dab[]\n  dabsPacked?: string\n  // Smudge only (#14), legacy since #416 — neither written nor read by the\n  // engine anymore, kept because the Operation Log is permanent and rooms in\n  // production hold strokes carrying them.\n  //\n  // They recorded this user's own carried-graphite level (0..1) immediately\n  // before/after the op's dabs. That was needed while the smudge tool\n  // carried a single scalar that persisted across strokes: replay had to\n  // reproduce pickup/deposit amounts that depended on state living *outside*\n  // any single dab, so each op had to state it. #416 replaced the scalar\n  // with a raster imprint that resets at every gesture (see\n  // engine/src/dabs/SmudgePainter.ts's imprints) — a smudge operation reproduces from\n  // its own dabs alone again, and there is nothing left for these to carry.\n  // A stroke recorded with them simply replays under the new model, ignoring\n  // them.\n  smudgeLoadAtStart?: number\n  smudgeLoadAtEnd?: number\n  /** Which gesture this operation belongs to. A stroke longer than\n   *  STROKE_DAB_CHUNK_LIMIT dabs is recorded as several operations (see the\n   *  engine's _flushStrokeChunk and that constant's own comment for why the\n   *  log can't hold one unbounded op); every chunk of one pen-down-to-pen-up\n   *  gesture carries the same value here, and a stroke short enough to fit in\n   *  one op carries it too.\n   *\n   *  Needed because a marker stroke is not the sum of its dabs: it composites\n   *  by multiplying the layer's *pre-stroke* content, frozen once per gesture\n   *  (see MarkerStrokeScratch). Replay a gesture's chunks as unrelated\n   *  operations and the second one multiplies over the first one's output\n   *  instead — a nib-shaped dark band across the stroke at every boundary,\n   *  which is what a long marker line looked like after an undo.\n   *\n   *  Absent on strokes recorded before this existed; they replay as they\n   *  always did, each chunk standing alone. */\n  strokeId?: string\n  /** (#468 v7) Which *wash* this stroke belongs to — watercolor only.\n   *\n   *  A wash is several strokes laid in quick succession with the same paint on\n   *  the same layer, and the point of grouping them is that they must not\n   *  behave like separate marks laid on top of one another. Real paint does not\n   *  work that way: lay a second band beside a wet first one and the two become\n   *  one pool, the boundary between them disappears, and only the outer\n   *  perimeter of the whole thing gets a tideline. Without this, a flat wash —\n   *  the very first exercise anyone is set — is impossible to paint, because\n   *  every band arrives with its own edge, its own pooling and its own dried\n   *  rim.\n   *\n   *  Decided live and *recorded*, exactly as `strokeId` is, and for the same\n   *  reason: the grouping rule wants wall-clock timing, which replay must never\n   *  have. Writing down the answer keeps replay a pure function of the log\n   *  while letting the decision use whatever the live client knows.\n   *\n   *  Absent on every stroke of every other tool, and on watercolor strokes\n   *  recorded before this existed — those replay exactly as they always did,\n   *  each standing alone. */\n  washId?: string\n\n  /** (#536) How wet the paper already was where this stroke landed — one hex\n   *  digit per dab, in order, `'0'` dry and `'f'` flooded.\n   *\n   *  This is the field that makes \"lay clean water, then take paint into it\"\n   *  expressible, and the shape of it is the whole architectural argument.\n   *  Wetness itself is a live, ephemeral, client-side thing that decays on a\n   *  wall clock, and it must stay that way: a replayable thirty-second physical\n   *  model of water on paper would be enormous and would put clocks back into\n   *  replay. What gets written down instead is not the environment but the\n   *  **interaction with it** — what this stroke saw at the moment it was made.\n   *  Live resolves clock -> wetness field -> stroke parameters -> serialize;","truncated":false}],"TOGGLEABLE_TOOLS":[{"path":"packages/shared/src/toolset.ts","line":10,"kind":"const","snippet":"// (#548, first step of #544) The tools a room may offer, and the only list\n// the wire knows about. Ordered exactly as the left toolbar and the floating\n// panel lay them out — materials, then the tools that work on marks already\n// down, then the utilities — so \"the tools\" means one thing in this app\n// rather than three.\n//\n// The three annotation tools are deliberately absent: they are a rail of\n// their own (#509/#510), shown *instead* of these rather than alongside them,\n// and a room's toolset has no say over a mode it never competes with.\nexport const TOGGLEABLE_TOOLS = [\n  'pencil', 'charcoal', 'liner', 'marker', 'brushPen', 'watercolor', 'digitalBrush',\n  'eraser', 'smudge', 'eyedropper',\n  // (#525) The shape tool is one entry, not four: which of the four shapes it\n  // draws is a setting on the tool, so a room cannot offer the ellipse and\n  // withhold the star, and there is nothing here to say if it could.\n  'hand', 'ruler', 'transform', 'selection', 'fill', 'shape', 'grid',\n] as const","truncated":false}],"ToggleableTool":[{"path":"packages/shared/src/toolset.ts","line":19,"kind":"type","snippet":"export type ToggleableTool = (typeof TOGGLEABLE_TOOLS)[number]","truncated":false}],"toHomography":[{"path":"packages/shared/src/layerOperations.ts","line":259,"kind":"function","snippet":"/** Widens the wire form to the 3x3 every consumer actually works in. */\nexport function toHomography(matrix: LayerTransformMatrix): HomographyMatrixTuple {\n  if (matrix.length === 9) return matrix\n  const [a, b, c, d, tx, ty] = matrix\n  return [a, b, 0, c, d, 0, tx, ty, 1]\n}","truncated":false}],"TOOLSET_MATERIAL_TOOLS":[{"path":"packages/shared/src/toolset.ts","line":27,"kind":"const","snippet":"/** The tools that actually lay material. At least one of them has to survive\n *  every toolset — see `sanitizeEnabledTools`.\n *\n *  The eraser and the smudge are deliberately not here despite being drawing\n *  tools in every other sense: neither can put a mark on an empty sheet, so a\n *  room offering only those is exactly as unusable as one offering nothing. */\nexport const TOOLSET_MATERIAL_TOOLS: readonly ToggleableTool[] = [\n  'pencil', 'charcoal', 'liner', 'marker', 'brushPen', 'watercolor',\n  // #547 — the digital brush lays material like the rest, and a room offering\n  // only it is a perfectly good digital-painting lesson. That it imitates no\n  // physical material is a fact about the mark, not about whether the tool can\n  // start a drawing from an empty sheet, which is the only question this list\n  // asks.\n  'digitalBrush',\n]","truncated":false}],"ToolType":[{"path":"packages/shared/src/stroke.ts","line":6,"kind":"type","snippet":"export type ToolType =\n  | 'pencil' | 'eraser' | 'smudge' | 'liner' | 'marker' | 'charcoal' | 'brushPen'\n  // #468, ADR 011 — an experiment, and deliberately not in docs/TOOLSET.md","truncated":false}],"undo":[{"path":"apps/web/src/engine/index.ts","line":734,"kind":"method","snippet":"  undo(): Operation | null","truncated":false}],"unpackDabs":[{"path":"packages/shared/src/dabCodec.ts","line":92,"kind":"function","snippet":"/** Inverse of packDabs. Throws on a payload that is not a whole number of\n *  dabs — that means a truncated or foreign encoding, and painting the\n *  prefix of it would put content on the canvas that nobody drew. */\nexport function unpackDabs(packed: string): Dab[] {","truncated":false}],"User":[{"path":"apps/server/prisma/schema.prisma","line":21,"kind":"model","snippet":"// Every browser gets a User row from its first visit on, via a long-lived\n// identity cookie (#41) — `email` starts out null (anonymous/guest) and gets\n// filled in place the first time this browser signs in, same row, same id. So\n// `ownerId` on Room is never optional: anonymous room creation still has a\n// real user behind it, just not (yet) a named one. email stays @unique even\n// though many guest rows share `null` — Postgres treats NULLs as distinct for\n// uniqueness, so this only constrains actual registered emails.\n//\n// There is no password column (#316): sign-in is a one-time code mailed to\n// the address, so the mailbox is the credential and there is nothing else to\n// store, forget, or leak.\nmodel User {\n  id                String            @id @default(uuid())\n  email             String?           @unique\n  name              String?\n  // Subscription/monetization tier (#5). Gates unrestricted room ownership\n  // (paid) vs free-tier limits — orthogonal to per-room roles, which come\n  // from Room.ownerId / RoomParticipant, not from account type.\n  role              UserRole          @default(FREE)\n  ownedRooms        Room[]\n  participatedRooms RoomParticipant[]\n  roomFolders       RoomFolder[]\n  // (#224) Access control back-relations — see the three models at the bottom\n  // of this file.\n  roomInvitesSent   RoomInvite[]\n  roomJoinRequests  RoomJoinRequest[]\n  roomBlocks        RoomBlock[]\n  // (#586) When this browser/account was last seen by the server. Not\n  // `updatedAt`, which only moves when the row is edited: a person who draws\n  // every day and never touches their profile would read as gone since\n  // signup. Written by identity.ts at most once per LAST_SEEN_WRITE_INTERVAL_MS,\n  // so it means \"within the last few minutes\", not to the second. Null for\n  // rows older than the column.\n  lastSeenAt        DateTime?\n  // (#586) When `email` was first filled in. Not `createdAt`: signing up\n  // claims the browser's existing guest row (see the comment above), so\n  // `createdAt` is the first visit, which can be months before the account.\n  registeredAt      DateTime?\n  // (#587) Account ban. Set means every HTTP request, socket handshake and\n  // sign-in code for this user is refused (see bans.ts). `bannedById` is a\n  // plain id rather than a relation: the journal (AdminAction) is the record\n  // of who did what, this is only the current state.\n  bannedAt          DateTime?\n  banReason         String?\n  bannedById        String?\n  // (#589) \"Sign out everywhere\": identity tokens issued before this moment\n  // are refused (identity.ts), which turns every browser holding one back\n  // into a fresh guest. Null means nothing was ever revoked.\n  sessionsRevokedAt DateTime?\n  devices           UserDevice[]\n  createdAt         DateTime          @default(now())\n  updatedAt         DateTime          @updatedAt\n}","truncated":false}],"UserDevice":[{"path":"apps/server/prisma/schema.prisma","line":571,"kind":"model","snippet":"// (#589) One browser a person has used. \"Browser\" is the `al_dev` cookie\n// (identity.ts), not the identity cookie: signing in on a second browser gives\n// both the same user id, and the question this table answers is \"which of\n// their devices\", so the device needs an id of its own.\n//\n// `env` is what the client reports about itself (lib/api/environment.ts) — build,\n// screen, pen, GPU — and is replaced wholesale on every report. Json rather\n// than columns: it is read by one person in the admin panel and never\n// queried, and the set of fields will keep growing with the bugs it answers.\nmodel UserDevice {\n  id          String    @id @default(uuid())\n  userId      String\n  user        User      @relation(fields: [userId], references: [id], onDelete: Cascade)\n  deviceId    String\n  userAgent   String\n  platform    String\n  browser     String\n  lastIp      String?\n  env         Json?\n  envAt       DateTime?\n  firstSeenAt DateTime  @default(now())\n  lastSeenAt  DateTime  @default(now())\n\n  @@unique([userId, deviceId])\n  @@index([lastSeenAt])\n}","truncated":false}],"UserRole":[{"path":"packages/shared/src/room.ts","line":300,"kind":"type","snippet":"export type UserRole = 'FREE' | 'PRO' | 'ADMIN'\nexport type ParticipantRole = 'owner' | 'member'","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":544,"kind":"enum","snippet":"enum UserRole {\n  FREE\n  PRO\n  ADMIN\n}","truncated":false}],"WATERCOLOR_WET_DRY_MS":[{"path":"packages/shared/src/operations.ts","line":72,"kind":"const","snippet":"/** (#536) How long watercolour water stays on the paper, in ms. Here rather\n *  than only in the engine because the server needs it too: a `paper_dry`\n *  older than this can have no effect on anything, and stops being sent to a\n *  joining client (isCoveredBySnapshot). */\nexport const WATERCOLOR_WET_DRY_MS = 120000","truncated":false}],"watercolorDryWash":[{"path":"apps/web/src/engine/index.ts","line":1020,"kind":"method","snippet":"  /** (#536, §17.42) Dries every open wash NOW, as one component: the tide\n   *  along the union's outer contour is laid into the wet state itself, so\n   *  the next mark finds the wash dry. Returns how many washes it dried. Dev\n   *  probe for the rig today; the \"dry now\" command's engine half later. */\n  watercolorDryWash(): number","truncated":false}]},"repo":"https://github.com/SuselMan/art_lessons/blob/agents/494-paper-state","issuesBase":"https://github.com/SuselMan/art_lessons/issues/"};</script>
<script>/* Architecture map — rendering and interaction. Data is injected as window.__ARCH__. */
(function () {
  'use strict';

  var D = window.__ARCH__;
  var REPO = D.repo; // https://github.com/owner/name/blob/main
  var byId = new Map(D.modules.map(function (m) { return [m.id, m]; }));
  var layerById = new Map(D.layers.map(function (l) { return [l.id, l]; }));
  var partById = new Map(D.parts.map(function (g) { return [g.id, g]; }));
  var rank = new Map(D.layers.map(function (l, i) { return [l.id, i]; }));

  /* (#642) A module is a folder with a README; inside the big flat folders the map keeps its
   * own split as groups. Flows, runtime nodes and topics may point at either, so every link
   * resolves through here: a group lands on its module with the group opened. */
  var groupById = new Map();
  D.modules.forEach(function (m) {
    m.groupings.forEach(function (g) { groupById.set(g.id, { g: g, m: m }); });
  });
  function refModule(id) {
    if (byId.has(id)) return byId.get(id);
    var hit = groupById.get(id);
    return hit ? hit.m : null;
  }
  function refTitle(id) {
    var hit = groupById.get(id);
    if (hit) return hit.m.title + ' › ' + hit.g.title;
    var m = byId.get(id);
    return m ? m.title : id;
  }

  var outEdges = new Map();
  var inEdges = new Map();
  var neighbours = new Map();
  D.edges.forEach(function (e) {
    if (!outEdges.has(e.from)) outEdges.set(e.from, []);
    if (!inEdges.has(e.to)) inEdges.set(e.to, []);
    outEdges.get(e.from).push(e);
    inEdges.get(e.to).push(e);
    if (!neighbours.has(e.from)) neighbours.set(e.from, new Set());
    if (!neighbours.has(e.to)) neighbours.set(e.to, new Set());
    neighbours.get(e.from).add(e.to);
    neighbours.get(e.to).add(e.from);
  });

  var violationsByModule = new Map();
  D.health.violations.forEach(function (v) {
    [v.fromModule, v.toModule].forEach(function (id) {
      if (!id) return;
      if (!violationsByModule.has(id)) violationsByModule.set(id, []);
      if (violationsByModule.get(id).indexOf(v) < 0) violationsByModule.get(id).push(v);
    });
  });

  var clonesByModule = new Map();
  D.health.clones.forEach(function (c) {
    [c.aModule, c.bModule].forEach(function (id) {
      if (!id) return;
      if (!clonesByModule.has(id)) clonesByModule.set(id, []);
      if (clonesByModule.get(id).indexOf(c) < 0) clonesByModule.get(id).push(c);
    });
  });

  var maxChurn = Math.max.apply(null, D.modules.map(function (m) { return m.churn; }).concat([1]));
  var maxDebt = Math.max.apply(null, D.modules.map(function (m) {
    return (violationsByModule.get(m.id) || []).length;
  }).concat([1]));

  /* ------------------------------------------------------------------ what is on screen
   *
   * Three independent ways to thin the map out, applied in this order:
   *   hiddenLayers   — a whole column folded to a strip (click its heading)
   *   hiddenModules  — individual squares put away (side panel, or "keep what was found")
   *   focus          — keep one module and everything within N hops of it
   * The focused module always survives, so focusing can never blank the screen.
   */

  var STORE_KEY = 'archmap.filter.v1';
  var hiddenLayers = new Set();
  var hiddenModules = new Set();
  var focus = null; // { id, depth }

  function loadFilter() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      (saved.layers || []).forEach(function (id) { if (layerById.has(id)) hiddenLayers.add(id); });
      (saved.modules || []).forEach(function (id) { if (byId.has(id)) hiddenModules.add(id); });
    } catch (e) { /* private mode, cleared storage — start with everything shown */ }
  }

  function saveFilter() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        layers: Array.from(hiddenLayers),
        modules: Array.from(hiddenModules),
      }));
    } catch (e) { /* nothing to do — the filter just won't survive a reload */ }
  }

  function neighbourhood(id, depth) {
    var seen = new Set([id]);
    var frontier = [id];
    for (var d = 0; d < depth; d++) {
      var next = [];
      frontier.forEach(function (cur) {
        (neighbours.get(cur) || new Set()).forEach(function (n) {
          if (seen.has(n)) return;
          seen.add(n);
          next.push(n);
        });
      });
      frontier = next;
    }
    return seen;
  }

  var visible = new Set();

  function computeVisible() {
    visible = new Set();
    D.modules.forEach(function (m) {
      if (hiddenLayers.has(m.layer) || hiddenModules.has(m.id)) return;
      visible.add(m.id);
    });
    if (focus) {
      var keep = neighbourhood(focus.id, focus.depth);
      visible = new Set(Array.from(visible).filter(function (id) { return keep.has(id); }));
      visible.add(focus.id);
    }
  }

  /** Bring a module back whichever filter is hiding it — used by every cross-link. */
  function reveal(id) {
    var m = byId.get(id);
    if (!m) return;
    hiddenModules.delete(id);
    hiddenLayers.delete(m.layer);
    if (focus && !neighbourhood(focus.id, focus.depth).has(id)) focus = null;
    saveFilter();
    refresh();
  }

  function resetFilter() {
    hiddenLayers.clear();
    hiddenModules.clear();
    focus = null;
    saveFilter();
    refresh();
  }

  /* ------------------------------------------------------------------ layout */

  var CARD_W = 208;
  var COL_W = 240;
  var STRIP_W = 34;
  var GAP_Y = 11;
  var TOP = 74;      // room for the band + layer headings
  var LEFT = 24;

  var pos = new Map();
  var cols = [];
  var bands = [];
  var canvasW = 0;
  var canvasH = 0;

  // Height is the module's size (lines of code, square-rooted so one giant does not dwarf the
  // rest); the floor leaves room for the title and the metrics row.
  function cardHeight(m) {
    return Math.max(80, Math.min(136, 66 + Math.sqrt(m.loc) * 2.1));
  }

  function computeLayout() {
    pos.clear();
    cols = [];
    bands = [];
    var x = LEFT;
    var maxBottom = TOP;

    D.layers.forEach(function (layer) {
      var all = D.modules.filter(function (m) { return m.layer === layer.id; });
      var mods = all.filter(function (m) { return visible.has(m.id); });
      if (!mods.length) {
        // Folded to a strip rather than dropped: a column you cannot see is one you cannot
        // get back, and the strip is the only affordance saying it still exists.
        cols.push({
          layer: layer, x: x, w: STRIP_W, collapsed: true, shown: 0, total: all.length,
          // Folded by hand, or emptied by the focus? The strip has to undo the right one.
          folded: hiddenLayers.has(layer.id),
        });
        x += STRIP_W + 6;
        return;
      }
      // Heaviest first — the thing you should look at sits at eye level.
      mods.sort(function (a, b) { return b.loc - a.loc; });
      var y = TOP;
      mods.forEach(function (m) {
        var h = cardHeight(m);
        pos.set(m.id, { x: x + (COL_W - CARD_W) / 2, y: y, w: CARD_W, h: h });
        y += h + GAP_Y;
      });
      cols.push({ layer: layer, x: x, w: COL_W, collapsed: false, shown: mods.length, total: all.length });
      maxBottom = Math.max(maxBottom, y);
      x += COL_W;
    });

    D.parts.forEach(function (g) {
      var own = cols.filter(function (c) { return c.layer.part === g.id; });
      if (!own.length) return;
      var x0 = Math.min.apply(null, own.map(function (c) { return c.x; }));
      var x1 = Math.max.apply(null, own.map(function (c) { return c.x + c.w; }));
      bands.push({ group: g, x: x0, w: x1 - x0 });
    });

    canvasW = x + LEFT;
    canvasH = Math.max(maxBottom + 40, 380);
  }

  /* ------------------------------------------------------------------ svg */

  var svg = document.getElementById('graph');
  var NS = 'http://www.w3.org/2000/svg';
  var gRoot, gBands, gEdges, gNodes;

  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function text(parent, x, y, cls, str) {
    var t = el('text', { x: x, y: y, class: cls }, parent);
    t.textContent = str;
    return t;
  }

  function tip(node, str) {
    var t = el('title', {}, node);
    t.textContent = str;
  }

  function clip(str, max) {
    return str.length > max ? str.slice(0, max - 1) + '…' : str;
  }

  function edgePath(a, b) {
    var x1 = a.x + a.w, y1 = a.y + a.h / 2;
    var x2 = b.x, y2 = b.y + b.h / 2;
    if (b.x > a.x) {
      var dx = Math.max(40, (x2 - x1) * 0.45);
      return 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ',' + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2;
    }
    // Backwards or sideways: leave the right edge, loop under, come back to the right edge.
    var xr = b.x + b.w;
    var lift = 26 + Math.min(90, Math.abs(y2 - y1) * 0.25);
    return 'M' + x1 + ' ' + y1 +
      ' C' + (x1 + 60) + ' ' + (y1 + lift) + ',' + (xr + 60) + ' ' + (y2 + lift) + ',' + xr + ' ' + y2;
  }

  function drawGraph() {
    svg.innerHTML = '';
    // (#639) One arrowhead per edge state: a marker cannot inherit its path's stroke colour.
    var defs = el('defs', {}, svg);
    ['base', 'in', 'out', 'back'].forEach(function (k) {
      var mk = el('marker', {
        id: 'arr-' + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7,
        orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse',
      }, defs);
      el('path', { d: 'M0,1 L10,5 L0,9 z', class: 'arrow arrow-' + k }, mk);
    });
    gRoot = el('g', {}, svg);
    gBands = el('g', {}, gRoot);
    gEdges = el('g', {}, gRoot);
    gNodes = el('g', {}, gRoot);

    bands.forEach(function (b) {
      el('rect', { x: b.x + 3, y: 12, width: b.w - 6, height: canvasH - 24, rx: 14, class: 'band' }, gBands);
      text(gBands, b.x + 14, 32, 'band-title', b.group.title);
    });

    cols.forEach(function (c) {
      if (c.collapsed) {
        var strip = el('g', {
          class: 'strip', 'data-layer': c.layer.id, 'data-folded': c.folded ? 'true' : 'false',
        }, gBands);
        el('rect', { x: c.x, y: TOP - 26, width: c.w, height: canvasH - TOP - 4, rx: 8 }, strip);
        var t = text(strip, 0, 0, 'strip-title', c.layer.title + ' · ' + c.total);
        t.setAttribute('transform',
          'translate(' + (c.x + c.w / 2 + 4) + ',' + (canvasH - 26) + ') rotate(-90)');
        tip(strip, c.folded
          ? 'Развернуть слой «' + c.layer.title + '»'
          : 'Слой пуст из-за фокуса — вернуть его целиком');
        return;
      }
      var head = el('g', { class: 'layer-head', 'data-layer': c.layer.id }, gBands);
      el('rect', {
        x: c.x + (COL_W - CARD_W) / 2 - 7, y: TOP - 30, width: CARD_W + 14, height: 23,
        rx: 6, class: 'layer-head-hit',
      }, head);
      var label = c.layer.title + (c.shown < c.total ? ' · ' + c.shown + '/' + c.total : '');
      text(head, c.x + (COL_W - CARD_W) / 2, TOP - 14, 'layer-title', label);
      tip(head, 'Свернуть слой «' + c.layer.title + '»');
    });

    D.edges.forEach(function (e) {
      var a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) return;
      var back = (rank.get(byId.get(e.to).layer) || 0) < (rank.get(byId.get(e.from).layer) || 0);
      el('path', {
        class: 'edge',
        d: edgePath(a, b),
        'data-from': e.from,
        'data-to': e.to,
        'data-back': back ? 'true' : 'false',
        'data-type': e.typeOnly ? 'true' : 'false',
      }, gEdges);
    });

    D.modules.forEach(function (m) {
      var p = pos.get(m.id);
      if (!p) return;
      var g = el('g', { class: 'node', 'data-id': m.id }, gNodes);
      el('rect', { x: p.x, y: p.y, width: p.w, height: p.h }, g);
      // (#642) The folder path, as it is in the repo, and the README's two or three words.
      text(g, p.x + 12, p.y + 21, 'title', clip(m.title, 24));
      text(g, p.x + 12, p.y + 37, 'summary', '(' + clip(m.summary, 28) + ')');
      tip(g, m.id + (m.groupings.length ? ' · групп карты: ' + m.groupings.length : ''));
      // (#639) Every metric at once, instead of one bar at a time relative to the biggest module.
      text(g, p.x + 12, p.y + p.h - 27, 'meta',
        m.loc.toLocaleString('ru') + ' стр · ' + m.fileCount + ' ' + plural(m.fileCount, 'файл', 'файла', 'файлов') +
        (m.groupings.length ? ' · ' + m.groupings.length + ' гр.' : ''));
      var row = el('text', { x: p.x + 12, y: p.y + p.h - 11, class: 'metrics' }, g);
      metricSpans(m).forEach(function (sp, i) {
        if (i) el('tspan', { class: 'sep' }, row).textContent = ' · ';
        var t = el('tspan', { class: 'mv', 'data-level': sp.level }, row);
        t.textContent = sp.text;
      });
      if (focus && focus.id === m.id) g.setAttribute('data-focus', 'true');
      // Selection happens in the svg-level pointerup, not here: panning can start on a card
      // too, so a click is only distinguishable from a drag once the pointer comes back up.
      g.addEventListener('mouseenter', function () { if (!selected) highlight(m.id); });
      g.addEventListener('mouseleave', function () { if (!selected) highlight(null); });
    });

    paintMetric();
    applySearch();
  }

  function plural(n, one, few, many) {
    var d = n % 10, h = n % 100;
    if (d === 1 && h !== 11) return one;
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return few;
    return many;
  }

  function testRatio(m) { return m.loc ? m.testLoc / m.loc : 0; }
  function debtOf(m) {
    return (violationsByModule.get(m.id) || []).length + (clonesByModule.get(m.id) || []).length;
  }

  /** The metrics row: tests, churn, debt — coloured only where the value asks for attention. */
  function metricSpans(m) {
    var r = testRatio(m);
    var out = [{
      text: 'тесты ' + (r >= 10 ? Math.round(r) + '×' : r >= 1 ? r.toFixed(1).replace('.', ',') + '×' : Math.round(r * 100) + ' %'),
      level: r === 0 ? 'bad' : r < 0.25 ? 'warn' : 'ok',
    }];
    out.push({ text: 'правок ' + m.churn, level: m.churn / maxChurn > 0.35 ? 'warn' : 'plain' });
    var d = debtOf(m);
    if (d) out.push({ text: 'долг ' + d, level: 'bad' });
    return out;
  }

  /** Re-run everything downstream of a filter change. */
  function refresh(keepView) {
    computeVisible();
    computeLayout();
    drawGraph();
    renderFilterBar();
    if (selected) { highlight(selected); renderPanel(selected); }
    if (!keepView) fit();
  }

  /* ------------------------------------------------------------------ metric colouring */

  var metric = 'none';

  /** (#639) The selected chip tints each card — a heat map — instead of drawing a bar. */
  function metricTint(m) {
    if (metric === 'none') return null;
    if (metric === 'tests') {
      var r = testRatio(m);
      return r === 0 ? ['--warn', 30] : r < 0.25 ? ['--out', 22] : ['--ok', 26];
    }
    if (metric === 'churn') return ['--out', Math.round(6 + 30 * m.churn / maxChurn)];
    if (metric === 'debt') {
      var d = debtOf(m);
      return d ? ['--warn', Math.round(14 + 36 * Math.min(1, d / Math.max(maxDebt, 3)))] : null;
    }
    var who = D.understanding && D.understanding.people[0];
    var sc = who ? who.moduleScore[m.id] || 0 : 0;
    return sc >= 1 ? ['--ok', 32] : sc >= 0.5 ? ['--in', 26] : sc > 0 ? ['--out', 20] : ['--warn', 14];
  }

  function paintMetric() {
    D.modules.forEach(function (m) {
      var g = gNodes.querySelector('[data-id="' + m.id + '"]');
      if (!g) return;
      var tint = metricTint(m);
      g.querySelector('rect').style.fill = tint
        ? 'color-mix(in srgb, var(' + tint[0] + ') ' + tint[1] + '%, var(--card))'
        : '';
    });
  }

  /* ------------------------------------------------------------------ selection & highlight */

  var selected = null;

  function highlight(id) {
    var ins = new Set(), outs = new Set();
    if (id) {
      (inEdges.get(id) || []).forEach(function (e) { ins.add(e.from); });
      (outEdges.get(id) || []).forEach(function (e) { outs.add(e.to); });
    }
    gNodes.querySelectorAll('.node').forEach(function (n) {
      var nid = n.getAttribute('data-id');
      n.removeAttribute('data-rel');
      n.setAttribute('data-sel', String(nid === id));
      if (!id) { n.removeAttribute('data-dim'); return; }
      if (nid === id) n.removeAttribute('data-dim');
      else if (ins.has(nid)) { n.setAttribute('data-rel', 'in'); n.removeAttribute('data-dim'); }
      else if (outs.has(nid)) { n.setAttribute('data-rel', 'out'); n.removeAttribute('data-dim'); }
      else n.setAttribute('data-dim', 'true');
    });
    gEdges.querySelectorAll('.edge').forEach(function (p) {
      p.removeAttribute('data-rel');
      if (!id) { p.removeAttribute('data-dim'); return; }
      var f = p.getAttribute('data-from'), t = p.getAttribute('data-to');
      if (t === id) { p.setAttribute('data-rel', 'in'); p.removeAttribute('data-dim'); }
      else if (f === id) { p.setAttribute('data-rel', 'out'); p.removeAttribute('data-dim'); }
      else p.setAttribute('data-dim', 'true');
    });
    var node = id && gNodes.querySelector('[data-id="' + id + '"]');
    if (node) gNodes.appendChild(node);
  }

  function select(id, group) {
    selected = id;
    highlight(id);
    renderPanel(id, group);
    // The page also ships as a published snapshot, where the embedding frame can refuse
    // history writes — a deep link is a nicety, not a reason to break selection.
    try {
      history.replaceState(null, '', id ? '#' + (group || id) : location.pathname + location.search);
    } catch (e) { /* opaque origin */ }
  }

  /** Go to a module or a map group from anywhere: reveal it, select it, centre on it. */
  function goTo(ref) {
    var m = refModule(ref);
    if (!m) return;
    if (!visible.has(m.id)) reveal(m.id);
    select(m.id, m.id === ref ? null : ref);
    centerOn(m.id);
  }

  /* ------------------------------------------------------------------ side panel */

  var aside = document.getElementById('panel');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* (#632) Names of types and functions the map mentions become clickable; the click shows the
   * declaration lifted from the code at build time (D.symbols). Delegated on the document, so
   * panels that re-render their HTML need no wiring of their own. */
  var SYMBOLS = D.symbols || {};

  function symText(str) {
    return String(str).split(/(\b[A-Za-z_]\w{2,}\b)/).map(function (part, i) {
      if (i % 2 && Object.prototype.hasOwnProperty.call(SYMBOLS, part)) {
        return '<span class="sym" data-sym="' + part + '">' + part + '</span>';
      }
      return esc(part);
    }).join('');
  }

  /* Syntax colouring for the snippets. A tokenizer of our own rather than a library: the map
   * has to open offline from a file, and a highlighter that builds its own spans would fight
   * the clickable-name spans above. TypeScript declarations and Prisma models are all it sees,
   * so comments, strings, keywords, type names and property keys are enough. */
  var KEYWORDS = new Set(('export type interface const let function class enum extends implements import from ' +
    'readonly declare keyof typeof as return if else new void null undefined true false in of ' +
    'public private protected static async await model').split(' '));
  var BUILTINS = new Set(('string number boolean unknown any never object bigint symbol Record Partial Pick ' +
    'Omit Readonly ReadonlyArray ReadonlySet ReadonlyMap Array Promise Set Map Date Uint8Array Float32Array ' +
    'Int String Boolean Json Bytes DateTime Float BigInt Decimal').split(' '));
  var TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`(?:\\.|[^`\\])*`)|(@@?\w+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g;

  // Named apart from `highlight(id)` above on purpose: both are function declarations in one
  // closure, so a second `highlight` silently replaced the edge highlighting (#643).
  function highlightCode(src) {
    var out = '', last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src))) {
      out += esc(src.slice(last, m.index));
      last = TOKEN.lastIndex;
      var t = m[0];
      if (m[1]) out += '<span class="hl-c">' + symText(t) + '</span>';
      else if (m[2]) out += '<span class="hl-s">' + esc(t) + '</span>';
      else if (m[3]) out += '<span class="hl-a">' + esc(t) + '</span>';
      else if (m[4]) out += '<span class="hl-n">' + t + '</span>';
      else if (Object.prototype.hasOwnProperty.call(SYMBOLS, t)) out += '<span class="sym hl-t" data-sym="' + t + '">' + t + '</span>';
      // A key before `:` is a property even when it is spelled like a keyword (`type: 'stroke'`).
      else if (/^\s*\??:/.test(src.slice(last, last + 3))) out += '<span class="hl-p">' + esc(t) + '</span>';
      else if (KEYWORDS.has(t)) out += '<span class="hl-k">' + t + '</span>';
      else if (BUILTINS.has(t)) out += '<span class="hl-b">' + t + '</span>';
      else if (/^[A-Z]/.test(t)) out += '<span class="hl-t">' + esc(t) + '</span>';
      else out += esc(t);
    }
