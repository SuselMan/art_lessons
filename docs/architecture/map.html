<meta charset="utf-8" />
<title>Grafetto — карта архитектуры</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>:root {
  --bg: #f6f5f2;
  --panel: #ffffff;
  --panel-2: #fbfaf8;
  --ink: #1b1a18;
  --ink-2: #55524c;
  --ink-3: #8a857c;
  --line: #ddd9d1;
  --line-2: #ebe7df;
  --accent: #7b5cff;
  --in: #1f7ae0;
  --out: #d97706;
  --warn: #d2453c;
  --ok: #2f8f5b;
  --card: #ffffff;
  --card-hover: #f2eeff;
  --shadow: 0 1px 2px rgba(20, 18, 14, 0.08), 0 8px 24px rgba(20, 18, 14, 0.06);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #16151a;
    --panel: #1e1d24;
    --panel-2: #23222a;
    --ink: #ece9e3;
    --ink-2: #b3aea5;
    --ink-3: #7e786f;
    --line: #34323c;
    --line-2: #2a2933;
    --accent: #a691ff;
    --in: #5fa8f5;
    --out: #f0a63d;
    --warn: #ef6f66;
    --ok: #55c288;
    --card: #24232c;
    --card-hover: #302c46;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --bg: #16151a;
  --panel: #1e1d24;
  --panel-2: #23222a;
  --ink: #ece9e3;
  --ink-2: #b3aea5;
  --ink-3: #7e786f;
  --line: #34323c;
  --line-2: #2a2933;
  --accent: #a691ff;
  --in: #5fa8f5;
  --out: #f0a63d;
  --warn: #ef6f66;
  --ok: #55c288;
  --card: #24232c;
  --card-hover: #302c46;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------- top bar ---------- */

header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex: none;
  flex-wrap: wrap;
}

.brand { font-weight: 620; letter-spacing: -0.01em; font-size: 15px; }
.stamp { color: var(--ink-3); font: 11px/1.4 var(--mono); }

.tabs { display: flex; gap: 2px; background: var(--panel-2); border-radius: 9px; padding: 3px; }
.tabs button {
  border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 5px 12px; border-radius: 7px; cursor: pointer;
}
.tabs button[aria-selected='true'] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.spacer { flex: 1; }

input[type='search'] {
  width: 230px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 13px;
}
input[type='search']:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; user-select: none;
}
.chip[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- layout ---------- */

main { flex: 1; display: flex; min-height: 0; }
.view { flex: 1; min-width: 0; position: relative; display: none; }
.view[data-active='true'] { display: block; }

#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph.dragging { cursor: grabbing; }

.hint {
  position: absolute; left: 14px; bottom: 12px; color: var(--ink-3);
  font-size: 11px; pointer-events: none; background: var(--bg); padding: 2px 6px; border-radius: 6px;
}

/* Sits above the hint: how much of the map is currently hidden, and the way back. */
.filters {
  position: absolute; left: 14px; bottom: 36px; display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 6px 5px 13px; box-shadow: var(--shadow); font-size: 12px; color: var(--ink-2);
}
.filters .chip { padding: 3px 10px; }
.filters .chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- svg pieces ---------- */

.band { fill: var(--panel-2); stroke: var(--line-2); }
.band-title { fill: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.09em; text-transform: uppercase; }
.layer-title { fill: var(--ink-2); font: 600 12px var(--sans); pointer-events: none; }

.layer-head { cursor: pointer; }
.layer-head-hit { fill: transparent; }
.layer-head:hover .layer-head-hit { fill: var(--card-hover); }
.layer-head:hover .layer-title { fill: var(--accent); }

/* A folded column: narrow enough to ignore, wide enough to click back open. */
.strip { cursor: pointer; }
.strip rect { fill: var(--card); stroke: var(--line); stroke-dasharray: 3 3; }
.strip:hover rect { fill: var(--card-hover); stroke: var(--accent); stroke-dasharray: none; }
.strip-title { fill: var(--ink-3); font: 600 11px var(--sans); }
.strip:hover .strip-title { fill: var(--accent); }

.node rect { fill: var(--card); stroke: var(--line); stroke-width: 1; rx: 9; }
.node .title { fill: var(--ink); font: 600 12.5px var(--sans); }
.node .meta { fill: var(--ink-3); font: 11px var(--mono); }
.node .bar-bg { fill: var(--line-2); }
.node .bar { fill: var(--ok); }
.node { cursor: pointer; }
.node:hover rect { fill: var(--card-hover); stroke: var(--accent); }
.node[data-sel='true'] rect { stroke: var(--accent); stroke-width: 2.5; }
.node[data-rel='in'] rect { stroke: var(--in); stroke-width: 2; }
.node[data-rel='out'] rect { stroke: var(--out); stroke-width: 2; }
.node[data-dim='true'] { opacity: 0.24; }
.node[data-hit='true'] rect { fill: var(--card-hover); stroke: var(--accent); stroke-dasharray: 4 3; }
.node[data-focus='true'] rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 3; }

.edge { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-opacity: 0.55; }
.edge[data-back='true'] { stroke: var(--warn); stroke-opacity: 0.5; }
.edge[data-type='true'] { stroke-dasharray: 3 4; }
.edge[data-rel='in'] { stroke: var(--in); stroke-width: 2; stroke-opacity: 1; }
.edge[data-rel='out'] { stroke: var(--out); stroke-width: 2; stroke-opacity: 1; }
.edge[data-dim='true'] { stroke-opacity: 0.07; }

/* ---------- side panel ---------- */

aside {
  width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 16px 18px 40px;
}
aside.empty { color: var(--ink-3); }
aside h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
aside h3 {
  margin: 22px 0 8px; font: 600 11px var(--sans); letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-3);
}
aside .layer-tag { color: var(--ink-3); font-size: 12px; }
aside .owns { margin: 10px 0 0; color: var(--ink); }
aside .note {
  margin: 6px 0 0; padding: 8px 10px; background: var(--panel-2);
  border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--ink-2);
}

.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.actions button {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer;
}
.actions button:hover { border-color: var(--accent); color: var(--accent); }
.actions button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 7px 9px; }
.stat b { display: block; font-size: 16px; font-weight: 620; }
.stat span { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.03em; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 4px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.list li:last-child { border-bottom: 0; }
.path { font: 11.5px var(--mono); color: var(--ink-2); word-break: break-all; }
.num { color: var(--ink-3); font: 11px var(--mono); float: right; margin-left: 8px; }

.link { color: var(--accent); cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }
a.link { color: var(--accent); }
/* A dependency that is currently filtered off the map — clicking it brings it back. */
.link.off { color: var(--ink-3); text-decoration: underline dotted; }
.link.off:hover { color: var(--accent); }

.tag {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); margin: 0 4px 4px 0;
}
.tag.warn { border-color: var(--warn); color: var(--warn); }
.tag.ok { border-color: var(--ok); color: var(--ok); }

/* ---------- flows ---------- */

.flow-wrap { height: 100%; overflow: auto; padding: 22px 26px 60px; }
.flow-wrap h2 { margin: 0 0 4px; font-size: 19px; }
.flow-wrap .intro { color: var(--ink-2); max-width: 70ch; margin: 0 0 20px; }
.flow { margin-bottom: 42px; }
.steps { display: flex; flex-direction: column; gap: 0; max-width: 900px; }
.step { display: flex; gap: 14px; }
.step .rail { width: 22px; flex: none; display: flex; flex-direction: column; align-items: center; }
.step .dot {
  width: 11px; height: 11px; border-radius: 50%; background: var(--accent);
  margin-top: 15px; flex: none; box-shadow: 0 0 0 3px var(--bg);
}
.step[data-side='server'] .dot { background: var(--out); }
.step[data-side='wire'] .dot { background: var(--in); }
.step .stem { flex: 1; width: 2px; background: var(--line); }
.step:last-child .stem { background: none; }
.step .body {
  flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 10px;
}
.step .body h4 { margin: 0 0 4px; font-size: 14px; }
.step .body p { margin: 0; color: var(--ink-2); font-size: 13px; }
.step .body .where { margin-top: 7px; font-size: 12px; }

/* ---------- runtime (#624) ---------- */

/* Contract strength, strongest first: one colour + one dash pattern per level, so the
   legend reads in greyscale too. */
[data-contract='bound'] { --c: var(--ok); --dash: none; }
[data-contract='named'] { --c: var(--in); --dash: 10 4; }
[data-contract='one-side'] { --c: var(--out); --dash: 5 5; }
[data-contract='opaque'] { --c: var(--ink-3); --dash: 1.5 5; }

.rt-wrap { display: flex; height: 100%; }
.rt-canvas { flex: 1; min-width: 0; overflow: auto; padding: 0 0 30px; }
#rt-svg { display: block; width: 100%; height: auto; }
.rt-legend {
  position: sticky; top: 0; left: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line-2); font-size: 12.5px;
}
.rt-key { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.rt-key line { stroke: var(--c); stroke-width: 3; stroke-dasharray: var(--dash); stroke-linecap: round; }
.rt-key-note { color: var(--ink-3); font-size: 11.5px; }

.rt-zone rect { fill: var(--panel-2); stroke: var(--line-2); }
.rt-zone-title { fill: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.09em; text-transform: uppercase; }

.rt-link { cursor: pointer; }
.rt-link .rt-hit { fill: none; stroke: transparent; stroke-width: 14; }
.rt-link .rt-line {
  fill: none; stroke: var(--c); stroke-width: 2; stroke-dasharray: var(--dash); stroke-linecap: round; opacity: 0.8;
}
.rt-link:hover .rt-line, .rt-link[data-sel='true'] .rt-line { stroke-width: 3.5; opacity: 1; }
.rt-link[data-dim='true'] .rt-line { opacity: 0.12; }

.rt-label { cursor: pointer; }
.rt-label rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.2; }
.rt-label-text { fill: var(--ink-2); font: 11px var(--mono); }
.rt-label:hover rect, .rt-label[data-sel='true'] rect { stroke-width: 2.4; }
.rt-label[data-dim='true'] { opacity: 0.18; }

.rt-node { cursor: pointer; }
.rt-node rect { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.rt-node[data-kind='external'] rect { stroke-dasharray: 5 4; fill: var(--panel-2); }
.rt-node .rt-store-lid { stroke: var(--line); stroke-width: 1.2; }
.rt-node:hover rect { fill: var(--card-hover); stroke: var(--accent); }
.rt-node[data-sel='true'] rect { stroke: var(--accent); stroke-width: 2.5; }
.rt-node[data-dim='true'] { opacity: 0.3; }
.rt-node-title { fill: var(--ink); font: 600 13px var(--sans); }
.rt-node-kind { fill: var(--ink-3); font: 11px var(--sans); }

.rt-panel {
  width: 380px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 16px 18px 40px;
}
.rt-panel h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
.rt-panel h3 {
  margin: 22px 0 8px; font: 600 11px var(--sans); letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-3);
}
.rt-panel .layer-tag { color: var(--ink-3); font-size: 12px; }
.rt-panel .owns { margin: 10px 0 0; }
.rt-panel .note {
  margin: 8px 0 0; padding: 8px 10px; background: var(--panel-2);
  border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--ink-2);
}
.rt-badge {
  display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; white-space: nowrap;
  border: 1.5px solid var(--c); color: var(--c); font-weight: 600;
}
.rt-msgs { table-layout: fixed; }
.rt-msgs td { font-size: 12.5px; overflow-wrap: anywhere; }
.rt-msgs code { font: 12px var(--mono); color: var(--ink); }
.rt-dir { width: 22px; color: var(--ink-3); font-size: 15px; }
.rt-type { font: 11.5px var(--mono); color: var(--accent); margin-top: 2px; }
.rt-mnote { color: var(--ink-2); margin-top: 2px; }
.rt-runtime { color: var(--ink-2); margin-top: 3px; font-size: 12px; padding-left: 8px; border-left: 2px solid var(--out); }

/* ---------- health ---------- */

.health { height: 100%; overflow: auto; padding: 22px 26px 60px; }
.health h2 { margin: 0 0 6px; font-size: 19px; }
.health h3 { margin: 28px 0 8px; font-size: 14px; }
.health p.lede { color: var(--ink-2); max-width: 78ch; margin: 0 0 6px; }
table { border-collapse: collapse; width: 100%; max-width: 1100px; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { color: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; }
td.r, th.r { text-align: right; }
.empty-note { color: var(--ok); }

/* ---------- understanding (#628) ---------- */

.und-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; max-width: 1100px; margin: 16px 0 6px; }
.und-tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.und-tile.code { border-style: dashed; }
.und-tile span { display: block; font-size: 12px; color: var(--ink-2); }
.und-tile b { display: block; font-size: 24px; font-weight: 620; letter-spacing: -0.02em; margin: 2px 0 6px; }
.und-tile em { display: block; font-style: normal; font-size: 11px; color: var(--ink-3); margin-top: 5px; }
.und-bar { height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.und-bar i { display: block; height: 100%; background: var(--ok); }

.und-status {
  display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; white-space: nowrap;
  border: 1.5px solid var(--st); color: var(--st); font-weight: 600;
}
.und-status.s0 { --st: var(--ink-3); }
.und-status.s1 { --st: var(--out); }
.und-status.s2 { --st: var(--in); }
.und-status.s3 { --st: var(--ok); }

.und-next { list-style: none; padding: 0; margin: 0; max-width: 900px; }
.und-next li { padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.und-tree { list-style: none; margin: 0; padding-left: 0; max-width: 980px; }
.und-tree .und-tree { padding-left: 22px; border-left: 1px solid var(--line); margin-left: 6px; }
.und-tree li { padding: 7px 0 3px; }
.und-why { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; max-width: 80ch; }
.und-refs { font-size: 12px; margin-top: 3px; color: var(--ink-3); }

/* ---------- symbols (#632) ---------- */

.sym {
  cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px;
  text-decoration-color: color-mix(in srgb, currentColor 55%, transparent);
}
.sym:hover { color: var(--accent); text-decoration-style: solid; }
.sym-pop {
  position: fixed; z-index: 50; overflow: auto; padding: 12px 14px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.sym-pop[hidden] { display: none; }
.sym-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin: 4px 28px 6px 0; font-size: 14px; }
.sym-head .tag { margin: 0; }
.sym-pop pre {
  margin: 0 0 10px; padding: 10px 12px; background: var(--panel-2); border-radius: 8px;
  font: 12px/1.5 var(--mono); color: var(--ink); overflow-x: auto; white-space: pre;
}
.sym-pop pre .sym { color: var(--accent); }
.sym-many { margin: 0 28px 8px 0; font-size: 12.5px; color: var(--ink-2); }
.sym-close {
  position: sticky; float: right; top: 0; border: 0; background: none; color: var(--ink-3);
  font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px;
}
.sym-close:hover { color: var(--accent); }
</style>

<header>
  <span class="brand">Grafetto · карта архитектуры</span>
  <div class="tabs">
    <button data-tab="structure" aria-selected="true">Структура</button>
    <button data-tab="runtime" aria-selected="false">Исполнение</button>
    <button data-tab="flows" aria-selected="false">Потоки</button>
    <button data-tab="health" aria-selected="false">Здоровье</button>
    <button data-tab="understanding" aria-selected="false">Понимание</button>
  </div>
  <div class="chips">
    <button class="chip" data-metric="size" aria-pressed="true">размер</button>
    <button class="chip" data-metric="tests" aria-pressed="false">тесты</button>
    <button class="chip" data-metric="churn" aria-pressed="false">правки</button>
    <button class="chip" data-metric="debt" aria-pressed="false">долг</button>
    <button class="chip" data-metric="understanding" aria-pressed="false">понимание</button>
  </div>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Найти модуль или файл  ( / )" />
  <span class="stamp">773b78e · 2026-09-28 18:18 UTC</span>
</header>

<main>
  <div class="view" id="view-structure" data-active="true">
    <svg id="graph"></svg>
    <div class="filters">
      <span id="filter-count"></span>
      <button class="chip" id="filter-keep" hidden></button>
      <button class="chip" id="filter-reset" hidden>показать всё</button>
    </div>

  </div>
  <div class="view" id="view-runtime"></div>
  <div class="view" id="view-flows"></div>

ам (#612). Внизу реестр (roomRegistry.ts): запись комнаты, Map, правило урок/доска, очередь записи в Postgres; над ним — какие строки комната пишет по ходу (roomPersistence.ts). Поверх него отдельно: структурный лог, проверка операций, правило покрытия снапшотом (snapshotCoverage.ts), хранилище снапшотов (snapshotStore.ts), рычаги владельца — заморозка, инструменты, закрытие, доступ, блокировки слоёв (ownerControls.ts) — и живой класс: доски, задания, подсветка, руки (classroom.ts). Холодная загрузка из Postgres — roomLoader.ts; журнал операций — operationLog.ts; взгляды для здоровья, сторожа и админки — roomStats.ts. В rooms.ts остаются создание, вход и выход, выселение и room_state.","adr":["002-collaborative-undo","014-boards","015-class-mode"],"issues":[],"notes":["Работа в классе (ADR 015): личная доска — доска урока с владельцем-учеником. Кто её видит, решает одна функция canSeeBoard (lessons.ts) — и для join_room, и для REST, и для LessonState, который собирается под получателя и шлётся событием lesson_state.","Map остаётся источником правды для всего живого; запись в Postgres — fire-and-forget, её не ждут на горячем пути. Плата: операция, проигравшая гонку падению сервера, выпадает из истории, хотя уже была ретранслирована.","Комната, которая читается как стёртая, — это испорченная строка RoomLayerState, а не потерянные данные."],"tags":["socket.io","комнаты"],"loc":3922,"testLoc":4400,"styleLoc":0,"fileCount":15,"testCount":11,"churn":210,"files":[{"path":"apps/server/src/rooms.test.ts","loc":1782,"kind":"test","in":0,"out":0,"churn":37},{"path":"apps/server/src/socketHandlers.ts","loc":889,"kind":"code","in":1,"out":15,"churn":38},{"path":"apps/server/src/roomSnapshots.test.ts","loc":862,"kind":"test","in":0,"out":0,"churn":19},{"path":"apps/server/src/rooms.ts","loc":586,"kind":"code","in":9,"out":4,"churn":77},{"path":"apps/server/src/boards.test.ts","loc":481,"kind":"test","in":0,"out":0,"churn":8},{"path":"apps/server/src/classMode.test.ts","loc":424," tle":"Штрих — от пера до чужого экрана","intro":"Главный путь приложения. Всё в нём устроено так, чтобы линия появлялась под пером мгновенно и локально, а сеть догоняла потом.","steps":[{"id":"pointer","title":"Событие указателя","module":"engine-input","side":"client","detail":"PointerInput принимает нажим, наклон и скорость (по часам сэмпла, не обработчика) и переводит экранные координаты в координаты холста аналитически, через setTransform."},{"id":"dabs","title":"Сплайн и дабы","module":"engine-dabs","side":"client","detail":"Точки укладываются на сплайн Catmull-Rom, по нему с нужным шагом расставляются дабы, форма каждого берётся из пресета инструмента и отпечатка кончика."},{"id":"raster","title":"Растеризация в буфер","module":"engine-buffers","side":"client","detail":"Дабы рисуются в аккумуляционный буфер штриха, затем — в тайлы слоя. Пользователь видит линию здесь, до всякой сети."},{"id":"op","title":"Операция","module":"engine-oplog","side":"client","detail":"Завершённый штрих становится сериализуемой Operation. Это же значение потом уедет на сервер, ляжет в историю и будет свёрнуто при реплее у всех остальных."},{"id":"pack","title":"Упаковка дабов","module":"shared-dab-codec","side":"wire","detail":"Дабы пакуются в компактный проводной формат — иначе поток не проходит по реальному каналу, а не только по локальной сети."},{"id":"outbox","title":"Исходящая очередь","module":"room-net","side":"client","detail":"Операция кладётся в outbox и переживает потерю связи и перезагрузку страницы. Локально она применена оптимистично, до подтверждения."},{"id":"emit","title":"emit operation","module":"shared-contract","side":"wire","detail":"Сокет отправляет `operation`; параллельно, пока рука ещё ведёт, идут `stroke_live` с частичными дабами и `cursor_move`."},{"id":"relay","title":"Сервер присваивает seq и ретранслирует","module":"server-rooms","side":"server","detail":"Комната в памяти даёт операции порядковый номер, рассылает `operation_confirmed` всем и `peer_stroke_live` — соседям. Сервер ничего не рисует."},{"id":"persist","title":"Запись в Postgres","module":"server-entry","side":"server","detail":"Запись идёт fire-and-forget, её не ждут на горячем пути: задержка БД не должна добавляться к задержке рисования."},{"id":"peer","title":"Чужой клиент сворачивает операцию","module":"engine-facade","side":"client","detail":"У остальных участников та же операция применяется к их движку. Картинка сходится не потому, что кто-то прислал пиксели, а потому что все свернули один и тот же лог."}]},{"id":"join","title":"Вход в комнату и восстановление картинки","intro":"Второй по важности путь: он решает, увидит ли учитель свою работу через неделю и сколько секунд он будет её ждать.","steps":[{"id":"gate","title":"Ворота входа","module":"room-net","side":"client","detail":"Клиент встаёт в очередь входа и держит канвас закрытым, пока не решено, что именно восстанавливать: чужие операции, прилетевшие в это окно, не должны нарисоваться дважды."},{"id":"join_room","title":"join_room","module":"shared-contract","side":"wire","detail":"В запросе едет максимальный seq, который у клиента уже есть, — чтобы сервер не слал заново то, что вкладка не теряла."},{"id":"room_state","title":"room_state","module":"server-rooms","side":"server","detail":"Сервер отдаёт комнату, участников, палитру, статус заморозки, номер последнего снапшота и хвост операций. Что именно вырезано из хвоста, решается по каждому слою отдельно, против его собственного покрытия — общий порог по комнате однажды уже съел рисунок."},{"id":"fetch","title":"Загрузка снапшотов","module":"server-rooms-http","side":"server","detail":"Клиент сам забирает индекс снапшотов и по блобу на слой обычным HTTP — по сокету это не едет."},{"id":"decode","title":"Раскодирование и ретайлинг","module":"engine-oplog","side":"client","detail":"Блобы распаковываются и раскладываются по тайлам слоёв — при этом сетка тайлов может не совпадать с той, в которой снапшот пекли."},{"id":"replay","title":"Реплей хвоста","module":"engine-facade","side":"client","detail":"Поверх восстановленных пикселей сворачивается хвост операций. Операции, несущие и пиксели, и структуру, приходят всегда, а их пиксельную половину клиент пропускает сам — против того покрытия, которое реально восстановил."},{"id":"report","title":"Отчёт о восстановлении","module":"room-diagnostics","side":"client","detail":"Что восстановилось, за сколько и не потерялось ли — уходит в отчёт. Это то, чем мы узнаём о сбое раньше учителя."}]},{"id":"undo","title":"Отмена в четыре руки","intro":"Отмена в общей комнате — не стек. Разбор того, почему именно так, лежит в ADR 002.","steps":[{"id":"request","title":"Клиент просит отменить своё","module":"room-net","side":"client","detail":"Отменяется собственная операция участника по её идентификатору, а не «последнее действие в комнате»."},{"id":"server_undo","title":"Сервер выпускает обратную операцию","module":"server-rooms","side":"server","detail":"Отмена сама становится операцией в общем логе и получает свой seq — иначе порядок у разных участников разъедется."},{"id":"fold","title":"Все сворачивают её одинаково","module":"engine-facade","side":"client","detail":"Структурная отмена возвращает удалённый слой по его id. Пиксели при этом придут только если строка RoomLayerState цела."}]}],"adr":{"001-layer-panel-dnd":"ADR 001: Layer Panel DnD","002-collaborative-undo":"ADR 002: Коллаборативный undo/redo, владение слоями и revoke","003-liner-tool":"ADR 003: Линер / Fineliner — чернильный инструмент рисования","004-marker-tool":"ADR 004: Маркер — инструмент маркер-рендеринга","005-charcoal-tool":"ADR 005: Уголь — рыхлый углеродный материал","006-i18n":"ADR 006: Локализация интерфейса (i18n)","007-desktop-controls":"ADR 007: Управление на ПК с графическим планшетом","008-selection":"ADR 008: Выделение области и операции над выделенным","009-brush-pen":"ADR 009: Brush Pen — нажимное перо","010-fill-tool":"ADR 010: Инструмент заливки","011-watercolor":"ADR 011: Watercolor — акварель как per-stroke wash","012-tip-footprint-geometry":"ADR 012: Единый API геометрии отпечатка","013-digital-brush":"ADR 013: Цифровая кисть — кисть как данные","014-boards":"ADR 014: Доски — несколько холстов в одном уроке","014-layer-filters":"ADR 014: Фильтры слоя","015-class-mode":"ADR 015: Работа в классе — личные доски учеников"},"issues":{"25":"[Refactor] UI: engine не должен храниться в store","375":"[Epic] Датасет как побочный продукт: сбор и дешёвое хранение полных operation logs","493":"[Refactor] UI: декомпозиция Room/index.tsx","494":"[Refactor] Engine: декомпозиция PencilEngine","525":"[Epic] UI+Engine: фигуры — прямоугольник, эллипс, polystar, линия","529":"[Feature] UI: инструменты фигур, их настройки и два цвета (обводка и заливка)","530":"[Feature] UI: жест фигуры, правка до подтверждения и числовой ввод размеров","542":"[UX] UI: единый способ показывать и менять цвет инструмента","548":"[Feature] UI: набор инструментов комнаты и вкладки на экране создания","549":"🗺️ Интерактивная карта архитектуры (вне трека)","574":"[Feature] Engine: фильтры слоя — размытие, движение, HSL, кривые, цветовой баланс"},"health":{"violations":[{"rule":"engine-public-api-only","severity":"error","from":"apps/web/scripts/bakePaperTextures.ts","to":"apps/web/src/engine/src/paperCatch.ts","fromModule":"build-assets","toModule":"engine-paper"},{"rule":"engine-public-api-only","severity":"error","from":"apps/web/scripts/bakePaperTextures.ts","to":"apps/web/src/engine/src/paperConstants.ts","fromModule":"build-assets","toModule":"engine-paper"},{"rule":"engine-public-api-only","severity":"error","from":"apps/web/scripts/bakePaperTextures.ts","to":"apps/web/src/engine/src/paperManifest.ts","fromModule":"build-assets","toModule":"engine-paper"},{"rule":"engine-public-api-only","severity":"error","from":"apps/web/scripts/paperAssetIO.ts","to":"apps/web/src/engine/src/paperConstants.ts","fromModule":"build-assets","toModule":"engine-paper"},{"rule":"engine-public-api ие участники","col":2,"note":"Каждый — такая же вкладка, как слева."}],"nodes":[{"id":"ui","title":"Интерфейс и стор","zone":"device","at":[1,1],"kind":"process","owns":"React-страницы и один Zustand-стор. Стор — отражение того, что уже применено к движку, а не источник правды для картинки: движок меняют императивным вызовом, стор потом записывает результат.","modules":["app-shell","room-shell","room-net","room-tools","room-panels","store-room","store-app","lib-api"]},{"id":"engine","title":"Движок","zone":"device","at":[0,1],"kind":"process","owns":"PencilEngine в том же JS-потоке, что и интерфейс. Держит лог операций, тайлы слоёв и конвейер от события пера до даба. Интерфейс видит его только через PencilEngineAPI.","modules":["engine-facade","engine-input","engine-dabs","engine-oplog","engine-buffers","engine-presets"]},{"id":"gpu","title":"GPU (WebGL1)","zone":"device","at":[0,0],"kind":"store","owns":"Текстуры тайлов, буфер штриха и шейдеры. Сюда уезжает всё, что видно на холсте; обратно — только через readPixels, дорого и редко.","modules":["engine-raster","engine-paper","engine-buffers"]},{"id":"idb","title":"IndexedDB","zone":"device","at":[1,0],"kind":"store","owns":"Исходящая очередь операций (outbox): переживает потерю связи и перезагрузку вкладки. И буфер обмена редактора — он переживает переход в другую комнату и виден из соседней вкладки.","modules":["room-net"]},{"id":"ls","title":"localStorage","zone":"device","at":[0,2],"kind":"store","owns":"Настройки приложения и комнаты, флаги, калибровка нажима. Только удобства этого устройства — ничего, что должны видеть другие.","modules":["store-app","lib-browser"]},{"id":"sw","title":"Service Worker","zone":"device","at":[1,2],"kind":"process","owns":"Кэш сборки для PWA. `/api/` и `/socket.io/` он не трогает — это проверено тестом, иначе он отдавал бы устаревшие ответы. Он же отдаёт старую сборку сразу после деплоя.","modules":["pwa"]},{"id":"peer","title":"Вкладка другого участника","zone":"peer","at":[0,2],"kind":"process","owns":"Та же схема, что слева: свой интерфейс, свой движок, свой GPU. Картинка у всех сходится не потому, что кто-то шлёт пиксели, а потому что все сворачивают один и тот же лог."},{"id":"nginx","title":"nginx","zone":"vps","at":[0,0],"kind":"process","owns":"TLS, раздача статики (сборка, текстуры бумаги, шрифт иконок — заранее сжатые) и прокси /api и /socket.io на процесс Node. Сам ничего не понимает в сообщениях."},{"id":"server","title":"Процесс Node","zone":"vps","at":[0,1],"kind":"process","owns":"Fastify (HTTP) и Socket.io в одном процессе. Комнаты живут в памяти: сервер присваивает операциям seq и ретранслирует их, но ничего не рисует. Пишет в БД, не дожидаясь записи.","modules":["server-rooms","server-rooms-http","server-auth","server-admin","server-health","server-entry"]},{"id":"pg","title":"Postgres","zone":"vps","at":[1,0],"kind":"store","owns":"Источник правды между сессиями: пользователи, комнаты, полный лог операций (он же датасет), снапшоты слоёв, миниатюры.","modules":["server-entry"]},{"id":"backup","title":"Ночной бэкап","zone":"vps","at":[1,2],"kind":"process","owns":"cron → deploy/backup.sh: pg_dump и выгрузка копии за пределы машины. Запуск, который не выгрузил копию, считается упавшим — локальные дампы умирают вместе с сервером."},{"id":"resend","title":"Resend","zone":"external","at":[1,0],"kind":"external","owns":"Отправка писем. Сейчас это только коды входа — то есть без него нельзя войти."},{"id":"sentry","title":"Sentry","zone":"external","at":[0,0],"kind":"external","owns":"Ошибки и отчёты с клиента и с сервера.","modules":["lib-observability"]},{"id":"b2","title":"Backblaze B2","zone":"external","at":[2,0],"kind":"external","owns":"Внемашинная копия базы."}],"links":[{"id":"engine-api","from":"ui","to":"engine","channel":"вызовы PencilEngineAPI","contract":"bound","summary":"Operation, ToolType","note":"Один интерфейс, одна реализация, один пакет — самый крепкий контракт в системе. Главное правило границы: стор — отражение движка. Меняют движок, стор записывает результат.","messages":[{"dir":"→","name":"appendOperation","type":"Operation","note":"чужая или восстановленная операция"},{"dir":"→","name":"setTool / setColor / setSize …","type":"ToolType","note":"текущее состояние инструмента"},{"dir":"→","name":"setViewport","type":"cx, cy, zoom, angle","note":"вьюпорт у каждого свой"},{"dir":"→","name":"restoreLayerFromSnapshot","type":"SnapshotTile[]","decl":["apps/web/src/engine/src/snapshotCodec.ts"]},{"dir":"→","name":"appendPeerLiveDabs","type":"PeerLivePacket","decl":["apps/web/src/engine/index.ts"],"note":"чужой штрих, пока он ещё рисуется"},{"dir":"←","name":"onLocalOperation","type":"Operation","note":"свой завершённый штрих — дальше он уедет в outbox"},{"dir":"←","name":"undo() / redo()","type":"Operation","note":"обратная операция, её тоже отправляют"},{"dir":"←","name":"bakeNetworkSnapshot","type":"Uint8Array","note":"слой, упакованный для снапшота"}]},{"id":"engine-gpu","from":"engine","to":"gpu","channel":"вызовы WebGL1","contract":"opaque","summary":"дабы, текстуры","note":"Здесь тип — это раскладка байтов в буфере, и компилятор её не видит. Поэтому ошибки здесь проявляются чёрным экраном или разной картинкой на разных GPU, а не красным typecheck.","messages":[{"dir":"→","name":"дабы штриха","type":"Float32Array"},{"dir":"→","name":"текстуры бумаги и тайлов","type":"WebGLTexture"},{"dir":"←","name":"readPixels","type":"Uint8Array","note":"снапшоты, миниатюры, пипетка"}]},{"id":"ui-socket","from":"ui","to":"server","channel":"Socket.io (WebSocket)","contract":"bound","checks":"socket","summary":"Operation, StrokeLiveData","note":"Одна таблица событий в packages/shared/src/protocol.ts параметризует и клиентский Socket, и серверный Server. Переименуешь поле — typecheck упадёт с обеих сторон. Но только на этапе компиляции: пришедший пакет сервер не сверяет с типом, он проверяет права, а не форму.","messages":[{"dir":"→","name":"create_room","type":"Room, JoinResult","note":"ответ через ack"},{"dir":"→","name":"join_room","type":"JoinResult","note":"в запросе — последний известный seq"},{"dir":"→","name":"operation","type":"Operation, SendResult","note":"главный канал: штрихи и любые правки. Штрих — StrokeOperation: слой, инструмент, цвет и массив Dab — отпечатков кисти (координаты, нажим, наклон, размер), а не пиксели","runtime":"права и заморозка проверяются, форма — нет"},{"dir":"→","name":"stroke_live","type":"StrokeLiveData","note":"дабы, пока рука ещё ведёт"},{"dir":"→","name":"stroke_live_end","type":"strokeId"},{"dir":"→","name":"cursor_move","type":"CursorMoveData"},{"dir":"→","name":"clock_sync","type":"serverNow","note":"сверка часов для живого штриха"},{"dir":"→","name":"palette_add_color","type":"color"},{"dir":"→","name":"palette_remove_color","type":"color"},{"dir":"→","name":"set_room_frozen","type":"boolean"},{"dir":"→","name":"set_room_tools","type":"ToggleableTool[]"},{"dir":"→","name":"set_participant_frozen","type":"userId, frozen"},{"dir":"→","name":"set_active_board","type":"boardId"},{"dir":"→","name":"assignment_start","type":"AssignmentStartResult"},{"dir":"→","name":"set_class_location","type":"assignmentId"},{"dir":"→","name":"set_spotlight","type":"boardId"},{"dir":"→","name":"set_hand_raised","type":"raised"},{"dir":"→","name":"set_class_visibility","type":"ClassVisibility"},{"dir":"←","name":"room_state","type":"Room, Operation[], Participant[], LessonState","note":"всё для входа: комната, хвост лога, участники"},{"dir":"←","name":"operation_confirmed","type":"seq, Operation","note":"подтверждение — операция получила место в общем порядке"},{"dir":"←","name":"peer_stroke_live","type":"StrokeLiveData"},{"dir":"←","name":"peer_stroke_live_end","type":"strokeId"},{"dir":"←","name":"peer_cursor","type":"CursorMoveData"},{"dir":"←","name":"peer_joined","type":"Participant"},{"dir":"←","name":"peer_left","type":"userId"},{"dir":"←","name":"palette_updated","type":"palette"},{"dir":"←","name":"room_frozen_chan At    DateTime @default(now())\n\n  @@index([createdAt])\n  @@index([targetUserId])\n}","truncated":false}],"AdminActionList":[{"path":"packages/shared/src/admin.ts","line":254,"kind":"type","snippet":"export type AdminActionList = { actions: AdminActionRow[] }","truncated":false}],"AdminIpBanList":[{"path":"packages/shared/src/admin.ts","line":138,"kind":"type","snippet":"export type AdminIpBanList = { bans: AdminIpBan[] }","truncated":false}],"AdminIpDetail":[{"path":"packages/shared/src/admin.ts","line":112,"kind":"type","snippet":"/** (#590) Everyone seen from one address, and its ban history. */\nexport type AdminIpDetail = {\n  ip: string\n  activeBan: AdminIpBan | null\n  sightings: Array\u003c{\n    userId: string\n    email: string | null\n    name: string | null\n    deviceId: string\n    firstSeenAt: string\n    lastSeenAt: string\n    userBanned: boolean\n  }>\n  bans: AdminIpBan[]\n}","truncated":false}],"AdminLessonList":[{"path":"packages/shared/src/admin.ts","line":239,"kind":"type","snippet":"export type AdminLessonList = { lessons: AdminLessonRow[]; total: number }","truncated":false}],"AdminOverview":[{"path":"packages/shared/src/admin.ts","line":4,"kind":"type","snippet":"export type AdminOverview = {\n  /** (#589) Devices seen in the last seven days, by platform and by browser. */\n  devices: {\n    byPlatform: Array\u003c{ key: string; count: number }>\n    byBrowser: Array\u003c{ key: string; count: number }>\n  }\n  users: {\n    registered: number\n    registeredLast24h: number\n    registeredLast7d: number\n    /** Guests who have been in at least one room. Every browser that ever\n     *  loaded a page is a guest row, so the bare count is mostly noise. */\n    activeGuests: number\n    seenLast24h: number\n    banned: number\n  }\n  lessons: {\n    total: number\n    createdLast24h: number\n    createdLast7d: number\n    /** Lessons anyone entered in the last 24 hours. */\n    activeLast24h: number\n  }\n  live: {\n    sockets: number\n    people: number\n    lessons: AdminLiveLesson[]\n  }\n  server: {\n    uptimeSeconds: number\n    rssMb: number\n    heapUsedMb: number\n    heapLimitMb: number\n    residentRooms: number\n    residentOperations: number\n    diskUsedPct: number | null\n    diskFreeGb: number | null\n  }\n}","truncated":false}],"AdminUserDetail":[{"path":"packages/shared/src/admin.ts","line":79,"kind":"type","snippet":"export type AdminUserDetail = AdminUserRow & {\n  banReason: string | null\n  bannedById: string | null\n  sessionsRevokedAt: string | null\n  lessons: AdminUserLesson[]\n  devices: AdminDevice[]\n  ips: AdminUserIp[]\n  actions: AdminActionRow[]\n}","truncated":false}],"AdminUserList":[{"path":"packages/shared/src/admin.ts","line":67,"kind":"type","snippet":"export type AdminUserList = { users: AdminUserRow[]; total: number }","truncated":false}],"AssignmentStartResult":[{"path":"packages/shared/src/protocol.ts","line":420,"kind":"type","snippet":"/** (#595) `assignment_start`'s answer. `busy`: another one is still being\n *  created — a double tap, answered once. */\nexport type AssignmentStartResult =\n  | { ok: true; assignment: AssignmentSummary }\n  | { ok: false; error: 'not_owner' | 'busy' | 'server_error' }","truncated":false}],"BoardSummary":[{"path":"packages/shared/src/room.ts","line":167,"kind":"type","snippet":"// (#176, ADR 014) One entry of a lesson's board strip — what the client needs\n// to draw the strip and to switch, nothing more. The full `Room` of a board\n// arrives with its own `room_state` once the client joins it. The lesson\n// itself is the first entry, at `order` 0, under its own id.\nexport type BoardSummary = {\n  id: string\n  name: string\n  order: number\n  // Same cache-busting key `Room.thumbnailUpdatedAt` is; absent until the\n  // board has been baked once. Kept current by `board_thumbnail_updated`\n  // (#595) for everyone who may see the board.\n  thumbnailUpdatedAt?: string\n  // (#595) Set on a personal board only — see `Room.assignmentId`. Personal\n  // boards are not pages of the lesson's strip: they have their own grid, and\n  // their `order` is meaningless.\n  assignmentId?: string\n  ownerId?: string\n}","truncated":false}],"ClassVisibility":[{"path":"packages/shared/src/room.ts","line":144,"kind":"type","snippet":"/** (#595, ADR 015 §3) Whether students see each other's personal boards.\n *  `teacher_only` — only the teacher and the board's own student; `class` —\n *  everyone in the lesson may look (and only look: drawing stays the student's\n *  and the teacher's). Spelled as the Postgres enum, like `RoomAccessMode`. */\nexport type ClassVisibility = 'teacher_only' | 'class'","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":278,"kind":"enum","snippet":"// Spelled as the wire values in packages/shared's `ClassVisibility`, the same\n// way `RoomAccessMode` is, so the row crosses to the client with no mapping.\nenum ClassVisibility {\n  teacher_only\n  class\n}","truncated":false}],"ClientEnvironment":[{"path":"packages/shared/src/admin.ts","line":153,"kind":"type","snippet":"/** (#589) What a browser reports about itself once per page load\n *  (apps/web lib/environment.ts). Flat on purpose: the server keeps only the\n *  keys it knows, each checked against its type (`sanitizeClientEnvironment`),\n *  and a flat record is what makes that a loop instead of a parser.\n *\n *  Every field is optional — an old build, a browser without WebGL, a field\n *  added later — and the admin panel shows whatever arrived. */\nexport type ClientEnvironment = {\n  appVersion?: string\n  /** The effective device type (ADR 007), and whether the person picked it\n   *  in Settings rather than leaving it to detection. */\n  deviceType?: string\n  deviceTypeChosen?: boolean\n  screenW?: number\n  screenH?: number\n  dpr?: number\n  viewportW?: number\n  viewportH?: number\n  maxTouchPoints?: number\n  /** `(pointer: …)` of the primary input: coarse, fine or none. */\n  pointer?: string\n  hover?: boolean\n  /** A pen with pressure has touched this browser at least once. Sticky. */\n  penSeen?: boolean\n  /** Launched as an installed PWA rather than in a tab. */\n  standalone?: boolean\n  language?: string\n  timeZone?: string\n  webgl?: boolean\n  gpuVendor?: string\n  gpuRenderer?: string\n  maxTextureSize?: number\n  deviceMemoryGb?: number\n  cores?: number\n}","truncated":false}],"CursorMoveData":[{"path":"packages/shared/src/protocol.ts","line":79,"kind":"type","snippet":"/** Peer cursor position (#37). Sent only while the sender is *not* drawing.\n *\n *  (#431) This used to carry a `drawing` flag, and peers froze the cursor dot\n *  wherever it last was for as long as it was true. That was the only sane\n *  choice at the time: the stroke's shape was unknown until the finished\n *  StrokeOperation arrived, so a cursor that kept following the pointer would\n *  have run seconds ahead of its own ink. Freezing was less wrong than lying.\n *\n *  With the stroke streaming live (#429) the flag has nothing left to do, so\n *  it is gone rather than left as a field nobody reads. While the pen is down\n *  a peer's cursor position comes from the last dab it actually painted — the\n *  same packets that draw the ink — which is what makes the dot and the line\n *  it is drawing incapable of disagreeing: they are the same data. And since\n *  the dab stream already carries the position, sending cursor packets during\n *  a stroke would be spending ~30 packets a second to say it again, less\n *  accurately. */\nexport type CursorMoveData = {\n  x: number\n  y: number\n}","truncated":false}],"Dab":[{"path":"packages/shared/src/stroke.ts","line":25,"kind":"type","snippet":"export type Dab = {\n  x: number\n  y: number\n  pressure: number\n  tiltX: number\n  tiltY: number\n  size: number\n  aspectRatio: number\n  angle: number\n  // Final dab opacity, baked at record time (preset × user opacity × stroke\n  // speed). Replay has no live pointer speed, so it must not recompute this.\n  opacity: number\n  // Milliseconds since the stroke's first dab (always 0 for that first dab).\n  // Undo/redo/checkpoint replay ignore it (paints the whole array at once),\n  // but a peer's live-stroke reveal (#37 follow-up v2) uses it to play the\n  // recorded dabs back at the original pacing instead of all at once.\n  t: number\n}","truncated":false}],"EmailMessage":[{"path":"apps/server/src/email.ts","line":25,"kind":"interface","snippet":"export interface EmailMessage {\n  to: string\n  subject: string\n  /** Plain-text half. Never optional: some clients show it, and a mail with\n   *  no text part scores worse with spam filters — which for a sign-in code\n   *  is the difference between logging in and not. */\n  text: string\n  html: string\n}","truncated":false}],"JoinResult":[{"path":"packages/shared/src/protocol.ts","line":59,"kind":"type","snippet":"export type JoinResult =\n  | { ok: true; userId: string }\n  | { ok: false; error: JoinDenial }","truncated":false}],"LayerState":[{"path":"packages/shared/src/layers.ts","line":37,"kind":"interface","snippet":"export interface LayerState {\n  items: Record\u003cstring, LayerItem>\n  rootOrder: string[]    // top→bottom; index 0 = topmost layer\n  activeId: string\n  selectedIds: string[]\n}","truncated":false}],"LessonState":[{"path":"packages/shared/src/room.ts","line":191,"kind":"type","snippet":"/** The lesson half of a board's `room_state` (#176): which lesson this board\n *  belongs to, every board in it, and the one the teacher is on. `id` is the\n *  lesson's id — for a room with a single board it equals `room.id`.\n *\n *  (#595) Built *for its recipient*: `boards` holds every shared board, and\n *  of the personal ones only those this person may see (their own, all of\n *  them for the teacher, all of them under `classVisibility: 'class'`, and the\n *  one in the spotlight). Which is why it arrives on its own as `lesson_state`\n *  whenever that set changes, rather than as a broadcast delta. */\nexport type LessonState = {\n  id: string\n  boards: BoardSummary[]\n  // Null means the lesson's own first board — see `Room.activeBoardId`.\n  activeBoardId: string | null\n  // (#595, ADR 015) Every assignment round of this lesson, in order.\n  assignments: AssignmentSummary[]\n  // Where the class is (ADR 015 §11): an assignment — each student on their\n  // own board in it — or null, everyone on the teacher's board. A following\n  // student goes where this says (see the web's followTarget).\n  activeAssignmentId: string | null\n  // The personal board the teacher is showing everyone; null when none. A\n  // following student is on it while it is set, whatever else is going on.\n  spotlightBoardId: string | null\n  classVisibility: ClassVisibility\n  // Who has a hand up, by userId. Live only, never persisted — like freeze.\n  handsRaised: string[]\n}","truncated":false}],"MyRooms":[{"path":"apps/web/src/lib/api.ts","line":111,"kind":"interface","snippet":"export interface MyRooms {\n  owned: Room[]\n  participated: Room[]\n}","truncated":false}],"Operation":[{"path":"packages/shared/src/operations.ts","line":50,"kind":"type","snippet":"export type Operation =\n  | StrokeOperation\n  | LayerAddOperation\n  | ImageImportOperation\n  | FolderAddOperation\n  | LayerDeleteOperation\n  | LayerMoveOperation\n  | LayerOpacityOperation\n  | LayerVisibilityOperation\n  | LayerRenameOperation\n  | LayerOwnerLockOperation\n  | LayerLockOperation\n  | LayerClearOperation\n  | LayerMergeOperation\n  | LayerDuplicateOperation\n  | LayerTransformOperation\n  | AreaTransformOperation\n  | AreaClearOperation\n  | AreaPasteOperation\n  | AreaFillOperation\n  | ShapeOperation\n  | LayerFilterOperation\n  | OperationRevokeOperation\n  | OperationUndoOperation\n  | OperationRedoOperation\n  | AnnotationAddOperation\n  | AnnotationUpdateOperation\n  | AnnotationDeleteOperation","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":344,"kind":"model","snippet":"// One row per Operation (@art-lessons/shared) as broadcast over the wire —\n// `data` is the full serialized op (source of truth for replay); `type`/\n// `layerId`/`tool` are pulled out as their own columns purely for querying\n// without parsing JSON. Only `stroke` ops have `tool`, and a few op types\n// (layer_delete, operation_revoke/undo/redo) have no `layerId` at all — see\n// the `Operation` union in packages/shared — hence both stay nullable.\nmodel Operation {\n  id        String   @id\n  seq       Int\n  type      String\n  roomId    String\n  room      Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  userId    String\n  layerId   String?\n  tool      String?\n  data      Json\n  createdAt DateTime @default(now())\n\n  @@unique([roomId, seq])\n}","truncated":false}],"OutboxEntry":[{"path":"apps/web/src/pages/Room/outboxStorage.ts","line":5,"kind":"interface","snippet":"// (#289 epic, reliable history spec v0.2 §9) One record per operation this\n// client has sent but not yet gotten a definitive SendResult for.\nexport interface OutboxEntry {\n  op: Operation\n  // (#358) Which room this operation was drawn in. An `Operation` says nothing\n  // about that — the server records one against whatever room the sending\n  // socket has joined — so without it a queue shared by every room in one\n  // browser profile has no way to tell whose work it is holding. It had none:\n  // opening any next room drained the previous room's unconfirmed strokes into\n  // it, and they were accepted (every room's first layer carries the same\n  // INITIAL_LAYER_ID, so even the alive-id check passed) and painted for\n  // everyone there.\n  roomId: string\n  attempts: number\n  nextRetryAt: number\n}","truncated":false}],"Participant":[{"path":"packages/shared/src/room.ts","line":303,"kind":"type","snippet":"export type Participant = {\n  userId: string\n  name: string\n  role: ParticipantRole\n  color: string // cursor color\n  // (#254 epic) Owner-triggered runtime privilege, computed server-side same\n  // as `role` — never persisted, reset whenever the in-memory room record\n  // itself is (server restart / room evicted then reloaded). The room's\n  // owner can never be frozen (see rooms.ts's setParticipantFrozen).\n  frozen: boolean\n  // (#176, ADR 014) Which board of the lesson this person is currently on.\n  // Participants belong to the *lesson*, so a `room_state` lists everyone in\n  // the lesson, and this is how a client tells who shares its page. The\n  // server always sets it; optional in the type only so a client built before\n  // boards existed keeps compiling. For a lesson with one board it equals the\n  // lesson id.\n  boardId?: string\n}","truncated":false}],"PeerLivePacket":[{"path":"apps/web/src/engine/index.ts","line":1041,"kind":"interface","snippet":"/** (#429) One packet of a peer's in-progress stroke, as\n *  PencilEngineAPI.appendPeerLiveDabs takes it. Mirrors the wire's\n *  StrokeLiveData with the dabs already decoded — the engine deals in Dab[]\n *  everywhere else, and keeping the unpacking at the socket seam means a test\n *  can drive this without going through the codec. */\nexport interface PeerLivePacket {\n  strokeId: string\n  layerId: string\n  tool: ToolType\n  preset: string\n  color: [number, number, number]\n  packetSeq: number\n  dabs: Dab[]\n  /** (#468) The wash this gesture belongs to — see StrokeLiveData.washId for\n   *  why it has to travel on the live stream and not only on the operation. */\n  washId?: string\n}","truncated":false}],"PencilEngine":[{"path":"apps/web/src/engine/index.ts","line":1758,"kind":"class","snippet":"export class PencilEngine implements PencilEngineAPI {","truncated":false}],"PencilEngineAPI":[{"path":"apps/web/src/engine/index.ts","line":445,"kind":"interface","snippet":"export interface PencilEngineAPI {","truncated":false}],"RequestedLoginCode":[{"path":"apps/web/src/lib/api.ts","line":73,"kind":"interface","snippet":"export interface RequestedLoginCode {\n  /** Four characters also printed in the email, so the person can see the\n   *  mail belongs to the page in front of them (#316). */\n  confirmation: string\n  expiresAt: string\n  /** Only ever present in local development with no mail provider configured\n   *  (#353) — the server refuses to include it otherwise. Its presence is the\n   *  signal that no mail was sent and the code has nowhere else to be read. */\n  devCode?: string\n}","truncated":false}],"Room":[{"path":"packages/shared/src/room.ts","line":29,"kind":"type","snippet":"export type Room = {\n  id: string\n  name: string\n  paper: PaperType\n  // Hex color (sRGB, e.g. \"#f5f0e6\") the creator picked for the paper\n  // background, decided once at creation alongside `paper` itself — never\n  // changed after (same \"fixed after creation\" rule the CreateRoom UI\n  // states for `paper`). Absent on rooms created before this field existed;\n  // renderers fall back to DEFAULT_PAPER_COLORS[paper] in that case (see\n  // engine/index.ts's PAPER_COLORS usage) rather than treating it as\n  // required everywhere.\n  paperColor?: string\n  // Infinite (tiled) canvas — see the engine's ILayerBuffer/TiledLayerBuffer.\n  // canvasWidth/canvasHeight are present iff !infinite; an explicit boolean\n  // discriminant rather than a sentinel width/height so every existing\n  // fixed-canvas call site keeps its exact `room.canvasWidth` shape (no\n  // `!== null`/`!== -1` checks needed anywhere).\n  infinite: boolean\n  canvasWidth?: number\n  canvasHeight?: number\n  hasPassword: boolean\n  // (#224) Required rather than optional, unlike the other fields added to\n  // this type after the fact: the column is NOT NULL with a default, so every\n  // room — including every one that predates the column — has a real value,\n  // and an optional field would invite `?? 'anyone_with_link'` fallbacks at\n  // each call site, i.e. a second place where the default lives and can drift\n  // from the schema's.\n  accessMode: RoomAccessMode\n  ownerId: string\n  // Owner's display name, joined in server-side (User.name is nullable —\n  // guest/anonymous accounts, see schema.prisma's User comment — so this is\n  // too). Only populated by list-style endpoints (e.g. GET /api/rooms/mine)\n  // that explicitly include it; absent elsewhere (e.g. the in-memory room\n  // state built by rooms.ts's cold-load path).\n  ownerName?: string\n  createdAt: string\n  // #146: set once a client has uploaded a composite-PNG preview of the\n  // room's content (RoomThumbnail table) — absent until the first upload.\n  // Client-only cache-busting key for `\u003cimg src=\"/api/rooms/:id/thumbnail\">`;\n  // the bytes themselves are fetched separately, never inlined here.\n  thumbnailUpdatedAt?: string\n  // (#211 epic) This room's folder placement for the *current* caller —\n  // folders are per-user organization (RoomParticipant.folderId), not a\n  // property of the room itself, so this reflects the caller's own filing,\n  // not a global fact about the room. Absent/undefined = root level.\n  folderId?: string\n  // (#222) Set while the room is closed for editing — the state the homework\n  // model's source lesson sits in (release track #314 §4), and what makes a\n  // template trustworthy: a fork can only be a faithful copy if its source\n  // cannot drift after the copy was taken.\n  //\n  // Unlike the room/participant freeze (#256/#257), which is a live\n  // classroom control held in memory and lost on restart, this is a property\n  // of the document and is persisted. It is also stricter: freeze exempts the\n  // owner, closing does not — see getOperationRejectReason in rooms.ts.\n  //\n  // A timestamp rather than a boolean because the column already existed as\n  // one (schema.prisma) and \"when was this handed out\" is worth more later\n  // than the bit alone. Absent = open.\n  closedAt?: string\n  // (#317) The room this one was forked from — the homework model's whole\n  // lineage record (see §4 of the release track #314: a lesson is closed for\n  // editing and each student forks it). Absent on rooms created from\n  // scratch. Deliberately survives the parent's deletion as `undefined`\n  // rather than taking the fork with it: a student's own work must not\n  // disappear because the teacher tidied up their side.\n  parentRoomId?: string\n  // (#548) Which tools this room offers, if it restricts them at all. Absent\n  // means it does not — see `sanitizeEnabledTools` for why the unrestricted\n  // case is an absence rather than a list of every tool.\n  //\n  // A property of the room, so it reads the same for the owner and for every\n  // student: a teacher who put out two pencils has to see the two pencils the\n  // class sees. It never touches the Operation Log — strokes drawn with a tool\n  // before it was switched off keep replaying, and a peer's operation with a\n  // tool this room no longer offers still paints. The toolset decides what can\n  // be picked up, not what exists.\n  enabledTools?: ToggleableTool[]\n  // (#176, ADR 014) Boards. A lesson is a Room with no `lessonId` and is also\n  // its own first board; every further board is a Room whose `lessonId` names\n  // the lesson. The two are told apart by this one field, and the split it\n  // draws is the whole model: everything social (participants, access, closed,\n  // tools, palette, freeze) belongs to the lesson, everything content\n  // (operations, snapshots, thumbnail, paper, size) to the board. Boards are\n  // never listed by the room-list endpoints — they are reached through their\n  // lesson's `room_state.lesson.boards`.\n  //\n  // On a board's own `room_state.room` the social fields (`accessMode`,\n  // `hasPassword`, `closedAt`, `enabledTools`, `activeBoardId`) are the\n  // *lesson's*, overlaid by the server, so a client reads one object either\n  // way and never has to know where a fact lives.\n  lessonId?: string\n  // Position in the lesson's board strip; the lesson itself is 0. Absent on\n  // rows the server builds by hand (the same optionality `parentRoomId` has).\n  boardOrder?: number\n  // The board the lesson's owner is on — what a joiner lands on and what a\n  // following student switches to. Absent means the lesson's own first board.\n  // Set only on a lesson (and overlaid onto its boards, see `lessonId`).\n  activeBoardId?: string\n  // (#595, ADR 015) Set together on a *personal board* — a student's own page\n  // in one assignment round — and absent on every other room. Only this\n  // student and the teacher (the lesson's owner) may draw on it; the server\n  // refuses anyone else with `board_not_yours`.\n  assignmentId?: string\n  boardOwnerId?: string\n  // (#595) Lesson only (overlaid onto its boards like `activeBoardId`): who\n  // sees a student's personal board besides the student and the teacher.\n  // Absent on rows the server builds by hand; `teacher_only` is the default.\n  classVisibility?: ClassVisibility\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":119,"kind":"model","snippet":"model Room {\n  id                 String              @id\n  name               String\n  paper              String\n  // Hex color the creator picked for the paper background (see the shared\n  // `Room.paperColor` doc comment) — nullable so pre-existing rows fall back\n  // to DEFAULT_PAPER_COLORS[paper] client-side rather than needing a backfill.\n  paperColor         String?\n  // Infinite (tiled) canvas — canvasWidth/canvasHeight are set iff !infinite.\n  // Nullable rather than a sentinel so existing fixed-canvas rows/queries\n  // don't need to special-case a magic value; `@default(false)` backfills\n  // every pre-existing row as a fixed-canvas room with no data migration.\n  infinite           Boolean             @default(false)\n  canvasWidth        Int?\n  canvasHeight       Int?\n  passwordHash       String?\n  // (#224) Who may enter at all. Deliberately independent of `passwordHash`,\n  // which stays its own toggle applicable in either mode: the password is a\n  // shared secret about the *link*, this is about *people*. A lesson can be\n  // invite-only without a password (the allow-list is the gate) or open with\n  // one (the secret is the gate) — collapsing them into one setting would\n  // make \"invite these three students, no password to type on a tablet\"\n  // unexpressible.\n  //\n  // Enum rather than a String column (unlike `paper`/`verification`) because\n  // this one decides who gets in: a value Postgres cannot hold is a value no\n  // join check has to have an opinion about, and there is no fail-open branch\n  // to get wrong. Its members are spelled exactly as the wire values in\n  // packages/shared's `RoomAccessMode`, so the row travels to the client\n  // through `toWireRoom` with no mapping table and no cast.\n  //\n  // `@default` backfills every existing room as `anyone_with_link` — today's\n  // actual behaviour, so the migration changes no room's accessibility.\n  accessMode         RoomAccessMode      @default(anyone_with_link)\n  // (#548) Which tools this room offers. An empty list means \"no restriction\",\n  // which is also what every pre-existing row backfills to — so this migration\n  // changes no room's behaviour.\n  //\n  // Empty cannot be confused with \"the owner switched everything off\": a legal\n  // toolset always keeps at least one drawing tool (see `sanitizeEnabledTools`\n  // in packages/shared), so the empty list is unreachable as a restriction and\n  // free to mean the absence of one. And the absence is stored as an absence\n  // rather than as all fifteen ids on purpose — a stored full list would keep\n  // the *next* tool this app ships out of every room that never restricted\n  // anything.\n  //\n  // A scalar String[] rather than the enum treatment `accessMode` gets: this\n  // list is read back through the shared sanitizer, which drops ids it does\n  // not know, and that is what lets a row written by a newer build still open\n  // in an older one instead of failing to parse.\n  enabledTools       String[]            @default([])\n  closedAt           DateTime?\n  // (#317) Fork lineage. `SetNull` rather than the `Cascade` every other\n  // relation here uses, and deliberately so: deleting the lesson a student\n  // forked from must never delete the student's own work with it. The fork\n  // keeps everything it was seeded with — that content lives in its own\n  // snapshot and operation rows, not in the parent's — and only forgets\n  // where it came from.\n  parentRoomId       String?\n  parent             Room?               @relation(\"RoomForks\", fields: [parentRoomId], references: [id], onDelete: SetNull)\n  forks              Room[]              @relation(\"RoomForks\")\n  // (#176, ADR 014) Boards. A lesson is an ordinary Room (`lessonId` null) and\n  // is also its own first board; every additional board is a Room row whose\n  // `lessonId` points at the lesson. Everything *social* — participants,\n  // invites, requests, blocks, password, accessMode, closedAt, enabledTools,\n  // palette — is read and written on the lesson (`lessonOf(room)`, see\n  // lessons.ts); everything *content* — operations, snapshots, layer state,\n  // thumbnail — stays on the board itself. Depth is exactly one: a board's\n  // lesson always has `lessonId` null, and the server refuses to create a\n  // board inside a board.\n  //\n  // `Cascade`, unlike `parentRoomId`'s `SetNull` just above, because the two\n  // links mean opposite things: a fork is somebody else's independent work\n  // that merely remembers its origin, a board is a page *of* this lesson and\n  // has no meaning without it. Every pre-existing row is a lesson with one\n  // board, so the migration is purely additive.\n  lessonId           String?\n  lesson             Room?               @relation(\"LessonBoards\", fields: [lessonId], references: [id], onDelete: Cascade)\n  boards             Room[]              @relation(\"LessonBoards\")\n  // Position in the lesson's board strip. The lesson itself is always 0; a new\n  // board takes max + 1. Meaningless (and left at 0) on a lesson row.\n  boardOrder         Int                 @default(0)\n  // The board the teacher is currently on — what a joiner lands on and what\n  // followers switch to. Null means the lesson's own first board. Only ever\n  // set on a lesson row. Not a relation on purpose: it may name a board that\n  // was deleted a moment ago, and the delete route resets it rather than\n  // asking Postgres to.\n  activeBoardId      String?\n  // (#595, ADR 015) Class mode. A *personal board* is a board with an owner of\n  // its own, one per student per assignment round: `assignmentId` and\n  // `boardOwnerId` are set together or not at all, and only on a board\n  // (`lessonId` set). Only the student and the teacher draw on it\n  // (`board_not_yours`); who else may *see* it is the lesson's\n  // `classVisibility`. `boardOwnerId` is not a relation for the same reason\n  // `activeBoardId` is not: nothing here needs Postgres to chase it, and a\n  // student's account going away must not take their lesson's grid with it.\n  assignmentId       String?\n  assignment         Assignment?         @relation(\"AssignmentBoards\", fields: [assignmentId], references: [id], onDelete: Cascade)\n  boardOwnerId       String?\n  // Lesson rows only. The assignment round in progress (null — none), the\n  // personal board the teacher is showing the whole class (null — none), and\n  // whether students see each other's work. `teacher_only` by default: showing\n  // your work to everyone is awkward for beginners, and the teacher can open\n  // it up at any moment.\n  activeAssignmentId String?\n  spotlightBoardId   String?\n  classVisibility    ClassVisibility     @default(teacher_only)\n  assignments        Assignment[]        @relation(\"LessonAssignments\")\n  ownerId            String\n  owner              User                @relation(fields: [ownerId], references: [id])\n  operations         Operation[]\n  participants       RoomParticipant[]\n  invites            RoomInvite[]\n  joinRequests       RoomJoinRequest[]\n  blocks             RoomBlock[]\n  snapshots          RoomLayerSnapshot[]\n  layerState         RoomLayerState?\n  palette            RoomPalette?\n  thumbnail          RoomThumbnail?\n  createdAt          DateTime            @default(now())\n\n  // (#595) One personal board per student per assignment — what makes the\n  // lazy creation for a latecomer safe to race (ADR 015 §2).\n  @@unique([assignmentId, boardOwnerId])\n  // Every read of a lesson's boards is \"its boards, in strip order\".\n  @@index([lessonId, boardOrder])\n}","truncated":false}],"RoomAccessInfo":[{"path":"packages/shared/src/room.ts","line":251,"kind":"type","snippet":"export type RoomAccessInfo = {\n  accessMode: RoomAccessMode\n  hasPassword: boolean\n  invites: RoomInvite[]\n  pendingRequests: RoomJoinRequest[]\n  participants: RoomAccessParticipant[]\n}","truncated":false}],"RoomAccessMode":[{"path":"packages/shared/src/room.ts","line":16,"kind":"type","snippet":"// (#224, release track #314 §6) Who is allowed into a room at all.\n//\n// `anyone_with_link` is what every room did before this existed and stays the\n// default: the id in the URL is the credential. `invite_only` admits the\n// owner, anyone on the room's email allow-list, and anyone the owner has\n// approved from the waiting queue; everyone else can ask, and waits.\n//\n// Orthogonal to `hasPassword` — see the accessMode comment in schema.prisma\n// for why the two are separate toggles rather than one setting.\nexport type RoomAccessMode = 'anyone_with_link' | 'invite_only'","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":551,"kind":"enum","snippet":"// (#224) Members spelled as the wire values on purpose — see Room.accessMode.\nenum RoomAccessMode {\n  anyone_with_link\n  invite_only\n}","truncated":false}],"RoomFolder":[{"path":"packages/shared/src/room.ts","line":290,"kind":"type","snippet":"// (#211 epic) Per-user room-list folder. Nesting via `parentFolderId`\n// (null = root level); see issue #212 for the cycle-guard/empty-only-delete\n// rules enforced server-side. Purely organizational metadata — deleting a\n// folder never deletes the rooms filed in it (see Room.folderId above).\nexport type RoomFolder = {\n  id: string\n  userId: string\n  name: string\n  parentFolderId: string | null\n  createdAt: string\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":326,"kind":"model","snippet":"// (#211 epic, issue #212) Per-user, nestable folder for organizing \"Мои\n// уроки\". Purely organizational metadata (see RoomParticipant.folderId\n// above) — never owns a Room, so deleting a folder is always safe data-wise;\n// the API layer still restricts delete to empty folders only (no direct\n// child rooms or subfolders) to avoid silently reshuffling a user's\n// organization (see roomFolderRoutes.ts).\nmodel RoomFolder {\n  id             String            @id @default(uuid())\n  userId         String\n  user           User              @relation(fields: [userId], references: [id], onDelete: Cascade)\n  name           String\n  parentFolderId String?\n  parentFolder   RoomFolder?       @relation(\"RoomFolderChildren\", fields: [parentFolderId], references: [id], onDelete: SetNull)\n  children       RoomFolder[]      @relation(\"RoomFolderChildren\")\n  participants   RoomParticipant[]\n  createdAt      DateTime          @default(now())\n}","truncated":false}],"RoomInvite":[{"path":"packages/shared/src/room.ts","line":218,"kind":"type","snippet":"/** One entry of an `invite_only` room's allow-list. The address is stored\n *  lowercased/trimmed (see roomAccess.ts) — this is the normalized form, which\n *  is also the one to send back to `DELETE /invites/:email`. */\nexport type RoomInvite = {\n  email: string\n  invitedAt: string\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":473,"kind":"model","snippet":"// (#224, §6 of the release track #314) The allow-list an `invite_only` room\n// admits people by. Keyed by **email, not userId**, and that is the point: the\n// person a teacher invites usually has no account here yet, and every browser\n// already carries a `User` row of its own (see the identity-cookie comment on\n// User), so a userId allow-list could only ever list people who had already\n// been here. The email is resolved to whoever presents it at join time —\n// meaning an invite sent today still admits the student who signs in for the\n// first time tomorrow, without the invite needing to be re-issued.\n//\n// It also means an invite grants nothing to a guest who never signs in: with\n// `email` null on their User row there is nothing to match. That is the\n// intended trade — an allow-list that anonymous browsers could satisfy would\n// not be one.\n//\n// `email` is stored lowercased/trimmed by the API layer before it ever gets\n// here, same rule as LoginCode.email, so an invite typed with capitals still\n// matches the address as stored on User.\nmodel RoomInvite {\n  id              String   @id @default(uuid())\n  roomId          String\n  room            Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  email           String\n  invitedByUserId String\n  // No `onDelete` (Prisma's default Restrict), matching Room.owner rather than\n  // the Cascade the room-scoped relations use: cascading here would let a\n  // deleted account silently retract access it had granted to other people.\n  invitedBy       User     @relation(fields: [invitedByUserId], references: [id])\n  createdAt       DateTime @default(now())\n\n  // Re-inviting an address already on the list is a no-op, not a second row —\n  // and the check \"is this address invited to this room\" is this index.\n  @@unique([roomId, email])\n}","truncated":false}],"RoomJoinRequest":[{"path":"packages/shared/src/room.ts","line":229,"kind":"type","snippet":"/** Someone waiting for the owner to let them in. `email` is included — unlike\n *  on `RoomAccessParticipant` below — because this person is actively asking\n *  the owner for a decision, and the address they are asking with is the\n *  minimum needed to make it a real one rather than a coin flip on a display\n *  name. Only reachable by someone signed in (a guest gets `login_required`),\n *  so it is never null in practice; typed nullable because `User.email` is. */\nexport type RoomJoinRequest = {\n  id: string\n  userId: string\n  name: string\n  email: string | null\n  requestedAt: string\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":503,"kind":"model","snippet":"// (#224) Someone who wants into an `invite_only` room and isn't on its\n// allow-list. The owner sees these as a queue and approves or denies.\n//\n// One row per (room, user), not one per request: a denial that spawned a fresh\n// row every time would let anyone holding the link grow this table without\n// limit, and the owner's queue with it. A repeat ask therefore flips the same\n// row back to `pending` (see #226's endpoints), which also keeps \"this person\n// was already denied once\" visible instead of laundering it into a new\n// request.\n//\n// `name` is what the asker typed on the join screen, snapshotted here rather\n// than read from User.name: a guest's row often has no name at all, and the\n// owner needs something to recognize them by while deciding.\nmodel RoomJoinRequest {\n  id          String                @id @default(uuid())\n  roomId      String\n  room        Room                  @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  userId      String\n  user        User                  @relation(fields: [userId], references: [id], onDelete: Cascade)\n  name        String\n  status      RoomJoinRequestStatus @default(pending)\n  requestedAt DateTime              @default(now())\n  resolvedAt  DateTime?\n\n  @@unique([roomId, userId])\n  // The owner-facing read is always \"pending requests for this room\".\n  @@index([roomId, status])\n}","truncated":false}],"RoomLayerSnapshot":[{"path":"apps/server/prisma/schema.prisma","line":379,"kind":"model","snippet":"// Client-baked snapshot of ONE layer's pixels as of `seq` (#149 epic, made\n// per-layer by #370). `data` is the gzip-compressed output of the engine's\n// `encodeLayerTiles` — raw RGBA tiles, no image codec anywhere in the path.\n//\n// One row per layer rather than one bundle per room, and that is the whole\n// point (#369). A bundle forced every bake to re-read every layer, which is\n// O(layers) of synchronous GPU readback every SNAPSHOT_SEQ_INTERVAL\n// operations; worse, a layer the baking client couldn't produce was simply\n// left out, and since operations were withheld from clients by a single\n// room-wide `latestSnapshotSeq`, a layer missing from the bundle lost its\n// content outright. Per-layer rows make the seq a property of the layer:\n// `coveredSeq(layer)` is the newest row for it, and everything after that\n// stays replayable from the operation log. Not sending a layer then costs\n// nothing but a missed optimisation.\n//\n// `hash` is sha256 of the *decompressed* `data` — used both to dedup (a\n// second upload for a (layer, seq) this room already has is discarded) and,\n// when SNAPSHOT_VERIFY_DETERMINISM is on, to detect a same-seq upload whose\n// pixels don't match what's already stored (a cross-device determinism\n// violation — see rooms.ts's saveSnapshot).\nmodel RoomLayerSnapshot {\n  id           String   @id @default(uuid())\n  roomId       String\n  room         Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  layerId      String\n  seq          Int\n  data         Bytes\n  hash         String\n  createdAt    DateTime @default(now())\n  // (#289 epic, reliable history spec v0.2 §13) Whether this snapshot has\n  // been independently corroborated. `unverified` on arrival; `verified`\n  // once a second, independently-produced bake of the same seq matched this\n  // one's hash; `disputed` if one didn't. Only a `verified` snapshot may\n  // ever justify deleting the raw operations it claims to cover — see\n  // rooms.ts's pruneOperationsBeforeSnapshot, which now refuses to prune\n  // against anything else. `disputed` is deliberately terminal and never\n  // auto-resolved: nothing here can tell which of two disagreeing bakes is\n  // the correct one, so both stay and the raw operations stay too.\n  verification String   @default(\"unverified\")\n\n  @@unique([roomId, layerId, seq])\n  // Every read is \"the newest row for this layer\" (coveredSeq) or \"the newest\n  // row for each layer of this room\" (restore) — both are this index.\n  @@index([roomId, layerId, seq])\n}","truncated":false}],"RoomLayerState":[{"path":"apps/server/prisma/schema.prisma","line":417,"kind":"model","snippet":"// The structural half of a snapshot (#370): which layers exist, their order,\n// names, opacity and visibility, as of `seq`.\n//\n// It used to travel inside each snapshot bundle, because a room-wide seq made\n// \"pixels and structure as of the same moment\" a single fact. With per-layer\n// coverage there is no room-wide moment left to attach it to, so it becomes\n// what it always was underneath: one current value per room, last write wins.\n//\n// Kept as a convenience rather than a source of truth. Every operation that\n// changes it is structural, and structural operations are resident for a\n// room's whole life (see rooms.ts's RESIDENT_OP_TYPES), so a client can\n// always rederive this by folding the log — this only saves it the walk.\nmodel RoomLayerState {\n  id        String   @id @default(uuid())\n  roomId    String   @unique\n  room      Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  seq
