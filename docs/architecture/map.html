та, уже резидентная (то есть\n *  идущий урок), этим гейтом не проверяется вовсе — участник такой комнаты\n *  ничего к куче не добавляет. */\nexport type JoinDenial =\n  | 'not_found'\n  | 'wrong_password'\n  | 'access_revoked'\n  | 'login_required'\n  | 'pending_approval'\n  | 'server_busy'\n  // (#595) A student's personal board, and this person is neither that","truncated":false}],"JoinResult":[{"path":"packages/shared/src/protocol.ts","line":59,"kind":"type","snippet":"export type JoinResult =\n  | { ok: true; userId: string }\n  | { ok: false; error: JoinDenial }","truncated":false}],"LayerAddOperation":[{"path":"packages/shared/src/layerOperations.ts","line":17,"kind":"type","snippet":"/** Inserts a new raster layer directly above whichever layer its author had\n *  selected (#378) — the same `(parentId, index)` delta `layer_move` uses, and\n *  for the same reason it is carried in the operation rather than derived:\n *  `activeId` is per-user view state that never enters the log, so replay on\n *  anyone else's client has nothing to work out a position from. Resolving it\n *  at emission is also what makes concurrent adds behave, exactly like\n *  `layer_delete` resolving folder children up front.\n *\n *  Both fields optional, and absent means \"top of rootOrder\": that is where\n *  every layer went before this existed, so operations already in the log\n *  replay unchanged. */\nexport type LayerAddOperation = OperationBase & {\n  type: 'layer_add'\n  layerId: string\n  name: string\n  parentId?: string | null // folder id, or null/absent for root\n  index?: number           // position within the target container, top→bottom\n}","truncated":false}],"LayerClearOperation":[{"path":"packages/shared/src/layerOperations.ts","line":172,"kind":"type","snippet":"export type LayerClearOperation = OperationBase & {\n  type: 'layer_clear'\n  layerId: string\n}","truncated":false}],"LayerDeleteOperation":[{"path":"packages/shared/src/layerOperations.ts","line":66,"kind":"type","snippet":"export type LayerDeleteOperation = OperationBase & {\n  type: 'layer_delete'\n  layerIds: string[]    // targets plus their folder children, resolved at emission\n}","truncated":false}],"LayerDuplicateOperation":[{"path":"packages/shared/src/layerOperations.ts","line":216,"kind":"type","snippet":"/** (#449) Copies one layer — pixels and all — into a brand-new layer, leaving\n *  the source untouched.\n *\n *  Deliberately its own operation rather than `layer_add` + something: the copy\n *  carries the source's pixels, and nothing already in the log can express\n *  \"these pixels, again, over there\". Re-recording them as an `image_import`\n *  would mean rasterizing to a data URL at emission — lossy on an infinite\n *  canvas, which has no single raster to flatten to, and enormous on the wire\n *  for something the receiving client can reproduce from state it already has.\n *\n *  Shaped like `LayerMergeOperation` above and handled alongside it everywhere,\n *  because it is the same *kind* of thing: an operation carrying pixels **and**\n *  structure at once. That combination is what decides its treatment on the\n *  snapshot path — it is never withheld from a joining client the way a pure\n *  pixel op is (the client needs its structural half), so the client skips the\n *  pixel half itself against the coverage it restored. See `isCoveredBySnapshot`\n *  in the server's rooms.ts and `_isCoveredByRestore` in the engine.\n *\n *  `sourceOpacity` is captured at emission for the same reason a merge captures\n *  its sources': replay must not depend on an opacity the source picked up\n *  afterwards. Unlike a merge it is *not* applied to the pixels — it becomes\n *  the copy's own `opacity`, so the duplicate looks exactly like what was\n *  duplicated rather than baking transparency into ink.\n *\n *  Duplicating a folder is not this operation: it is a `folder_add` plus one of\n *  these per descendant layer, emitted together (see LayerPanel's\n *  `buildDuplicateOps`). A folder holds no pixels of its own, so there is\n *  nothing here for it to copy. */\nexport type LayerDuplicateOperation = OperationBase & {\n  type: 'layer_duplicate'\n  layerId: string        // id of the new copy\n  sourceId: string       // layer being copied; stays alive\n  name: string\n  sourceOpacity: number  // 0–1, the source's own opacity at emission time\n  sourceVisible: boolean\n  parentId: string | null // where the copy lands\n  index: number\n}","truncated":false}],"LayerFilter":[{"path":"packages/shared/src/layerFilters.ts","line":53,"kind":"type","snippet":"export type LayerFilter =\n  | { kind: 'gaussian_blur'; radius: number }","truncated":false}],"LayerFilterOperation":[{"path":"packages/shared/src/layerFilters.ts","line":71,"kind":"type","snippet":"/** A pure single-layer pixel operation, so a layer snapshot can stand in for\n *  it (`COVERABLE_OP_TYPES`) and undo is a replay of the layer without it. */\nexport type LayerFilterOperation = OperationBase & {\n  type: 'layer_filter'\n  layerId: string\n  filter: LayerFilter\n}","truncated":false}],"LayerFolder":[{"path":"packages/shared/src/layers.ts","line":23,"kind":"interface","snippet":"export interface LayerFolder {\n  kind: 'folder'\n  id: string\n  name: string\n  opacity: number\n  visible: boolean\n  collapsed: boolean\n  locked?: boolean\n  ownerLocked?: boolean\n  children: string[]  // ordered ids, top→bottom\n}","truncated":false}],"LayerItem":[{"path":"packages/shared/src/layers.ts","line":35,"kind":"type","snippet":"export type LayerItem = RasterLayer | LayerFolder","truncated":false}],"LayerLockOperation":[{"path":"packages/shared/src/layerOperations.ts","line":166,"kind":"type","snippet":"/** (#488) The other lock: a shared guard anyone may set and anyone may take\n *  off, stopping paint from every hand including the room owner's. Where\n *  `layer_owner_lock` is a claim about *who* may draw, this is a claim that\n *  *nobody* should right now — the \"don't touch this one while we work\"\n *  everyone in the room can see and undo.\n *\n *  It needs no privilege to send — that is what \"anyone may take it off\"\n *  means — but the server does inspect it (#518): it mirrors the flag the\n *  same way it mirrors `layer_owner_lock`, and refuses painting operations\n *  aimed at a locked layer from everyone, the room owner included. Until then\n *  the lock was a client-side courtesy, which is a different feature: any tab\n *  running an older build, or a stale one, wrote through it into everyone\n *  else's canvas. It is a real operation rather than local view state for a\n *  related reason — the alternative was tried, and a lock outside the log\n *  cannot survive a reload, since a reload has no earlier state to carry it\n *  from.\n *\n *  Single `layerId` rather than the plural shape `layer_visibility` uses, and\n *  deliberately: the server refuses layerId-bearing operations aimed at an\n *  owner-locked layer, so naming one layer is what keeps a non-owner from\n *  unlocking what the owner reserved. A mass toggle sends one per layer. */\nexport type LayerLockOperation = OperationBase & {\n  type: 'layer_lock'\n  layerId: string\n  locked: boolean\n}","truncated":false}],"LayerMergeOperation":[{"path":"packages/shared/src/layerOperations.ts","line":177,"kind":"type","snippet":"export type LayerMergeOperation = OperationBase & {\n  type: 'layer_merge'\n  layerId: string       // id of the new merged layer\n  name: string\n  // Bottom→top, with each source's effective opacity captured at merge time\n  // so replay does not depend on later opacity changes.\n  sources: Array\u003c{ id: string; opacity: number }>\n  parentId: string | null // where the merged layer lands\n  index: number\n}","truncated":false}],"LayerMoveOperation":[{"path":"packages/shared/src/layerOperations.ts","line":78,"kind":"type","snippet":"/** Delta move: relocate one item to (parentId, index). A full-order list would\n *  let one user's later reorder silently swallow another's undo (ADR 002 §2).\n *\n *  (#410) `parentId` may now name a folder even when the moving item is itself\n *  a folder. The one structural refusal left is a loop — a folder moved into\n *  its own descendant — and it is enforced in `applyMove`, i.e. on replay,\n *  not only where the gesture is made. */\nexport type LayerMoveOperation = OperationBase & {\n  type: 'layer_move'\n  /** Pre-#413 single-target form, still in recorded logs. Read both through\n   *  `operationLayerIds`. */\n  layerId?: string\n  /** (#413) The items to relocate, inserted as one contiguous run in this\n   *  order. One operation rather than one per item: a group move is one undo,\n   *  and other participants see one change instead of watching a selection\n   *  disassemble and reassemble itself.\n   *\n   *  A single `(parentId, index)` is enough for any legal group only because\n   *  folders nest (#410) — before that, a set mixing folders and layers had no\n   *  single container that could hold all of it. */\n  layerIds?: string[]\n  parentId: string | null // folder id, or null for root\n  index: number           // position within the target container, top→bottom\n}","truncated":false}],"LayerOpacityOperation":[{"path":"packages/shared/src/layerOperations.ts","line":107,"kind":"type","snippet":"/** (#412) Applies one opacity to any number of layers at once.\n *\n *  Plural rather than N separate operations for the reason `layer_transform`\n *  and `layer_delete` are already plural: one operation is one undo. N\n *  operations would make Ctrl+Z take a mass change apart layer by layer, and\n *  would let every other participant in the room watch it happen in pieces.\n *\n *  `layerId` is the pre-#412 single-target form. It is still in the recorded\n *  logs of every live room, so it stays readable forever; new operations only\n *  ever write `layerIds`. Read both through `operationLayerIds` rather than\n *  touching either field directly. */\nexport type LayerOpacityOperation = OperationBase & {\n  type: 'layer_opacity'\n  layerId?: string\n  layerIds?: string[]\n  opacity: number       // 0–1\n}","truncated":false}],"LayerOwnerLockOperation":[{"path":"packages/shared/src/layerOperations.ts","line":139,"kind":"type","snippet":"/** Owner-only (#254/#258): reserves (or releases) a layer for the room\n *  owner — the server rejects `stroke`/other layerId-bearing operations\n *  targeting a `locked: true` layer from anyone but the owner. Goes through\n *  the normal Operation Log/replay path like `layer_visibility`/\n *  `layer_opacity` (so every participant's `RasterLayer.ownerLocked`/\n *  `LayerFolder.ownerLocked` stays in sync via applyContentOp), but is also\n *  the one operation type the server itself inspects the content of — see\n *  rooms.ts's `lockedLayerIds` tracking and its own doc comment for why\n *  that's a deliberate, narrow exception to \"server never renders/parses\n *  operation content\" (CLAUDE.md). */\nexport type LayerOwnerLockOperation = OperationBase & {\n  type: 'layer_owner_lock'\n  layerId: string\n  locked: boolean\n}","truncated":false}],"LayerRenameOperation":[{"path":"packages/shared/src/layerOperations.ts","line":123,"kind":"type","snippet":"export type LayerRenameOperation = OperationBase & {\n  type: 'layer_rename'\n  layerId: string\n  name: string\n}","truncated":false}],"LayerState":[{"path":"packages/shared/src/layers.ts","line":37,"kind":"interface","snippet":"export interface LayerState {\n  items: Record\u003cstring, LayerItem>\n  rootOrder: string[]    // top→bottom; index 0 = topmost layer\n  activeId: string\n  selectedIds: string[]\n}","truncated":false}],"LayerTransformMatrix":[{"path":"packages/shared/src/layerOperations.ts","line":256,"kind":"type","snippet":"/** What travels on the wire (#392). Six numbers is not legacy-and-deprecated\n *  — it stays the encoding every affine gizmo drag emits, because writing\n *  three constants into every log entry for the common case is pure waste.\n *  Nine numbers appears only when a Distort actually needs it.\n *\n *  Consumers never branch on the length: they call toHomography() once at\n *  the read boundary and work in 3x3 from there. That is what keeps a\n *  projective transform from becoming a second code path through undo,\n *  snapshots and the bake — mathematically an affine map *is* a homography,\n *  and the shader already multiplies by a mat3 either way. It is also why\n *  every operation log recorded before #392 (kept on purpose as a dataset,\n *  #375) stays readable forever with no migration. */\nexport type LayerTransformMatrix = AffineMatrixTuple | HomographyMatrixTuple","truncated":false}],"LayerTransformOperation":[{"path":"packages/shared/src/layerOperations.ts","line":287,"kind":"type","snippet":"/** Transforms (translate/scale/rotate/skew/distort) one or more layers' pixel\n *  content in place — one operation regardless of how many layers a gizmo\n *  moved together, so undo/redo flips them all atomically (a partial\n *  transform applied to some selected layers but not others would be a worse\n *  bug than a slightly bigger log entry — see #120 discussion). Background is\n *  never a legal target, same as other structural ops. */\nexport type LayerTransformOperation = OperationBase & {\n  type: 'layer_transform'\n  transforms: Array\u003c{\n    layerId: string\n    matrix: LayerTransformMatrix\n  }>\n}","truncated":false}],"LayerVisibilityOperation":[{"path":"packages/shared/src/layerOperations.ts","line":116,"kind":"type","snippet":"/** (#412) Same plural shape and the same reasoning as `LayerOpacityOperation`\n *  above — including the legacy `layerId`, which recorded logs still carry. */\nexport type LayerVisibilityOperation = OperationBase & {\n  type: 'layer_visibility'\n  layerId?: string\n  layerIds?: string[]\n  visible: boolean\n}","truncated":false}],"LessonState":[{"path":"packages/shared/src/room.ts","line":191,"kind":"type","snippet":"/** The lesson half of a board's `room_state` (#176): which lesson this board\n *  belongs to, every board in it, and the one the teacher is on. `id` is the\n *  lesson's id — for a room with a single board it equals `room.id`.\n *\n *  (#595) Built *for its recipient*: `boards` holds every shared board, and\n *  of the personal ones only those this person may see (their own, all of\n *  them for the teacher, all of them under `classVisibility: 'class'`, and the\n *  one in the spotlight). Which is why it arrives on its own as `lesson_state`\n *  whenever that set changes, rather than as a broadcast delta. */\nexport type LessonState = {\n  id: string\n  boards: BoardSummary[]\n  // Null means the lesson's own first board — see `Room.activeBoardId`.\n  activeBoardId: string | null\n  // (#595, ADR 015) Every assignment round of this lesson, in order.\n  assignments: AssignmentSummary[]\n  // Where the class is (ADR 015 §11): an assignment — each student on their\n  // own board in it — or null, everyone on the teacher's board. A following\n  // student goes where this says (see the web's followTarget).\n  activeAssignmentId: string | null\n  // The personal board the teacher is showing everyone; null when none. A\n  // following student is on it while it is set, whatever else is going on.\n  spotlightBoardId: string | null\n  classVisibility: ClassVisibility\n  // Who has a hand up, by userId. Live only, never persisted — like freeze.\n  handsRaised: string[]\n}","truncated":false}],"LoginCode":[{"path":"apps/server/prisma/schema.prisma","line":94,"kind":"model","snippet":"// One outstanding sign-in code (#316). Not a relation to User on purpose: a\n// code is requested by an *address*, and the address may not have an account\n// yet — asking for a code is how an account gets created in the first place.\n//\n// Stored hashed for the same reason a password was: six digits is a million\n// possibilities, which a dump of this table turns into an offline search of a\n// second or two. The ten-minute TTL doesn't help there — a dump can be taken\n// while codes are live.\nmodel LoginCode {\n  id           String    @id @default(uuid())\n  // Normalized (trimmed + lowercased) by loginCodes.ts before it ever gets\n  // here, so lookups can't miss a code because of how someone typed it.\n  email        String\n  codeHash     String\n  // Ties the code to the browser that asked for it (cookie `al_login_nonce`).\n  // Without it, a code read aloud to an attacker over the phone is enough to\n  // sign in from anywhere — the one attack this flow is actually exposed to.\n  requestNonce String\n  // Wrong guesses against *this* code. At ATTEMPT_LIMIT the row is burned:\n  // a per-code ceiling is what makes six digits safe, since a time-window\n  // limit alone lets a patient attacker keep guessing the same live code.\n  attempts     Int       @default(0)\n  expiresAt    DateTime\n  consumedAt   DateTime?\n  createdAt    DateTime  @default(now())\n\n  // Lookup is always \"the newest live code for this address\".\n  @@index([email, createdAt])\n  // Sweeping expired rows: this endpoint takes no credentials, so the table\n  // grows with every attempt anyone makes.\n  @@index([expiresAt])\n}","truncated":false}],"MyRooms":[{"path":"packages/shared/src/rest.ts","line":69,"kind":"interface","snippet":"export interface MyRooms {\n  owned: Room[]\n  participated: Room[]\n}","truncated":false}],"Operation":[{"path":"packages/shared/src/operations.ts","line":74,"kind":"type","snippet":"export type Operation =\n  | StrokeOperation\n  | LayerAddOperation\n  | ImageImportOperation\n  | FolderAddOperation\n  | LayerDeleteOperation\n  | LayerMoveOperation\n  | LayerOpacityOperation\n  | LayerVisibilityOperation\n  | LayerRenameOperation\n  | LayerOwnerLockOperation\n  | LayerLockOperation\n  | LayerClearOperation\n  | LayerMergeOperation\n  | LayerDuplicateOperation\n  | LayerTransformOperation\n  | AreaTransformOperation\n  | AreaClearOperation\n  | AreaPasteOperation\n  | AreaFillOperation\n  | ShapeOperation\n  | LayerFilterOperation\n  | OperationRevokeOperation\n  | OperationUndoOperation\n  | OperationRedoOperation\n  | AnnotationAddOperation\n  | AnnotationUpdateOperation\n  | AnnotationDeleteOperation\n  | PaperDryOperation","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":344,"kind":"model","snippet":"// One row per Operation (@art-lessons/shared) as broadcast over the wire —\n// `data` is the full serialized op (source of truth for replay); `type`/\n// `layerId`/`tool` are pulled out as their own columns purely for querying\n// without parsing JSON. Only `stroke` ops have `tool`, and a few op types\n// (layer_delete, operation_revoke/undo/redo) have no `layerId` at all — see\n// the `Operation` union in packages/shared — hence both stay nullable.\nmodel Operation {\n  id        String   @id\n  seq       Int\n  type      String\n  roomId    String\n  room      Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  userId    String\n  layerId   String?\n  tool      String?\n  data      Json\n  createdAt DateTime @default(now())\n\n  @@unique([roomId, seq])\n}","truncated":false}],"OperationBase":[{"path":"packages/shared/src/operationBase.ts","line":4,"kind":"type","snippet":"export type OperationBase = {\n  id: string\n  userId: string\n  timestamp: number\n  seq?: number          // total order; assigned by the server (local log until then)\n}","truncated":false}],"operationLayerIds":[{"path":"packages/shared/src/layers.ts","line":77,"kind":"function","snippet":"/**\n * The layers an operation applies to, in one shape whichever form it was\n * recorded in (#412).\n *\n * `layer_opacity` and `layer_visibility` used to name a single `layerId` and\n * now carry a `layerIds` list. Both forms are permanently valid to *read*:\n * the singular one is written into the operation logs of every room created\n * before #412, and those logs are replayed verbatim on every join. Only the\n * plural form is ever written from here on.\n *\n * Every reader goes through this. A `op.layerId` left somewhere would work\n * perfectly against old rooms and silently ignore every mass change made in\n * new ones — the kind of failure that shows up as \"sometimes it doesn't\n * apply\" months later.\n */\nexport function operationLayerIds(op: { layerId?: string; layerIds?: string[] }): string[] {\n  if (op.layerIds) return op.layerIds\n  return op.layerId === undefined ? [] : [op.layerId]\n}","truncated":false}],"OperationRedoOperation":[{"path":"packages/shared/src/operations.ts","line":45,"kind":"type","snippet":"/** Symmetric with `OperationUndoOperation`: flips a specific undone entry\n *  back to done. */\nexport type OperationRedoOperation = OperationBase & {\n  type: 'operation_redo'\n  targetOpId: string\n}","truncated":false}],"OperationRevokeOperation":[{"path":"packages/shared/src/operations.ts","line":24,"kind":"type","snippet":"/** Teacher-only: marks the target operation `gone` for everyone. Not an undo —\n *  it bypasses the author's history and cannot be redone (ADR 002 §6). */\nexport type OperationRevokeOperation = OperationBase & {\n  type: 'operation_revoke'\n  targetOpId: string\n}","truncated":false}],"OperationSource":[{"path":"apps/web/src/engine/index.ts","line":477,"kind":"type","snippet":"// 'local' (default) — a genuinely local action; triggers onLocalOperation for\n// broadcast. 'remote' — applying an operation that arrived from another\n// participant (room_state replay, peer_operation); must not be re-broadcast.\nexport type OperationSource = 'local' | 'remote'","truncated":false}],"OperationUndoOperation":[{"path":"packages/shared/src/operations.ts","line":38,"kind":"type","snippet":"/** A user's own undo, broadcast so every participant sees it — not just the\n *  author (#103). `targetOpId` is the specific entry to flip done → undone,\n *  decided once by the author's own client (the latest done op of theirs\n *  that isn't itself an operation_revoke/undo/redo); every replica applies\n *  the exact same id, so there's nothing to reconcile. Self-scoped like\n *  `undo`/`redo` already are: only the operation's own author's ops are\n *  ever legal targets (see `OperationLog.applyUndo`) — unlike\n *  `operation_revoke`, this is reversible via `OperationRedoOperation` and\n *  needs no owner privilege. */\nexport type OperationUndoOperation = OperationBase & {\n  type: 'operation_undo'\n  targetOpId: string\n}","truncated":false}],"OutboxEntry":[{"path":"apps/web/src/pages/Room/net/outboxStorage.ts","line":5,"kind":"interface","snippet":"// (#289 epic, reliable history spec v0.2 §9) One record per operation this\n// client has sent but not yet gotten a definitive SendResult for.\nexport interface OutboxEntry {\n  op: Operation\n  // (#358) Which room this operation was drawn in. An `Operation` says nothing\n  // about that — the server records one against whatever room the sending\n  // socket has joined — so without it a queue shared by every room in one\n  // browser profile has no way to tell whose work it is holding. It had none:\n  // opening any next room drained the previous room's unconfirmed strokes into\n  // it, and they were accepted (every room's first layer carries the same\n  // INITIAL_LAYER_ID, so even the alive-id check passed) and painted for\n  // everyone there.\n  roomId: string\n  attempts: number\n  nextRetryAt: number\n}","truncated":false}],"packDabs":[{"path":"packages/shared/src/dabCodec.ts","line":76,"kind":"function","snippet":"/** Packs dabs into the base64 form a StrokeOperation carries. */\nexport function packDabs(dabs: Dab[]): string {\n  const buffer = new ArrayBuffer(dabs.length * BYTES_PER_DAB)\n  const view = new DataView(buffer)\n  let offset = 0\n  for (const dab of dabs) {\n    for (const field of FIELDS) {\n      view.setFloat32(offset, dab[field], LITTLE_ENDIAN)\n      offset += 4\n    }\n  }\n  return `${DAB_PACK_VERSION}:${toBase64(new Uint8Array(buffer))}`\n}","truncated":false}],"PAPER_COARSENESS":[{"path":"packages/shared/src/paper.ts","line":10,"kind":"const","snippet":"// Paper is one axis: how coarse the stock is. It was briefly a grid — a\n// coarseness axis crossed with a \"character\" axis (fbm/capsules/streak) —\n// back when the grain was generated procedurally and a second axis cost\n// nothing but a few noise parameters (#300). Every one of those nine came\n// from the same synthetic fBm, and none of them read as paper; the whole\n// grid was replaced by three bakes of one photographed sheet at three\n// magnifications (#333), which is what these three names now mean. A future\n// second sheet is a new *stock*, not a second axis — it gets its own entry\n// here, the way real paper is sold.\nexport const PAPER_COARSENESS = ['coarse', 'medium', 'fine'] as const","truncated":false}],"PAPER_GRAIN_TYPES":[{"path":"packages/shared/src/paper.ts","line":18,"kind":"const","snippet":"export const PAPER_GRAIN_TYPES: readonly PaperGrainType[] = PAPER_COARSENESS","truncated":false}],"PAPER_TYPES":[{"path":"packages/shared/src/paper.ts","line":20,"kind":"const","snippet":"export const PAPER_TYPES: readonly PaperType[] = [...PAPER_GRAIN_TYPES, 'flat']","truncated":false}],"PaperCoarseness":[{"path":"packages/shared/src/paper.ts","line":11,"kind":"type","snippet":"export type PaperCoarseness = typeof PAPER_COARSENESS[number]","truncated":false}],"paperCoarsenessOf":[{"path":"packages/shared/src/paper.ts","line":55,"kind":"function","snippet":"// Validates rather than casts: this is reached with whatever string the\n// database holds (a legacy name, or a type from a build newer than this\n// one), and silently returning an invalid key produced `undefined` lookups\n// deep in the engine and the sound synth rather than an obvious failure.\n// `null` means \"no grain axis\" — which is exactly how `flat` behaves too.\nexport function paperCoarsenessOf(type: string): PaperCoarseness | null {\n  const head = type.split('-')[0]\n  return (PAPER_COARSENESS as readonly string[]).includes(head) ? head as PaperCoarseness : null\n}","truncated":false}],"PaperDryOperation":[{"path":"packages/shared/src/operations.ts","line":64,"kind":"type","snippet":"/** (#536, ADR 011 §17.48) \"Высушить всё\" - the watercolour paper is dry, for\n *  everyone in the room, from this point in the log on. The whole sheet, not\n *  a layer: the teacher presses it to KNOW that what a student lays next goes\n *  onto dry paper, which a per-client button could not promise.\n *\n *  It carries nothing, and changes no pixel. Its whole effect is on the\n *  ephemeral wetness every client keeps (and on which wash the next stroke\n *  may join); the strokes after it record the dry paper they met in their own\n *  `wet` profile, so a replay would reproduce the picture even without it.\n *  What it adds is the part a replay does not see: the sheen on every screen,\n *  and the paper the next live stroke of each participant lands on.\n *\n *  Not undoable (there is no \"wet it again\"), and worthless past the paper's\n *  own drying time - see WATERCOLOR_WET_DRY_MS. */\nexport type PaperDryOperation = OperationBase & {\n  type: 'paper_dry'\n}","truncated":false}],"PaperGrainType":[{"path":"packages/shared/src/paper.ts","line":15,"kind":"type","snippet":"// `flat` is deliberately not on this axis — it has no grain to be coarse or\n// fine, so it is its own single type rather than three identical ones.\nexport type PaperGrainType = PaperCoarseness","truncated":false}],"PaperType":[{"path":"packages/shared/src/paper.ts","line":16,"kind":"type","snippet":"export type PaperType = PaperGrainType | 'flat'","truncated":false}],"Participant":[{"path":"packages/shared/src/room.ts","line":303,"kind":"type","snippet":"export type Participant = {\n  userId: string\n  name: string\n  role: ParticipantRole\n  color: string // cursor color\n  // (#254 epic) Owner-triggered runtime privilege, computed server-side same\n  // as `role` — never persisted, reset whenever the in-memory room record\n  // itself is (server restart / room evicted then reloaded). The room's\n  // owner can never be frozen (see rooms.ts's setParticipantFrozen).\n  frozen: boolean\n  // (#176, ADR 014) Which board of the lesson this person is currently on.\n  // Participants belong to the *lesson*, so a `room_state` lists everyone in\n  // the lesson, and this is how a client tells who shares its page. The\n  // server always sets it; optional in the type only so a client built before\n  // boards existed keeps compiling. For a lesson with one board it equals the\n  // lesson id.\n  boardId?: string\n}","truncated":false}],"ParticipantRole":[{"path":"packages/shared/src/room.ts","line":301,"kind":"type","snippet":"export type ParticipantRole = 'owner' | 'member'","truncated":false}],"PeerLivePacket":[{"path":"apps/web/src/engine/index.ts","line":1065,"kind":"interface","snippet":"/** (#429) One packet of a peer's in-progress stroke, as\n *  PencilEngineAPI.appendPeerLiveDabs takes it. Mirrors the wire's\n *  StrokeLiveData with the dabs already decoded — the engine deals in Dab[]\n *  everywhere else, and keeping the unpacking at the socket seam means a test\n *  can drive this without going through the codec. */\nexport interface PeerLivePacket {\n  strokeId: string\n  layerId: string\n  tool: ToolType\n  preset: string\n  color: [number, number, number]\n  packetSeq: number\n  dabs: Dab[]\n  /** (#468) The wash this gesture belongs to — see StrokeLiveData.washId for\n   *  why it has to travel on the live stream and not only on the operation. */\n  washId?: string\n  /** (#536) One hex digit per dab of *this packet*, saying how wet the paper\n   *  the author was painting into already was. Same reason as washId: the peer\n   *  cannot derive it — its own wetness field is its own — so it travels with\n   *  the dabs or the two clients draw different marks. */\n  wet?: string\n}","truncated":false}],"PeerPreviewState":[{"path":"apps/web/src/engine/index.ts","line":1191,"kind":"interface","snippet":"// One peer's live-stroke reveal state (#37 follow-up v2, see\n// PencilEngineAPI.previewOperation). `queue[0]` is the op currently being\n// revealed; `dabIdx` is how many of its dabs have been painted into `buf` so\n// far; `startTime` is performance.now() when that op's reveal began, the\n// reference point Dab.t is measured against. Scheduled with setTimeout, not\n// requestAnimationFrame: rAF fully stops firing in a hidden/backgrounded tab\n// (e.g. a student who alt-tabbed away), which would leave the underlying\n// operation permanently uncommitted — since onPreviewApplied only fires once\n// the reveal finishes — until they come back. setTimeout is still throttled\n// while hidden but never fully suspended, so the reveal (and the commit\n// after it) always eventually completes regardless of tab visibility.\ninterface PeerPreviewState {\n  // `rate` travels with each queued op (not the peer state as a whole): the\n  // lesson-replay player (#108) can change its global speed between two\n  // strokes by the same author queued back-to-back, and each should play at\n  // whatever rate was requested when *it* was queued, not retroactively\n  // affect one already animating — see previewOperation's own doc comment.\n  // (#366) `dabs` is decoded from the operation once, when it joins the\n  // queue — this is walked on every timer tick as the reveal plays out, and\n  // unpacking the whole array per tick would turn a cheap read into real work\n  // proportional to the stroke's length.\n  queue: Array\u003c{ op: StrokeOperation; rate: number; dabs: Dab[] }>\n  buf: AccumulationBuffer\n  // (#138) World point this buffer's own pixel (0,0) represents — see\n  // PencilEngine._cameraCenteredOrigin's doc comment for why this has to be\n  // snapshotted once (at previewOperation's first queued op for this peer)\n  // rather than re-derived from the live camera at every _composeToFBO\n  // call: the buffer's actual painted pixels are already fixed relative to\n  // whatever the camera was at paint time, in _stepPeerPreview.\n  origin: { x: number; y: number }\n  dabIdx: number\n  startTime: number\n  timer: ReturnType\u003ctypeof setTimeout> | null\n}","truncated":false}],"PencilEngine":[{"path":"apps/web/src/engine/index.ts","line":2155,"kind":"class","snippet":"export class PencilEngine implements PencilEngineAPI {\n  private canvas: HTMLCanvasElement\n  private gl: WebGLRenderingContext\n  private _opts: EngineOpts\n  private _grainMode: number | undefined\n  private _charcoalGrainMode: number | undefined\n  private _userId: string\n  private _onLocalOperation?: (op: Operation) => void\n  private _onPreviewApplied?: (op: StrokeOperation) => void\n  private _onInvariant?: (name: string, context: Record\u003cstring, string | number>) => void\n  // (#480) Подряд идущие отказы _takeCheckpoint по слою. Единичный отказ —\n  // норма и вся суть защиты из #479: перо опущено, чекпойнт подождёт границы.\n  // А вот слой, который не удаётся зачекпойнтить десятки раз кряду, означает,\n  // что что-то держит его «грязным» постоянно — и тогда он остаётся без\n  // чекпойнта совсем, то есть каждый undo по нему проигрывает всю историю.\n  private _checkpointRefusals = new Map\u003cstring, number>()\n  // (#429) Sending half of the live stroke channel. Dabs painted since the\n  // last packet went out, plus when that was and how many packets this gesture\n  // has sent — all three reset at pen-down.\n  private _onLiveStrokeDabs?: (packet: PeerLivePacket) => void\n  private _onLiveStrokeEnd?: (strokeId: string) => void\n  private _liveDabQueue: Dab[] = []\n  private _liveLastEmitAt = 0\n  private _livePacketSeq = 0\n\n  // Debug instrumentation (#91 device investigation) — all no-ops unless\n  // _debug is true, so this costs nothing in normal use.\n  private _debug: boolean\n  private _onStrokeDebugStats?: (stats: StrokeDebugStats) => void\n  private _dbgMoveEvents = 0\n  private _dbgStrokeStart = 0\n  private _dbgLastMoveT = 0\n  private _dbgGapSum = 0\n  private _dbgMaxGap = 0\n  private _dbgDabCount = 0\n  private _dbgRenderMs = 0\n  // #104 end-to-end latency tracking — see StrokeDebugStats' avgE2eLatencyMs.\n  private _dbgPrevMoveTimestamp = 0\n  private _dbgE2eSum = 0\n  private _dbgE2eCount = 0\n  private _dbgMaxE2e = 0\n  private _dbgTipSum = 0\n  private _dbgTipCount = 0\n  private _dbgMaxTip = 0\n  // rAF-anchored display latency — see StrokeDebugStats.avgFrameLatencyMs.\n  // Pending is the timestamp of the latest move sample not yet consumed by\n  // a _scheduleDisplay() rAF firing; null when there's nothing outstanding\n  // (just reset, or already consumed) so that rAF callback knows not to\n  // double-count a frame no new input actually fed.\n  private _dbgPendingFrameTimestamp: number | null = null\n  private _dbgFrameSum = 0\n  private _dbgFrameCount = 0\n  private _dbgMaxFrame = 0\n\n  // Pointer-prediction preview (#92) — all no-ops unless _predictPointer is\n  // true. _previewBuf is a dedicated, stroke-scoped AccumulationBuffer (not\n  // any layer's real buffer): created on stroke start, repainted from scratch\n  // on every real move, and destroyed on stroke end, so a wrong prediction\n  // never survives past the stroke it was guessed for and never touches\n  // permanent pixel state.\n  //\n  // (#138) _previewBufOrigin is the world point this buffer's own pixel\n  // (0,0) represents, snapshotted once at stroke start via\n  // _cameraCenteredOrigin() — see that method's doc comment for why a fixed\n  // canvas-sized scratch buffer needs *some* origin at all for infinite\n  // rooms, and why it's captured once rather than re-derived from the live\n  // camera on every repaint/composite.\n  private _predictPointer: boolean\n  private _previewBuf: AccumulationBuffer | null = null\n  private _previewBufOrigin = { x: 0, y: 0 }\n  // (#155) Backing GL object for _previewBuf, kept alive across strokes —\n  // see _acquirePreviewBuf's own comment for why. null exactly when\n  // _previewBuf has never been created yet or was invalidated by context\n  // loss; _previewBuf itself is still nulled every stroke end (see _onEnd)\n  // so _display()'s `if (this._previewBuf)` blend-skip is unaffected.\n  private _previewBufPool: ScratchSlot\u003cAccumulationBuffer>\n\n  // Live-tip segment preview (#104) — all no-ops unless _liveTip is true.\n  // _tipBuf is a dedicated, stroke-scoped AccumulationBuffer, same lifecycle\n  // pattern as _previewBuf: created on stroke start, cleared and repainted\n  // from scratch on every real move (never accumulated), destroyed on stroke\n  // end. See DabSystem.peekTipDabs() and _refreshTip() below.\n  //\n  // (#138) _tipBufOrigin: see _previewBufOrigin just above — same purpose,\n  // captured at the same time (stroke start), for this buffer instead.\n  private _liveTip: boolean\n  private _tipBuf: AccumulationBuffer | null = null\n  private _tipBufOrigin = { x: 0, y: 0 }\n  // (#155) Same pooling as _previewBufPool above, see _acquireTipBuf.\n  private _tipBufPool: ScratchSlot\u003cAccumulationBuffer>\n\n  // Marker's own per-stroke, per-tile scratch (original content + this\n  // stroke's accumulated coverage — see RibbonStrokeScratch's own doc\n  // comment). Non-null exactly while a *local* marker stroke is in\n  // progress: created in _onStart, destroyed and nulled in _onEnd. A\n  // one-shot full-array _paintRibbonDabs call (replay/undo/redo/checkpoint/\n  // most peer ops) never touches this field at all — it creates and tears\n  // down its own throwaway instance within that single call instead (see\n  // _paintRibbonDabs' own doc comment).\n  private _ribbonStrokeScratch: RibbonStrokeScratch | null = null\n  /** (#468 v7) The wash in progress, if any — watercolor only.\n   *\n   *  A wash outlives the stroke that started it: its scratch is kept between\n   *  strokes so the next one accumulates into the same pool, and is only torn\n   *  down when something makes the wash a different wash (a gap long enough to\n   *  count as dry, a different paint, a different layer, a different tool).\n   *\n   *  `endedAt` is wall-clock and that is fine, because it decides the *live*\n   *  grouping only. The answer is written onto the operation as `washId`, and\n   *  replay reads that instead of re-deriving it — the same split `strokeId`\n   *  already uses for chunking. */\n  private _wash: {\n    id: string\n    layerId: string\n    signature: string\n    endedAt: number\n    scratch: RibbonStrokeScratch\n  } | null = null\n  private _washId: string | null = null\n  /** (#536) Where the paper is still wet — live, local, ephemeral, never\n   *  replayed. See paperWetness.ts for why that is the design rather than a\n   *  shortcut. */\n  private readonly _paperWet = new PaperWetness()\n  /** The quantized profile of what *this* gesture has seen so far, built as it\n   *  is drawn and recorded on the operation. Read back by the painting path\n   *  itself, so a live mark and its replay consume the identical numbers. */\n  private _strokeWet = ''\n  /** (#536) The wetness field as a coarse world-space texture for the display\n   *  pass, plus the world rect it covers and when it was last rebuilt. Null\n   *  rect means nothing is wet and the whole overlay is off. */\n  private _wetTex: WebGLTexture | null = null\n  private _wetRect: [number, number, number, number] = [0, 0, -1, -1]\n  private _wetTexAt = 0\n  /** Texels of the wetness map, so the display pass can read its slope. */\n  /** Quantized wetness the screen is currently showing, so the drying watcher\n   *  can skip the frames that would look identical. -1 = nothing shown. */\n  private _wetShown = -1\n  /** (#536) 0 normal, 1 silhouette, 2 density, 3 pigment, 4 standing water — see setWatercolorDebugView. */\n  private _wcDebugView = 0\n  /** Handle of the repaint that watches the paper dry, or 0. */\n  private _dryingTimer = 0\n  /** The same profile for the dabs still queued for the live channel, drained\n   *  with them so a packet always carries exactly its own dabs' digits. */\n  private _liveWetQueue = ''\n  /** (#385) Shared free list behind every RibbonStrokeScratch this engine\n   *  builds — see RibbonScratchPool's own doc comment for why the marker path\n   *  cannot allocate per gesture. Assigned in the constructor, right after\n   *  `gl`. */\n  private _ribbonScratchPool: RibbonScratchPool\n  // The gesture this stroke belongs to (StrokeOperation.strokeId) — one id","truncated":true}],"PencilEngineAPI":[{"path":"apps/web/src/engine/index.ts","line":493,"kind":"interface","snippet":"export interface PencilEngineAPI {","truncated":false}],"previewOperation":[{"path":"apps/web/src/engine/index.ts","line":953,"kind":"method","snippet":"  // Live remote-stroke reveal (#37 follow-up v2): call when a peer's finished\n  // StrokeOperation arrives. Plays its dabs back into a dedicated per-peer\n  // preview buffer (composited on top in _display(), never written into any\n  // real layer) at their original recorded pacing (Dab.t), queueing if that\n  // peer already has one in flight. Fires onPreviewApplied with the exact\n  // same op once every dab has played, so the caller can commit it for real.\n  // `rate` (#108) scales that pacing — 2 plays the dabs twice as fast, 0.5\n  // half as fast; defaults to 1 (real recorded speed, what the live-room\n  // peer-reveal path above always uses). Captured once per queued op, not\n  // live-adjustable mid-reveal — see PeerPreviewState's own doc comment.\n  previewOperation(op: StrokeOperation, rate?: number): void","truncated":false}],"RasterLayer":[{"path":"packages/shared/src/layers.ts","line":4,"kind":"interface","snippet":"export interface RasterLayer {\n  kind: 'layer'\n  id: string\n  name: string\n  opacity: number   // 0–1\n  visible: boolean\n  // (#488) Two locks, and the asymmetry between them is the point:\n  //   `locked`      — a shared guard against anyone's hand, the owner's\n  //                   included. Anyone may set it and anyone may take it off.\n  //   `ownerLocked` — the room owner reserving a layer: it stops everyone\n  //                   *but* the owner, and only the owner can release it.\n  // Both travel in the log (`layer_lock` / `layer_owner_lock`). `locked` used\n  // to be per-user view state that never became an operation, which made it\n  // behave backwards — it did not survive its own author's reload, and it did\n  // reach everyone else through the snapshot's layerState.\n  locked?: boolean\n  ownerLocked?: boolean\n}","truncated":false}],"redo":[{"path":"apps/web/src/engine/index.ts","line":735,"kind":"method","snippet":"  redo(): Operation | null","truncated":false}],"RejectReason":[{"path":"packages/shared/src/protocol.ts","line":195,"kind":"type","snippet":"export type RejectReason =\n  | 'room_frozen' | 'participant_frozen' | 'layer_owner_locked' | 'not_owner'\n  // (#518) The shared lock (`layer_lock`) — distinct from","truncated":false}],"RequestedLoginCode":[{"path":"packages/shared/src/rest.ts","line":59,"kind":"interface","snippet":"export interface RequestedLoginCode {\n  /** Four characters also printed in the email, so the person can see the\n   *  mail belongs to the page in front of them (#316). */\n  confirmation: string\n  expiresAt: string\n  /** Only ever present in local development with no mail provider configured\n   *  (#353) — the server refuses to include it otherwise. */\n  devCode?: string\n}","truncated":false}],"restoreLayerFromSnapshot":[{"path":"apps/web/src/engine/index.ts","line":676,"kind":"method","snippet":"  // (#169) Restores a layer's pixel content wholesale from a downloaded\n  // network snapshot — the layer must already exist (via initLayer) with an\n  // empty buffer; this is the fast-join counterpart to a live stroke replay,\n  // skipping straight to the end result instead of repainting every\n  // historical dab. Same tile-restore primitive local checkpoint restore\n  // already uses (resolveForPaint + AccumulationBuffer.restorePixels +\n  // ILayerBuffer.restoreTileContent).\n  // (#374) `coveredSeq` is the room seq those tiles were baked at. Operations\n  // at or below it that paint this layer are already in the pixels, so the\n  // engine must not paint them again — see `appendOperation`'s layer_merge,\n  // layer_duplicate and layer_transform branches, the only ones that can still\n  // arrive covered (the server withholds pure pixel operations it can account\n  // for, but a merge or a duplicate also carries structure and a transform can\n  // name several layers, so those always come through — see rooms.ts's\n  // isCoveredBySnapshot).\n  // Omit it and nothing is treated as covered, which is what every caller\n  // outside the snapshot-restore path wants.\n  restoreLayerFromSnapshot(layerId: string, tiles: SnapshotTile[], coveredSeq?: number): void","truncated":false}],"RibbonScratchPool":[{"path":"apps/web/src/engine/index.ts","line":1528,"kind":"class","snippet":"class RibbonScratchPool {\n  private _free = new Map\u003cstring, AccumulationBuffer[]>()\n  private readonly gl: WebGLRenderingContext\n  /** (#536, §17.22) Bytes of every buffer this pool has created and not yet\n   *  destroyed, and of those, the ones sitting free — for the perf readout. */\n  private _allocatedBytes = 0\n  private _freeBytes = 0\n\n  constructor(gl: WebGLRenderingContext) {\n    this.gl = gl\n  }\n\n  /** Live (handed out) and free bytes. */\n  get bytes(): { live: number; free: number } {\n    return { live: this._allocatedBytes - this._freeBytes, free: this._freeBytes }\n  }\n\n  acquire(width: number, height: number): AccumulationBuffer {\n    const list = this._free.get(`${width}x${height}`)\n    const reused = list?.pop()\n    if (reused) { this._freeBytes -= width * height * 4; return reused }\n    // 'nearest' matches what RibbonStrokeScratch has always asked for — see\n    // its getOrCreate comment. The pool must never hand back a buffer built\n    // with a different filter, which is why it is keyed by size alone and\n    // used by this one caller.\n    this._allocatedBytes += width * height * 4\n    return new AccumulationBuffer(this.gl, width, height, 'nearest')\n  }\n\n  release(buf: AccumulationBuffer): void {\n    const key = `${buf.width}x${buf.height}`\n    const bytes = buf.width * buf.height * 4\n    const list = this._free.get(key)\n    if (!list && this._freeBytes + bytes > SCRATCH_POOL_FREE_BYTES) { buf.destroy(); this._allocatedBytes -= bytes; return }\n    if (!list) { this._free.set(key, [buf]); this._freeBytes += bytes; return }\n    // (#536, ADR 011 §17.50) ...and never more than SCRATCH_POOL_FREE_BYTES\n    // held idle in all: on the iPad (Safari, 3 GB) 151 MB of idle buffers on\n    // top of the live wash was enough for the tab to be killed and reloaded\n    // at the next stroke.\n    if (list.length >= MARKER_SCRATCH_POOL_PER_SIZE || this._freeBytes + bytes > SCRATCH_POOL_FREE_BYTES) { buf.destroy(); this._allocatedBytes -= bytes; return }","truncated":false}],"RibbonStrokeScratch":[{"path":"apps/web/src/engine/index.ts","line":1633,"kind":"class","snippet":"class RibbonStrokeScratch {\n  private _tiles = new Map\u003cAccumulationBuffer, RibbonTileScratch>()\n  private readonly pool: RibbonScratchPool\n  /** (#536, §17.19) Whether tiles carry inkColor — watercolor only. */\n  private readonly needsColor: boolean\n  /** (#536, §17.20) Every paint laid into this wash, as colour keys. While it\n   *  is one paint, the colour record is the deposit times one absorption and\n   *  the diffusion need not carry it — see _diffuseWash. */\n  readonly paints = new Set\u003cstring>()\n  /** (#536, §17.21) What each dab of the batch just painted left standing on\n   *  the sheet (watercolorStandingWater) — the ribbon build writes it, and\n   *  whoever feeds the live wetness field reads it, so the field and the\n   *  wash's coverage .b are fed one number. Cleared per batch; the keys are\n   *  the batch's own dab objects. */\n  readonly standing = new Map\u003cDab, number>()\n  /** (#536, §17.22) Live batches no longer composite one by one: each adds\n   *  its rect here, and the engine composites the union once per displayed\n   *  frame (_flushLiveComposite). Keyed by tile buffer. */\n  readonly pendingComposite = new Map\u003cAccumulationBuffer, { tile: PaintTarget; bounds: { minX: number; minY: number; maxX: number; maxY: number } }>()\n  private readonly needsInk: boolean\n  /** (#468 v3) How much of the brush's load this gesture has spent so far,\n   *  measured in brush radii of travel (ADR 011 §3.8).\n   *\n   *  Lives on the scratch rather than on the engine because that is the one\n   *  object all three paths already share for the length of exactly one\n   *  gesture: a live stroke's batches, a one-shot replay's single call, and a\n   *  chunked replay's several operations. Put it on the engine and replay would\n   *  either carry it between unrelated strokes or reset it at every chunk\n   *  boundary — and a seam in the depletion is a visible band across the mark. */\n  private _waterUsed = 0\n  /** (#536, ADR 011 §17.11) Whether deposit has been laid since the wash's\n   *  pigment was last diffused. The diffusion is the one pass in this tool\n   *  that is *not* idempotent — every run is N more steps — so it may run\n   *  exactly once per operation, on every path alike: a live chunk flush, the\n   *  pen-up, a replayed chunk, a peer's operation. This flag is what makes\n   *  that true whichever path calls _finishRibbonStroke and however often. */\n  diffusePending = false\n  /** (#536) The same clock for pigment, and the reason it is a second number\n   *  rather than the same one is the brush drinking from wet paper.\n   *\n   *  Picking up water rewinds the water clock (watercolorWaterClock). Pigment\n   *  must not come back with it: dragging a brush through a puddle of clean\n   *  water does not reload it with paint, it dilutes what is left. So travel\n   *  advances both, and only water is ever given back.\n   *\n   *  On dry paper the two are the same number to the last bit, which is what\n   *  keeps every stroke that never meets water behaving exactly as it did. */\n  private _pigmentUsed = 0\n\n  /** (#468 v6) The composite's scalar uniforms, fixed for the whole gesture.\n   *\n   *  They cannot be per batch. The composite is a *recomputation* over a whole\n   *  rect, so whichever batch wrote a pixel last decides its scalars — and with\n   *  per-batch values that showed up immediately as rectangular tone blocks\n   *  along a live stroke, one per pointer event, which is precisely what\n   *  \"штрих постоянно странно меняется\" was.\n   *\n   *  Derived from the gesture's *first* dab, which is the one thing a live\n   *  stroke and a replay of it are guaranteed to agree on: live sees it as the\n   *  first dab of its first batch, a one-shot replay as the first dab of the\n   *  only batch. Anything averaged over a batch would differ between the two. */\n  private _composite: {\n    spreadPx: number; inkSmoothPx: number; water: number; migratePx: number; bristleRadiusPx: number\n    /** (#468 v10) Where the noise fields are anchored.\n     *\n     *  A constant of the gesture, and that is a bug fix rather than tidiness.\n     *  It used to be *this batch's* first dab, so the whole texture shifted by\n     *  a few pixels on every pointer event — the mark's grain visibly crawled\n     *  backwards under the pen as it was drawn, and then landed somewhere else\n     *  again at pen-up, because the final pass anchored on the gesture's first\n     *  dab instead. On a long straight stroke the same shifting showed up as a\n     *  row of discs at the batch pitch. */\n    fieldSeed: [number, number]\n  } | null = null\n\n  compositeScalars(make: () => { spreadPx: number; inkSmoothPx: number; water: number; migratePx: number; fieldSeed: [number, number]; bristleRadiusPx: number }): { spreadPx: number; inkSmoothPx: number; water: number; migratePx: number; fieldSeed: [number, number]; bristleRadiusPx: number } {\n    if (!this._composite) this._composite = make()\n    return this._composite\n  }\n\n  /** (#468 v6) The gesture's dab spacing, cached the first time two consecutive\n   *  dabs are actually available.\n   *\n   *  Measured rather than derived, because what it has to match is\n   *  DabSystem's `baseSize * spacingFactor` — and `baseSize` is the tool's\n   *  *nominal* size, which no operation records: dabs carry their post-pressure,\n   *  post-taper sizes instead. The distance between the stroke's own first two\n   *  dabs is that spacing, and it is the same pair of dabs whether they arrive\n   *  in one replayed batch or across two live ones (the second case reaches\n   *  them through prevDab), so both paths measure the identical number.\n   *\n   *  Zero until a pair exists — a first batch of exactly one dab covers a few\n   *  px at the stroke's start, and the next batch's padded rect recomposites it\n   *  anyway. */\n  private _dabSpacing = 0\n  /** (#468 v6) Everything the gesture's final recomposite needs, plus the union\n   *  of every batch's bounds.\n   *\n   *  It exists because reasoning about whether the incremental per-batch\n   *  composites are *sufficient* turned out to be a trap: three plausible\n   *  arguments that they were, and a measured 26% of the mark still differing\n   *  between a live stroke and a replay of it. So the last thing a gesture does\n   *  is now exactly what a replay does — one composite over the whole mark with\n   *  the finished buffers — and the two agree by construction rather than by\n   *  argument.\n   *\n   *  This is not the old settle pass. That one *introduced* terms the live\n   *  batches had switched off, and re-read scalars from the first batch, which\n   *  is why the mark jumped at pen-up. Every scalar here is already a constant\n   *  of the gesture, so the final pass recomputes the same values the batches\n   *  did — it only fixes pixels that were composited before all their ink had\n   *  arrived. */\n  private _finish: {\n    target: ILayerBuffer; preset: PencilPreset; profile: RibbonProfile\n    color: [number, number, number]; opacity: number\n    bounds: { minX: number; minY: number; maxX: number; maxY: number }\n    fieldSeed: [number, number]\n    /** (#536, §17.23) The recorded wetness of the paper where this operation\n     *  LANDED — its first dab's digit — so the settle can tell a drop into a\n     *  damp wash (a bloom) from one into a wet or a dry one. The first dab,\n     *  as everything else the gesture decides once (see _paintRibbonDabs):\n     *  it is the one sample a live stroke and its replay are sure to share,\n     *  and the profile after it is strided and trimmed. */\n    landedWet: number\n    /** (#536, §17.25) The wettest paper the operation ran over (wetPeak):\n     *  whether its water joined a puddle already there. */\n    wetPeak: number\n    /** (#536, §17.23) The widest dab radius of the operation, px. */\n    radiusPx: number\n    /** (#536, §17.37) How long the brush stood on landing, ms. */\n    dwellMs: number\n  } | null = null\n\n  /** (#536, §17.42) What the group tide needs when the wash dries as one\n   *  component (watercolorDryWash): the composite's constants from the LAST\n   *  settled operation, the widest radius and the wettest standing level\n   *  of any, and the union of every settle's bounds. Set by the settle. */\n  dryCtx: {\n    target: ILayerBuffer; preset: PencilPreset; profile: RibbonProfile\n    color: [number, number, number]; opacity: number; fieldSeed: [number, number]\n    bounds: { minX: number; minY: number; maxX: number; maxY: number }\n    radiusPx: number; standing: number\n  } | null = null\n\n  noteFinish(ctx: NonNullable\u003cRibbonStrokeScratch['_finish']>): void {\n    const prev = this._finish\n    if (!prev) { this._finish = ctx; return }\n    prev.dwellMs = Math.max(prev.dwellMs, ctx.dwellMs)\n    prev.bounds = {\n      minX: Math.min(prev.bounds.minX, ctx.bounds.minX),","truncated":true}],"RibbonTileScratch":[{"path":"apps/web/src/engine/index.ts","line":1596,"kind":"interface","snippet":"/** One tile's worth of a ribbon stroke's scratch state. `inkLoad` is null for a\n *  tool whose composite doesn't read one — see RibbonStrokeScratch's ctor. */\ninterface RibbonTileScratch {\n  original: AccumulationBuffer\n  coverage: AccumulationBuffer\n  inkLoad: AccumulationBuffer | null\n  /** (#536, §17.17) The deposit as it stood after the wash's last settle —\n   *  the FIXED paint. What the diffusion moves is inkLoad minus this: the\n   *  paint laid since, and only that. Null when inkLoad is. */\n  inkSettled: AccumulationBuffer | null\n  /** (#536, §17.19) The optical depth of the paint per texel, .rgb, and its\n   *  mass in .a — the wash's colour record (pigmentOptics.ts). Written by the\n   *  ink pass beside inkLoad, moved by the diffusion by the same fractions. */\n  inkColor: AccumulationBuffer | null\n  /** Its settled counterpart, as inkSettled is to inkLoad. */\n  colorSettled: AccumulationBuffer | null\n  /** (#536, s17.28) The gesture's FILM: its stamps and bands under MAX, so a\n   *  texel holds the thickest thing the brush left there and never the\n   *  count of overlapping stamps. inkLoad is rebuilt per batch as\n   *  inkBase + strokeInk, inkBase being the wash as it stood when this\n   *  gesture began (refreshed on the first batch of each gesture). The\n   *  colour record has the same pair. Null until a gesture with film draws. */\n  strokeInk: AccumulationBuffer | null\n  inkBase: AccumulationBuffer | null\n  strokeColor: AccumulationBuffer | null\n  colorBase: AccumulationBuffer | null\n  /** Which gesture the film buffers belong to (RibbonStrokeScratch.gesture). */\n  filmGesture: number\n  /** (#536, §17.42) The wash's PROVISIONAL DRY TARGET: inkLoad - the wet\n   *  state, which is what the next operation of the wash starts from - with\n   *  the one tide laid along the outer contour of the wash's whole coverage,\n   *  recomputed at every pen-up. The composite reads this, never inkLoad,\n   *  once it exists; the live batches composite inkLoad (wet plus film), so\n   *  a brush touching the wash shows it wet again until the pen lifts. Null\n   *  under the per-operation drying A/B (wcOpDry). */\n  inkDry: AccumulationBuffer | null\n  colorDry: AccumulationBuffer | null\n}","truncated":false}],"Room":[{"path":"packages/shared/src/room.ts","line":29,"kind":"type","snippet":"export type Room = {\n  id: string\n  name: string\n  paper: PaperType\n  // Hex color (sRGB, e.g. \"#f5f0e6\") the creator picked for the paper\n  // background, decided once at creation alongside `paper` itself — never\n  // changed after (same \"fixed after creation\" rule the CreateRoom UI\n  // states for `paper`). Absent on rooms created before this field existed;\n  // renderers fall back to DEFAULT_PAPER_COLORS[paper] in that case (see\n  // engine/index.ts's PAPER_COLORS usage) rather than treating it as\n  // required everywhere.\n  paperColor?: string\n  // Infinite (tiled) canvas — see the engine's ILayerBuffer/TiledLayerBuffer.\n  // canvasWidth/canvasHeight are present iff !infinite; an explicit boolean\n  // discriminant rather than a sentinel width/height so every existing\n  // fixed-canvas call site keeps its exact `room.canvasWidth` shape (no\n  // `!== null`/`!== -1` checks needed anywhere).\n  infinite: boolean\n  canvasWidth?: number\n  canvasHeight?: number\n  hasPassword: boolean\n  // (#224) Required rather than optional, unlike the other fields added to\n  // this type after the fact: the column is NOT NULL with a default, so every\n  // room — including every one that predates the column — has a real value,\n  // and an optional field would invite `?? 'anyone_with_link'` fallbacks at\n  // each call site, i.e. a second place where the default lives and can drift\n  // from the schema's.\n  accessMode: RoomAccessMode\n  ownerId: string\n  // Owner's display name, joined in server-side (User.name is nullable —\n  // guest/anonymous accounts, see schema.prisma's User comment — so this is\n  // too). Only populated by list-style endpoints (e.g. GET /api/rooms/mine)\n  // that explicitly include it; absent elsewhere (e.g. the in-memory room\n  // state built by rooms.ts's cold-load path).\n  ownerName?: string\n  createdAt: string\n  // #146: set once a client has uploaded a composite-PNG preview of the\n  // room's content (RoomThumbnail table) — absent until the first upload.\n  // Client-only cache-busting key for `\u003cimg src=\"/api/rooms/:id/thumbnail\">`;\n  // the bytes themselves are fetched separately, never inlined here.\n  thumbnailUpdatedAt?: string\n  // (#211 epic) This room's folder placement for the *current* caller —\n  // folders are per-user organization (RoomParticipant.folderId), not a\n  // property of the room itself, so this reflects the caller's own filing,\n  // not a global fact about the room. Absent/undefined = root level.\n  folderId?: string\n  // (#222) Set while the room is closed for editing — the state the homework\n  // model's source lesson sits in (release track #314 §4), and what makes a\n  // template trustworthy: a fork can only be a faithful copy if its source\n  // cannot drift after the copy was taken.\n  //\n  // Unlike the room/participant freeze (#256/#257), which is a live\n  // classroom control held in memory and lost on restart, this is a property\n  // of the document and is persisted. It is also stricter: freeze exempts the\n  // owner, closing does not — see getOperationRejectReason in rooms.ts.\n  //\n  // A timestamp rather than a boolean because the column already existed as\n  // one (schema.prisma) and \"when was this handed out\" is worth more later\n  // than the bit alone. Absent = open.\n  closedAt?: string\n  // (#317) The room this one was forked from — the homework model's whole\n  // lineage record (see §4 of the release track #314: a lesson is closed for\n  // editing and each student forks it). Absent on rooms created from\n  // scratch. Deliberately survives the parent's deletion as `undefined`\n  // rather than taking the fork with it: a student's own work must not\n  // disappear because the teacher tidied up their side.\n  parentRoomId?: string\n  // (#548) Which tools this room offers, if it restricts them at all. Absent\n  // means it does not — see `sanitizeEnabledTools` for why the unrestricted\n  // case is an absence rather than a list of every tool.\n  //\n  // A property of the room, so it reads the same for the owner and for every\n  // student: a teacher who put out two pencils has to see the two pencils the\n  // class sees. It never touches the Operation Log — strokes drawn with a tool\n  // before it was switched off keep replaying, and a peer's operation with a\n  // tool this room no longer offers still paints. The toolset decides what can\n  // be picked up, not what exists.\n  enabledTools?: ToggleableTool[]\n  // (#176, ADR 014) Boards. A lesson is a Room with no `lessonId` and is also\n  // its own first board; every further board is a Room whose `lessonId` names\n  // the lesson. The two are told apart by this one field, and the split it\n  // draws is the whole model: everything social (participants, access, closed,\n  // tools, palette, freeze) belongs to the lesson, everything content\n  // (operations, snapshots, thumbnail, paper, size) to the board. Boards are\n  // never listed by the room-list endpoints — they are reached through their\n  // lesson's `room_state.lesson.boards`.\n  //\n  // On a board's own `room_state.room` the social fields (`accessMode`,\n  // `hasPassword`, `closedAt`, `enabledTools`, `activeBoardId`) are the\n  // *lesson's*, overlaid by the server, so a client reads one object either\n  // way and never has to know where a fact lives.\n  lessonId?: string\n  // Position in the lesson's board strip; the lesson itself is 0. Absent on\n  // rows the server builds by hand (the same optionality `parentRoomId` has).\n  boardOrder?: number\n  // The board the lesson's owner is on — what a joiner lands on and what a\n  // following student switches to. Absent means the lesson's own first board.\n  // Set only on a lesson (and overlaid onto its boards, see `lessonId`).\n  activeBoardId?: string\n  // (#595, ADR 015) Set together on a *personal board* — a student's own page\n  // in one assignment round — and absent on every other room. Only this\n  // student and the teacher (the lesson's owner) may draw on it; the server\n  // refuses anyone else with `board_not_yours`.\n  assignmentId?: string\n  boardOwnerId?: string\n  // (#595) Lesson only (overlaid onto its boards like `activeBoardId`): who\n  // sees a student's personal board besides the student and the teacher.\n  // Absent on rows the server builds by hand; `teacher_only` is the default.\n  classVisibility?: ClassVisibility\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":119,"kind":"model","snippet":"model Room {\n  id                 String              @id\n  name               String\n  paper              String\n  // Hex color the creator picked for the paper background (see the shared\n  // `Room.paperColor` doc comment) — nullable so pre-existing rows fall back\n  // to DEFAULT_PAPER_COLORS[paper] client-side rather than needing a backfill.\n  paperColor         String?\n  // Infinite (tiled) canvas — canvasWidth/canvasHeight are set iff !infinite.\n  // Nullable rather than a sentinel so existing fixed-canvas rows/queries\n  // don't need to special-case a magic value; `@default(false)` backfills\n  // every pre-existing row as a fixed-canvas room with no data migration.\n  infinite           Boolean             @default(false)\n  canvasWidth        Int?\n  canvasHeight       Int?\n  passwordHash       String?\n  // (#224) Who may enter at all. Deliberately independent of `passwordHash`,\n  // which stays its own toggle applicable in either mode: the password is a\n  // shared secret about the *link*, this is about *people*. A lesson can be\n  // invite-only without a password (the allow-list is the gate) or open with\n  // one (the secret is the gate) — collapsing them into one setting would\n  // make \"invite these three students, no password to type on a tablet\"\n  // unexpressible.\n  //\n  // Enum rather than a String column (unlike `paper`/`verification`) because\n  // this one decides who gets in: a value Postgres cannot hold is a value no\n  // join check has to have an opinion about, and there is no fail-open branch\n  // to get wrong. Its members are spelled exactly as the wire values in\n  // packages/shared's `RoomAccessMode`, so the row travels to the client\n  // through `toWireRoom` with no mapping table and no cast.\n  //\n  // `@default` backfills every existing room as `anyone_with_link` — today's\n  // actual behaviour, so the migration changes no room's accessibility.\n  accessMode         RoomAccessMode      @default(anyone_with_link)\n  // (#548) Which tools this room offers. An empty list means \"no restriction\",\n  // which is also what every pre-existing row backfills to — so this migration\n  // changes no room's behaviour.\n  //\n  // Empty cannot be confused with \"the owner switched everything off\": a legal\n  // toolset always keeps at least one drawing tool (see `sanitizeEnabledTools`\n  // in packages/shared), so the empty list is unreachable as a restriction and\n  // free to mean the absence of one. And the absence is stored as an absence\n  // rather than as all fifteen ids on purpose — a stored full list would keep\n  // the *next* tool this app ships out of every room that never restricted\n  // anything.\n  //\n  // A scalar String[] rather than the enum treatment `accessMode` gets: this\n  // list is read back through the shared sanitizer, which drops ids it does\n  // not know, and that is what lets a row written by a newer build still open\n  // in an older one instead of failing to parse.\n  enabledTools       String[]            @default([])\n  closedAt           DateTime?\n  // (#317) Fork lineage. `SetNull` rather than the `Cascade` every other\n  // relation here uses, and deliberately so: deleting the lesson a student\n  // forked from must never delete the student's own work with it. The fork\n  // keeps everything it was seeded with — that content lives in its own\n  // snapshot and operation rows, not in the parent's — and only forgets\n  // where it came from.\n  parentRoomId       String?\n  parent             Room?               @relation(\"RoomForks\", fields: [parentRoomId], references: [id], onDelete: SetNull)\n  forks              Room[]              @relation(\"RoomForks\")\n  // (#176, ADR 014) Boards. A lesson is an ordinary Room (`lessonId` null) and\n  // is also its own first board; every additional board is a Room row whose\n  // `lessonId` points at the lesson. Everything *social* — participants,\n  // invites, requests, blocks, password, accessMode, closedAt, enabledTools,\n  // palette — is read and written on the lesson (`lessonOf(room)`, see\n  // lessons.ts); everything *content* — operations, snapshots, layer state,\n  // thumbnail — stays on the board itself. Depth is exactly one: a board's\n  // lesson always has `lessonId` null, and the server refuses to create a\n  // board inside a board.\n  //\n  // `Cascade`, unlike `parentRoomId`'s `SetNull` just above, because the two\n  // links mean opposite things: a fork is somebody else's independent work\n  // that merely remembers its origin, a board is a page *of* this lesson and\n  // has no meaning without it. Every pre-existing row is a lesson with one\n  // board, so the migration is purely additive.\n  lessonId           String?\n  lesson             Room?               @relation(\"LessonBoards\", fields: [lessonId], references: [id], onDelete: Cascade)\n  boards             Room[]              @relation(\"LessonBoards\")\n  // Position in the lesson's board strip. The lesson itself is always 0; a new\n  // board takes max + 1. Meaningless (and left at 0) on a lesson row.\n  boardOrder         Int                 @default(0)\n  // The board the teacher is currently on — what a joiner lands on and what\n  // followers switch to. Null means the lesson's own first board. Only ever\n  // set on a lesson row. Not a relation on purpose: it may name a board that\n  // was deleted a moment ago, and the delete route resets it rather than\n  // asking Postgres to.\n  activeBoardId      String?\n  // (#595, ADR 015) Class mode. A *personal board* is a board with an owner of\n  // its own, one per student per assignment round: `assignmentId` and\n  // `boardOwnerId` are set together or not at all, and only on a board\n  // (`lessonId` set). Only the student and the teacher draw on it\n  // (`board_not_yours`); who else may *see* it is the lesson's\n  // `classVisibility`. `boardOwnerId` is not a relation for the same reason\n  // `activeBoardId` is not: nothing here needs Postgres to chase it, and a\n  // student's account going away must not take their lesson's grid with it.\n  assignmentId       String?\n  assignment         Assignment?         @relation(\"AssignmentBoards\", fields: [assignmentId], references: [id], onDelete: Cascade)\n  boardOwnerId       String?\n  // Lesson rows only. The assignment round in progress (null — none), the\n  // personal board the teacher is showing the whole class (null — none), and\n  // whether students see each other's work. `teacher_only` by default: showing\n  // your work to everyone is awkward for beginners, and the teacher can open\n  // it up at any moment.\n  activeAssignmentId String?\n  spotlightBoardId   String?\n  classVisibility    ClassVisibility     @default(teacher_only)\n  assignments        Assignment[]        @relation(\"LessonAssignments\")\n  ownerId            String\n  owner              User                @relation(fields: [ownerId], references: [id])\n  operations         Operation[]\n  participants       RoomParticipant[]\n  invites            RoomInvite[]\n  joinRequests       RoomJoinRequest[]\n  blocks             RoomBlock[]\n  snapshots          RoomLayerSnapshot[]\n  layerState         RoomLayerState?\n  palette            RoomPalette?\n  thumbnail          RoomThumbnail?\n  createdAt          DateTime            @default(now())\n\n  // (#595) One personal board per student per assignment — what makes the\n  // lazy creation for a latecomer safe to race (ADR 015 §2).\n  @@unique([assignmentId, boardOwnerId])\n  // Every read of a lesson's boards is \"its boards, in strip order\".\n  @@index([lessonId, boardOrder])\n}","truncated":false}],"ROOM_ACCESS_MODES":[{"path":"packages/shared/src/room.ts","line":18,"kind":"const","snippet":"export const ROOM_ACCESS_MODES: readonly RoomAccessMode[] = ['anyone_with_link', 'invite_only']","truncated":false}],"RoomAccessInfo":[{"path":"packages/shared/src/room.ts","line":251,"kind":"type","snippet":"export type RoomAccessInfo = {\n  accessMode: RoomAccessMode\n  hasPassword: boolean\n  invites: RoomInvite[]\n  pendingRequests: RoomJoinRequest[]\n  participants: RoomAccessParticipant[]\n}","truncated":false}],"RoomAccessMode":[{"path":"packages/shared/src/room.ts","line":16,"kind":"type","snippet":"// (#224, release track #314 §6) Who is allowed into a room at all.\n//\n// `anyone_with_link` is what every room did before this existed and stays the\n// default: the id in the URL is the credential. `invite_only` admits the\n// owner, anyone on the room's email allow-list, and anyone the owner has\n// approved from the waiting queue; everyone else can ask, and waits.\n//\n// Orthogonal to `hasPassword` — see the accessMode comment in schema.prisma\n// for why the two are separate toggles rather than one setting.\nexport type RoomAccessMode = 'anyone_with_link' | 'invite_only'","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":551,"kind":"enum","snippet":"// (#224) Members spelled as the wire values on purpose — see Room.accessMode.\nenum RoomAccessMode {\n  anyone_with_link\n  invite_only\n}","truncated":false}],"RoomAccessParticipant":[{"path":"packages/shared/src/room.ts","line":245,"kind":"type","snippet":"/** Someone who has ever been in the room (`RoomParticipant`), with whether\n *  they are currently blocked from coming back.\n *\n *  Deliberately carries no email. These people didn't ask the owner for\n *  anything — they were let in, or came through a link — and the owner's use\n *  for this list is \"who is in my lesson, and remove that one\", which a name\n *  serves. Handing every room owner the addresses of everyone who ever opened\n *  their link is a disclosure with no matching need. */\nexport type RoomAccessParticipant = {\n  userId: string\n  name: string | null\n  blocked: boolean\n}","truncated":false}],"RoomBlock":[{"path":"apps/server/prisma/schema.prisma","line":531,"kind":"model","snippet":"// (#224) A revoked participant — the \"kick\" that sticks. Checked on every\n// `join_room` independently of `accessMode`, because the mode a room is in\n// says nothing about the one person it was decided must not be in it.\n//\n// Keyed by userId, which bounds what it can promise: a blocked *guest* who\n// clears site data arrives as a new `User` and is no longer recognizably the\n// same person. Accepted for the first release rather than papered over —\n// blocking is meaningful against signed-in accounts, and a room that needs a\n// hard door has `invite_only` and/or a password for that. Anything stronger\n// (IP, device fingerprint) would be both weaker than it looks and a privacy\n// cost we don't want; recorded here so the limitation isn't rediscovered as a\n// bug later.\nmodel RoomBlock {\n  id        String   @id @default(uuid())\n  roomId    String\n  room      Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  userId    String\n  user      User     @relation(fields: [userId], references: [id], onDelete: Cascade)\n  createdAt DateTime @default(now())\n\n  // Every read is \"is this user blocked from this room\", and blocking twice\n  // is the same block.\n  @@unique([roomId, userId])\n}","truncated":false}],"RoomFolder":[{"path":"packages/shared/src/room.ts","line":290,"kind":"type","snippet":"// (#211 epic) Per-user room-list folder. Nesting via `parentFolderId`\n// (null = root level); see issue #212 for the cycle-guard/empty-only-delete\n// rules enforced server-side. Purely organizational metadata — deleting a\n// folder never deletes the rooms filed in it (see Room.folderId above).\nexport type RoomFolder = {\n  id: string\n  userId: string\n  name: string\n  parentFolderId: string | null\n  createdAt: string\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":326,"kind":"model","snippet":"// (#211 epic, issue #212) Per-user, nestable folder for organizing \"Мои\n// уроки\". Purely organizational metadata (see RoomParticipant.folderId\n// above) — never owns a Room, so deleting a folder is always safe data-wise;\n// the API layer still restricts delete to empty folders only (no direct\n// child rooms or subfolders) to avoid silently reshuffling a user's\n// organization (see roomFolderRoutes.ts).\nmodel RoomFolder {\n  id             String            @id @default(uuid())\n  userId         String\n  user           User              @relation(fields: [userId], references: [id], onDelete: Cascade)\n  name           String\n  parentFolderId String?\n  parentFolder   RoomFolder?       @relation(\"RoomFolderChildren\", fields: [parentFolderId], references: [id], onDelete: SetNull)\n  children       RoomFolder[]      @relation(\"RoomFolderChildren\")\n  participants   RoomParticipant[]\n  createdAt      DateTime          @default(now())\n}","truncated":false}],"RoomInvite":[{"path":"packages/shared/src/room.ts","line":218,"kind":"type","snippet":"/** One entry of an `invite_only` room's allow-list. The address is stored\n *  lowercased/trimmed (see roomAccess.ts) — this is the normalized form, which\n *  is also the one to send back to `DELETE /invites/:email`. */\nexport type RoomInvite = {\n  email: string\n  invitedAt: string\n}","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":473,"kind":"model","snippet":"// (#224, §6 of the release track #314) The allow-list an `invite_only` room\n// admits people by. Keyed by **email, not userId**, and that is the point: the\n// person a teacher invites usually has no account here yet, and every browser\n// already carries a `User` row of its own (see the identity-cookie comment on\n// User), so a userId allow-list could only ever list people who had already\n// been here. The email is resolved to whoever presents it at join time —\n// meaning an invite sent today still admits the student who signs in for the\n// first time tomorrow, without the invite needing to be re-issued.\n//\n// It also means an invite grants nothing to a guest who never signs in: with\n// `email` null on their User row there is nothing to match. That is the\n// intended trade — an allow-list that anonymous browsers could satisfy would\n// not be one.\n//\n// `email` is stored lowercased/trimmed by the API layer before it ever gets\n// here, same rule as LoginCode.email, so an invite typed with capitals still\n// matches the address as stored on User.\nmodel RoomInvite {\n  id              String   @id @default(uuid())\n  roomId          String\n  room            Room     @relation(fields: [roomId], references: [id], onDelete: Cascade)\n  email           String\n  invitedByUserId String\n  // No `onDelete` (Prisma's default Restrict), matching Room.owner rather than\n  // the Cascade the room-scoped relations use: cascading here would let a\n  // deleted account silently retract access it had gran
