:root[data-theme='dark'] {
  --bg: #16151a;
  --panel: #1e1d24;
  --panel-2: #23222a;

  --out: #f0a63d;
  --warn: #ef6f66;

  color-scheme: dark;

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------- top bar ---------- */

header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex: none;
  flex-wrap: wrap;
}

.brand { font-weight: 620; letter-spacing: -0.01em; font-size: 15px; }
.stamp { color: var(--ink-3); font: 11px/1.4 var(--mono); }

.tabs { display: flex; gap: 2px; background: var(--panel-2); border-radius: 9px; padding: 3px; }
.tabs button {
  border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 5px 12px; border-radius: 7px; cursor: pointer;
}
.tabs button[aria-selected='true'] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.spacer { flex: 1; }

input[type='search'] {
  width: 230px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 13px;
}
input[type='search']:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; user-select: none;
}
.chip[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- layout ---------- */

main { flex: 1; display: flex; min-height: 0; }
.view { flex: 1; min-width: 0; position: relative; display: none; }
.view[data-active='true'] { display: block; }

#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph.dragging { cursor: grabbing; }

.hint {
  position: absolute; left: 14px; bottom: 12px; color: var(--ink-3);
  font-size: 11px; pointer-events: none; background: var(--bg); padding: 2px 6px; border-radius: 6px;
}

/* Sits above the hint: how much of the map is currently hidden, and the way back. */
.filters {
  position: absolute; left: 14px; bottom: 36px; display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 6px 5px 13px; box-shadow: var(--shadow); font-size: 12px; color: var(--ink-2);
}
.filters .chip { padding: 3px 10px; }
.filters .chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- svg pieces ---------- */

.band { fill: var(--panel-2); stroke: var(--line-2); }
.band-title { fill: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.09em; text-transform: uppercase; }
.layer-title { fill: var(--ink-2); font: 600 12px var(--sans); pointer-events: none; }

.layer-head { cursor: pointer; }
.layer-head-hit { fill: transparent; }
.layer-head:hover .layer-head-hit { fill: var(--card-hover); }
.layer-head:hover .layer-title { fill: var(--accent); }

/* A folded column: narrow enough to ignore, wide enough to click back open. */
.strip { cursor: pointer; }
.strip rect { fill: var(--card); stroke: var(--line); stroke-dasharray: 3 3; }
.strip:hover rect { fill: var(--card-hover); stroke: var(--accent); stroke-dasharray: none; }
.strip-title { fill: var(--ink-3); font: 600 11px var(--sans); }
.strip:hover .strip-title { fill: var(--accent); }

.node rect { fill: var(--card); stroke: var(--line); stroke-width: 1; rx: 9; }
.node .title { fill: var(--ink); font: 600 12.5px var(--sans); }
.node .meta { fill: var(--ink-3); font: 11px var(--mono); }
.node .bar-bg { fill: var(--line-2); }
.node .bar { fill: var(--ok); }
.node { cursor: pointer; }
.node:hover rect { fill: var(--card-hover); stroke: var(--accent); }
.node[data-sel='true'] rect { stroke: var(--accent); stroke-width: 2.5; }
.node[data-rel='in'] rect { stroke: var(--in); stroke-width: 2; }
.node[data-rel='out'] rect { stroke: var(--out); stroke-width: 2; }
.node[data-dim='true'] { opacity: 0.24; }
.node[data-hit='true'] rect { fill: var(--card-hover); stroke: var(--accent); stroke-dasharray: 4 3; }
.node[data-focus='true'] rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 3; }

.edge { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-opacity: 0.55; }
.edge[data-back='true'] { stroke: var(--warn); stroke-opacity: 0.5; }
.edge[data-type='true'] { stroke-dasharray: 3 4; }
.edge[data-rel='in'] { stroke: var(--in); stroke-width: 2; stroke-opacity: 1; }
.edge[data-rel='out'] { stroke: var(--out); stroke-width: 2; stroke-opacity: 1; }
.edge[data-dim='true'] { stroke-opacity: 0.07; }

/* ---------- side panel ---------- */

aside {
  width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 16px 18px 40px;
}
aside.empty { color: var(--ink-3); }
aside h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
aside h3 {
  margin: 22px 0 8px; font: 600 11px var(--sans); letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-3);
}
aside .layer-tag { color: var(--ink-3); font-size: 12px; }
aside .owns { margin: 10px 0 0; color: var(--ink); }
aside .note {
  margin: 6px 0 0; padding: 8px 10px; background: var(--panel-2);
  border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--ink-2);
}

.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.actions button {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer;
}
.actions button:hover { border-color: var(--accent); color: var(--accent); }
.actions button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 7px 9px; }
.stat b { display: block; font-size: 16px; font-weight: 620; }
.stat span { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.03em; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 4px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.list li:last-child { border-bottom: 0; }
.path { font: 11.5px var(--mono); color: var(--ink-2); word-break: break-all; }
.num { color: var(--ink-3); font: 11px var(--mono); float: right; margin-left: 8px; }

.link { color: var(--accent); cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }
a.link { color: var(--accent); }
/* A dependency that is currently filtered off the map — clicking it brings it back. */
.link.off { color: var(--ink-3); text-decoration: underline dotted; }
.link.off:hover { color: var(--accent); }

.tag {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); margin: 0 4px 4px 0;
}
.tag.warn { border-color: var(--warn); color: var(--warn); }
.tag.ok { border-color: var(--ok); color: var(--ok); }

/* ---------- flows ---------- */

.flow-wrap { height: 100%; overflow: auto; padding: 22px 26px 60px; }
.flow-wrap h2 { margin: 0 0 4px; font-size: 19px; }
.flow-wrap .intro { color: var(--ink-2); max-width: 70ch; margin: 0 0 20px; }
.flow { margin-bottom: 42px; }
.steps { display: flex; flex-direction: column; gap: 0; max-width: 900px; }
.step { display: flex; gap: 14px; }
.step .rail { width: 22px; flex: none; display: flex; flex-direction: column; align-items: center; }
.step .dot {
  width: 11px; height: 11px; border-radius: 50%; background: var(--accent);
  margin-top: 15px; flex: none; box-shadow: 0 0 0 3px var(--bg);
}
.step[data-side='server'] .dot { background: var(--out); }
.step[data-side='wire'] .dot { background: var(--in); }
.step .stem { flex: 1; width: 2px; background: var(--line); }
.step:last-child .stem { background: none; }
.step .body {
  flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 10px;
}
.step .body h4 { margin: 0 0 4px; font-size: 14px; }
.step .body p { margin: 0; color: var(--ink-2); font-size: 13px; }
.step .body .where { margin-top: 7px; font-size: 12px; }

/* ---------- runtime (#624) ---------- */

/* Contract strength, strongest first: one colour + one dash pattern per level, so the
   legend reads in greyscale too. */
[data-contract='bound'] { --c: var(--ok); --dash: none; }
[data-contract='named'] { --c: var(--in); --dash: 10 4; }
[data-contract='one-side'] { --c: var(--out); --dash: 5 5; }
[data-contract='opaque'] { --c: var(--ink-3); --dash: 1.5 5; }

.rt-wrap { display: flex; height: 100%; }
.rt-canvas { flex: 1; min-width: 0; overflow: auto; padding: 0 0 30px; }
#rt-svg { display: block; width: 100%; height: auto; }
.rt-legend {
  position: sticky; top: 0; left: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line-2); font-size: 12.5px;
}
.rt-key { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.rt-key line { stroke: var(--c); stroke-width: 3; stroke-dasharray: var(--dash); stroke-linecap: round; }
.rt-key-note { color: var(--ink-3); font-size: 11.5px; }

.rt-zone rect { fill: var(--panel-2); stroke: var(--line-2); }
.rt-zone-title { fill: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.09em; text-transform: uppercase; }

.rt-link { cursor: pointer; }
.rt-link .rt-hit { fill: none; stroke: transparent; stroke-width: 14; }
.rt-link .rt-line {
  fill: none; stroke: var(--c); stroke-width: 2; stroke-dasharray: var(--dash); stroke-linecap: round; opacity: 0.8;
}
.rt-link:hover .rt-line, .rt-link[data-sel='true'] .rt-line { stroke-width: 3.5; opacity: 1; }
.rt-link[data-dim='true'] .rt-line { opacity: 0.12; }

.rt-label { cursor: pointer; }
.rt-label rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.2; }
.rt-label-text { fill: var(--ink-2); font: 11px var(--mono); }
.rt-label:hover rect, .rt-label[data-sel='true'] rect { stroke-width: 2.4; }
.rt-label[data-dim='true'] { opacity: 0.18; }

.rt-node { cursor: pointer; }
.rt-node rect { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.rt-node[data-kind='external'] rect { stroke-dasharray: 5 4; fill: var(--panel-2); }
.rt-node .rt-store-lid { stroke: var(--line); stroke-width: 1.2; }
.rt-node:hover rect { fill: var(--card-hover); stroke: var(--accent); }
.rt-node[data-sel='true'] rect { stroke: var(--accent); stroke-width: 2.5; }
.rt-node[data-dim='true'] { opacity: 0.3; }
.rt-node-title { fill: var(--ink); font: 600 13px var(--sans); }
.rt-node-kind { fill: var(--ink-3); font: 11px var(--sans); }

.rt-panel {
  width: 380px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 16px 18px 40px;
}
.rt-panel h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
.rt-panel h3 {
  margin: 22px 0 8px; font: 600 11px var(--sans); letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-3);
}
.rt-panel .layer-tag { color: var(--ink-3); font-size: 12px; }
.rt-panel .owns { margin: 10px 0 0; }
.rt-panel .note {
  margin: 8px 0 0; padding: 8px 10px; background: var(--panel-2);
  border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--ink-2);
}
.rt-badge {
  display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; white-space: nowrap;
  border: 1.5px solid var(--c); color: var(--c); font-weight: 600;
}
.rt-msgs { table-layout: fixed; }
.rt-msgs td { font-size: 12.5px; overflow-wrap: anywhere; }
.rt-msgs code { font: 12px var(--mono); color: var(--ink); }
.rt-dir { width: 22px; color: var(--ink-3); font-size: 15px; }
.rt-type { font: 11.5px var(--mono); color: var(--accent); margin-top: 2px; }
.rt-mnote { color: var(--ink-2); margin-top: 2px; }
.rt-runtime { color: var(--ink-2); margin-top: 3px; font-size: 12px; padding-left: 8px; border-left: 2px solid var(--out); }

/* ---------- health ---------- */

.health { height: 100%; overflow: auto; padding: 22px 26px 60px; }
.health h2 { margin: 0 0 6px; font-size: 19px; }
.health h3 { margin: 28px 0 8px; font-size: 14px; }
.health p.lede { color: var(--ink-2); max-width: 78ch; margin: 0 0 6px; }
table { border-collapse: collapse; width: 100%; max-width: 1100px; font-size: 12.5px; }

":["фильтры","детерминизм"],"loc":586,"testLoc":276,"styleLoc":0,"fileCount":1,"testCount":1,"churn":2,"files":[{"path":"apps/web/src/engine/src/layerFilters.ts","loc":586,"kind":"code","in":1,"out":0,"churn":1},{"path":"apps/web/src/engine/src/layerFilters.test.ts","loc":276,"kind":"test","in":0,"out":0,"churn":1}]},{"id":"server-rooms","title":"Комнаты и релей","layer":"server-realtime","owns":"Сердце сервера: комнаты в памяти, подкреплённые Postgres, ретрансляция операций всем участникам, живые штрихи и курсоры, undo/redo, заморозка. Сервер никогда не рендерит — он пересылает операции. rooms.ts разбирается по доменам (#612). Внизу реестр (roomRegistry.ts): запись комнаты, Map, правило урок/доска, очередь записи в Postgres; над ним — какие строки комната пишет по ходу (roomPersistence.ts). Поверх него отдельно: структурный лог, проверка операций, правило покрытия снапшотом (snapshotCoverage.ts), хранилище снапшотов (snapshotStore.ts), рычаги владельца — заморозка, инструменты, закрытие, доступ, блокировки слоёв (ownerControls.ts) — и живой класс: доски, задания, подсветка, руки (classroom.ts). Холодная загрузка из Postgres — roomLoader.ts; журнал операций — operationLog.ts; взгляды для здоровья, сторожа и админки — roomStats.ts. В rooms.ts остаются создание, вход и выход, выселение и room_state.","adr":["002-collaborative-undo","014-boards","015-class-mode"],"issues":[],"notes":["Работа в классе (ADR 015): личная доска — доска урока с владельцем-учеником. Кто её видит, решает одна функция canSeeBoard (lessons.ts) — и для join_room, и для REST, и для LessonState, который собирается под получателя и шлётся событием lesson_state.","Map остаётся источником правды для всего живого; запись в Postgres — fire-and-forget, её не ждут на горячем пути. Плата: операция, проигравшая гонку падению сервера, выпадает из истории, хотя уже была ретранслирована.","Комната, которая читается как стёртая, — это испорченная строка RoomLayerState, а не потерянные данные."],"tags":["socket ":"client","detail":"PointerInput принимает нажим, наклон и скорость (по часам сэмпла, не обработчика) и переводит экранные координаты в координаты холста аналитически, через setTransform."},{"id":"dabs","title":"Сплайн и дабы","module":"engine-dabs","side":"client","detail":"Точки укладываются на сплайн Catmull-Rom, по нему с нужным шагом расставляются дабы, форма каждого берётся из пресета инструмента и отпечатка кончика."},{"id":"raster","title":"Растеризация в буфер","module":"engine-buffers","side":"client","detail":"Дабы рисуются в аккумуляционный буфер штриха, затем — в тайлы слоя. Пользователь видит линию здесь, до всякой сети."},{"id":"op","title":"Операция","module":"engine-oplog","side":"client","detail":"Завершённый штрих становится сериализуемой Operation. Это же значение потом уедет на сервер, ляжет в историю и будет свёрнуто при реплее у всех остальных."},{"id":"pack","title":"Упаковка дабов","module":"shared-dab-codec","side":"wire","detail":"Дабы пакуются в компактный проводной формат — иначе поток не проходит по реальному каналу, а не только по локальной сети."},{"id":"outbox","title":"Исходящая очередь","module":"room-net","side":"client","detail":"Операция кладётся в outbox и переживает потерю связи и перезагрузку страницы. Локально она применена оптимистично, до подтверждения."},{"id":"emit","title":"emit operation","module":"shared-contract","side":"wire","detail":"Сокет отправляет `operation`; параллельно, пока рука ещё ведёт, идут `stroke_live` с частичными дабами и `cursor_move`."},{"id":"relay","title":"Сервер присваивает seq и ретранслирует","module":"server-rooms","side":"server","detail":"Комната в памяти даёт операции порядковый номер, рассылает `operation_confirmed` всем и `peer_stroke_live` — соседям. Сервер ничего не рисует."},{"id":"persist","title":"Запись в Postgres","module":"server-entry","side":"server","detail":"Запись идёт fire-and-forget, её не ждут на горячем пути: задержка БД не должна добавляться к задержке рисования."},{"id":"peer","title":"Чужой клиент сворачивает операцию","module":"engine-facade","side":"client","detail":"У остальных участников та же операция применяется к их движку. Картинка сходится не потому, что кто-то прислал пиксели, а потому что все свернули один и тот же лог."}]},{"id":"join","title":"Вход в комнату и восстановление картинки","intro":"Второй по важности путь: он решает, увидит ли учитель свою работу через неделю и сколько секунд он будет её ждать.","steps":[{"id":"gate","title":"Ворота входа","module":"room-net","side":"client","detail":"Клиент встаёт в очередь входа и держит канвас закрытым, пока не решено, что именно восстанавливать: чужие операции, прилетевшие в это окно, не должны нарисоваться дважды."},{"id":"join_room","title":"join_room","module":"shared-contract","side":"wire","detail":"В запросе едет максимальный seq, который у клиента уже есть, — чтобы сервер не слал заново то, что вкладка не теряла."},{"id":"room_state","title":"room_state","module":"server-rooms","side":"server","detail":"Сервер отдаёт комнату, участников, палитру, статус заморозки, номер последнего снапшота и хвост операций. Что именно вырезано из хвоста, решается по каждому слою отдельно, против его собственного покрытия — общий порог по комнате однажды уже съел рисунок."},{"id":"fetch","title":"Загрузка снапшотов","module":"server-rooms-http","side":"server","detail":"Клиент сам забирает индекс снапшотов и по блобу на слой обычным HTTP — по сокету это не едет."},{"id":"decode","title":"Раскодирование и ретайлинг","module":"engine-oplog","side":"client","detail":"Блобы распаковываются и раскладываются по тайлам слоёв — при этом сетка тайлов может не совпадать с той, в которой снапшот пекли."},{"id":"replay","title":"Реплей хвоста","module":"engine-facade","side":"client","detail":"Поверх восстановленных пикселей сворачивается хвост операций. Операции, несущие и пиксели, и структуру, приходят всегда, а их пиксельную половину клиент пропускает сам — против того покрытия, которое реально восстановил."},{"id":"report","title":"Отчёт о восстановлении","module":"room-diagnostics","side":"client","detail":"Что восстановилось, за сколько и не потерялось ли — уходит в отчёт. Это то, чем мы узнаём о сбое раньше учителя."}]},{"id":"undo","title":"Отмена в четыре руки","intro":"Отмена в общей комнате — не стек. Разбор того, почему именно так, лежит в ADR 002.","steps":[{"id":"request","title":"Клиент просит отменить своё","module":"room-net","side":"client","detail":"Отменяется собственная операция участника по её идентификатору, а не «последнее действие в комнате»."},{"id":"server_undo","title":"Сервер выпускает обратную операцию","module":"server-rooms","side":"server","detail":"Отмена сама становится операцией в общем логе и получает свой seq — иначе порядок у разных участников разъедется."},{"id":"fold","title":"Все сворачивают её одинаково","module":"engine-facade","side":"client","detail":"Структурная отмена возвращает удалённый слой по его id. Пиксели при этом придут только если строка RoomLayerState цела."}]}],"adr":{"001-layer-panel-dnd":"ADR 001: Layer Panel DnD","002-collaborative-undo":"ADR 002: Коллаборативный undo/redo, владение слоями и revoke","003-liner-tool":"ADR 003: Линер / Fineliner — чернильный инструмент рисования","004-marker-tool":"ADR 004: Маркер — инструмент маркер-рендеринга","005-charcoal-tool":"ADR 005: Уголь — рыхлый углеродный материал","006-i18n":"ADR 006: Локализация интерфейса (i18n)","007-desktop-controls":"ADR 007: Управление на ПК с графическим планшетом","008-selection":"ADR 008: Выделение области и операции над выделенным","009-brush-pen":"ADR 009: Brush Pen — нажимное перо","010-fill-tool":"ADR 010: Инструмент заливки","011-watercolor":"ADR 011: Watercolor — акварель как per-stroke wash","012-tip-footprint-geometry":"ADR 012: Единый API геометрии отпечатка","013-digital-brush":"ADR 013: Цифровая кисть — кисть как данные","014-boards":"ADR 014: Доски — несколько холстов в одном уроке","014-layer-filters":"A езагрузку вкладки. И буфер обмена редактора — он переживает переход в другую комнату и виден из соседней вкладки.","modules":["room-net"]},{"id":"ls","title":"localStorage","zone":"device","at":[0,2],"kind":"store","owns":"Настройки приложения и комнаты, флаги, калибровка нажима. Только удобства этого устройства — ничего, что должны видеть другие.","modules":["store-app","lib-browser"]},{"id":"sw","title":"Service Worker","zone":"device","at":[1,2],"kind":"process","owns":"Кэш сборки для PWA. `/api/` и `/socket.io/` он не трогает — это проверено тестом, иначе он отдавал бы устаревшие ответы. Он же отдаёт старую сборку сразу после деплоя.","modules":["pwa"]},{"id":"peer","title":"Вкладка другого участника","zone":"peer","at":[0,2],"kind":"process","owns":"Та же схема, что слева: свой интерфейс, свой движок, свой GPU. Картинка у всех сходится не потому, что кто-то шлёт пиксели, а потому что все сворачивают один и тот же лог."},{"id":"nginx","title":"nginx","zone":"vps","at":[0,0],"kind":"process","owns":"TLS, раздача статики (сборка, текстуры бумаги, шрифт иконок — заранее сжатые) и прокси /api и /socket.io на процесс Node. Сам ничего не понимает в сообщениях."},{"id":"server","title":"Процесс Node","zone":"vps","at":[0,1],"kind":"process","owns":"Fastify (HTTP) и Socket.io в одном процессе. Комнаты живут в памяти: сервер присваивает операциям seq и ретранслирует их, но ничего не рисует. Пишет в БД, не дожидаясь записи.","modules":["server-rooms","server-rooms-http","server-auth","server-admin","server-health","server-entry"]},{"id":"pg","title":"Postgres","zone":"vps","at":[1,0],"kind":"store","owns":"Источник правды между сессиями: пользователи, комнаты, полный лог операций (он же датасет), снапшоты слоёв, миниатюры.","modules":["server-entry"]},{"id":"backup","title":"Ночной бэкап","zone":"vps","at":[1,2],"kind":"process","owns":"cron → deploy/backup.sh: pg_dump и выгрузка копии за пределы машины. Запуск, который не выгрузил копию, считается упавшим — локальные дампы умирают вместе с сервером."},{"id":"resend","title":"Resend","zone":"external","at":[1,0],"kind":"external","owns":"Отправка писем. Сейчас это только коды входа — то есть без него нельзя войти."},{"id":"sentry","title":"Sentry","zone":"external","at":[0,0],"kind":"external","owns":"Ошибки и отчёты с клиента и с сервера.","modules":["lib-observability"]},{"id":"b2","title":"Backblaze B2","zone":"external","at":[2,0],"kind":"external","owns":"Внемашинная копия базы."}],"links":[{"id":"engine-api","from":"ui","to":"engine","channel":"вызовы PencilEngineAPI","contract":"bound","summary":"Operation, ToolType","note":"Один интерфейс, одна реализация, один пакет — самый крепкий контракт в системе. Главное правило границы: стор — отражение движка. Меняют движок, стор записывает результат.","messages":[{"dir":"→","name":"appendOperation","type":"Operation","note":"чужая или восстановленная операция"},{"dir":"→","name":"setTool / setColor / setSize …","type":"ToolType","note":"текущее состояние инструмента"},{"dir":"→","name":"setViewport","type":"cx, cy, zoom, angle","note":"вьюпорт у каждого свой"},{"dir":"→","name":"restoreLayerFromSnapshot","type":"SnapshotTile[]","decl":["apps/web/src/engine/src/snapshotCodec.ts"]},{"dir":"→","name":"appendPeerLiveDabs","type":"PeerLivePacket","decl":["apps/web/src/engine/index.ts"],"note":"чужой штрих, пока он ещё рисуется"},{"dir":"←","name":"onLocalOperation","type":"Operation","note":"свой завершённый штрих — дальше он уедет в outbox"},{"dir":"←","name":"undo() / redo()","type":"Operation","note":"обратная операция, её тоже отправляют"},{"dir":"←","name":"bakeNetworkSnapshot","type":"Uint8Array","note":"слой, упакованный для снапшота"}]},{"id":"engine-gpu","from":"engine","to":"gpu","channel":"вызовы WebGL1","contract":"opaque","summary":"дабы, текстуры","note":"Здесь тип — это раскладка байтов в буфере, и компилятор её не видит. Поэтому ошибки здесь проявляются чёрным экраном или разной картинкой на разных GPU, а не красным typec type":"Room, Operation[], Participant[], LessonState","note":"всё для входа: комната, хвост лога, участники"},{"dir":"←","name":"operation_confirmed","type":"seq, Operation","note":"подтверждение — операция получила место в общем порядке"},{"dir":"←","name":"peer_stroke_live","type":"StrokeLiveData"},{"dir":"←","name":"peer_stroke_live_end","type":"strokeId"},{"dir":"←","name":"peer_cursor","type":"CursorMoveData"},{"dir":"←","name":"peer_joined","type":"Participant"},{"dir":"←","name":"peer_left","type":"userId"},{"dir":"←","name":"palette_updated","type":"palette"},{"dir":"←","name":"room_frozen_changed","type":"frozen"},{"dir":"←","name":"room_tools_changed","type":"ToggleableTool[]"},{"dir":"←","name":"participant_frozen_changed","type":"userId, frozen"},{"dir":"←","name":"room_closed_changed","type":"closedAt"},{"dir":"←","name":"join_request_created","type":"RoomJoinRequest"},{"dir":"←","name":"join_request_resolved","type":"requestId, approved"},{"dir":"←","name":"kicked","type":"roomId"},{"dir":"←","name":"peer_board_changed","type":"userId, boardId"},{"dir":"←","name":"active_board_changed","type":"boardId"},{"dir":"←","name":"board_created","type":"BoardSummary"},{"dir":"←","name":"board_renamed","type":"boardId, name"},{"dir":"←","name":"boards_reordered","type":"order"},{"dir":"←","name":"board_deleted","type":"boardId"},{"dir":"←","name":"lesson_state","type":"LessonState"},{"dir":"←","name":"participant_hand_changed","type":"userId, raised"},{"dir":"←","name":"board_thumbnail_updated","type":"boardId, updatedAt"}]},{"id":"server-peer","from":"server","to":"peer","channel":"Socket.io — рассылка","contract":"bound","summary":"те же события","note":"Сервер рассылает остальным участникам то же, что получил от одного: operation_confirmed всем, peer_stroke_live и peer_cursor — соседям. Список событий — на стрелке слева.","messages":[{"dir":"→","name":"события ServerToClientEvents","type":"Operation, StrokeLiveData, CursorMoveData"}]},{"id":"ui-rest","from":"ui","to":"server","channel":"HTTP (REST, JSON)","contract":"one-side","checks":"rest","summary":"Room, Me, BoardSummary","note":"Слабое место контракта (#623). Клиент пишет apiFetch\u003cRoom>(…) — это обещание, а не проверка: res.json() приведён к нужному типу. Сервер собирает ответ литералом и тип ответа не объявляет. Части типов (Me, MyRooms, SnapshotIndex) нет в shared вовсе.","messages":[{"dir":"→","name":"GET /api/me","type":"Me","decl":["apps/web/src/lib/api.ts"],"note":"Me объявлен только на клиенте"},{"dir":"→","name":"POST /api/me/environment","type":"ClientEnvironment","runtime":"сервер прогоняет тело через sanitizeClientEnvironment — единственная ручка с настоящей проверкой"},{"dir":"→","name":"POST /api/auth/code/request","type":"RequestedLoginCode","decl":["apps/web/src/lib/api.ts"]},{"dir":"→","name":"POST /api/auth/code/verify","type":"Me","decl":["apps/web/src/lib/api.ts"]},{"dir":"→","name":"POST /api/auth/logout","type":"Me","decl":["apps/web/src/lib/api.ts"]},{"dir":"→","name":"GET /api/rooms","type":"RoomsAtFolder","decl":["apps/web/src/lib/api.ts"]},{"dir":"→","name":"GET /api/rooms/mine","type":"MyRooms","decl":["apps/web/src/lib/api.ts"],"note":"MyRooms объявлен только на клиенте"},{"dir":"→","name":"GET /api/rooms/search","type":"Room[]"},{"dir":"→","name":"PATCH /api/rooms/:id","type":"Room"},{"dir":"→","name":"PATCH /api/rooms/:id/closed","type":"Room"},{"dir":"→","name":"DELETE /api/rooms/:id","type":"ok"},{"dir":"→","name":"DELETE /api/rooms/:id/participation","type":"ok"},{"dir":"→","name":"POST /api/rooms/:id/fork","type":"Room"},{"dir":"→","name":"POST /api/rooms/folders","type":"RoomFolder"},{"dir":"→","name":"PATCH /api/rooms/folders/:id","type":"RoomFolder"},{"dir":"→","name":"DELETE /api/rooms/folders/:id","type":"ok"},{"dir":"→","name":"PATCH /api/rooms/:id/folder","type":"ok"},{"dir":"→","name":"GET /api/rooms/:id/access","type":"RoomAccessInfo"},{"dir":"→","name":"PATCH /api/rooms/:id/access","type":"RoomAccessMode","runtime":" я сторона пишет сама. Перепутать тип на одной стороне компилятор не помешает.","messages":[{"dir":"→","name":"GET /api/admin/overview","type":"AdminOverview"},{"dir":"→","name":"GET /api/admin/users","type":"AdminUserList"},{"dir":"→","name":"GET /api/admin/users/:id","type":"AdminUserDetail"},{"dir":"→","name":"POST /api/admin/users/:id/ban","type":"ok"},{"dir":"→","name":"POST /api/admin/users/:id/unban","type":"ok"},{"dir":"→","name":"POST /api/admin/users/:id/revoke-sessions","type":"ok"},{"dir":"→","name":"GET /api/admin/ip-bans","type":"AdminIpBanList"},{"dir":"→","name":"GET /api/admin/ips/:ip","type":"AdminIpDetail"},{"dir":"→","name":"POST /api/admin/ips/:ip/ban","type":"ok"},{"dir":"→","name":"POST /api/admin/ips/:ip/unban","type":"ok"},{"dir":"→","name":"GET /api/admin/lessons","type":"AdminLessonList"},{"dir":"→","name":"GET /api/admin/lessons/:id/thumbnail","type":"png"},{"dir":"→","name":"GET /api/admin/actions","type":"AdminActionList"}]},{"id":"ui-idb","from":"ui","to":"idb","channel":"IndexedDB","contract":"one-side","summary":"OutboxEntry","note":"Тип знает только тот код, который пишет и читает. Что лежит на диске после обновления приложения до новой версии, компилятор не проверит: запись могла оставить старая сборка.","messages":[{"dir":"→","name":"pending-operations","type":"OutboxEntry","decl":["apps/web/src/pages/Room/outboxStorage.ts"],"note":"операция ждёт operation_confirmed"},{"dir":"←","name":"чтение при входе","type":"OutboxEntry","decl":["apps/web/src/pages/Room/outboxStorage.ts"],"note":"неотправленное уходит заново"}]},{"id":"ui-ls","from":"ui","to":"ls","channel":"localStorage (JSON-строки)","contract":"one-side","summary":"JSON с версией","note":"Строка на диске — каст при чтении. Поэтому настройки комнаты завёрнуты в конверт с версией: чужую или старую форму выбрасывают, а не падают на ней.","messages":[{"dir":"→","name":"настройки приложения и комнаты","type":"JSON с версией"},{"dir":"←","name":"чтение при старте","type":"JSON с в pe":"Operation","runtime":"row.data as Operation — без проверки"}]},{"id":"server-resend","from":"server","to":"resend","channel":"HTTPS","contract":"opaque","summary":"письмо с кодом","messages":[{"dir":"→","name":"POST /emails","type":"EmailMessage","decl":["apps/server/src/email.ts"],"note":"чужой API: наш тип описывает только то, что мы шлём"}]},{"id":"server-sentry","from":"server","to":"sentry","channel":"HTTPS (Sentry SDK)","contract":"opaque","summary":"ошибки","messages":[{"dir":"→","name":"исключения сервера","type":"формат SDK"}]},{"id":"backup-pg","from":"backup","to":"pg","bend":40,"channel":"pg_dump","contract":"opaque","summary":"дамп базы","messages":[{"dir":"←","name":"дамп","type":"pg_dump, custom-формат"}]},{"id":"backup-b2","from":"backup","to":"b2","channel":"rclone","contract":"opaque","summary":"копия дампа","messages":[{"dir":"→","name":"дамп","type":"файл"}]}]},"repo":"https://github.com/SuselMan/art_lessons/blob/agents/watercolor-feel","issuesBase":"https://github.com/SuselMan/art_lessons/issues/"};</script>
<script>/* Architecture map — rendering and interaction. Data is injected as window.__ARCH__. */
(function () {
  'use strict';

  var D = window.__ARCH__;
  var REPO = D.repo; // https://github.com/owner/name/blob/main
  var byId = new Map(D.modules.map(function (m) { return [m.id, m]; }));
  var layerById = new Map(D.layers.map(function (l) { return [l.id, l]; }));
  var groupById = new Map(D.groups.map(function (g) { return [g.id, g]; }));
  var rank = new Map(D.layers.map(function (l, i) { return [l.id, i]; }));

  var outEdges = new Map();
  var inEdges = new Map();
  var neighbours = new Map();
  D.edges.forEach(function (e) {
    if (!outEdges.has(e.from)) outEdges.set(e.from, []);
    if (!inEdges.has(e.to)) inEdges.set(e.to, []);
    outEdges.get(e.from).push(e);
    inEdges.get(e.to).push(e);
    if (!neighbours.has(e.from)) neighbours.set(e.from, new Set());
    if (!neighbours.has(e.to)) neighbours.set(e.to, new Set());
    neighbours.get(e.from).add(e.to);
    neighbours.get(e.to).add(e.from);
  });

  var violationsByModule = new Map();
  D.health.violations.forEach(function (v) {
    [v.fromModule, v.toModule].forEach(function (id) {
      if (!id) return;
      if (!violationsByModule.has(id)) violationsByModule.set(id, []);
      if (violationsByModule.get(id).indexOf(v) < 0) violationsByModule.get(id).push(v);
    });
  });

  var clonesByModule = new Map();
  D.health.clones.forEach(function (c) {
    [c.aModule, c.bModule].forEach(function (id) {
      if (!id) return;
      if (!clonesByModule.has(id)) clonesByModule.set(id, []);
      if (clonesByModule.get(id).indexOf(c) < 0) clonesByModule.get(id).push(c);
    });
  });

  var maxLoc = Math.max.apply(null, D.modules.map(function (m) { return m.loc; }).concat([1]));
  var maxChurn = Math.max.apply(null, D.modules.map(function (m) { return m.churn; }).concat([1]));
  var maxDebt = Math.max.apply(null, D.modules.map(function (m) {
    return (violationsByModule.get(m.id) || []).length;
  }).concat([1]));

  /* ------------------------------------------------------------------ what is on screen
   *
   * Three independent ways to thin the map out, applied in this order:
   *   hiddenLayers   — a whole column folded to a strip (click its heading)
   *   hiddenModules  — individual squares put away (side panel, or "keep what was found")
   *   focus          — keep one module and everything within N hops of it
   * The focused module always survives, so focusing can never blank the screen.
   */

  var STORE_KEY = 'archmap.filter.v1';
  var hiddenLayers = new Set();
  var hiddenModules = new Set();
  var focus = null; // { id, depth }

  function loadFilter() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      (saved.layers || []).forEach(function (id) { if (layerById.has(id)) hiddenLayers.add(id); });
      (saved.modules || []).forEach(function (id) { if (byId.has(id)) hiddenModules.add(id); });
    } catch (e) { /* private mode, cleared storage — start with everything shown */ }
  }

  function saveFilter() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        layers: Array.from(hiddenLayers),
        modules: Array.from(hiddenModules),
      }));
    } catch (e) { /* nothing to do — the filter just won't survive a reload */ }
  }

  function neighbourhood(id, depth) {
    var seen = new Set([id]);
    var frontier = [id];
    for (var d = 0; d < depth; d++) {
      var next = [];
      frontier.forEach(function (cur) {
        (neighbours.get(cur) || new Set()).forEach(function (n) {
          if (seen.has(n)) return;
          seen.add(n);
          next.push(n);
        });
      });
      frontier = next;
    }
    return seen;
  }

  var visible = new Set();

  function computeVisible() {
    visible = new Set();
    D.modules.forEach(function (m) {
      if (hiddenLayers.has(m.layer) || hiddenModules.has(m.id)) return;
      visible.add(m.id);
    });
    if (focus) {
      var keep = neighbourhood(focus.id, focus.depth);
      visible = new Set(Array.from(visible).filter(function (id) { return keep.has(id); }));
      visible.add(focus.id);
    }
  }

  /** Bring a module back whichever filter is hiding it — used by every cross-link. */
  function reveal(id) {
    var m = byId.get(id);
    if (!m) return;
    hiddenModules.delete(id);
    hiddenLayers.delete(m.layer);
    if (focus && !neighbourhood(focus.id, focus.depth).has(id)) focus = null;
    saveFilter();
    refresh();
  }

  function resetFilter() {
    hiddenLayers.clear();
    hiddenModules.clear();
    focus = null;
    saveFilter();
    refresh();
  }

  /* ------------------------------------------------------------------ layout */

  var CARD_W = 208;
  var COL_W = 240;
  var STRIP_W = 34;
  var GAP_Y = 11;
  var TOP = 74;      // room for the band + layer headings
  var LEFT = 24;

  var pos = new Map();
  var cols = [];
  var bands = [];
  var canvasW = 0;
  var canvasH = 0;

  function cardHeight(m) {
    return Math.max(46, Math.min(112, 42 + Math.sqrt(m.loc) * 2.1));
  }

  function computeLayout() {
    pos.clear();
    cols = [];
    bands = [];
    var x = LEFT;
    var maxBottom = TOP;

    D.layers.forEach(function (layer) {
      var all = D.modules.filter(function (m) { return m.layer === layer.id; });
      var mods = all.filter(function (m) { return visible.has(m.id); });
      if (!mods.length) {
        // Folded to a strip rather than dropped: a column you cannot see is one you cannot
        // get back, and the strip is the only affordance saying it still exists.
        cols.push({
          layer: layer, x: x, w: STRIP_W, collapsed: true, shown: 0, total: all.length,
          // Folded by hand, or emptied by the focus? The strip has to undo the right one.
          folded: hiddenLayers.has(layer.id),
        });
        x += STRIP_W + 6;
        return;
      }
      // Heaviest first — the thing you should look at sits at eye level.
      mods.sort(function (a, b) { return b.loc - a.loc; });
      var y = TOP;
      mods.forEach(function (m) {
        var h = cardHeight(m);
        pos.set(m.id, { x: x + (COL_W - CARD_W) / 2, y: y, w: CARD_W, h: h });
        y += h + GAP_Y;
      });
      cols.push({ layer: layer, x: x, w: COL_W, collapsed: false, shown: mods.length, total: all.length });
      maxBottom = Math.max(maxBottom, y);
      x += COL_W;
    });

    D.groups.forEach(function (g) {
      var own = cols.filter(function (c) { return c.layer.group === g.id; });
      if (!own.length) return;
      var x0 = Math.min.apply(null, own.map(function (c) { return c.x; }));
      var x1 = Math.max.apply(null, own.map(function (c) { return c.x + c.w; }));
      bands.push({ group: g, x: x0, w: x1 - x0 });
    });

    canvasW = x + LEFT;
    canvasH = Math.max(maxBottom + 40, 380);
  }

  /* ------------------------------------------------------------------ svg */

  var svg = document.getElementById('graph');
  var NS = 'http://www.w3.org/2000/svg';
  var gRoot, gBands, gEdges, gNodes;

  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function text(parent, x, y, cls, str) {
    var t = el('text', { x: x, y: y, class: cls }, parent);
    t.textContent = str;
    return t;
  }

  function tip(node, str) {
    var t = el('title', {}, node);
    t.textContent = str;
  }

  function clip(str, max) {
    return str.length > max ? str.slice(0, max - 1) + '…' : str;
  }

  function edgePath(a, b) {
    var x1 = a.x + a.w, y1 = a.y + a.h / 2;
    var x2 = b.x, y2 = b.y + b.h / 2;
    if (b.x > a.x) {
      var dx = Math.max(40, (x2 - x1) * 0.45);
      return 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ',' + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2;
    }
    // Backwards or sideways: leave the right edge, loop under, come back to the right edge.
    var xr = b.x + b.w;
    var lift = 26 + Math.min(90, Math.abs(y2 - y1) * 0.25);
    return 'M' + x1 + ' ' + y1 +
      ' C' + (x1 + 60) + ' ' + (y1 + lift) + ',' + (xr + 60) + ' ' + (y2 + lift) + ',' + xr + ' ' + y2;
  }

  function drawGraph() {
    svg.innerHTML = '';
    gRoot = el('g', {}, svg);
    gBands = el('g', {}, gRoot);
    gEdges = el('g', {}, gRoot);
    gNodes = el('g', {}, gRoot);

    bands.forEach(function (b) {
      el('rect', { x: b.x + 3, y: 12, width: b.w - 6, height: canvasH - 24, rx: 14, class: 'band' }, gBands);
      text(gBands, b.x + 14, 32, 'band-title', b.group.title);
    });

    cols.forEach(function (c) {
      if (c.collapsed) {
        var strip = el('g', {
          class: 'strip', 'data-layer': c.layer.id, 'data-folded': c.folded ? 'true' : 'false',
        }, gBands);
        el('rect', { x: c.x, y: TOP - 26, width: c.w, height: canvasH - TOP - 4, rx: 8 }, strip);
        var t = text(strip, 0, 0, 'strip-title', c.layer.title + ' · ' + c.total);
        t.setAttribute('transform',
          'translate(' + (c.x + c.w / 2 + 4) + ',' + (canvasH - 26) + ') rotate(-90)');
        tip(strip, c.folded
          ? 'Развернуть слой «' + c.layer.title + '»'
          : 'Слой пуст из-за фокуса — вернуть его целиком');
        return;
      }
      var head = el('g', { class: 'layer-head', 'data-layer': c.layer.id }, gBands);
      el('rect', {
        x: c.x + (COL_W - CARD_W) / 2 - 7, y: TOP - 30, width: CARD_W + 14, height: 23,
        rx: 6, class: 'layer-head-hit',
      }, head);
      var label = c.layer.title + (c.shown < c.total ? ' · ' + c.shown + '/' + c.total : '');
      text(head, c.x + (COL_W - CARD_W) / 2, TOP - 14, 'layer-title', label);
      tip(head, 'Свернуть слой «' + c.layer.title + '»');
    });

    D.edges.forEach(function (e) {
      var a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) return;
      var back = (rank.get(byId.get(e.to).layer) || 0) < (rank.get(byId.get(e.from).layer) || 0);
      el('path', {
        class: 'edge',
        d: edgePath(a, b),
        'data-from': e.from,
        'data-to': e.to,
        'data-back': back ? 'true' : 'false',
        'data-type': e.typeOnly ? 'true' : 'false',
      }, gEdges);
    });

    D.modules.forEach(function (m) {
      var p = pos.get(m.id);
      if (!p) return;
      var g = el('g', { class: 'node', 'data-id': m.id }, gNodes);
      el('rect', { x: p.x, y: p.y, width: p.w, height: p.h }, g);
      wrap(m.title, 24).slice(0, 2).forEach(function (ln, i) {
        text(g, p.x + 12, p.y + 21 + i * 15, 'title', ln);
      });
      var vio = (violationsByModule.get(m.id) || []).length;
      text(g, p.x + 12, p.y + p.h - 20, 'meta',
        m.loc.toLocaleString('ru') + ' стр · ' + m.fileCount + ' ф' + (vio ? ' · ⚠' + vio : ''));
      el('rect', { x: p.x + 12, y: p.y + p.h - 11, width: p.w - 24, height: 4, rx: 2, class: 'bar-bg' }, g);
      el('rect', { x: p.x + 12, y: p.y + p.h - 11, width: 0, height: 4, rx: 2, class: 'bar' }, g);
      if (focus && focus.id === m.id) g.setAttribute('data-focus', 'true');
      // Selection happens in the svg-level pointerup, not here: panning can start on a card
      // too, so a click is only distinguishable from a drag once the pointer comes back up.
      g.addEventListener('mouseenter', function () { if (!selected) highlight(m.id); });
      g.addEventListener('mouseleave', function () { if (!selected) highlight(null); });
    });

    paintMetric();
    applySearch();
  }

  function wrap(str, max) {
    var words = str.split(' ');
    var lines = [];
    var cur = '';
    words.forEach(function (w) {
      if ((cur + ' ' + w).trim().length > max) { if (cur) lines.push(cur); cur = w; }
      else cur = (cur ? cur + ' ' : '') + w;
    });
    if (cur) lines.push(cur);
    if (lines.length > 2) { lines = [lines[0], clip(lines.slice(1).join(' '), max)]; }
    return lines;
  }

  /** Re-run everything downstream of a filter change. */
  function refresh(keepView) {
    computeVisible();
    computeLayout();
    drawGraph();
    renderFilterBar();
    if (selected) { highlight(selected); renderPanel(selected); }
    if (!keepView) fit();
  }

  /* ------------------------------------------------------------------ metric colouring */

  var metric = 'size';

  function metricValue(m) {
    if (metric === 'size') return { v: m.loc / maxLoc, col: 'var(--accent)' };
    if (metric === 'tests') {
      var ratio = m.loc ? m.testLoc / m.loc : 0;
      return { v: Math.min(1, ratio), col: ratio >= 0.25 ? 'var(--ok)' : ratio > 0 ? 'var(--out)' : 'var(--warn)' };
    }
    if (metric === 'churn') return { v: m.churn / maxChurn, col: 'var(--out)' };
    var n = (violationsByModule.get(m.id) || []).length + (clonesByModule.get(m.id) || []).length;
    return { v: Math.min(1, n / Math.max(maxDebt, 3)), col: n ? 'var(--warn)' : 'var(--line)' };
  }

  function paintMetric() {
    D.modules.forEach(function (m) {
      var g = gNodes.querySelector('[data-id="' + m.id + '"]');
      if (!g) return;
      var bar = g.querySelectorAll('rect')[2];
      var p = pos.get(m.id);
      var mv = metricValue(m);
      bar.setAttribute('width', Math.max(0, Math.round((p.w - 24) * mv.v)));
      bar.setAttribute('fill', mv.col);
    });
  }

  /* ------------------------------------------------------------------ selection & highlight */

  var selected = null;

  function highlight(id) {
    var ins = new Set(), outs = new Set();
    if (id) {
      (inEdges.get(id) || []).forEach(function (e) { ins.add(e.from); });
      (outEdges.get(id) || []).forEach(function (e) { outs.add(e.to); });
    }
    gNodes.querySelectorAll('.node').forEach(function (n) {
      var nid = n.getAttribute('data-id');
      n.removeAttribute('data-rel');
      n.setAttribute('data-sel', String(nid === id));
      if (!id) { n.removeAttribute('data-dim'); return; }
      if (nid === id) n.removeAttribute('data-dim');
      else if (ins.has(nid)) { n.setAttribute('data-rel', 'in'); n.removeAttribute('data-dim'); }
      else if (outs.has(nid)) { n.setAttribute('data-rel', 'out'); n.removeAttribute('data-dim'); }
      else n.setAttribute('data-dim', 'true');
    });
    gEdges.querySelectorAll('.edge').forEach(function (p) {
      p.removeAttribute('data-rel');
      if (!id) { p.removeAttribute('data-dim'); return; }
      var f = p.getAttribute('data-from'), t = p.getAttribute('data-to');
      if (t === id) { p.setAttribute('data-rel', 'in'); p.removeAttribute('data-dim'); }
      else if (f === id) { p.setAttribute('data-rel', 'out'); p.removeAttribute('data-dim'); }
      else p.setAttribute('data-dim', 'true');
    });
    var node = id && gNodes.querySelector('[data-id="' + id + '"]');
    if (node) gNodes.appendChild(node);
  }

  function select(id) {
    selected = id;
    highlight(id);
    renderPanel(id);
    // The page also ships as a published snapshot, where the embedding frame can refuse
    // history writes — a deep link is a nicety, not a reason to break selection.
    try {
      history.replaceState(null, '', id ? '#' + id : location.pathname + location.search);
    } catch (e) { /* opaque origin */ }
  }

  /* ------------------------------------------------------------------ side panel */

  var aside = document.getElementById('panel');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fileLink(path, line) {
    var href = REPO + '/' + path + (line ? '#L' + line : '');
    return '<a class="link path" href="' + href + '" target="_blank" rel="noreferrer">' + esc(path) + '</a>';
  }

  function moduleLink(id) {
    var m = byId.get(id);
    var off = visible.has(id) ? '' : ' off';
    return '<span class="link' + off + '" data-goto="' + id + '">' + esc(m ? m.title : id) + '</span>';
  }

  function renderPanel(id) {
    if (!id) {
      aside.className = 'empty';
      aside.innerHTML =
        '<h3>Как читать</h3>' +
        '<p>Столбцы — слои, слева направо в порядке зависимости: чем правее, тем «глубже» ' +
        'и тем меньше модуль знает об остальном приложении. Полосы сверху — крупные части системы.</p>' +
        '<p>Ткни в квадрат, чтобы увидеть, за что он отвечает, из чего состоит и кто на него ' +
        'опирается. <b>Синие</b> связи входят в выбранный модуль, <b>оранжевые</b> — выходят из него. ' +
        '<b>Красная</b> связь идёт против порядка слоёв: что-то глубокое тянется наверх. ' +
        'Пунктир — импорт только типов.</p>' +
        '<h3>Как убрать лишнее</h3>' +
        '<p>Клик по <b>заголовку слоя</b> сворачивает весь столбец в полоску; клик по полоске ' +
        'разворачивает обратно.</p>' +
        '<p>У выбранного модуля есть <b>«только соседи»</b> — оставить на экране его и то, ' +
        'с чем он связан напрямую (<b>«соседи ×2»</b> — плюс ещё шаг), и <b>«скрыть»</b> для ' +
        'одного квадрата. Поиск умеет оставить только найденное.</p>' +
        '<p>Сколько показано — слева внизу, там же «показать всё». Ссылка на скрытый модуль ' +
        'в этой панели показана тускло и возвращает его на экран по клику. Esc сбрасывает ' +
        'поиск и фокус. Что скрыто, переживает перезагрузку страницы.</p>' +
        '<p>Колесо — масштаб, перетаскивание — панорама, двойной клик по фону — вписать целиком.</p>';
      return;
    }
    var m = byId.get(id);
    var layer = layerById.get(m.layer);
    var group = groupById.get(layer.group);
    var outs = (outEdges.get(id) || []).slice().sort(function (a, b) { return b.weight - a.weight; });
    var ins = (inEdges.get(id) || []).slice().sort(function (a, b) { return b.weight - a.weight; });
    var vios = violationsByModule.get(id) || [];
    var cls = clonesByModule.get(id) || [];
    var focused = focus && focus.id === id;
    var h = [];

    aside.className = '';
    h.push('<h2>' + esc(m.title) + '</h2>');
    h.push('<div class="layer-tag">' + esc(group.title) + ' · ' + esc(layer.title) + '</div>');

    h.push('<div class="actions">' +
      '<button data-act="focus1"' + (focused && focus.depth === 1 ? ' aria-pressed="true"' : '') +
      '>только соседи</button>' +
      '<button data-act="focus2"' + (focused && focus.depth === 2 ? ' aria-pressed="true"' : '') +
      '>соседи ×2</button>' +
      '<button data-act="hide">скрыть</button>' +
      (focus && !focused ? '<button data-act="unfocus">сбросить фокус</button>' : '') +
      '</div>');

    h.push('<p class="owns">' + esc(m.owns) + '</p>');
    m.notes.forEach(function (n) { h.push('<p class="note">' + esc(n) + '</p>'); });
    if (m.tags.length) {
      h.push('<div style="margin-top:10px">' + m.tags.map(function (t) {
        return '<span class="tag">' + esc(t) + '</span>';
      }).join('') + '</div>');
    }

    h.push('<div class="stats">' +
      stat(m.loc.toLocaleString('ru'), 'строк') +
      stat(m.fileCount, 'файлов') +
      stat(m.testCount ? m.testCount : '—', 'тестов') +
      stat(m.churn, 'правок / 6 мес') +
      '</div>');

    if (m.adr.length || m.issues.length) {
      h.push('<h3>Решения</h3><ul class="list">');
      m.adr.forEach(function (a) {
        h.push('<li><a class="link" target="_blank" rel="noreferrer" href="' + REPO +
          '/docs/adr/' + a + '.md">ADR ' + esc(a) + '</a> — ' + esc(D.adr[a] || '') + '</li>');
      });
      m.issues.forEach(function (n) {
        h.push('<li><a class="link" target="_blank" rel="noreferrer" href="' + D.issuesBase + n +
          '">#' + n + '</a> — ' + esc(D.issues[String(n)] || 'без названия в кэше') + '</li>');
      });
      h.push('</ul>');
    }

    if (outs.length) {
      h.push('<h3>Опирается на · ' + outs.length + '</h3><ul class="list">');
      outs.forEach(function (e) {
        h.push('<li><span class="num">' + e.weight + (e.typeOnly ? ' типы' : '') + '</span>' +
          moduleLink(e.to) + '</li>');
      });
      h.push('</ul>');
    }
    if (ins.length) {
      h.push('<h3>На него опираются · ' + ins.length + '</h3><ul class="list">');
      ins.forEach(function (e) {
        h.push('<li><span class="num">' + e.weight + (e.typeOnly ? ' типы' : '') + '</span>' +
          moduleLink(e.from) + '</li>');
      });
      h.push('</ul>');
    }

    if (vios.length) {
      h.push('<h3>Нарушения правил · ' + vios.length + '</h3><ul class="list">');
      vios.forEach(function (v) {
        h.push('<li><span class="tag warn">' + esc(v.rule) + '</span><br>' +
          fileLink(v.from) + ' → ' + fileLink(v.to) + '</li>');
      });
      h.push('</ul>');
    }

    if (cls.length) {
      h.push('<h3>Совпадающие куски · ' + cls.length + '</h3><ul class="list">');
      cls.slice(0, 12).forEach(function (c) {
        h.push('<li><span class="num">' + c.lines + ' стр</span>' +
          fileLink(c.a.path, c.a.startLine) + '<br>' + fileLink(c.b.path, c.b.startLine) + '</li>');
      });
      h.push('</ul>');
    }

    h.push('<h3>Файлы · ' + m.files.length + '</h3><ul class="list">');
    m.files.forEach(function (f) {
      var badge = f.kind === 'test' ? ' <span class="tag">тест</span>' : f.kind === 'style' ? ' <span class="tag">css</span>' : '';
      h.push('<li><span class="num">' + f.loc + '</span>' + fileLink(f.path) + badge + '</li>');
    });
    h.push('</ul>');

    aside.innerHTML = h.join('');
    aside.scrollTop = 0;
    aside.querySelectorAll('[data-goto]').forEach(function (n) {
      n.addEventListener('click', function () {
        var target = n.getAttribute('data-goto');
        if (!visible.has(target)) reveal(target);
        select(target);
        centerOn(target);
      });
    });
    aside.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () { moduleAction(b.getAttribute('data-act'), id); });
    });
  }

  function moduleAction(act, id) {
    if (act === 'hide') {
      hiddenModules.add(id);
      if (focus && focus.id === id) focus = null;
      saveFilter();
      selected = null;
      refresh();
      select(null);
      return;
    }
    if (act === 'unfocus') focus = null;
    else if (act === 'focus1') focus = focus && focus.id === id && focus.depth === 1 ? null : { id: id, depth: 1 };
    else if (act === 'focus2') focus = focus && focus.id === id && focus.depth === 2 ? null : { id: id, depth: 2 };
    refresh();
    if (focus) centerOn(id);
  }

  function stat(v, label) {
    return '<div class="stat"><b>' + v + '</b><span>' + label + '</span></div>';
  }

  /* ------------------------------------------------------------------ filter bar */

  var filterCount = document.getElementById('filter-count');
  var filterKeep = document.getElementById('filter-keep');
  var filterReset = document.getElementById('filter-reset');

  function renderFilterBar() {
    var shown = visible.size;
    var total = D.modules.length;
    filterCount.textContent = 'показано ' + shown + ' из ' + total +
      (focus ? ' · фокус: ' + ((byId.get(focus.id) || {}).title || '') + ' ×' + focus.depth : '');
    filterReset.hidden = shown === total && !focus;
  }

  filterReset.addEventListener('click', resetFilter);
  filterKeep.addEventListener('click', function () {
    var hits = searchHits();
    if (!hits.size) return;
    focus = null;
    hiddenLayers.clear();
    hiddenModules = new Set(D.modules
      .filter(function (m) { return !hits.has(m.id); })
      .map(function (m) { return m.id; }));
    saveFilter();
    refresh();
  });

  /* ------------------------------------------------------------------ pan & zoom */

  var view = { x: 0, y: 0, k: 1 };

  function applyView() {
    gRoot.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
  }

  function fit() {
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var k = Math.min(r.width / canvasW, r.height / canvasH);
    view.k = Math.max(0.12, Math.min(1.4, k));
    view.x = (r.width - canvasW * view.k) / 2;
    view.y = (r.height - canvasH * view.k) / 2;
    applyView();
  }

  function centerOn(id) {
    var p = pos.get(id);
    if (!p) return;
    var r = svg.getBoundingClientRect();
    view.k = Math.max(view.k, 0.55);
    view.x = r.width / 2 - (p.x + p.w / 2) * view.k;
    view.y = r.height / 2 - (p.y + p.h / 2) * view.k;
    applyView();
  }

  svg.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var r = svg.getBoundingClientRect();
    var mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var f = Math.exp(-ev.deltaY * 0.0016);
    var k2 = Math.max(0.08, Math.min(3, view.k * f));
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2;
    applyView();
  }, { passive: false });

  // No setPointerCapture here: capturing retargets the subsequent click at the svg, which is
  // how card clicks got swallowed. Panning listens on the window instead, and a pointerup that
  // never moved is treated as a click on whatever is under it.
  var drag = null;
  svg.addEventListener('pointerdown', function (ev) {
    drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false, target: ev.target };
    svg.classList.add('dragging');
  });
  window.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (!drag.moved) return;
    view.x = drag.vx + dx;
    view.y = drag.vy + dy;
    applyView();
  });
  window.addEventListener('pointerup', function () {
    if (!drag) return;
    var moved = drag.moved;
    var target = drag.target;
    drag = null;
    svg.classList.remove('dragging');
    if (moved || !target || !target.closest) return;

    var strip = target.closest('.strip');
    if (strip) {
      if (strip.getAttribute('data-folded') === 'true') {
        hiddenLayers.delete(strip.getAttribute('data-layer'));
        saveFilter();
      } else {
        focus = null; // the column is empty only because a focus is narrowing the map
      }
      refresh();
      return;
    }
    var head = target.closest('.layer-head');
    if (head) {
      hiddenLayers.add(head.getAttribute('data-layer'));
      saveFilter();
      refresh();
      return;
    }
    var node = target.closest('.node');
    select(node ? node.getAttribute('data-id') : null);
  });
  svg.addEventListener('dblclick', function () { fit(); });

  /* ------------------------------------------------------------------ search */

  var search = document.getElementById('search');

  function searchHits() {
    var q = search.value.trim().toLowerCase();
    var hits = new Set();
    if (!q) return hits;
    D.modules.forEach(function (m) {
      if (m.title.toLowerCase().indexOf(q) >= 0 ||
        m.id.indexOf(q) >= 0 ||
        m.owns.toLowerCase().indexOf(q) >= 0 ||
        m.tags.join(' ').toLowerCase().indexOf(q) >= 0 ||
        m.files.some(function (f) { return f.path.toLowerCase().indexOf(q) >= 0; })) hits.add(m.id);
    });
    return hits;
  }

  function applySearch() {
    var q = search.value.trim();
    var hits = searchHits();
    filterKeep.hidden = !q || !hits.size;
    filterKeep.textContent = 'оставить найденное · ' + hits.size;
    gNodes.querySelectorAll('.node').forEach(function (n) {
      var hit = hits.has(n.getAttribute('data-id'));
      n.setAttribute('data-hit', String(q ? hit : false));
      if (q) n.setAttribute('data-dim', String(!hit));
      else if (!selected) n.removeAttribute('data-dim');
    });
    if (!q && selected) highlight(selected);
  }

  search.addEventListener('input', applySearch);

  document.querySelectorAll('[data-metric]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      metric = btn.getAttribute('data-metric');

  /* ------------------------------------------------------------------ runtime tab (#624)
   *
   * Processes and stores, laid out on a hand-picked grid per zone; zones sharing a `col`
   * stack vertically. Links are curves between node centres — parallel links between the
   * same pair fan out — and the nodes are drawn on top, so a curve's ends tuck under them.
   */

  var CONTRACT = {
    bound: {
      title: 'связан',
      text: 'Одно объявление на канал, компилятор проверяет по нему обе стороны. ' +
        'Переименуешь поле — typecheck упадёт и там, и там.',
    },
    named: {
      title: 'назван',
      text: 'Обе стороны берут тип из shared, но связь «этот маршрут — этот тип» каждая пишет сама. ' +
        'Ошибиться на одной стороне компилятор не помешает.',
    },
    'one-side': {
      title: 'с одной стороны',
      text: 'Тип объявлен только у одной стороны или приведён кастом (as). ' +
        'Расхождение не ловится ничем, кроме падения на живых данных.',
    },
    opaque: {
      title: 'без типа',
      text: 'Байты, текстуры, файлы, чужой API. Компилятор тут не помощник по самой природе канала.',
    },
  };
  var KIND = { process: 'процесс', store: 'хранилище', external: 'внешний сервис' };

  function renderRuntime() {
    var host = document.getElementById('view-runtime');
    var R = D.runtime;
    if (!R) {
      host.innerHTML = '<div class="health"><p class="lede">docs/architecture/runtime.yaml не найден.</p></div>';
      return;
    }
    var nodeById = new Map(R.nodes.map(function (n) { return [n.id, n]; }));
    var linkById = new Map(R.links.map(function (l) { return [l.id, l]; }));

    var CELL_W = 300, CELL_H = 150, NODE_W = 196, NODE_H = 62, PAD = 26, HEAD = 40, GAP_X = 110, GAP_Y = 36;

    // Zones → columns → stacked boxes.
    var cols = [];
    R.zones.forEach(function (z, i) {
      var c = z.col !== undefined ? z.col : i;
      (cols[c] = cols[c] || []).push(z);
    });
    var zoneBox = new Map();
    var x = 20;
    cols.forEach(function (zs) {
      if (!zs) return;
      var y = 20, colW = 0;
      zs.forEach(function (z) {
        var nodes = R.nodes.filter(function (n) { return n.zone === z.id; });
        var nc = 1 + Math.max.apply(null, nodes.map(function (n) { return n.at[0]; }).concat([0]));
        var nr = 1 + Math.max.apply(null, nodes.map(function (n) { return n.at[1]; }).concat([0]));
        var w = nc * CELL_W + PAD * 2 - (CELL_W - NODE_W);
        var h = HEAD + nr * CELL_H + PAD - (CELL_H - NODE_H);
        zoneBox.set(z.id, { x: x, y: y, w: w, h: h, z: z });
        y += h + GAP_Y;
        colW = Math.max(colW, w);
      });
      zs.forEach(function (z) { zoneBox.get(z.id).w = colW; });
      x += colW + GAP_X;
    });
    var W = x - GAP_X + 20;
    var H = 40 + Math.max.apply(null, Array.from(zoneBox.values()).map(function (b) { return b.y + b.h; }));

    var pos = new Map();
    R.nodes.forEach(function (n) {
      var b = zoneBox.get(n.zone);
      var nx = b.x + PAD + n.at[0] * CELL_W;
      var ny = b.y + HEAD + n.at[1] * CELL_H;
      pos.set(n.id, { x: nx, y: ny, cx: nx + NODE_W / 2, cy: ny + NODE_H / 2 });
    });

    host.innerHTML =
      '<div class="rt-wrap">' +
      '<div class="rt-canvas"><div class="rt-legend"></div><svg id="rt-svg"></svg></div>' +
      '<aside class="rt-panel"></aside></div>';
    var legend = host.querySelector('.rt-legend');
    legend.innerHTML = Object.keys(CONTRACT).map(function (k) {
      return '<span class="rt-key" data-contract="' + k + '"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" /></svg>' +
        esc(CONTRACT[k].title) + '</span>';
    }).join('') + '<span class="rt-key-note">цвет и штрих линии — сила контракта</span>';

    var s = host.querySelector('#rt-svg');
    s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    // Fit the width of the pane; never blow up past natural size on a wide screen.
    s.style.maxWidth = W + 'px';

    zoneBox.forEach(function (b) {
      var g = el('g', { class: 'rt-zone' }, s);
      el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 14 }, g);
      text(g, b.x + 16, b.y + 22, 'rt-zone-title', b.z.title);
      if (b.z.note) tip(g, b.z.note);
    });

    // Parallel links between the same pair fan out around the straight line.
    var pairCount = new Map(), pairSeen = new Map();
    R.links.forEach(function (l) {
      var k = [l.from, l.to].sort().join('|');
      pairCount.set(k, (pairCount.get(k) || 0) + 1);
    });
    var gLinks = el('g', {}, s);
    var gNodesRt = el('g', {}, s);
    // Labels go on top of the nodes: between neighbours the midpoint can sit on a box's edge.
    var gLabels = el('g', {}, s);
    R.links.forEach(function (l) {
      var a = pos.get(l.from), b = pos.get(l.to);
      var k = [l.from, l.to].sort().join('|');
      var i = pairSeen.get(k) || 0;
      pairSeen.set(k, i + 1);
      var off = (i - (pairCount.get(k) - 1) / 2) * 58 + (l.bend || 0);
      var dx = b.cx - a.cx, dy = b.cy - a.cy, len = Math.hypot(dx, dy) || 1;
      // Keep the normal pointing the same way whichever end is `from`, so a fan stays a fan.
      var sign = l.from < l.to ? 1 : -1;
      var nx = (-dy / len) * sign, ny = (dx / len) * sign;
      var mx = (a.cx + b.cx) / 2 + nx * off * 2, my = (a.cy + b.cy) / 2 + ny * off * 2;
      var g = el('g', { class: 'rt-link', 'data-id': l.id, 'data-contract': l.contract }, gLinks);
      var d = 'M' + a.cx + ',' + a.cy + ' Q' + mx + ',' + my + ' ' + b.cx + ',' + b.cy;
      el('path', { d: d, class: 'rt-hit' }, g);
      el('path', { d: d, class: 'rt-line' }, g);
      // Midpoint of the quadratic curve.
      var lx = 0.25 * a.cx + 0.5 * mx + 0.25 * b.cx, ly = 0.25 * a.cy + 0.5 * my + 0.25 * b.cy;
      var label = el('g', { class: 'rt-label', 'data-id': l.id, 'data-contract': l.contract }, gLabels);
      var t = text(label, lx, ly + 4, 'rt-label-text', clip(l.summary, 34));
      t.setAttribute('text-anchor', 'middle');
      var tw = Math.min(l.summary.length, 34) * 6.3 + 18;
      label.insertBefore(el('rect', { x: lx - tw / 2, y: ly - 10, width: tw, height: 20, rx: 10 }), t);
      tip(label, l.channel + ' · ' + l.messages.length + ' сообщ.');
    });

    R.nodes.forEach(function (n) {
      var p = pos.get(n.id);
      var g = el('g', { class: 'rt-node', 'data-id': n.id, 'data-kind': n.kind }, gNodesRt);
      el('rect', { x: p.x, y: p.y, width: NODE_W, height: NODE_H, rx: n.kind === 'store' ? 4 : 11 }, g);
      if (n.kind === 'store') el('line', { x1: p.x, y1: p.y + 7, x2: p.x + NODE_W, y2: p.y + 7, class: 'rt-store-lid' }, g);
      text(g, p.x + 14, p.y + 28, 'rt-node-title', clip(n.title, 24));
      text(g, p.x + 14, p.y + 46, 'rt-node-kind', KIND[n.kind] || n.kind);
    });

    var panel = host.querySelector('.rt-panel');
    var selected = null; // { type: 'node' | 'link', id }

    function linkify(str) {
      return esc(str).replace(/#(\d{2,4})/g, function (_, n) {
        var title = D.issues && D.issues[n];
        return '<a class="link" target="_blank" rel="noreferrer" href="' + D.issuesBase + n + '">#' + n +
          (title ? ' (' + esc(title) + ')' : '') + '</a>';
      });
    }

    function badge(c) {
      return '<span class="rt-badge" data-contract="' + c + '">' + esc(CONTRACT[c].title) + '</span>';
    }

    function linkRow(l, fromId) {
      var other = l.from === fromId ? l.to : l.from;
      return '<li><span class="link" data-rt-link="' + l.id + '">' + esc(l.channel) + '</span> ' + badge(l.contract) +
        '<br><span class="num">' + (l.from === fromId ? '→ ' : '← ') + esc(nodeById.get(other).title) + ' · ' +
        l.messages.length + ' сообщ.</span></li>';
    }

    function renderRtPanel() {
      var h = [];
      if (!selected) {
        h.push('<h2>Исполнение</h2><p class="owns">Что живёт, когда программа запущена, и что эти части шлют друг другу. ' +
          'Вкладка «Структура» отвечает на вопрос «кто кого импортирует»; здесь вопрос другой — клиент и сервер ' +
          'друг друга не импортируют, но разговаривают весь урок.</p>');
        h.push('<h3>Как читать</h3><ul class="list">' +
          '<li><b>Прямоугольник</b> — процесс: код, который выполняется.</li>' +
          '<li><b>С крышкой</b> — хранилище: данные лежат, пока их не спросят.</li>' +
          '<li><b>Пунктирная рамка</b> — чужая система.</li>' +
          '<li><b>Линия</b> — канал. Подпись на ней — главные типы, которые по нему ходят. Клик — полный список ' +
          'сообщений с направлением и типом.</li></ul>');
        h.push('<h3>Сила контракта</h3>');
        Object.keys(CONTRACT).forEach(function (k) {
          h.push('<p class="note">' + badge(k) + ' ' + esc(CONTRACT[k].text) + '</p>');
        });
        h.push('<p class="owns" style="color:var(--ink-2)">Проверка в рантайме — отдельная ось. Даже «связан» значит ' +
          'только проверку при компиляции: пришедший по сети пакет с типом никто не сверяет, кроме пары ' +
          'мест — они помечены в сообщениях.</p>');
        h.push('<h3>Все каналы</h3><ul class="list">');
        var order = ['bound', 'named', 'one-side', 'opaque'];
        R.links.slice().sort(function (a, b) { return order.indexOf(a.contract) - order.indexOf(b.contract); })
          .forEach(function (l) {
            h.push('<li><span class="link" data-rt-link="' + l.id + '">' + esc(nodeById.get(l.from).title) + ' — ' +
              esc(nodeById.get(l.to).title) + '</span> ' + badge(l.contract) + '<br><span class="num">' +
              esc(l.channel) + '</span></li>');
          });
        h.push('</ul>');
      } else if (selected.type === 'node') {
        var n = nodeById.get(selected.id);
        var z = zoneBox.get(n.zone).z;
        h.push('<h2>' + esc(n.title) + '</h2><span class="layer-tag">' + esc(KIND[n.kind]) + ' · ' + esc(z.title) + '</span>');
        h.push('<p class="owns">' + linkify(n.owns) + '</p>');
        if (n.modules && n.modules.length) {
          h.push('<h3>Из каких модулей собран</h3><ul class="list">');
          n.modules.forEach(function (id) {
            h.push('<li><span class="link" data-jump="' + id + '">' + esc((byId.get(id) || {}).title || id) + '</span></li>');
          });
          h.push('</ul>');
        }
        var mine = R.links.filter(function (l) { return l.from === n.id || l.to === n.id; });
        h.push('<h3>Каналы · ' + mine.length + '</h3><ul class="list">');
        mine.forEach(function (l) { h.push(linkRow(l, n.id)); });
        h.push('</ul>');
      } else {
        var l = linkById.get(selected.id);
        var from = nodeById.get(l.from), to = nodeById.get(l.to);
        h.push('<h2>' + esc(l.channel) + '</h2><span class="layer-tag"><span class="link" data-rt-node="' + from.id + '">' +
          esc(from.title) + '</span> ⇄ <span class="link" data-rt-node="' + to.id + '">' + esc(to.title) + '</span></span>');
        h.push('<p class="note">' + badge(l.contract) + ' ' + esc(CONTRACT[l.contract].text) + '</p>');
        if (l.note) h.push('<p class="owns">' + linkify(l.note) + '</p>');
        h.push('<h3>Сообщения · ' + l.messages.length + '</h3><table class="rt-msgs"><tbody>');
        l.messages.forEach(function (m) {
          var target = m.dir === '→' ? to.title : from.title;
          h.push('<tr><td class="rt-dir" title="к: ' + esc(target) + '">' + m.dir + '</td><td><code>' + esc(m.name) +
            '</code><div class="rt-type">' + esc(m.type) + '</div>' +
            (m.note ? '<div class="rt-mnote">' + linkify(m.note) + '</div>' : '') +
            (m.runtime ? '<div class="rt-runtime">в рантайме: ' + esc(m.runtime) + '</div>' : '') +
            '</td></tr>');
        });
        h.push('</tbody></table><p class="num" style="float:none">→ от «' + esc(from.title) + '» к «' + esc(to.title) +
          '», ← обратно.</p>');
      }
      if (selected) h.unshift('<p><span class="link" data-rt-clear>← как читать эту вкладку</span></p>');
      panel.innerHTML = h.join('');
      panel.querySelectorAll('[data-rt-link]').forEach(function (e) {
        e.addEventListener('click', function () { select({ type: 'link', id: e.getAttribute('data-rt-link') }); });
      });
      panel.querySelectorAll('[data-rt-node]').forEach(function (e) {
        e.addEventListener('click', function () { select({ type: 'node', id: e.getAttribute('data-rt-node') }); });
      });
      panel.querySelectorAll('[data-rt-clear]').forEach(function (e) {
        e.addEventListener('click', function () { select(null); });
      });
      wireJumps(panel);
    }

    function select(sel) {
      selected = sel;
      var liveNodes = new Set(), liveLinks = new Set();
      if (sel && sel.type === 'node') {
        liveNodes.add(sel.id);
        R.links.forEach(function (l) {
          if (l.from === sel.id || l.to === sel.id) { liveLinks.add(l.id); liveNodes.add(l.from); liveNodes.add(l.to); }
        });
      } else if (sel) {
        var l = linkById.get(sel.id);
        liveLinks.add(l.id); liveNodes.add(l.from); liveNodes.add(l.to);
      }
      s.querySelectorAll('.rt-node').forEach(function (e) {
        var id = e.getAttribute('data-id');
        e.setAttribute('data-dim', String(!!sel && !liveNodes.has(id)));
        e.setAttribute('data-sel', String(!!sel && sel.type === 'node' && sel.id === id));
      });
      s.querySelectorAll('.rt-link, .rt-label').forEach(function (e) {
        var id = e.getAttribute('data-id');
        e.setAttribute('data-dim', String(!!sel && !liveLinks.has(id)));
        e.setAttribute('data-sel', String(!!sel && sel.type === 'link' && sel.id === id));
      });
      renderRtPanel();
    }

    s.addEventListener('click', function (ev) {
      var hit = ev.target.closest('.rt-node, .rt-link, .rt-label');
      if (!hit) return select(null);
      var id = hit.getAttribute('data-id');
      select({ type: hit.classList.contains('rt-node') ? 'node' : 'link', id: id });
    });
    select(null);
  }

  /* ------------------------------------------------------------------ health tab */

    h.push('</tbody></table>');

    if (D.health.orphans.length) {
      h.push('<h3>Ни на что не ссылаются · ' + D.health.orphans.length + '</h3>' +
        '<p class="lede">Либо точка входа, либо мёртвый код.</p><table><tbody>');
      D.health.orphans.forEach(function (p) { h.push('<tr><td>' + fileLink(p) + '</td></tr>'); });
      h.push('</tbody></table>');
    }

    h.push('</div>');
    host.innerHTML = h.join('');
    wireJumps(host);
  }

  /* ------------------------------------------------------------------ boot */

  loadFilter();
  computeVisible();
  computeLayout();
  drawGraph();
  renderFilterBar();
  renderFlows();
  renderRuntime();
  renderHealth();
  renderPanel(null);
  fit();
  window.addEventListener('resize', function () { if (!selected) fit(); });

  var hash = location.hash.slice(1);
  if (hash && byId.has(hash)) {
    if (!visible.has(hash)) reveal(hash);
    select(hash);
    centerOn(hash);
  }
})();
</script>
