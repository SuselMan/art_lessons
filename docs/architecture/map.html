<meta charset="utf-8" />
<title>Grafetto — карта архитектуры</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>:root {
  --hl-k: #8a3fd1;
  --hl-s: #2f7d4f;
  --hl-c: #8a857c;
  --hl-t: #b25b00;
  --hl-b: #1f6fc4;
  --hl-p: #1b1a18;
  --hl-n: #c2410c;
  --bg: #f6f5f2;
  --panel: #ffffff;
  --panel-2: #fbfaf8;
  --ink: #1b1a18;
  --ink-2: #55524c;
  --ink-3: #8a857c;
  --line: #ddd9d1;
  --line-2: #ebe7df;
  --accent: #7b5cff;
  --in: #1f7ae0;
  --out: #d97706;
  --warn: #d2453c;
  --ok: #2f8f5b;
  --card: #ffffff;
  --card-hover: #f2eeff;
  --shadow: 0 1px 2px rgba(20, 18, 14, 0.08), 0 8px 24px rgba(20, 18, 14, 0.06);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --hl-k: #c792ea;
    --hl-s: #9ece6a;
    --hl-c: #7e786f;
    --hl-t: #f0a63d;
    --hl-b: #5fa8f5;
    --hl-p: #ece9e3;
    --hl-n: #ff9e64;
    --bg: #16151a;
    --panel: #1e1d24;
    --panel-2: #23222a;
    --ink: #ece9e3;
    --ink-2: #b3aea5;
    --ink-3: #7e786f;
    --line: #34323c;
    --line-2: #2a2933;
    --accent: #a691ff;
    --in: #5fa8f5;
    --out: #f0a63d;
    --warn: #ef6f66;
    --ok: #55c288;
    --card: #24232c;
    --card-hover: #302c46;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --hl-k: #c792ea;
  --hl-s: #9ece6a;
  --hl-c: #7e786f;
  --hl-t: #f0a63d;
  --hl-b: #5fa8f5;
  --hl-p: #ece9e3;
  --hl-n: #ff9e64;
  --bg: #16151a;
  --panel: #1e1d24;
  --panel-2: #23222a;
  --ink: #ece9e3;
  --ink-2: #b3aea5;
  --ink-3: #7e786f;
  --line: #34323c;
  --line-2: #2a2933;
  --accent: #a691ff;
  --in: #5fa8f5;
  --out: #f0a63d;
  --warn: #ef6f66;
  --ok: #55c288;
  --card: #24232c;
  --card-hover: #302c46;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------- top bar ---------- */

header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex: none;
  flex-wrap: wrap;
}

.brand { font-weight: 620; letter-spacing: -0.01em; font-size: 15px; }
.stamp { color: var(--ink-3); font: 11px/1.4 var(--mono); }

.tabs { display: flex; gap: 2px; background: var(--panel-2); border-radius: 9px; padding: 3px; }
.tabs button {
  border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 5px 12px; border-radius: 7px; cursor: pointer;
}
.tabs button[aria-selected='true'] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.spacer { flex: 1; }

input[type='search'] {
  width: 230px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 13px;
}
input[type='search']:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; user-select: none;
}
.chip[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- layout ---------- */

main { flex: 1; display: flex; min-height: 0; }
.view { flex: 1; min-width: 0; position: relative; display: none; }
.view[data-active='true'] { display: block; }

#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph.dragging { cursor: grabbing; }

.hint {
  position: absolute; left: 14px; bottom: 12px; color: var(--ink-3);
  font-size: 11px; pointer-events: none; background: var(--bg); padding: 2px 6px; border-radius: 6px;
}

/* Sits above the hint: how much of the map is currently hidden, and the way back. */
.filters {
  position: absolute; left: 14px; bottom: 36px; display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 6px 5px 13px; box-shadow: var(--shadow); font-size: 12px; color: var(--ink-2);
}
.filters .chip { padding: 3px 10px; }
.filters .chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- svg pieces ---------- */

.band { fill: var(--panel-2); stroke: var(--line-2); }
.band-title { fill: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.09em; text-transform: uppercase; }
.layer-title { fill: var(--ink-2); font: 600 12px var(--sans); pointer-events: none; }

.layer-head { cursor: pointer; }
.layer-head-hit { fill: transparent; }
.layer-head:hover .layer-head-hit { fill: var(--card-hover); }
.layer-head:hover .layer-title { fill: var(--accent); }

/* A folded column: narrow enough to ignore, wide enough to click back open. */
.strip { cursor: pointer; }
.strip rect { fill: var(--card); stroke: var(--line); stroke-dasharray: 3 3; }
.strip:hover rect { fill: var(--card-hover); stroke: var(--accent); stroke-dasharray: none; }
.strip-title { fill: var(--ink-3); font: 600 11px var(--sans); }
.strip:hover .strip-title { fill: var(--accent); }

.node rect { fill: var(--card); stroke: var(--line); stroke-width: 1; rx: 9; }
.node .title { fill: var(--ink); font: 600 12.5px var(--sans); }
.node .meta { fill: var(--ink-3); font: 11px var(--mono); }
.node .summary { fill: var(--ink-2); font: 12px var(--sans); }

/* (#642) The module's folder, its place in the folder tree, and the map's own groups. */
aside .h-summary { font-weight: 400; color: var(--ink-2); }
aside .tree { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }
aside .map-only {
  margin: 0 0 8px; padding: 7px 10px; font-size: 12.5px; color: var(--ink-2);
  border: 1px dashed var(--line); border-radius: 6px;
}
aside .map-only-tag { border-style: dashed; }
aside details.grouping { border: 1px dashed var(--line); border-radius: 8px; margin: 6px 0; padding: 6px 10px; }
aside details.grouping[data-target='true'] { border-color: var(--accent); border-style: solid; }
aside details.grouping summary { cursor: pointer; font-size: 13px; }
aside details.grouping summary .num { float: right; }
aside .grouping-body { margin-top: 4px; }
aside .grouping-body .gid { font: 11px var(--mono); color: var(--ink-3); }
/* (#639) The metrics row: plain grey unless a value asks for attention. */
.node .metrics { font: 11px var(--sans); }
.node .metrics .sep { fill: var(--ink-3); }
.node .metrics .mv { fill: var(--ink-2); }
.node .metrics .mv[data-level='ok'] { fill: var(--ok); }
.node .metrics .mv[data-level='warn'] { fill: var(--out); }
.node .metrics .mv[data-level='bad'] { fill: var(--warn); font-weight: 600; }
.node { cursor: pointer; }
.node:hover rect { fill: var(--card-hover); stroke: var(--accent); }
.node[data-sel='true'] rect { stroke: var(--accent); stroke-width: 2.5; }
.node[data-rel='in'] rect { stroke: var(--in); stroke-width: 2; }
.node[data-rel='out'] rect { stroke: var(--out); stroke-width: 2; }
.node[data-dim='true'] { opacity: 0.24; }
.node[data-hit='true'] rect { fill: var(--card-hover); stroke: var(--accent); stroke-dasharray: 4 3; }
.node[data-focus='true'] rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 3; }

.edge { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-opacity: 0.55; marker-end: url(#arr-base); }
.edge[data-back='true'] { stroke: var(--warn); stroke-opacity: 0.5; marker-end: url(#arr-back); }
.edge[data-type='true'] { stroke-dasharray: 3 4; }
.edge[data-rel='in'] { stroke: var(--in); stroke-width: 2; stroke-opacity: 1; marker-end: url(#arr-in); }
.edge[data-rel='out'] { stroke: var(--out); stroke-width: 2; stroke-opacity: 1; marker-end: url(#arr-out); }
.arrow-base { fill: var(--line); fill-opacity: 0.8; }
.arrow-back { fill: var(--warn); }
.arrow-in { fill: var(--in); }
.arrow-out { fill: var(--out); }
.edge[data-dim='true'] { stroke-opacity: 0.07; marker-end: none; }

/* ---------- side panel ---------- */

aside {
  width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 16px 18px 40px;
}
aside.empty { color: var(--ink-3); }
aside h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
aside h3 {
  margin: 22px 0 8px; font: 600 11px var(--sans); letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-3);
}
aside .layer-tag { color: var(--ink-3); font-size: 12px; }
aside .owns { margin: 10px 0 0; color: var(--ink); }
aside .note {
  margin: 6px 0 0; padding: 8px 10px; background: var(--panel-2);
  border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--ink-2);
}

.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.actions button {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer;
}
.actions button:hover { border-color: var(--accent); color: var(--accent); }
.actions button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 7px 9px; }
.stat b { display: block; font-size: 16px; font-weight: 620; }
.stat span { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.03em; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 4px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.list li:last-child { border-bottom: 0; }
.path { font: 11.5px var(--mono); color: var(--ink-2); word-break: break-all; }
.num { color: var(--ink-3); font: 11px var(--mono); float: right; margin-left: 8px; }

.link { color: var(--accent); cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }
a.link { color: var(--accent); }
/* A dependency that is currently filtered off the map — clicking it brings it back. */
.link.off { color: var(--ink-3); text-decoration: underline dotted; }
.link.off:hover { color: var(--accent); }

.tag {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); margin: 0 4px 4px 0;
}
.tag.warn { border-color: var(--warn); color: var(--warn); }
.tag.ok { border-color: var(--ok); color: var(--ok); }

/* ---------- flows ---------- */

.flow-wrap { height: 100%; overflow: auto; padding: 22px 26px 60px; }
.flow-wrap h2 { margin: 0 0 4px; font-size: 19px; }
.flow-wrap .intro { color: var(--ink-2); max-width: 70ch; margin: 0 0 20px; }
.flow { margin-bottom: 42px; }
.steps { display: flex; flex-direction: column; gap: 0; max-width: 900px; }
.step { display: flex; gap: 14px; }
.step .rail { width: 22px; flex: none; display: flex; flex-direction: column; align-items: center; }
.step .dot {
  width: 11px; height: 11px; border-radius: 50%; background: var(--accent);
  margin-top: 15px; flex: none; box-shadow: 0 0 0 3px var(--bg);
}
.step[data-side='server'] .dot { background: var(--out); }
.step[data-side='wire'] .dot { background: var(--in); }
.step .stem { flex: 1; width: 2px; background: var(--line); }
.step:last-child .stem { background: none; }
.step .body {
  flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 10px;
}
.step .body h4 { margin: 0 0 4px; font-size: 14px; }
.step .body p { margin: 0; color: var(--ink-2); font-size: 13px; }
.step .body .where { margin-top: 7px; font-size: 12px; }

/* ---------- runtime (#624) ---------- */

/* Contract strength, strongest first: one colour + one dash pattern per level, so the
   legend reads in greyscale too. */
[data-contract='bound'] { --c: var(--ok); --dash: none; }
[data-contract='named'] { --c: var(--in); --dash: 10 4; }
[data-contract='one-side'] { --c: var(--out); --dash: 5 5; }
[data-contract='opaque'] { --c: var(--ink-3); --dash: 1.5 5; }

.rt-wrap { display: flex; height: 100%; }
.rt-canvas { flex: 1; min-width: 0; overflow: auto; padding: 0 0 30px; }
#rt-svg { display: block; width: 100%; height: auto; }
.rt-legend {
  position: sticky; top: 0; left: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line-2); font-size: 12.5px;
}
.rt-key { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.rt-key line { stroke: var(--c); stroke-width: 3; stroke-dasharray: var(--dash); stroke-linecap: round; }
.rt-key-note { color: var(--ink-3); font-size: 11.5px; }

.rt-zone rect { fill: var(--panel-2); stroke: var(--line-2); }
.rt-zone-title { fill: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.09em; text-transform: uppercase; }

.rt-link { cursor: pointer; }
.rt-link .rt-hit { fill: none; stroke: transparent; stroke-width: 14; }
.rt-link .rt-line {
  fill: none; stroke: var(--c); stroke-width: 2; stroke-dasharray: var(--dash); stroke-linecap: round; opacity: 0.8;
}
.rt-link:hover .rt-line, .rt-link[data-sel='true'] .rt-line { stroke-width: 3.5; opacity: 1; }
.rt-link[data-dim='true'] .rt-line { opacity: 0.12; }

.rt-label { cursor: pointer; }
.rt-label rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.2; }
.rt-label-text { fill: var(--ink-2); font: 11px var(--mono); }
.rt-label:hover rect, .rt-label[data-sel='true'] rect { stroke-width: 2.4; }
.rt-label[data-dim='true'] { opacity: 0.18; }

.rt-node { cursor: pointer; }
.rt-node rect { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.rt-node[data-kind='external'] rect { stroke-dasharray: 5 4; fill: var(--panel-2); }
.rt-node .rt-store-lid { stroke: var(--line); stroke-width: 1.2; }
.rt-node:hover rect { fill: var(--card-hover); stroke: var(--accent); }
.rt-node[data-sel='true'] rect { stroke: var(--accent); stroke-width: 2.5; }
.rt-node[data-dim='true'] { opacity: 0.3; }
.rt-node-title { fill: var(--ink); font: 600 13px var(--sans); }
.rt-node-kind { fill: var(--ink-3); font: 11px var(--sans); }

.rt-panel {
  width: 380px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 16px 18px 40px;
}
.rt-panel h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
.rt-panel h3 {
  margin: 22px 0 8px; font: 600 11px var(--sans); letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-3);
}
.rt-panel .layer-tag { color: var(--ink-3); font-size: 12px; }
.rt-panel .owns { margin: 10px 0 0; }
.rt-panel .note {
  margin: 8px 0 0; padding: 8px 10px; background: var(--panel-2);
  border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--ink-2);
}
.rt-badge {
  display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; white-space: nowrap;
  border: 1.5px solid var(--c); color: var(--c); font-weight: 600;
}
.rt-msgs { table-layout: fixed; }
.rt-msgs td { font-size: 12.5px; overflow-wrap: anywhere; }
.rt-msgs code { font: 12px var(--mono); color: var(--ink); }
.rt-dir { width: 22px; color: var(--ink-3); font-size: 15px; }
.rt-type { font: 11.5px var(--mono); color: var(--accent); margin-top: 2px; }
.rt-mnote { color: var(--ink-2); margin-top: 2px; }
.rt-runtime { color: var(--ink-2); margin-top: 3px; font-size: 12px; padding-left: 8px; border-left: 2px solid var(--out); }

/* ---------- health ---------- */

.health { height: 100%; overflow: auto; padding: 22px 26px 60px; }
.health h2 { margin: 0 0 6px; font-size: 19px; }
.health h3 { margin: 28px 0 8px; font-size: 14px; }
.health p.lede { color: var(--ink-2); max-width: 78ch; margin: 0 0 6px; }
table { border-collapse: collapse; width: 100%; max-width: 1100px; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { color: var(--ink-3); font: 600 11px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; }
td.r, th.r { text-align: right; }
.empty-note { color: var(--ok); }

/* ---------- understanding (#628) ---------- */

.und-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; max-width: 1100px; margin: 16px 0 6px; }
.und-tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.und-tile.code { border-style: dashed; }
.und-tile span { display: block; font-size: 12px; color: var(--ink-2); }
.und-tile b { display: block; font-size: 24px; font-weight: 620; letter-spacing: -0.02em; margin: 2px 0 6px; }
.und-tile em { display: block; font-style: normal; font-size: 11px; color: var(--ink-3); margin-top: 5px; }
.und-bar { height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.und-bar i { display: block; height: 100%; background: var(--ok); }

.und-status {
  display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; white-space: nowrap;
  border: 1.5px solid var(--st); color: var(--st); font-weight: 600;
}
.und-status.s0 { --st: var(--ink-3); }
.und-status.s1 { --st: var(--out); }
.und-status.s2 { --st: var(--in); }
.und-status.s3 { --st: var(--ok); }

.und-next { list-style: none; padding: 0; margin: 0; max-width: 900px; }
.und-next li { padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.und-tree { list-style: none; margin: 0; padding-left: 0; max-width: 980px; }
.und-tree .und-tree { padding-left: 22px; border-left: 1px solid var(--line); margin-left: 6px; }
.und-tree li { padding: 7px 0 3px; }
.und-why { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; max-width: 80ch; }
.und-refs { font-size: 12px; margin-top: 3px; color: var(--ink-3); }

/* ---------- symbols (#632) ---------- */

.sym {
  cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px;
  text-decoration-color: color-mix(in srgb, currentColor 55%, transparent);
}
.sym:hover { color: var(--accent); text-decoration-style: solid; }
.sym-pop {
  position: fixed; z-index: 50; overflow: auto; padding: 12px 14px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.sym-pop[hidden] { display: none; }
.sym-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin: 4px 28px 6px 0; font-size: 14px; }
.sym-head .tag { margin: 0; }
.sym-pop pre {
  margin: 0 0 10px; padding: 10px 12px; background: var(--panel-2); border-radius: 8px;
  font: 12px/1.5 var(--mono); color: var(--ink); overflow-x: auto; white-space: pre;
}
.sym-pop pre .sym { text-decoration-color: color-mix(in srgb, currentColor 60%, transparent); }
.hl-k { color: var(--hl-k); }
.hl-s { color: var(--hl-s); }
.hl-c { color: var(--hl-c); font-style: italic; }
.hl-t { color: var(--hl-t); }
.hl-b { color: var(--hl-b); }
.hl-p { color: var(--hl-p); }
.hl-n { color: var(--hl-n); }
.hl-a { color: var(--hl-k); }
.sym-many { margin: 0 28px 8px 0; font-size: 12.5px; color: var(--ink-2); }
.sym-close {
  position: sticky; float: right; top: 0; border: 0; background: none; color: var(--ink-3);
  font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px;
}
.sym-close:hover { color: var(--accent); }

/* (#639) Metrics switch: off by default, the cards show only what the structure is. */

нос в папку.","adr":["001-layer-panel-dnd"],"issues":[],"notes":["Правило «папка не может стать своим потомком» проверяется в applyMove, то есть при реплее, а не только в обработчике перетаскивания: операции сворачивает каждый клиент, и цикл повесил бы всю комнату разом."],"tags":["слои","dnd"],"loc":2066,"fileCount":9,"churn":121},{"id":"ui-color","title":"Цвет","owns":"Всё, чем цвет инструмента показывается и меняется: колодец (кружок, у которого кольцо — обводка, а ядро — заливка), поповер вокруг него, сам пикер во всех режимах и палитра комнаты, общая для участников.","adr":[],"issues":[542],"notes":["Колодец — один глиф на все места, где показывается цвет: закреплённый в шапке рейла, центр плавающей панели, оба кружка внутри самого поповера. До #542 их было три разных, и следующий цветной инструмент завёл бы четвёртый.","Кольцо колодца — индикатор, а не мишень: оно 7-8px, а плавающая панель рассчитана на палец. Переключение обводки и заливки живёт в поповере и в радиальном веере панели, где элементы 40px, и никогда не требует попасть в полосу."],"tags":["цвет"],"loc":1106,"fileCount":14,"churn":64},{"id":"ui-tool-panel","title":"Плавающая панель и контролы","owns":"Плавающая панель инструментов со слотами и её выпадашки, плюс переиспользуемые контролы параметров: точный ползунок, радиальный диск, числовое поле, выбор из вариантов.","adr":[],"issues":[],"notes":["Панель по умолчанию скрыта: для проверки мышью нужен `al_floating_panel='always'`, для настоящего касания — планшет с минимальным UI.","ToolGroupButton (#544) — кнопка рейки, за которой лежит группа инструментов: тап берёт текущий, повторный тап или удержание открывают тот же список, что и выбор мягкости карандаша. Сам вид кнопки приходит классом из Room.module.css — рейка задаёт, как выглядят её кнопки, и эта не должна отличаться от соседних."],"tags":["инструменты","планшет"],"loc":2500,"fileCount":19,"churn":129},{"id":"ui-chrome","title":"Общая обвязка интерфейса","owns":"Всё, что не про рисование: ":"apps/web/src/engine/src/export","title":"engine/src/export","summary":"экспорт и миниатюра","parent":"apps/web/src/engine/src","children":[],"groupings":[],"layer":"engine-internals","owns":"`Exporter` (#494, вынесен из `PencilEngine`) собирает «весь рисунок» — лист ограниченной комнаты или прямоугольник содержимого бесконечной — в отдельный буфер 1 мировая единица = 1 пиксель, доводит его прозрачным проходом или бумагой движка и отдаёт PNG; миниатюра комнаты — та же сборка плюс цепочка уменьшения вдвое на GPU и WebP. Движок зовёт его через узкий `ExporterContext`.","adr":["015-class-mode"],"issues":[494],"notes":["Экспорт рисует теми же `_drawCompositeItem`/`_drawTileComposite`, что и экран, только со своим `exactFrame` (`raster/cameraFrame.ts`). До #494 он временно подменял камеру и центр/масштаб композита движка и восстанавливал их в `finally` — `CameraFrame` это убрал.","DOM сюда не заходит: кодирование пикселей в Blob (`document.createElement('canvas')`, `toBlob`) и снимок видимого канваса приходят функциями контекста. Тесты движка идут без DOM, а `tsc` такое не ловит.","Проход бумаги (`PAPER_COMPOSE_FRAG`) остаётся в движке: и программа, и текстура бумаги общие с экранным проходом, отсюда он зовётся как `composePaper`. Одна программа на оба пути — то, что не даёт экспорту и экрану разойтись (#301).","MockGL не растеризует ни бумагу, ни прозрачный проход, поэтому тесты движка проверяют сырые пиксели `buildContentComposite` (`index.tiledExport.test.ts`, `index.bakePreview.test.ts`)."],"tags":["экспорт","webgl1"],"loc":342,"testLoc":0,"styleLoc":0,"fileCount":1,"testCount":0,"churn":1,"files":[{"path":"apps/web/src/engine/src/export/Exporter.ts","loc":342,"kind":"code","in":1,"out":5,"churn":1}]},{"id":"apps/web/src/engine/src/filters","title":"engine/src/filters","summary":"фильтры слоя","parent":"apps/web/src/engine/src","children":[],"groupings":[],"layer":"engine-internals","owns":"Арифметика пяти фильтров слоя — размытия, тон/насыщенность, кривые, цветовой баланс — на CPU, целочисленно и без тригонометрии: фильтр пересчитывает каждый участник, и число должно совпасть на любом устройстве.","adr":["014-layer-filters"],"issues":[574],"notes":["Слой фильтруется по тайлам, каждый — с полем шириной в радиус действия фильтра; поэтому результат не зависит от того, где у клиента прошла сетка тайлов. layerFilters.test.ts проверяет это побайтно — сломать это свойство значит разойтись с остальными участниками."],"tags":["фильтры","детерминизм"],"loc":794,"testLoc":276,"styleLoc":0,"fileCount":2,"testCount":1,"churn":3,"files":[{"path":"apps/web/src/engine/src/filters/layerFilters.ts","loc":586,"kind":"code","in":2,"out":0,"churn":1},{"path":"apps/web/src/engine/src/filters/layerFilters.test.ts","loc":276,"kind":"test","in":0,"out":0,"churn":1},{"path":"apps/web/src/engine/src/filters/FilterPass.ts","loc":208,"kind":"code","in":1,"out":8,"churn":1}]},{"id":"apps/web/src/engine/src/input","title":"engine/src/input","summary":"указатель и линейка","parent":"apps/web/src/engine/src","children":[],"groupings":[],"layer":"engine-internals","owns":"Приём событий указателя: нажим, скорость по часам сэмпла, наклон, аналитический перевод координат через `setTransform()`, притяжение к линейке.","adr":[],"issues":[],"notes":["iPad терял примерно один штрих штриховки из пятнадцати, пока канвас не начал preventDefault на touchstart непассивно — `touch-action: none` было недостаточно."],"tags":["перо","ввод"],"loc":624,"testLoc":448,"styleLoc":0,"fileCount":2,"testCount":4,"churn":8,"files":[{"path":"apps/web/src/engine/src/input/PointerInput.ts","loc":558,"kind":"code","in":2,"out":0,"churn":2},{"path":"apps/web/src/engine/src/input/PointerInput.speed.test.ts","loc":196,"kind":"test","in":0,"out":0,"churn":1},{"path":"apps/web/src/engine/src/input/PointerInput.pressure.test.ts","loc":126,"kind":"test","in":0,"out":0,"churn":2},{"path":"apps/web/src/engine/src/input/rulerSnap.ts","loc":66,"kind":"code","in":1,"out":0,"churn":1},{"path":"apps/ CPU-модели акварели","parent":"apps/web/src/engine/src","children":[],"groupings":[],"layer":"engine-internals","owns":"Модели акварели на CPU: цвет смеси пигментов (`pigmentOptics.ts`), диффузия пигмента в стоячей воде (`wetDiffusion.ts`) и водный домен операции — куда растекается вода и где встаёт фронт высыхания (`waterFront.ts`). Диффузия и водный домен — эталоны для GLSL-проходов в `raster/shaders.ts`, по которым алгоритм проверяется без GPU. Но это не только эталоны: фасад движка берёт отсюда в работу расписание и коэффициенты диффузии (`WET_DIFFUSE_*`) и поглощение пигмента (`pigmentAbsorption`) — правка этих файлов меняет картинку у всех.","adr":["011-watercolor"],"issues":[536],"notes":["`waterFront.ts` пока ни откуда не импортируется (предупреждение no-orphans): это эталон для GPU-порта водного домена (ADR 011 §17.24), который ещё не подключён."],"tags":["акварель","оракул"],"loc":702,"testLoc":595,"styleLoc":0,"fileCount":3,"testCount":4,"churn":7,"files":[{"path":"apps/web/src/engine/src/watercolor/waterFront.ts","loc":304,"kind":"code","in":0,"out":0,"churn":1},{"path":"apps/web/src/engine/src/watercolor/wetDiffusion.ts","loc":301,"kind":"code","in":1,"out":0,"churn":1},{"path":"apps/web/src/engine/src/watercolor/wetBloom.test.ts","loc":194,"kind":"test","in":0,"out":0,"churn":1},{"path":"apps/web/src/engine/src/watercolor/wetDiffusion.test.ts","loc":176,"kind":"test","in":0,"out":0,"churn":1},{"path":"apps/web/src/engine/src/watercolor/pigmentOptics.test.ts","loc":159,"kind":"test","in":0,"out":0,"churn":1},{"path":"apps/web/src/engine/src/watercolor/pigmentOptics.ts","loc":97,"kind":"code","in":1,"out":0,"churn":1},{"path":"apps/web/src/engine/src/watercolor/waterFront.test.ts","loc":66,"kind":"test","in":0,"out":0,"churn":1}]},{"id":"apps/web/src/i18n","title":"i18n","summary":"переводы для компонентов","parent":"apps/web/src","children":["apps/web/src/i18n/core"],"groupings":[],"layer":"state","owns":"Лицо слоя i18n для React: `useT()` и `useLocale()` читают выбранный язык из стора настроек, остальное реэкспортируется из `core/`, так что компоненту хватает одного импорта `../../i18n`.","adr":["006-i18n"],"issues":[],"notes":["Сами словари, ключи и функция перевода — в подмодуле `core/`, слоем правее стора (#650): стор и `lib/` переводят и хранят `TranslationKey`, не импортируя хуки, которые читают стор. Код ниже стора импортирует `i18n/core/...`, а не этот баррель.","Dev-панели (флаги, тюнинг, отладочные оверлеи) остаются английскими намеренно."],"tags":["i18n"],"loc":38,"testLoc":0,"styleLoc":0,"fileCount":1,"testCount":0,"churn":2,"files":[{"path":"apps/web/src/i18n/index.ts","loc":38,"kind":"code","in":84,"out":7,"churn":2}]},{"id":"apps/web/src/i18n/core","title":"i18n/core","summary":"словари и перевод","parent":"apps/web/src/i18n","children":[],"groupings":[],"layer":"platform","owns":"Свой минимальный слой i18n без библиотеки: плоские типизированные ключи, английский — источник истины для набора ключей, любая другая локаль типизирована как Dictionary, поэтому пропущенный перевод — ошибка типизации. Выбор локали по умолчанию, правила множественного числа и сам `translate()` — чистые функции, стора не знают.","adr":["006-i18n"],"issues":[],"notes":["Отдельно от хуков `useT`/`useLocale` в `../` (#650): стор настроек хранит `Locale`, реестры в `lib/` хранят `TranslationKey`, а service worker переводит уведомление — всё это ниже стора и не может импортировать барреля, который его читает."],"tags":["i18n"],"loc":2095,"testLoc":114,"styleLoc":0,"fileCount":5,"testCount":1,"churn":6,"files":[{"path":"apps/web/src/i18n/core/en.ts","loc":1075,"kind":"code","in":6,"out":1,"churn":1},{"path":"apps/web/src/i18n/core/ru.ts","loc":897,"kind":"code","in":1,"out":1,"churn":1},{"path":"apps/web/src/i18n/core/i18n.test.ts","loc":114,"kind":"test","in":0,"out":0,"churn":1},{"path":"apps/web/src/i18n/core/translate.ts","loc":66,"kind":"code","in":4,"out":4,"churn":1},{"path":"apps/web/src/i18n/core/locale.ts","loc":37,"kind [],"notes":[],"tags":["ui"],"loc":22,"testLoc":0,"styleLoc":0,"fileCount":1,"testCount":0,"churn":1,"files":[{"path":"apps/web/src/pages/NotFound/index.tsx","loc":22,"kind":"code","in":2,"out":2,"churn":1}]},{"id":"apps/web/src/pages/Room","title":"pages/Room","summary":"экран комнаты","parent":"apps/web/src","children":["apps/web/src/pages/Room/diagnostics","apps/web/src/pages/Room/editing","apps/web/src/pages/Room/gestures","apps/web/src/pages/Room/net","apps/web/src/pages/Room/overlays","apps/web/src/pages/Room/panels","apps/web/src/pages/Room/participants","apps/web/src/pages/Room/shapes","apps/web/src/pages/Room/status","apps/web/src/pages/Room/tools","apps/web/src/pages/Room/viewport"],"groupings":[],"layer":"editor","owns":"Сборка всего редактора: канвас, движок, сокет, панели, горячие клавиши, жесты. Держит `engineRef` и императивный конвейер указателя — единственное место, где WebGL-движок встречается с React. В самой папке — `index.tsx` и хуки, на которые он разложен; всё остальное — подмодули: `net` (сеть комнаты), `tools`, `gestures`, `editing`, `shapes`, `overlays`, `panels`, `status`, `viewport`, `diagnostics`, `participants`.","adr":[],"issues":[25,493],"notes":["Самый крупный файл проекта. Миграция состояния редактора в store (#19→#24) закончена, но этот файл остался точкой сборки — он тянет ~100 модулей.","Граница, которую он держит: store — отражение того, что уже применено к движку императивным вызовом, а не источник правды для движка.","(#493) Декомпозиция идёт хуками рядом с index.tsx, по одному шву: звук, камера и backing store, трансляция курсора, синхронизация слоёв, Space-панорама, индикатор рисующих; и `restoreRoomState` — конвейер восстановления комнаты (снапшот → хвост → бэкфилл), который до этого жил двумя разошедшимися копиями. Правило деления входов: у store спрашиваем то, чем владеет store, а то, что Room выводит сам, передаём аргументом. Эффект монтирования после этого — создание движка и его сетевые колбэки; подписки на свой штрих, начальные слои и уборка вынесены функциями в `engineWiring`. Хука `useEngineLifecycle` сознательно нет: у него было бы около тридцати входов.","(#493, конец) Два эффекта, которые держат тяжёлые ресурсы, — движок и сокет — остались в `index.tsx` вместе со своими списками зависимостей, а их тела вынесены функциями: `connectRoomSocket` (`net/roomSocket.ts`) и `openParkedRoomState` (`engineWiring`). Список зависимостей — это и есть решение «когда пересоздать WebGL-контекст / переподключить сокет», и держать его там, где линтер сверяет его с тем, что передаётся, надёжнее, чем прятать за хуком. Общее для обоих восстановление связано один раз (`useRoomRestore`), положение клиента в потоке операций доски — `useBoardStream`. Разметка, у которой свой смысл, — компонентами: `CanvasOverlays`, `CanvasCatchers`, `RoomSidePanel`, `ClassChrome`, `RoomNotices`; то, чем владеет store, они читают сами.","`Room.module.css` — общие стили экрана; ими пользуются и подмодули (оверлеи, панели, баннеры)."],"tags":["точка-сборки","крупный"],"loc":8420,"testLoc":260,"styleLoc":1618,"fileCount":46,"testCount":4,"churn":544,"files":[{"path":"apps/web/src/pages/Room/index.tsx","loc":1817,"kind":"code","in":1,"out":98,"churn":359},{"path":"apps/web/src/pages/Room/Room.module.css","loc":1618,"kind":"style","in":0,"out":0,"churn":70},{"path":"apps/web/src/pages/Room/useAnnotations.tsx","loc":717,"kind":"code","in":1,"out":10,"churn":4},{"path":"apps/web/src/pages/Room/useTransformGizmoGestures.ts","loc":431,"kind":"code","in":1,"out":6,"churn":3},{"path":"apps/web/src/pages/Room/useTransformSession.ts","loc":431,"kind":"code","in":5,"out":6,"churn":4},{"path":"apps/web/src/pages/Room/useSelection.ts","loc":346,"kind":"code","in":1,"out":10,"churn":3},{"path":"apps/web/src/pages/Room/restoreRoomState.ts","loc":299,"kind":"code","in":3,"out":10,"churn":6},{"path":"apps/web/src/pages/Room/useToolSync.ts","loc":224,"kind":"code","in":1,"out":5,"churn":4},{"path":"apps/web/src/pages/Room/useToolColor.ts" /src/pages/Room/viewport","weight":1,"typeOnly":false,"samples":[["apps/web/src/pages/Room/tools/editorHotkeys.ts","apps/web/src/pages/Room/viewport/cameraMath.ts"]]},{"from":"apps/web/src/pages/Room","to":"apps/web/src/lib/annotations","weight":1,"typeOnly":false,"samples":[["apps/web/src/pages/Room/useAnnotations.tsx","apps/web/src/lib/annotations/annotations.ts"]]},{"from":"apps/web/src/pages/Room/diagnostics","to":"apps/web/src/lib/observability","weight":1,"typeOnly":false,"samples":[["apps/web/src/pages/Room/diagnostics/reportOpen.ts","apps/web/src/lib/observability/diagLog.ts"]]},{"from":"apps/web/src/pages/MyLessons","to":"apps/web/src/i18n","weight":1,"typeOnly":false,"samples":[["apps/web/src/pages/MyLessons/index.tsx","apps/web/src/i18n/index.ts"]]},{"from":"apps/web/src/pages/MyLessons","to":"apps/web/src/icons","weight":1,"typeOnly":true,"samples":[["apps/web/src/pages/MyLessons/index.tsx","apps/web/src/icons/iconNames.ts"]]},{"from":"apps/web/src/pages/MyLessons","to":"apps/web/src/pages/Room","weight":1,"typeOnly":false,"samples":[["apps/web/src/pages/MyLessons/index.tsx","apps/web/src/pages/Room/roomChunk.ts"]]},{"from":"apps/web/src/pages/Settings","to":"apps/web/src/engine","weight":1,"typeOnly":false,"samples":[["apps/web/src/pages/Settings/index.tsx","apps/web/src/engine/index.ts"]]},{"from":"apps/web/src/pages/Settings","to":"apps/web/src/stores","weight":1,"typeOnly":false,"samples":[["apps/web/src/pages/Settings/index.tsx","apps/web/src/stores/settingsStore.ts"]]},{"from":"apps/web/src/lib/browser","to":"apps/web/src/pwa","weight":1,"typeOnly":false,"samples":[["apps/web/src/lib/browser/registerServiceWorker.ts","apps/web/src/pwa/updatePolicy.ts"]]},{"from":"apps/web/src","to":"apps/web/src/i18n/core","weight":1,"typeOnly":false,"samples":[["apps/web/src/main.tsx","apps/web/src/i18n/core/translate.ts"]]},{"from":"apps/web","to":"apps/web/scripts","weight":1,"typeOnly":false,"samples":[["apps/web/vite.config.ts","apps/web/scripts/devBridgePlugin.ts"]]},{"from":"apps/web","to":"apps/web/src/pwa","weight":1,"typeOnly":false,"samples":[["apps/web/vite.config.ts","apps/web/src/pwa/swConfig.ts"]]}],"flows":[{"id":"stroke","title":"Штрих — от пера до чужого экрана","intro":"Главный путь приложения. Всё в нём устроено так, чтобы линия появлялась под пером мгновенно и локально, а сеть догоняла потом.","steps":[{"id":"pointer","title":"Событие указателя","module":"apps/web/src/engine/src/input","side":"client","detail":"PointerInput принимает нажим, наклон и скорость (по часам сэмпла, не обработчика) и переводит экранные координаты в координаты холста аналитически, через setTransform."},{"id":"dabs","title":"Сплайн и дабы","module":"apps/web/src/engine/src/dabs","side":"client","detail":"Точки укладываются на сплайн Catmull-Rom, по нему с нужным шагом расставляются дабы, форма каждого берётся из пресета инструмента и отпечатка кончика."},{"id":"raster","title":"Растеризация в буфер","module":"apps/web/src/engine/src/buffers","side":"client","detail":"Дабы рисуются в аккумуляционный буфер штриха, затем — в тайлы слоя. Пользователь видит линию здесь, до всякой сети."},{"id":"op","title":"Операция","module":"apps/web/src/engine/src/oplog","side":"client","detail":"Завершённый штрих становится сериализуемой Operation. Это же значение потом уедет на сервер, ляжет в историю и будет свёрнуто при реплее у всех остальных."},{"id":"pack","title":"Упаковка дабов","module":"shared-dab-codec","side":"wire","detail":"Дабы пакуются в компактный проводной формат — иначе поток не проходит по реальному каналу, а не только по локальной сети."},{"id":"outbox","title":"Исходящая очередь","module":"apps/web/src/pages/Room/net","side":"client","detail":"Операция кладётся в outbox и переживает потерю связи и перезагрузку страницы. Локально она применена оптимистично, до подтверждения."},{"id":"emit","title":"emit operation","module":"shared-contract","side":"wire","detail":"Сокет отправляет `operation`; параллельно, пока рука ещё ведёт, идут `stroke_live` с частичными дабами и `cursor_move`."},{"id":"relay","title":"Сервер присваивает seq и ретранслирует","module":"apps/server/src/rooms","side":"server","detail":"Комната в памяти даёт операции порядковый номер, рассылает `operation_confirmed` всем и `peer_stroke_live` — соседям. Сервер ничего не рисует."},{"id":"persist","title":"Запись в Postgres","module":"apps/server/src/db","side":"server","detail":"Запись идёт fire-and-forget, её не ждут на горячем пути: задержка БД не должна добавляться к задержке рисования."},{"id":"peer","title":"Чужой клиент сворачивает операцию","module":"apps/web/src/engine","side":"client","detail":"У остальных участников та же операция применяется к их движку. Картинка сходится не потому, что кто-то прислал пиксели, а потому что все свернули один и тот же лог."}]},{"id":"join","title":"Вход в комнату и восстановление картинки","intro":"Второй по важности путь: он решает, увидит ли учитель свою работу через неделю и сколько секунд он будет её ждать.","steps":[{"id":"gate","title":"Ворота входа","module":"apps/web/src/pages/Room/net","side":"client","detail":"Клиент встаёт в очередь входа и держит канвас закрытым, пока не решено, что именно восстанавливать: чужие операции, прилетевшие в это окно, не должны нарисоваться дважды."},{"id":"join_room","title":"join_room","module":"shared-contract","side":"wire","detail":"В запросе едет максимальный seq, который у клиента уже есть, — чтобы сервер не слал заново то, что вкладка не теряла."},{"id":"room_state","title":"room_state","module":"apps/server/src/rooms","side":"server","detail":"Сервер отдаёт комнату, участников, палитру, статус заморозки, номер последнего снапшота и хвост операций. Что именно вырезано из хвоста, решается по каждому слою отдельно, против его собственного покрытия — общий порог по комнате однажды уже съел рисунок."},{"id":"fetch","title":"Загрузка снапшотов","module":"apps/server/src/roomRoutes","side":"server","detail":"Клиент сам забирает индекс снапшотов и по блобу на слой обычным HTTP — по сокету это не едет."},{"id":"decode","title":"Раскодирование и ретайлинг","module":"apps/web/src/engine/src/oplog","side":"client","detail":"Блобы распаковываются и раскладываются по тайлам слоёв — при этом сетка тайлов может не совпадать с той, в которой снапшот пекли."},{"id":"replay","title":"Реплей хвоста","module":"apps/web/src/engine","side":"client","detail":"Поверх восстановленных пикселей сворачивается хвост операций. Операции, несущие и пиксели, и структуру, приходят всегда, а их пиксельную половину клиент пропускает сам — против того покрытия, которое реально восстановил."},{"id":"report","title":"Отчёт о восстановлении","module":"apps/web/src/pages/Room/diagnostics","side":"client","detail":"Что восстановилось, за сколько и не потерялось ли — уходит в отчёт. Это то, чем мы узнаём о сбое раньше учителя."}]},{"id":"undo","title":"Отмена в четыре руки","intro":"Отмена в общей комнате — не стек. Разбор того, почему именно так, лежит в ADR 002.","steps":[{"id":"request","title":"Клиент просит отменить своё","module":"apps/web/src/pages/Room/net","side":"client","detail":"Отменяется собственная операция участника по её идентификатору, а не «последнее действие в комнате»."},{"id":"server_undo","title":"Сервер выпускает обратную операцию","module":"apps/server/src/rooms","side":"server","detail":"Отмена сама становится операцией в общем логе и получает свой seq — иначе порядок у разных участников разъедется."},{"id":"fold","title":"Все сворачивают её одинаково","module":"apps/web/src/engine","side":"client","detail":"Структурная отмена возвращает удалённый слой по его id. Пиксели при этом придут только если строка RoomLayerState цела."}]}],"adr":{"001-layer-panel-dnd":"ADR 001: Layer Panel DnD","002-collaborative-undo":"ADR 002: Коллаборативный undo/redo, владение слоями и revoke","003-liner-tool":"ADR 003: Линер / Fineliner — чернильный инструмент рисования","004-marker-tool":"ADR 004: Маркер — инструмент маркер-рендери minUserIp[]\n  actions: AdminActionRow[]\n}","truncated":false}],"AdminUserIp":[{"path":"packages/shared/src/admin.ts","line":103,"kind":"type","snippet":"export type AdminUserIp = {\n  ip: string\n  firstSeenAt: string\n  lastSeenAt: string\n  /** Whether an IP ban is in force on this address right now. */\n  banned: boolean\n}","truncated":false}],"AdminUserLesson":[{"path":"packages/shared/src/admin.ts","line":69,"kind":"type","snippet":"export type AdminUserLesson = {\n  id: string\n  name: string\n  createdAt: string\n  role: 'owner' | 'member'\n  /** What this person called themselves in that room, if they joined it. */\n  nameInRoom: string | null\n  lastActiveAt: string | null\n}","truncated":false}],"AdminUserList":[{"path":"packages/shared/src/admin.ts","line":67,"kind":"type","snippet":"export type AdminUserList = { users: AdminUserRow[]; total: number }","truncated":false}],"AdminUserRow":[{"path":"packages/shared/src/admin.ts","line":55,"kind":"type","snippet":"export type AdminUserRow = {\n  id: string\n  email: string | null\n  name: string | null\n  createdAt: string\n  lastSeenAt: string | null\n  bannedAt: string | null\n  ownedLessons: number\n  joinedRooms: number\n  online: boolean\n}","truncated":false}],"AffineMatrixTuple":[{"path":"packages/shared/src/layerOperations.ts","line":229,"kind":"type","snippet":"/** 2x3 affine [a, b, c, d, tx, ty]: x' = a*x + c*y + tx, y' = b*x + d*y + ty.\n *  The only encoding a layer_transform had before #392. */\nexport type AffineMatrixTuple = [number, number, number, number, number, number]","truncated":false}],"AnnotationAddOperation":[{"path":"packages/shared/src/annotations.ts","line":83,"kind":"type","snippet":"/** Creates one annotation. `annotationId` is the annotation's own id, distinct\n *  from the operation's: `annotation_update` and `annotation_delete` target the\n *  annotation, and an operation id would tie them to the act of creating it. */\nexport type AnnotationAddOperation = OperationBase & {\n  type: 'annotation_add'\n  annotationId: string\n  shape: AnnotationShape\n}","truncated":false}],"AnnotationDeleteOperation":[{"path":"packages/shared/src/annotations.ts","line":118,"kind":"type","snippet":"/** Plural for the same reason `layer_delete` is: clearing several remarks at\n *  once is one action and must be one undo. */\nexport type AnnotationDeleteOperation = OperationBase & {\n  type: 'annotation_delete'\n  annotationIds: string[]\n}","truncated":false}],"AnnotationPatch":[{"path":"packages/shared/src/annotations.ts","line":101,"kind":"type","snippet":"/** Edits an existing annotation in place — fixing a typo, dragging a note to a\n *  better spot, recolouring it.\n *\n *  A third operation type rather than delete+add, and the reason is undo: a\n *  typo corrected by delete+add is two entries on the stack, so one Ctrl+Z\n *  leaves the annotation deleted and the user pressing it again to get back to\n *  where they started. The Operation Log is permanent, so this is the kind of\n *  economy that cannot be corrected later.\n *\n *  Fields absent from the patch are left as they were. A field that does not\n *  belong to the target's kind (`text` on an ink annotation) is ignored on\n *  replay rather than rejected — see `applyAnnotationOp`. */\nexport type AnnotationPatch = {\n  x?: number\n  y?: number\n  color?: string\n  size?: number\n  text?: string\n  points?: number[]\n}","truncated":false}],"AnnotationShape":[{"path":"packages/shared/src/annotations.ts","line":49,"kind":"type","snippet":"/** What an annotation *is*, without the identity the log already carries.\n *  Coordinates are canvas/world space, exactly like `AreaFillOperation`'s —\n *  the overlay rides the same transform as the canvas, so an annotation stays\n *  glued to the paper through pan/zoom/rotate rather than floating in screen\n *  space.\n *\n *  `size` means two different things, and the split is deliberate rather than\n *  sloppy — it follows what each of the two is:\n *\n *   - **ink** is a mark *on* the paper, so its width is in canvas units and it\n *     grows and shrinks with the drawing, like every stroke does;\n *   - **text** is a pin stuck in the paper with a note attached, so its size is\n *     in *screen* pixels and stays legible at any zoom. The point it is pinned\n *     to is world space; the note hanging off it is interface. A remark you\n *     cannot read when you zoom out to look at the whole picture is useless at\n *     exactly the moment you want it, which is what canvas-unit text gave. */\nexport type AnnotationShape =\n  | { kind: 'text'; x: number; y: number; color: string; size: number; text: string }","truncated":false}],"AnnotationUpdateOperation":[{"path":"packages/shared/src/annotations.ts","line":110,"kind":"type","snippet":"export type AnnotationUpdateOperation = OperationBase & {\n  type: 'annotation_update'\n  annotationId: string\n  patch: AnnotationPatch\n}","truncated":false}],"appendOperation":[{"path":"apps/web/src/engine/index.ts","line":564,"kind":"method","snippet":"  appendOperation(op: Operation, source?: OperationSource): void","truncated":false}],"appendPeerLiveDabs":[{"path":"apps/web/src/engine/index.ts","line":984,"kind":"method","snippet":"  // (#429) Paints one packet of a peer's still-in-progress stroke straight\n  // into the real layer, exactly as a local stroke paints itself while the\n  // pen is down — not into a preview buffer composited on top.\n  //\n  // That distinction is the whole design. Marker multiplies the layer's own\n  // content frozen at pen-down, and smudge reads and redistributes it;\n  // neither is expressible in a detached transparent buffer, which is why\n  // previewOperation's reveal path cannot double as the live path. Painting\n  // into the layer also means the gesture's stateful machinery — the marker's\n  // per-gesture scratch, the smudge imprint, the previous dab across a packet\n  // seam — is reached through `strokeId` exactly the way a chunked replay\n  // already reaches it, with no second implementation of any of it.\n  //\n  // The pixels this leaves are provisional in bookkeeping only: the\n  // StrokeOperation(s) that follow are still the record, and appendOperation\n  // recognises the dabs already painted here rather than painting them twice\n  // (see _peerLiveStrokes).\n  appendPeerLiveDabs(peerId: string, packet: PeerLivePacket): void","truncated":false}],"AreaClearOperation":[{"path":"packages/shared/src/areaOperations.ts","line":70,"kind":"type","snippet":"/** (#446) Erases everything inside `selection` on one layer — what both\n *  \"delete\" and the erase half of \"cut\" emit. `layer_clear` with a mask, and\n *  deliberately a separate type rather than an optional field on it: a\n *  `layer_clear` carrying an ignored `selection` would still wipe the whole\n *  layer on any client built before this existed, and the operation log is\n *  permanent. */\nexport type AreaClearOperation = OperationBase & {\n  type: 'area_clear'\n  layerId: string\n  selection: SelectionShape\n}","truncated":false}],"AreaFillOperation":[{"path":"packages/shared/src/areaOperations.ts","line":174,"kind":"type","snippet":"/** (#453) What the fill tool records: the region it worked out, as pixels.\n *\n *  Same raster-in-a-world-rect shape as `area_paste` above, and painted by the\n *  same code — a fill *is* a stamp of a raster onto a layer. `image` is a PNG\n *  data URL with straight alpha whose RGB is the fill colour flat across the\n *  whole rect and whose alpha is the coverage mask; `x`/`y`/`width`/`height`\n *  place it, always at the raster's natural size (a fill is never resampled —\n *  it is computed at the pixels it lands on).\n *\n *  **Why the result and not the recipe.** The obvious encoding is the one the\n *  user performed: seed point, tolerance, gap closing, and let every client\n *  flood-fill its own copy of the layer. That fails the cross-device\n *  determinism rule in `.claude/rules.md`, and fails it worse than most things\n *  do. A flood fill is a *threshold* over pixels that came off the GPU, and a\n *  threshold amplifies: two devices whose graphite agrees to a\n *  least-significant bit disagree about which side of `tolerance` one pixel of\n *  a pencil line sits on, and one pixel is the whole difference between a\n *  filled shape and a filled canvas. It would also put a full-domain readback\n *  and scan on the main thread of every participant replaying a room.\n *\n *  The freedom that buys is worth stating: because only the author ever runs\n *  the algorithm, the algorithm is not part of the contract. Tolerance, gap\n *  closing and the antialiased rim can be rewritten, or replaced with a\n *  perceptual metric, without versioning this operation or touching a single\n *  one already in the log. Compare `area_transform`, which ships a polygon\n *  every participant rasterizes and is therefore pinned to the byte.\n *\n *  **Why not `area_paste`.** Mechanically it would fit — and that is the\n *  point at which it stops being a good idea. The log is permanent and kept on\n *  purpose as a dataset (#375); a fill recorded as a paste is a fill nobody\n *  can ever find again. The parameters below carry it: nothing on the replay\n *  path reads them, they exist so the record says what happened.\n *\n *  A pure single-layer pixel operation like the three `area_*` ops next door,\n *  so a layer snapshot can stand in for it (`COVERABLE_OP_TYPES`). */\nexport type AreaFillOperation = OperationBase & {\n  type: 'area_fill'\n  layerId: string\n  image: string\n  x: number\n  y: number\n  width: number\n  height: number\n  /** Where the user tapped, in the same layer space as `Dab.x/y`. Replay\n   *  ignores it, as it does every field below — see the docstring. */\n  seedX: number\n  seedY: number\n  color: [number, number, number]\n  tolerance: number\n  gapClose: number\n  expand: number\n  source: FillSourceMode\n}","truncated":false}],"AreaPasteOperation":[{"path":"packages/shared/src/areaOperations.ts","line":116,"kind":"type","snippet":"/** (#446) Stamps a raster onto an existing layer at a given world rect —\n *  what \"paste\" emits, including a paste onto a layer other than the one the\n *  pixels were copied from.\n *\n *  Carries the pixels rather than a reference to where they came from\n *  (source layer + mask + the seq it was copied at), which would be smaller\n *  and is the wrong shape: replay would resolve that reference against the\n *  source layer *as it stands at the paste's own position in the log*, so\n *  painting over the original after copying — or undoing the stroke it came\n *  from — would retroactively change what had already been pasted. Clipboard\n *  contents are a snapshot at copy time on every other tool that has one, and\n *  a snapshot is what a raster in the operation is.\n *\n *  Distinct from `image_import`, which is imposed on a freshly created layer\n *  and fit-centers within the canvas (see its docstring) — the invariant that\n *  it never lands on content that already exists is worth keeping, so paste\n *  gets its own type instead of widening it.\n *\n *  `image` is a PNG data URL with straight (un-premultiplied) alpha, the same\n *  encoding `image_import` uses and the same one the engine's ImageImport\n *  blit premultiplies on the way into a layer buffer. `x`/`y` are the world-space top-left\n *  corner and `width`/`height` the rect it covers — always the raster's own\n *  natural size.\n *\n *  `matrix` is where it was moved to before it was let go. A pasted piece\n *  floats above the layer until it is dropped (ADR 008, \"Плавающее\n *  выделение\"), and whatever placing happened in between arrives here: one\n *  operation for the whole paste-place-drop gesture, rather than a paste\n *  followed by a transform of the region it landed in.\n *\n *  That second form would be wrong as well as clumsy. A transform lifts\n *  *everything* inside its mask, and by then that includes whatever was\n *  already under the pasted piece — which is exactly the bug the floating\n *  model exists to remove (Ilya, 13.08: \"двигаться начинает и тот что\n *  вставился и тот что я изначально выделил\").\n *\n *  Absent means identity — what a paste dropped where it landed writes.\n *  Applied about the world origin like `layer_transform`'s own matrix; the\n *  rect is not a second coordinate system, it is where the raster sits before\n *  the matrix acts. */\nexport type AreaPasteOperation = OperationBase & {\n  type: 'area_paste'\n  layerId: string\n  image: string\n  x: number\n  y: number\n  width: number\n  height: number\n  matrix?: LayerTransformMatrix\n}","truncated":false}],"AreaTransformOperation":[{"path":"packages/shared/src/areaOperations.ts","line":57,"kind":"type","snippet":"/** (#446) The three operations a selection can produce. All three are pure,\n *  single-layer pixel operations — they paint one layer and leave structure\n *  untouched — which is what lets them join `stroke`/`image_import`/\n *  `layer_clear` as snapshot-*coverable* on the server (rooms.ts's\n *  COVERABLE_OP_TYPES), unlike `layer_transform`, which names several layers\n *  at once and therefore can never be withheld from a joining client.\n *\n *  Single-layer is a decision, not an omission. `layer_transform` moves whole\n *  layers and a gizmo can hold several of them at once; a *selection* is a\n *  region drawn on the drawing in front of you, and the drawing in front of\n *  you is the active layer. Multi-layer would need the plural-with-atomic-\n *  undo shape `layer_transform` has (see its docstring) and buys a case\n *  nobody asked for; if it is ever wanted, it arrives the way #412/#413 added\n *  plurals elsewhere — additively, without invalidating a single operation\n *  already in the log.\n *\n *  Moves the pixels inside `selection` — and only those — through `matrix`,\n *  in place on one layer. The region is lifted (the source pixels are erased\n *  from the layer) and stamped down transformed, i.e. a move leaves a hole,\n *  which is what \"move this piece of my drawing\" means everywhere else. To\n *  keep a copy, the UI copies first and pastes; that is `area_paste`, not a\n *  flag here. */\nexport type AreaTransformOperation = OperationBase & {\n  type: 'area_transform'\n  layerId: string\n  selection: SelectionShape\n  matrix: LayerTransformMatrix\n}","truncated":false}],"Assignment":[{"path":"apps/server/prisma/schema.prisma","line":253,"kind":"model","snippet":"// (#595, ADR 015 §2) One round of work in class: \"draw the cube\", then later\n// \"draw the cylinder\". Its personal boards are shown together as one grid and\n// never mixed with another round's. A table rather than a flag on the board\n// because every question worth asking — which boards belong together, which\n// round a latecomer joins, what it is called, how its boards start — is a\n// question about the group, not about any one board.\nmodel Assignment {\n  id          String         @id @default(uuid())\n  lessonId    String\n  lesson      Room           @relation(\"LessonAssignments\", fields: [lessonId], references: [id], onDelete: Cascade)\n  name        String\n  order       Int\n  // What a personal board starts with. Only `blank` is built; `copy_board`\n  // (seed from the teacher's board, `seedBoardId`) is in the model so adding\n  // it later is one enum value and one branch, with no data migration.\n  seed        AssignmentSeed @default(blank)\n  seedBoardId String?\n  createdAt   DateTime       @default(now())\n  endedAt     DateTime?\n  boards      Room[]         @relation(\"AssignmentBoards\")\n\n  @@index([lessonId, order])\n}","truncated":false}],"AssignmentSeed":[{"path":"apps/server/prisma/schema.prisma","line":271,"kind":"enum","snippet":"enum AssignmentSeed {\n  blank\n  copy_board\n}","truncated":false}],"AssignmentStartResult":[{"path":"packages/shared/src/protocol.ts","line":430,"kind":"type","snippet":"/** (#595) `assignment_start`'s answer. `busy`: another one is still being\n *  created — a double tap, answered once. */\nexport type AssignmentStartResult =\n  | { ok: true; assignment: AssignmentSummary }\n  | { ok: false; error: 'not_owner' | 'busy' | 'server_error' }","truncated":false}],"AssignmentSummary":[{"path":"packages/shared/src/room.ts","line":156,"kind":"type","snippet":"/** (#595, ADR 015 §2, §11) One assignment of the lesson — \"draw the cube\".\n *  Its personal boards are the `BoardSummary` entries carrying its id. It\n *  never ends: the class is sent to it, called away from it and sent back\n *  (`set_class_location`), and its boards stay the students' throughout. */\nexport type AssignmentSummary = {\n  id: string\n  name: string\n  order: number\n  createdAt: string\n}","truncated":false}],"BACKGROUND_LAYER_ID":[{"path":"packages/shared/src/layers.ts","line":60,"kind":"const","snippet":"export const BACKGROUND_LAYER_ID = 'background'","truncated":false}],"bakeNetworkSnapshot":[{"path":"apps/web/src/engine/index.ts","line":641,"kind":"method","snippet":"  // (#149 epic) Raw (uncompressed) tile payload for this layer's current\n  // resident content — the same allResident() gather _takeCheckpoint already\n  // does for local undo checkpoints, just serialized for network upload\n  // instead of kept in memory. Null when the layer has no pixel content yet\n  // (nothing to snapshot) — mirrors _takeCheckpoint's own early-return.\n  // Bundling several layers together, compressing, and uploading is the\n  // caller's job (Room's snapshot orchestration), not the engine's — the\n  // engine only knows about one layer at a time.\n  bakeNetworkSnapshot(layerId: string): Uint8Array | null","truncated":false}],"bakePreview":[{"path":"apps/web/src/engine/index.ts","line":1047,"kind":"method","snippet":"  // (#595, ADR 015 §5) A small picture of the drawing for board thumbnails\n  // and the class grid: the same frame and content as exportPNG() (paper\n  // baked in; for an infinite room the \"whole drawing\" rect), shrunk on the\n  // GPU so its longer side is at most `maxSide`, and encoded as WebP (PNG\n  // where the browser cannot encode WebP — check `blob.type`). Only the small\n  // result is ever read back, which is what makes it cheap enough to call\n  // every few seconds on a tablet that is drawing. Null if encoding failed.\n  bakePreview(maxSide?: number): Promise\u003cBlob | null>","truncated":false}],"BoardSummary":[{"path":"packages/shared/src/room.ts","line":167,"kind":"type","snippet":"// (#176, ADR 014) One entry of a lesson's board strip — what the client needs\n// to draw the strip and to switch, nothing more. The full `Room` of a board\n// arrives with its own `room_state` once the client joins it. The lesson\n// itself is the first entry, at `order` 0, under its own id.\nexport type BoardSummary = {\n  id: string\n  name: string\n  order: number\n  // Same cache-busting key `Room.thumbnailUpdatedAt` is; absent until the\n  // board has been baked once. Kept current by `board_thumbnail_updated`\n  // (#595) for everyone who may see the board.\n  thumbnailUpdatedAt?: string\n  // (#595) Set on a personal board only — see `Room.assignmentId`. Personal\n  // boards are not pages of the lesson's strip: they have their own grid, and\n  // their `order` is meaningless.\n  assignmentId?: string\n  ownerId?: string\n}","truncated":false}],"ClassVisibility":[{"path":"packages/shared/src/room.ts","line":144,"kind":"type","snippet":"/** (#595, ADR 015 §3) Whether students see each other's personal boards.\n *  `teacher_only` — only the teacher and the board's own student; `class` —\n *  everyone in the lesson may look (and only look: drawing stays the student's\n *  and the teacher's). Spelled as the Postgres enum, like `RoomAccessMode`. */\nexport type ClassVisibility = 'teacher_only' | 'class'","truncated":false},{"path":"apps/server/prisma/schema.prisma","line":278,"kind":"enum","snippet":"// Spelled as the wire values in packages/shared's `ClassVisibility`, the same\n// way `RoomAccessMode` is, so the row crosses to the client with no mapping.\nenum ClassVisibility {\n  teacher_only\n  class\n}","truncated":false}],"ClientEnvironment":[{"path":"packages/shared/src/admin.ts","line":153,"kind":"type","snippet":"/** (#589) What a browser reports about itself once per page load\n *  (apps/web lib/api/environment.ts). Flat on purpose: the server keeps only the\n *  keys it knows, each checked against its type (`sanitizeClientEnvironment`),\n *  and a flat record is what makes that a loop instead of a parser.\n *\n *  Every field is optional — an old build, a browser without WebGL, a field\n *  added later — and the admin panel shows whatever arrived. */\nexport type ClientEnvironment = {\n  appVersion?: string\n  /** The effective device type (ADR 007), and whether the person picked it\n   *  in Settings rather than leaving it to detection. */\n  deviceType?: string\n  deviceTypeChosen?: boolean\n  screenW?: number\n  screenH?: number\n  dpr?: number\n  viewportW?: number\n  viewportH?: number\n  maxTouchPoints?: number\n  /** `(pointer: …)` of the primary input: coarse, fine or none. */\n  pointer?: string\n  hover?: boolean\n  /** A pen with pressure has touched this browser at least once. Sticky. */\n  penSeen?: boolean\n  /** Launched as an installed PWA rather than in a tab. */\n  standalone?: boolean\n  language?: string\n  timeZone?: string\n  webgl?: boolean\n  gpuVendor?: string\n  gpuRenderer?: string\n  maxTextureSize?: number\n  deviceMemoryGb?: number\n  cores?: number\n}","truncated":false}],"CursorMoveData":[{"path":"packages/shared/src/protocol.ts","line":79,"kind":"type","snippet":"/** Peer cursor position (#37). Sent only while the sender is *not* drawing.\n *\n *  (#431) This used to carry a `drawing` flag, and peers froze the cursor dot\n *  wherever it last was for as long as it was true. That was the only sane\n *  choice at the time: the stroke's shape was unknown until the finished\n *  StrokeOperation arrived, so a cursor that kept following the pointer would\n *  have run seconds ahead of its own ink. Freezing was less wrong than lying.\n *\n *  With the stroke streaming live (#429) the flag has nothing left to do, so\n *  it is gone rather than left as a field nobody reads. While the pen is down\n *  a peer's cursor position comes from the last dab it actually painted — the\n *  same packets that draw the ink — which is what makes the dot and the line\n *  it is drawing incapable of disagreeing: they are the same data. And since\n *  the dab stream already carries the position, sending cursor packets during\n *  a stroke would be spending ~30 packets a second to say it again, less\n *  accurately. */\nexport type CursorMoveData = {\n  x: number\n  y: number\n}","truncated":false}],"Dab":[{"path":"packages/shared/src/stroke.ts","line":25,"kind":"type","snippet":"export type Dab = {\n  x: number\n  y: number\n  pressure: number\n  tiltX: number\n  tiltY: number\n  size: number\n  aspectRatio: number\n  angle: number\n  // Final dab opacity, baked at record time (preset × user opacity × stroke\n  // speed). Replay has no live pointer speed, so it must not recompute this.\n  opacity: number\n  // Milliseconds since the stroke's first dab (always 0 for that first dab).\n  // Undo/redo/checkpoint replay ignore it (paints the whole array at once),\n  // but a peer's live-stroke reveal (#37 follow-up v2) uses it to play the\n  // recorded dabs back at the original pacing instead of all at once.\n  t: number\n}","truncated":false}],"DAB_PACK_VERSION":[{"path":"packages/shared/src/dabCodec.ts","line":41,"kind":"const","snippet":"/** Bumped only if the layout above changes incompatibly. Written as a prefix\n *  on every packed payload so a client meeting an encoding it does not know\n *  says so instead of silently painting garbage — the log is permanent, and a\n *  room recorded today gets replayed by clients built much later. Costs two\n *  characters per stroke, not per dab. */\nexport const DAB_PACK_VERSION = 1","truncated":false}],"DEFAULT_PALETTE_COLORS":[{"path":"packages/shared/src/room.ts","line":340,"kind":"const","snippet":"// Room color palette (#190 epic). One palette per room (not per-user, and not\n// a named/multi-palette choice) — created with DEFAULT_PALETTE_COLORS when\n// the room is created; any participant can add the currently selected color\n// or remove one already in the palette (toggle, not a delete-only UI).\n// Modeled as a plain hex-string array rather than a `Palette { id, name }`\n// type since there is exactly one per room; a richer type can be introduced\n// later if multiple/named palettes are ever needed. Lives outside the\n// Operation log — it's not a drawing action and must not participate in\n// undo/redo/replay — and syncs via its own socket events (protocol.ts) instead of an\n// Operation, sitting alongside `participants` in `room_state` rather than as\n// a field on `Room` itself (participants isn't a `Room` field either, for the\n// same reason: both are room-scoped state assembled independently of the\n// Prisma `Room` row — see roomMapper.ts's `toWireRoom`).\n// First entry is the pencil's own default graphite color (engine's\n// DEFAULT_GRAPHITE_COLOR, [0.14, 0.14, 0.17] converted via rgbToHex) —\n// duplicated as a literal rather than imported since `packages/shared` sits\n// below `apps/web/engine` in the dependency graph; keep the two in sync by\n// hand if the engine's default ever changes.\nexport const DEFAULT_PALETTE_COLORS: string[] = [\n  '#24242b', '#ffffff', '#000000', '#390099', '#9e0059', '#ff0054', '#ff5400', '#ffbd00',\n  '#ddf21f', '#00f3ff',\n]","truncated":false}],"DEFAULT_PAPER_COLORS":[{"path":"packages/shared/src/paper.ts","line":92,"kind":"const","snippet":"export const DEFAULT_PAPER_COLORS: Record\u003cPaperType, string> =\n  Object.fromEntries(PAPER_TYPES.map(t => [t, defaultPaperColor(t)])) as Record\u003cPaperType, string>","truncated":false}],"defaultPaperColor":[{"path":"packages/shared/src/paper.ts","line":86,"kind":"function","snippet":"export function defaultPaperColor(type: PaperType): string {\n  const coarseness = paperCoarsenessOf(type)\n  // Flat has no grain at all, so it gets the cleanest of the three.\n  return coarseness ? DEFAULT_PAPER_COLOR_BY_COARSENESS[coarseness] : '#fcfcfa'\n}","truncated":false}],"destroy":[{"path":"apps/web/src/engine/index.ts","line":1048,"kind":"method","snippet":"  destroy(): void","truncated":false}],"EmailMessage":[{"path":"apps/server/src/auth/email.ts","line":25,"kind":"interface","snippet":"export interface EmailMessage {\n  to: string\n  subject: string\n  /** Plain-text half. Never optional: some clients show it, and a mail with\n   *  no text part scores worse with spam filters — which for a sign-in code\n   *  is the difference between logging in and not. */\n  text: string\n  html: string\n}","truncated":false}],"EngineOpts":[{"path":"apps/web/src/engine/index.ts","line":1166,"kind":"interface","snippet":"interface EngineOpts {\n  deskColor: [number, number, number]\n  pencilType: string\n  size: number\n  /** (#494) The same immutable value as PaperState.scale: the paper itself —\n   *  type, colour, sheet — lives there now. Kept here only because the\n   *  ribbon/wash paths read `_opts.paperScale` directly and are being edited\n   *  on a live branch; fold into `_paper.scale` once that has landed. */\n  paperScale: number\n  graphiteColor: [number, number, number]\n  tool: ToolType\n  opacity: number\n}","truncated":false}],"exportPNG":[{"path":"apps/web/src/engine/index.ts","line":1008,"kind":"method","snippet":"  // Exports the canvas exactly as displayed (paper texture baked in) by\n  // default. Pass `transparent: true` for a second variant with no paper —\n  // just the graphite/ink content, transparent where nothing is drawn (#15).\n  //\n  // #145: for an infinite-canvas room there's no fixed \"whole drawing\" rect\n  // the way a bounded room's canvas.width x canvas.height already is one —\n  // so this exports the tightest rect containing every layer's actual\n  // painted content (getContentBounds's own union, at exactly 1 world unit\n  // = 1 pixel) instead of whatever the camera happens to be looking at right\n  // now. A bounded room exports its whole sheet (#470) — see\n  // Exporter.exportPNG (src/export/Exporter.ts) for the full reasoning.\n  exportPNG(transparent?: boolean): Promise\u003cBlob | null>","truncated":false}],"FILL_SOURCES":[{"path":"packages/shared/src/areaOperations.ts","line":135,"kind":"const","snippet":"/** (#453) Which pixels the fill reads its boundaries from. `visible` is the\n *  composite of every visible layer — the lineart-above/colour-below case that\n *  is most of what a bucket is for — and `layer` is the target layer alone.\n *  Paint lands in the target layer either way; this only chooses what counts\n *  as a wall.\n *\n *  Ordered as the settings UI shows them, `visible` first because it is the\n *  default. */\nexport const FILL_SOURCES = ['visible', 'layer'] as const","truncated":false}],"FillSourceMode":[{"path":"packages/shared/src/areaOperations.ts","line":137,"kind":"type","snippet":"export type FillSourceMode = (typeof FILL_SOURCES)[number]","truncated":false}],"FolderAddOperation":[{"path":"packages/shared/src/layerOperations.ts","line":58,"kind":"type","snippet":"/** Inserts a new empty folder above the active item's own row (#378), by the\n *  same rule and for the same reasons as `LayerAddOperation` above.\n *\n *  (#410) `parentId` is the counterpart this used to lack on purpose, back\n *  when folders were one level deep and a folder's position could only ever be\n *  an index into `rootOrder`. Folders nest now, so a folder is placed by the\n *  same (container, index) pair as anything else. Absent or null means root —\n *  which is where every folder went before nesting existed, so `folder_add`\n *  operations already in the log replay exactly as they did. Absent `index`\n *  means the top. */\nexport type FolderAddOperation = OperationBase & {\n  type: 'folder_add'\n  layerId: string\n  name: string\n  parentId?: string | null // folder id, or null/absent for root\n  index?: number\n}","truncated":false}],"getContentBounds":[{"path":"apps/web/src/engine/index.ts","line":819,"kind":"method","snippet":"  // Bounding box of a layer's actual painted content, canvas-pixel space —\n  // see the implementation's docstring for cost/call-frequency notes (#120).\n  getContentBounds(layerId: string): { x: number; y: number; width: number; height: number } | null","truncated":false}],"HomographyMatrixTuple":[{"path":"packages/shared/src/layerOperations.ts","line":238,"kind":"type","snippet":"/** 3x3 projective (homography), column-major to match the affine tuple's own\n *  column-major reading and gl.uniformMatrix3fv's required layout:\n *  [a, b, g, c, d, h, tx, ty, i] means\n *      x' = (a*x + c*y + tx) / (g*x + h*y + i)\n *      y' = (b*x + d*y + ty) / (g*x + h*y + i)\n *  An affine map is the case g = h = 0, i = 1 — which is exactly what\n *  toHomography() produces from the six-number form. */\nexport type HomographyMatrixTuple = [\n  number, number, number,\n  number, number, number,\n  number, number, number,\n]","truncated":false}],"ImageImportOperation":[{"path":"packages/shared/src/layerOperations.ts","line":33,"kind":"type","snippet":"/** Imports a reference image onto a layer (#88) — always targets a layer\n *  created by a `layer_add` dispatched just before it, never an existing\n *  one, so this never needs to account for content already on the layer.\n *  `image` is a data URL, embedded directly in the op rather than uploaded\n *  and referenced by URL — there's no object storage yet (#114 tracks\n *  adding one later; Postgres bytea/JSONB is the accepted MVP tradeoff for\n *  binary content, see #110). `width`/`height` are the image's own natural\n *  size, needed to fit-center it within the canvas without redecoding. */\nexport type ImageImportOperation = OperationBase & {\n  type: 'image_import'\n  layerId: string\n  image: string\n  width: number\n  height: number\n  // World-space top-left placement (infinite canvas only, #133 follow-on).\n  // Omitted entirely by fixed-canvas rooms — when absent, the engine's image blit's\n  // existing fit-center-within-the-fixed-canvas behavior is unchanged, so\n  // every already-recorded op (which never had x/y) keeps replaying exactly\n  // as before. Infinite-mode imports always set both.\n  x?: number\n  y?: number\n}","truncated":false}],"IMPLICIT_LAYER_IDS":[{"path":"packages/shared/src/layers.ts","line":90,"kind":"const","snippet":"export const IMPLICIT_LAYER_IDS: readonly string[] = [BACKGROUND_LAYER_ID, INITIAL_LAYER_ID]","truncated":false}],"INITIAL_LAYER_ID":[{"path":"packages/shared/src/layers.ts","line":89,"kind":"const","snippet":"// The two layers every room starts with. Neither is ever produced by a\n// `layer_add` operation — they are baked into the client's initial\n// LayerState (see makeInitialLayerState) and therefore exist from seq 0 with\n// nothing in the operation log to prove it. Anything that reconstructs \"which\n// layers exist\" by folding over the log alone (the server's `aliveIds`\n// mirror, #289) MUST seed itself from this list, or it will treat the initial\n// layer as never-created and reject every delete/merge/transform touching it.\nexport const INITIAL_LAYER_ID = 'layer-1'\nexport const IMPLICIT_LAYER_IDS: readonly string[] = [BACKGROUND_LAYER_ID, INITIAL_LAYER_ID]","truncated":false}],"initLayer":[{"path":"apps/web/src/engine/index.ts","line":494,"kind":"method","snippet":"  initLayer(id: string): void","truncated":false}],"isLayerStateShape":[{"path":"packages/shared/src/layers.ts","line":50,"kind":"function","snippet":"/** (#623) Whether stored JSON is shaped like a LayerState, at the top level.\n *  The snapshot index hands back what some client once uploaded, typed\n *  `unknown` on the wire (see SnapshotIndex); this is the check that turns it\n *  into a LayerState, instead of a cast that would let a malformed row through\n *  to the engine. It does not walk the items — a bad item is the restore's to\n *  survive, the same as it always was. */\nexport function isLayerStateShape(value: unknown): value is LayerState {\n  if (typeof value !== 'object' || value === null) return false\n  if (!('items' in value) || !('rootOrder' in value) || !('activeId' in value) || !('selectedIds' in value)) return false\n  const { items, rootOrder, activeId, selectedIds } = value\n  return typeof items === 'object' && items !== null && !Array.isArray(items)\n    && Array.isArray(rootOrder) && rootOrder.every(id => typeof id === 'string')\n    && typeof activeId === 'string'\n    && Array.isArray(selectedIds)\n}","truncated":false}],"isRoomAccessMode":[{"path":"packages/shared/src/room.ts","line":25,"kind":"function","snippet":"/** (#232) The wire type is a compile-time promise, and a socket payload is\n *  not compiled by us — this is what stands between a hand-crafted\n *  `accessMode: \"public\"` and a Postgres enum that cannot hold it. Without\n *  it that write fails, and since room creation is persisted fire-and-forget\n *  (rooms.ts), the room would exist in memory with no row behind it. */\nexport function isRoomAccessMode(value: unknown): value is RoomAccessMode {\n  return typeof value === 'string' && (ROOM_ACCESS_MODES as readonly string[]).includes(value)\n}","truncated":false}],"isToggleableTool":[{"path":"packages/shared/src/toolset.ts","line":37,"kind":"function","snippet":"export function isToggleableTool(value: unknown): value is ToggleableTool {\n  return typeof value === 'string' && (TOGGLEABLE_TOOLS as readonly string[]).includes(value)\n}","truncated":false}],"JoinDenial":[{"path":"packages/shared/src/protocol.ts","line":47,"kind":"type","snippet":"/** Result of a `create_room`/`join_room` attempt. `not_found` means no room\n *  has been registered under that id, in memory or in Postgres (#74);\n *  `wrong_password` means the room exists but the supplied password didn't\n *  match. On success, `userId` is the caller's server-resolved identity\n *  (from the identity cookie, #41) — the client uses this instead of its own\n *  ephemeral Socket.IO connection id for everything identity-shaped (stamping\n *  outgoing operations, engine.setUserId), since that id is otherwise the\n *  only stable one across reconnects. */\n/** (#225) Every way a join can fail to seat someone. Three of these are not\n *  really failures of the request but states of the *person* asking, which is\n *  why they are worth distinguishing in the wire contract rather than\n *  collapsing into one refusal — the join screen renders a different thing for\n *  each (#231):\n *\n *  - `access_revoked` — the owner blocked this user from this room. Terminal:\n *    nothing the client can do changes it.\n *  - `login_required` — an `invite_only` room's allow-list is keyed by email,\n *    and this browser is an anonymous guest with none. Signing in is the one\n *    move that can change the answer.\n *  - `pending_approval` — the request has been recorded and is waiting for the\n *    owner. The only one of these that resolves on its own, by someone else's\n *    action.\n *\n *  Deliberately no `access_denied`: a denied request reopens as pending on the\n *  next attempt (see roomAccess.ts), so \"denied\" is never a state the joiner\n *  sits in and never a thing the client has to render.\n *\n *  (#415, трек #314 §1) `server_busy` — единственная из причин, которая не про\n *  спрашивающего и не про комнату, а про коробку: сервер у потолка кучи, и\n *  холодная загрузка ещё одной комнаты — та самая аллокация, после которой\n *  падает процесс и с ним все идущие уроки разом. Отказать одному входящему\n *  дешевле, и он единственный, кому в этот момент ещё можно помочь.\n *\n *  Проходит только по холодному пути: комна
