# Карта архитектуры — то, что не принадлежит ни одному модулю (#642).
#
# Модуль — это папка с README.md. В шапке README — его слой (`layer`) и подпись для карты
# (`summary`), в теле — за что он отвечает. Здесь модули не описываются: здесь только
#
#   parts, layers  части системы и слои — порядок и правило «кто кого может импортировать»;
#                  из них `.dependency-cruiser.cjs` генерирует правила layer-*, и
#                  `npm run map:rules` падает на новом импорте против слоёв;
#   groupings      группы файлов внутри больших плоских папок — группировка карты, в коде её
#                  нет; уходит отсюда, когда папку раскладывают по подпапкам (#646–#649);
#   budgets        потолки длины отдельных файлов;
#   flows          что происходит во времени.
#
#   npm run map        собрать docs/architecture/map.html
#   npm run map:check  упасть, если код и карта разошлись
#   npm run map:rules  упасть на новом нарушении слоёв и других границ
#
# Как завести модуль и что делать, когда CI красный, — docs/architecture/README.md.

# ------------------------------------------------------------------ части и слои
#
# Порядок слоёв — порядок зависимости слева направо: модуль может импортировать модули своего
# слоя и слоёв правее, но не левее. Сверх того часть (`part`) может импортировать другую часть,
# только если та указана в её `uses`: клиент не импортирует сервер и наоборот, движок не знает
# приложения, контракт — лист.
#
# Что эти правила заменили (раньше это были отдельные правила в .dependency-cruiser.cjs):
#   engine-knows-no-app  движок не лезет в стор, компоненты, страницы, i18n — слои движка
#                        правее всего клиента, а часть engine использует только contract;
#   store-holds-no-ui    стор держит состояние, не React — state правее ui-kit и editor;
#   server-has-no-client сервер никогда не рендерит — часть server не использует client;
#   shared-is-a-leaf     packages/shared импортируют все, а он никого — shared крайний справа
#                        и part contract ничего не uses.

parts:
  - id: build
    title: Сборка и проверки
    uses: [client, engine, server, contract]
  - id: client
    title: Клиент
    uses: [engine, contract]
  - id: engine
    title: Движок
    uses: [contract]
  - id: server
    title: Сервер
    uses: [contract]
  - id: contract
    title: Общий контракт

layers:
  - id: tooling
    title: Инструменты
    part: build
  - id: shell
    title: Оболочка
    part: client
  - id: screens
    title: Экраны
    part: client
  - id: editor
    title: Редактор
    part: client
    note: >-
      Был разделён на «вид» и «логику», но оба слоя состояли из файлов одной плоской папки
      pages/Room — это теперь её подпапки (#646).
  - id: ui-kit
    title: Компоненты
    part: client
  - id: state
    title: Состояние
    part: client
  - id: platform
    title: Платформа
    part: client
  - id: engine-api
    title: API движка
    part: engine
  - id: engine-internals
    title: Внутренности движка
    part: engine
  - id: server
    title: Сервер
    part: server
    note: >-
      HTTP, реальное время и точка входа — подпапки server/src (#649): комнаты, их REST, вход,
      админка, здоровье процесса и обвязка REST. Клиент Prisma — слоем правее.
  - id: server-infra
    title: Инфраструктура
    part: server
  - id: shared
    title: Контракт
    part: contract

# ------------------------------------------------------------------ группы внутри модулей
#
# Группировка карты, в коде её нет. Ключ — папка модуля, который группа делит; `files` —
# globs от корня репозитория, только внутри этой папки. Тест попадает в группу своего
# предмета сам (`outbox.test.ts` — туда же, где `outbox.ts`). Файл, который не попал ни в одну
# группу, остаётся в модуле и показан на карте «вне групп» — это не ошибка: модуль — папка.
# Ссылаться на группу (из потоков, runtime.yaml, understanding.yaml) можно по её id, как на
# модуль.

groupings:
  apps/web/scripts:
    - id: build-assets
      title: Запекание ассетов
      owns: >-
        Офлайн-генерация всего, что нельзя считать в рантайме: текстуры бумаги, иконки
        приложения, subset-шрифт Material Symbols и образцы мазков цифровых кистей. Результат
        коммитится, поэтому сборка не зависит ни от GPU, ни от сети.
      files:
        - apps/web/scripts/bakePaperTextures.ts
        - apps/web/scripts/bakeWatercolorNoise.ts
        - apps/web/scripts/bakeAppIcons.ts
        - apps/web/scripts/bakeIconFont.ts
        - apps/web/scripts/bakeBrushSamples.ts
        - apps/web/scripts/paperAssetIO.ts
      notes:
        - >-
          `npm run build` чистит public/paper на ~2 минуты и перезапекает его. Тесты
          paperAssets, запущенные в это окно, молча скипаются — гонять их надо не во время
          сборки.
        - >-
          bakeBrushSamples — единственный бейк, которому нужен браузер и поднятый дев-стек:
          образец мазка рисует сам движок настоящим пером через CDP. Иначе картинку пришлось бы
          перерисовывать вручную при каждой правке кисти, и она бы врала.
        - >-
          Единственные скрипты, которым можно лезть в engine/src напрямую: они запекают ровно
          то, что движок потом читает, и общего публичного API для этого нет.
      tags: [ассеты, оффлайн]

    - id: build-dist
      title: Пред-сжатие дистрибутива
      owns: >-
        Постобработка сборки: brotli/gzip рядом с каждым подходящим файлом, чтобы nginx на VPS
        раздавал готовое, а не жал на лету.
      files:
        - apps/web/scripts/precompressDist.ts
        - apps/web/scripts/precompressPolicy.ts
        - apps/web/scripts/precompress.test.ts
      notes:
        - >-
          Никогда не называй вручную разжатый файл с расширением .gz — статик-сервер сам добавит
          Content-Encoding, и браузер разожмёт содержимое второй раз.
      tags: [деплой]

  apps/web/src/components:
    - id: ui-layers
      title: Панель слоёв
      owns: >-
        Дерево слоёв и папок: перетаскивание на любую глубину, мультивыделение, слияние,
        видимость и блокировка, перенос в папку.
      files:
        - apps/web/src/components/LayerPanel/**
        - apps/web/src/components/MoveToDialog/**
      adr: [001-layer-panel-dnd]
      notes:
        - >-
          Правило «папка не может стать своим потомком» проверяется в applyMove, то есть при
          реплее, а не только в обработчике перетаскивания: операции сворачивает каждый клиент,
          и цикл повесил бы всю комнату разом.
      tags: [слои, dnd]

    - id: ui-color
      title: Цвет
      owns: >-
        Всё, чем цвет инструмента показывается и меняется: колодец (кружок, у которого кольцо —
        обводка, а ядро — заливка), поповер вокруг него, сам пикер во всех режимах и палитра
        комнаты, общая для участников.
      files:
        - apps/web/src/components/ColorWell/**
        - apps/web/src/components/ColorFlyout/**
        - apps/web/src/components/ColorPicker/**
        - apps/web/src/components/PaletteBar/**
      issues: [542]
      notes:
        - >-
          Колодец — один глиф на все места, где показывается цвет: закреплённый в шапке рейла,
          центр плавающей панели, оба кружка внутри самого поповера. До #542 их было три разных,
          и следующий цветной инструмент завёл бы четвёртый.
        - >-
          Кольцо колодца — индикатор, а не мишень: оно 7-8px, а плавающая панель рассчитана на
          палец. Переключение обводки и заливки живёт в поповере и в радиальном веере панели,
          где элементы 40px, и никогда не требует попасть в полосу.
      tags: [цвет]

    - id: ui-tool-panel
      title: Плавающая панель и контролы
      owns: >-
        Плавающая панель инструментов со слотами и её выпадашки, плюс переиспользуемые контролы
        параметров: точный ползунок, радиальный диск, числовое поле, выбор из вариантов.
      files:
        - apps/web/src/components/FloatingToolPanel/**
        - apps/web/src/components/OptionPicker/**
        - apps/web/src/components/ToolGroupButton/**
        - apps/web/src/components/OptionGroup/**
        - apps/web/src/components/RadialDial/**
        - apps/web/src/components/PrecisionSlider/**
        - apps/web/src/components/NumberField/**
      notes:
        - >-
          Панель по умолчанию скрыта: для проверки мышью нужен `al_floating_panel='always'`, для
          настоящего касания — планшет с минимальным UI.
        - >-
          ToolGroupButton (#544) — кнопка рейки, за которой лежит группа инструментов: тап берёт
          текущий, повторный тап или удержание открывают тот же список, что и выбор мягкости
          карандаша. Сам вид кнопки приходит классом из Room.module.css — рейка задаёт, как
          выглядят её кнопки, и эта не должна отличаться от соседних.
      tags: [инструменты, планшет]

    - id: ui-chrome
      title: Общая обвязка интерфейса
      owns: >-
        Всё, что не про рисование: шапка, меню аккаунта, логотип, иконки, меню и карточные меню,
        боковая панель, модалки и диалоги подтверждения, уведомления, пустые состояния, поля
        настроек, переключатели, ввод текста.
      files:
        - apps/web/src/components/AppHeader/**
        - apps/web/src/components/AccountNav/**
        - apps/web/src/components/Logo.*
        - apps/web/src/components/Icon.tsx
        - apps/web/src/components/Menu/**
        - apps/web/src/components/CardMenu/**
        - apps/web/src/components/SidePanel/**
        - apps/web/src/components/Modal/**
        - apps/web/src/components/ConfirmDialog/**
        - apps/web/src/components/Notice/**
        - apps/web/src/components/AppErrorBoundary.*
        - apps/web/src/components/StatusCard.*
        - apps/web/src/components/ListState/**
        - apps/web/src/components/SettingsPanel/**
        - apps/web/src/components/SettingField/**
        - apps/web/src/components/Switch/**
        - apps/web/src/components/TextInput/**
      tags: [ui]

    - id: ui-toolset
      title: Выбор набора инструментов
      owns: >-
        Какие инструменты вообще доступны в комнате. Это не настройка удобства, а учительский
        приём: «сегодня работаем карандашом». Компонент отдаёт наружу ровно то значение, которое
        несёт `Room.enabledTools`, без собственного кодирования.
      files:
        - apps/web/src/components/ToolSetPicker/**
        - apps/web/src/components/ClassVisibilityField/**
      issues: [548]
      notes:
        - >-
          Пустого набора не бывает: список, в котором не осталось материала, — это не набор, а
          комната, в которой никто не может рисовать. Санитизация живёт в общем контракте
          (`sanitizeEnabledTools`), а не здесь.
      tags: [инструменты, урок]

    - id: ui-room-access
      title: Управление доступом
      owns: >-
        Кто может войти в комнату: режим доступа, приглашения, заявки на вход.
      files:
        - apps/web/src/components/RoomAccessControl/**
      tags: [доступ]

    - id: ui-paper
      title: Превью бумаги
      owns: >-
        Показ образца бумаги вне холста — на создании комнаты и в настройках. Единственный
        компонент со своим WebGL-контекстом.
      files:
        - apps/web/src/components/PaperPreview/**
      tags: [бумага, webgl]

    - id: ui-pressure
      title: Калибровка нажима
      owns: >-
        Мастер калибровки пера: замер реального диапазона нажима устройства и подгонка кривой
        под руку.
      files:
        - apps/web/src/components/PressureCalibration/**
      tags: [перо]

    - id: ui-filters
      title: Диалог фильтров слоя
      owns: >-
        Плавающая карточка фильтра: выбор фильтра, его настройки, редактор кривых, предпросмотр
        на холсте и «Применить». Не Modal — затемнение спрятало бы сам предпросмотр.
      files:
        - apps/web/src/components/FilterPanel/**
      adr: [014-layer-filters]
      issues: [574]
      tags: [фильтры]

  apps/web/src/stores:
    - id: store-room
      title: Стор комнаты
      owns: >-
        Единственный глобальный стор приложения: слои, вьюпорт, инструмент и пресеты, цвет,
        выделение, аннотации, данные комнаты, текущий штрих. Разрезан на слайсы, но это один
        стор, и `resetRoomStore()` чистит его на каждый монтаж комнаты.
      files:
        - apps/web/src/stores/roomStore.ts
        - apps/web/src/stores/roomStore.test.ts
        - apps/web/src/stores/resetBoardState.test.ts
        - apps/web/src/stores/slices/**
      issues: [25]
      notes:
        - >-
          Состояние стора — отражение того, что уже применено к движку императивным вызовом,
          никогда не источник правды для движка.
      tags: [zustand, единый-стор]

    - id: store-app
      title: Сторы вне комнаты
      owns: >-
        То, что переживает комнату: настройки приложения (язык), очередь уведомлений, буфер
        обмена. Сознательное исключение из правила «один стор».
      files:
        - apps/web/src/stores/settingsStore.ts
        - apps/web/src/stores/noticeStore.ts
        - apps/web/src/stores/noticeStore.test.ts
        - apps/web/src/stores/clipboardStore.ts
      adr: [006-i18n]
      tags: [zustand, настройки]

  packages/shared:
    - id: shared-contract
      title: Общие типы и операции
      owns: >-
        Единственный контракт между клиентом и сервером: тип `Operation` и все его варианты,
        сущности комнаты и участника, события сокета в обе стороны, общие константы. Каждое
        действие рисования сериализуемо с первого дня. С #613 — по модулю на домен (слои,
        бумага, комната, набор инструментов, штрих, слоевые и областные операции, фигуры,
        фильтры, аннотации, объединение операций, протокол, хоткеи); index.ts — только
        оглавление, и все по-прежнему импортируют `@grafetto/shared`. С #623 тот же контракт и у
        REST: таблица маршрутов rest.ts, через которую сервер регистрирует роуты (apiRoute.ts),
        а клиент их зовёт (lib/api/api.ts).
      files:
        - packages/shared/src/index.ts
        - packages/shared/src/layers.ts
        - packages/shared/src/paper.ts
        - packages/shared/src/room.ts
        - packages/shared/src/toolset.ts
        - packages/shared/src/operationBase.ts
        - packages/shared/src/stroke.ts
        - packages/shared/src/layerOperations.ts
        - packages/shared/src/areaOperations.ts
        - packages/shared/src/shapes.ts
        - packages/shared/src/layerFilters.ts
        - packages/shared/src/annotations.ts
        - packages/shared/src/operations.ts
        - packages/shared/src/protocol.ts
        - packages/shared/src/hotkeys.ts
        - packages/shared/src/rest.ts
        - packages/shared/src/rest.test.ts
        - packages/shared/src/admin.ts
        - packages/shared/src/admin.test.ts
        - packages/shared/src/rejectReason.test.ts
        - packages/shared/src/transformMatrix.test.ts
        - packages/shared/src/toolset.test.ts
        - packages/shared/src/shapeBounds.test.ts
      tags: [контракт, операции]

    - id: shared-dab-codec
      title: Кодек дабов
      owns: >-
        Упаковка дабов в компактный проводной формат и обратно — то, что делает поток штриха
        достаточно дешёвым для настоящего интернета, а не только для локальной сети.
      files:
        - packages/shared/src/dabCodec.ts
        - packages/shared/src/dabCodec.test.ts
      tags: [контракт, сжатие]

# ------------------------------------------------------------------ бюджеты размера

# (#493) Потолки длины отдельных файлов. Это храповик: вынес код — опусти
# потолок в том же изменении; поднимать его можно только отдельной строкой с
# причиной в коммите. `map:check` падает, когда файл перерос свой бюджет, и
# подсказывает, когда его можно ужать.
budgets:
  - file: apps/web/src/pages/Room/index.tsx
    maxLines: 1820
    why: >-
      За месяц декомпозиции (#493) из Room вынесли около тысячи строк, а доски,
      класс и аннотации добавили примерно столько же — каждая новая фича
      приезжала в этот файл. Без потолка это беговая дорожка. +9 (#536):
      подключение акварели — шлюз подтверждений на время кусочной загрузки
      хвоста, оверлей «графика перестала работать», dev-флаги, кнопка
      «высушить всё»; сами модули лежат рядом. 3414 → 1817 (#493, конец):
      выбор инструмента, приём операций, поток доски, outbox, публикация
      снапшота, потерянная работа, минимальный интерфейс, тела эффектов сокета
      и движка, пять компонентов разметки — всё рядом, в index.tsx вызовы.
      +2 (#728): передача roomId/failure в вынесенный historical repair hook
      и подключение typed engine notification; walker и восстановление остаются
      в отдельных модулях, тело алгоритма в Room не добавляется.
      +1 (#728): constructor opt-in asyncFinish для существующего FIFO движка;
      в Room только настройка, очередь и material ownership остаются в Engine.

# ======================================================================== потоки
#
# То, чего из импортов не вывести: что происходит во времени. Рисуется руками, проверяется
# глазами — но каждый шаг привязан к модулю или группе, и `map:check` падает, если их нет.

flows:
  - id: stroke
    title: Штрих — от пера до чужого экрана
    intro: >-
      Главный путь приложения. Всё в нём устроено так, чтобы линия появлялась под пером
      мгновенно и локально, а сеть догоняла потом.
    steps:
      - id: pointer
        title: Событие указателя
        module: apps/web/src/engine/src/input
        side: client
        detail: >-
          PointerInput принимает нажим, наклон и скорость (по часам сэмпла, не обработчика)
          и переводит экранные координаты в координаты холста аналитически, через setTransform.
      - id: dabs
        title: Сплайн и дабы
        module: apps/web/src/engine/src/dabs
        side: client
        detail: >-
          Точки укладываются на сплайн Catmull-Rom, по нему с нужным шагом расставляются дабы,
          форма каждого берётся из пресета инструмента и отпечатка кончика.
      - id: raster
        title: Растеризация в буфер
        module: apps/web/src/engine/src/buffers
        side: client
        detail: >-
          Дабы рисуются в аккумуляционный буфер штриха, затем — в тайлы слоя. Пользователь видит
          линию здесь, до всякой сети.
      - id: op
        title: Операция
        module: apps/web/src/engine/src/oplog
        side: client
        detail: >-
          Завершённый штрих становится сериализуемой Operation. Это же значение потом уедет
          на сервер, ляжет в историю и будет свёрнуто при реплее у всех остальных.
      - id: pack
        title: Упаковка дабов
        module: shared-dab-codec
        side: wire
        detail: >-
          Дабы пакуются в компактный проводной формат — иначе поток не проходит по реальному
          каналу, а не только по локальной сети.
      - id: outbox
        title: Исходящая очередь
        module: apps/web/src/pages/Room/net
        side: client
        detail: >-
          Операция кладётся в outbox и переживает потерю связи и перезагрузку страницы.
          Локально она применена оптимистично, до подтверждения.
      - id: emit
        title: emit operation
        module: shared-contract
        side: wire
        detail: >-
          Сокет отправляет `operation`; параллельно, пока рука ещё ведёт, идут `stroke_live`
          с частичными дабами и `cursor_move`.
      - id: relay
        title: Сервер присваивает seq и ретранслирует
        module: apps/server/src/rooms
        side: server
        detail: >-
          Комната в памяти даёт операции порядковый номер, рассылает `operation_confirmed`
          всем и `peer_stroke_live` — соседям. Сервер ничего не рисует.
      - id: persist
        title: Запись в Postgres
        module: apps/server/src/db
        side: server
        detail: >-
          Запись идёт fire-and-forget, её не ждут на горячем пути: задержка БД не должна
          добавляться к задержке рисования.
      - id: peer
        title: Чужой клиент сворачивает операцию
        module: apps/web/src/engine
        side: client
        detail: >-
          У остальных участников та же операция применяется к их движку. Картинка сходится
          не потому, что кто-то прислал пиксели, а потому что все свернули один и тот же лог.

  - id: join
    title: Вход в комнату и восстановление картинки
    intro: >-
      Второй по важности путь: он решает, увидит ли учитель свою работу через неделю и сколько
      секунд он будет её ждать.
    steps:
      - id: gate
        title: Ворота входа
        module: apps/web/src/pages/Room/net
        side: client
        detail: >-
          Клиент встаёт в очередь входа и держит канвас закрытым, пока не решено, что именно
          восстанавливать: чужие операции, прилетевшие в это окно, не должны нарисоваться дважды.
      - id: join_room
        title: join_room
        module: shared-contract
        side: wire
        detail: >-
          В запросе едет максимальный seq, который у клиента уже есть, — чтобы сервер не слал
          заново то, что вкладка не теряла.
      - id: room_state
        title: room_state
        module: apps/server/src/rooms
        side: server
        detail: >-
          Сервер отдаёт комнату, участников, палитру, статус заморозки, номер последнего
          снапшота и хвост операций. Что именно вырезано из хвоста, решается по каждому слою
          отдельно, против его собственного покрытия — общий порог по комнате однажды уже
          съел рисунок.
      - id: fetch
        title: Загрузка снапшотов
        module: apps/server/src/roomRoutes
        side: server
        detail: >-
          Клиент сам забирает индекс снапшотов и по блобу на слой обычным HTTP — по сокету
          это не едет.
      - id: decode
        title: Раскодирование и ретайлинг
        module: apps/web/src/engine/src/oplog
        side: client
        detail: >-
          Блобы распаковываются и раскладываются по тайлам слоёв — при этом сетка тайлов может
          не совпадать с той, в которой снапшот пекли.
      - id: replay
        title: Реплей хвоста
        module: apps/web/src/engine
        side: client
        detail: >-
          Поверх восстановленных пикселей сворачивается хвост операций. Операции, несущие и
          пиксели, и структуру, приходят всегда, а их пиксельную половину клиент пропускает
          сам — против того покрытия, которое реально восстановил.
      - id: report
        title: Отчёт о восстановлении
        module: apps/web/src/pages/Room/diagnostics
        side: client
        detail: >-
          Что восстановилось, за сколько и не потерялось ли — уходит в отчёт. Это то, чем мы
          узнаём о сбое раньше учителя.

  - id: undo
    title: Отмена в четыре руки
    intro: >-
      Отмена в общей комнате — не стек. Разбор того, почему именно так, лежит в ADR 002.
    steps:
      - id: request
        title: Клиент просит отменить своё
        module: apps/web/src/pages/Room/net
        side: client
        detail: >-
          Отменяется собственная операция участника по её идентификатору, а не «последнее
          действие в комнате».
      - id: server_undo
        title: Сервер выпускает обратную операцию
        module: apps/server/src/rooms
        side: server
        detail: >-
          Отмена сама становится операцией в общем логе и получает свой seq — иначе порядок
          у разных участников разъедется.
      - id: fold
        title: Все сворачивают её одинаково
        module: apps/web/src/engine
        side: client
        detail: >-
          Структурная отмена возвращает удалённый слой по его id. Пиксели при этом придут
          только если строка RoomLayerState цела.
