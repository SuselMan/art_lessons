# Карта архитектуры — рукописная половина.
#
# Здесь живёт только то, чего нет в коде: за что модуль отвечает и почему он существует.
# Всё измеримое — связи, размеры, дубли, история правок, нарушения правил — снимается
# из репозитория при каждой сборке карты и сюда не пишется никогда.
#
#   npm run map        собрать docs/architecture/map.html
#   npm run map:check  упасть, если код и карта разошлись
#
# Правило одно: каждый файл в apps/, packages/, scripts/ и e2e/ принадлежит ровно одному
# модулю. Новая папка без описания = красный CI. Это единственное, что не даёт карте протухнуть.
#
# Порядок слоёв в `layers` — это порядок зависимости слева направо. Связь справа налево
# рисуется красным: что-то глубокое тянется наверх.

groups:
  - id: build
    title: Сборка и проверки
  - id: client
    title: Клиент
  - id: engine
    title: Движок
  - id: server
    title: Сервер
  - id: contract
    title: Общий контракт

layers:
  - id: tooling
    title: Инструменты
    group: build
  - id: shell
    title: Оболочка
    group: client
  - id: screens
    title: Экраны
    group: client
  - id: editor-ui
    title: Редактор — вид
    group: client
  - id: editor-logic
    title: Редактор — логика
    group: client
  - id: ui-kit
    title: Компоненты
    group: client
  - id: state
    title: Состояние
    group: client
  - id: platform
    title: Платформа
    group: client
  - id: engine-api
    title: API движка
    group: engine
  - id: engine-internals
    title: Внутренности движка
    group: engine
  - id: server-http
    title: HTTP
    group: server
  - id: server-realtime
    title: Реальное время
    group: server
  - id: server-infra
    title: Инфраструктура
    group: server
  - id: shared
    title: Контракт
    group: contract

modules:
  # ------------------------------------------------------------------ сборка

  - id: build-assets
    title: Запекание ассетов
    layer: tooling
    owns: >-
      Офлайн-генерация всего, что нельзя считать в рантайме: текстуры бумаги, иконки приложения,
      subset-шрифт Material Symbols и образцы мазков цифровых кистей. Результат коммитится,
      поэтому сборка не зависит ни от GPU, ни от сети.
    files:
      - apps/web/scripts/bakePaperTextures.ts
      - apps/web/scripts/bakeAppIcons.ts
      - apps/web/scripts/bakeIconFont.ts
      - apps/web/scripts/bakeBrushSamples.ts
      - apps/web/scripts/paperAssetIO.ts
    notes:
      - >-
        `npm run build` чистит public/paper на ~2 минуты и перезапекает его. Тесты paperAssets,
        запущенные в это окно, молча скипаются — гонять их надо не во время сборки.
      - >-
        bakeBrushSamples — единственный бейк, которому нужен браузер и поднятый дев-стек: образец
        мазка рисует сам движок настоящим пером через CDP. Иначе картинку пришлось бы
        перерисовывать вручную при каждой правке кисти, и она бы врала.
      - >-
        Единственные скрипты, которым можно лезть в engine/src напрямую: они запекают ровно то,
        что движок потом читает, и общего публичного API для этого нет.
    tags: [ассеты, оффлайн]

  - id: build-dist
    title: Пред-сжатие дистрибутива
    layer: tooling
    owns: >-
      Постобработка сборки: brotli/gzip рядом с каждым подходящим файлом, чтобы nginx на VPS
      раздавал готовое, а не жал на лету.
    files:
      - apps/web/scripts/precompressDist.ts
      - apps/web/scripts/precompressPolicy.ts
      - apps/web/scripts/precompress.test.ts
    notes:
      - >-
        Никогда не называй вручную разжатый файл с расширением .gz — статик-сервер сам добавит
        Content-Encoding, и браузер разожмёт содержимое второй раз.
    tags: [деплой]

  - id: build-config
    title: Конфиг сборки
    layer: tooling
    owns: >-
      Vite: PWA-плагин, dev-сервер с `--host` для планшетов в локальной сети, режимы http/https.
    files:
      - apps/web/vite.config.ts
    tags: [vite]

  - id: e2e
    title: E2E-стенд
    layer: tooling
    owns: >-
      Playwright-сценарии поверх настоящего браузера и настоящего сервера — единственное место,
      где проверяется то, что vitest с mock-WebGL проверить не может: реальные пиксели и реальный
      ввод пером.
    files:
      - e2e/**
    notes:
      - >-
        Свежему worktree нужен `npm run bake:paper` до первого прогона, иначе бумага не грузится.
      - >-
        Порты 4491/5491 умеет держать брошенный прогон из соседнего worktree.
    tags: [playwright, реальный-браузер]

  - id: server-tools
    title: Нагрузка и замеры сервера
    layer: tooling
    owns: >-
      Разовые скрипты: синтетический нагрузочный прогон комнаты, замер памяти на комнату,
      генерация синтетических штрихов.
    files:
      - apps/server/src/scripts/**
    tags: [профилирование]

  - id: archmap
    title: Эта карта
    layer: tooling
    owns: >-
      Генератор карты архитектуры: снимает граф импортов (dependency-cruiser), повторы (jscpd)
      и историю правок, склеивает с описаниями из map.yaml и рендерит одну самодостаточную
      HTML-страницу. `map:check` падает, когда код и карта разошлись.
    files:
      - scripts/archmap/**
    issues: [549]
    tags: [документация]

  # ------------------------------------------------------------------ оболочка

  - id: app-shell
    title: Оболочка приложения
    layer: shell
    owns: >-
      Точка входа, роутер, провайдеры (react-query, Sentry, i18n), глобальная загрузка бумаги
      и выбор экрана. Всё, что живёт дольше любой комнаты.
    files:
      - apps/web/src/App.tsx
      - apps/web/src/main.tsx
    tags: [роутинг, вход]

  - id: pwa
    title: PWA и service worker
    layer: shell
    owns: >-
      Service worker, политика обновления версии и обработка навигационных ответов — то, что
      делает приложение устанавливаемым и переживающим потерю сети.
    files:
      - apps/web/src/pwa/**
    notes:
      - >-
        При диагностике прода сначала сверь хеш загруженного бандла: SW отдаёт сборку,
        которая была до деплоя, и симптом легко списать не на то.
    tags: [оффлайн, обновления]

  # ------------------------------------------------------------------ экраны

  - id: screen-auth
    title: Вход
    layer: screens
    owns: >-
      Беспарольный вход по коду на email — экран ввода адреса и кода.
    files:
      - apps/web/src/pages/Auth/**
    tags: [аккаунты]

  - id: screen-lessons
    title: Мои уроки
    layer: screens
    owns: >-
      Личный кабинет: список комнат и папок, переименование, перенос, форк, выдача домашки.
      Единственный экран, где комнатой управляют, а не рисуют в ней.
    files:
      - apps/web/src/pages/MyLessons/**
    tags: [аккаунты, комнаты]

  - id: screen-create-room
    title: Создание комнаты
    layer: screens
    owns: >-
      Выбор бумаги, размера холста (или бесконечного), режима доступа — и первый `create_room`
      по сокету.
    files:
      - apps/web/src/pages/CreateRoom/**
    tags: [комнаты]

  - id: screen-settings
    title: Настройки приложения
    layer: screens
    owns: >-
      Общие настройки, которые переживают любую комнату — сейчас это язык.
    files:
      - apps/web/src/pages/Settings/**
    adr: [006-i18n]
    tags: [настройки]

  # ------------------------------------------------------------------ редактор: вид

  - id: room-shell
    title: Экран комнаты
    layer: editor-ui
    owns: >-
      Сборка всего редактора: канвас, движок, сокет, панели, горячие клавиши, жесты. Держит
      `engineRef` и императивный конвейер указателя — единственное место, где WebGL-движок
      встречается с React.
    files:
      - apps/web/src/pages/Room/index.tsx
      - apps/web/src/pages/Room/Room.module.css
    issues: [25]
    notes:
      - >-
        Самый крупный файл проекта. Миграция состояния редактора в store (#19→#24) закончена,
        но этот файл остался точкой сборки — он тянет ~100 модулей.
      - >-
        Граница, которую он держит: store — отражение того, что уже применено к движку
        императивным вызовом, а не источник правды для движка.
    tags: [точка-сборки, крупный]

  - id: room-overlays
    title: Слои поверх холста
    layer: editor-ui
    owns: >-
      Всё, что рисуется поверх канваса и живёт в экранных координатах: сетка, линейка, рамка
      выделения, гизмо трансформации, курсоры соседей, кисть-курсор, диск угла грифеля,
      аннотации.
    files:
      - apps/web/src/pages/Room/GridOverlay.*
      - apps/web/src/pages/Room/RulerOverlay.*
      - apps/web/src/pages/Room/SelectionOverlay.*
      - apps/web/src/pages/Room/TransformGizmo.*
      - apps/web/src/pages/Room/PeerCursors.*
      - apps/web/src/pages/Room/BrushCursor.*
      - apps/web/src/pages/Room/ChiselAngleDial.*
      - apps/web/src/pages/Room/AnnotationOverlay.*
    adr: [008-selection]
    tags: [оверлеи]

  - id: room-status
    title: Баннеры состояния
    layer: editor-ui
    owns: >-
      Вся обратная связь о том, что происходит с комнатой и связью: подключение, заморозка,
      закрытие, оффлайн, не загрузилась бумага, идёт восстановление, потерялась работа,
      статус синхронизации, ворота входа.
    files:
      - apps/web/src/pages/Room/ConnectionBanner.*
      - apps/web/src/pages/Room/ClosedBanner.*
      - apps/web/src/pages/Room/FrozenBanner.*
      - apps/web/src/pages/Room/LostWorkBanner.*
      - apps/web/src/pages/Room/OfflineRoomOverlay.*
      - apps/web/src/pages/Room/PaperFailedOverlay.*
      - apps/web/src/pages/Room/RoomLoadingOverlay.*
      - apps/web/src/pages/Room/SyncIndicator.*
      - apps/web/src/pages/Room/ViewportToast.*
      - apps/web/src/pages/Room/JoinGate.*
      - apps/web/src/pages/Room/RoomFailureOverlay.*
      - apps/web/src/pages/Room/RestoreFailedOverlay.*
    notes:
      - >-
        RoomFailureOverlay — общая форма «комната не открылась», RestoreFailedOverlay
        подставляет в неё причину. Причин ровно две, и они не взаимозаменяемы: пиксели не
        доехали по сети (#533) или доехали и упали при выкладке на экран (#538). Назвать
        человеку не ту причину — это стоить ему следующей попытки.
    tags: [состояние-связи]

  - id: room-panels
    title: Панели комнаты
    layer: editor-ui
    owns: >-
      Список участников с управлением доступом и dev-панель тюнинга звука карандаша.
    files:
      - apps/web/src/pages/Room/ParticipantsPanel.*
      - apps/web/src/pages/Room/PencilSoundTuningPanel.*
    tags: [панели]

  # ------------------------------------------------------------------ редактор: логика

  - id: room-viewport
    title: Вьюпорт
    layer: editor-logic
    owns: >-
      Локальная камера пользователя `{cx, cy, zoom, angle}`: математика камеры, пинч, перевод
      координат указателя в холст, позиционирование плавающих панелей. У каждого участника своя —
      по сети не ездит.
    files:
      - apps/web/src/pages/Room/cameraMath.ts
      - apps/web/src/pages/Room/useViewport.ts
      - apps/web/src/pages/Room/pointerTransform.ts
      - apps/web/src/pages/Room/pinchTracker.ts
      - apps/web/src/pages/Room/useViewportToast.ts
      - apps/web/src/pages/Room/panelPosition.ts
      - apps/web/src/pages/Room/*.test.ts
    adr: [007-desktop-controls]
    tags: [камера, локальное]

  - id: room-net
    title: Сетевой слой комнаты
    layer: editor-logic
    owns: >-
      Всё между движком и сокетом: исходящая очередь операций и её сохранение на диск, оптимизм
      до подтверждения, догон пропущенного, очередь входа, ворота и восстановление снапшота,
      оживление сокета, статус синхронизации, троттлинг курсора.
    files:
      - apps/web/src/pages/Room/outbox.ts
      - apps/web/src/pages/Room/outboxStorage.ts
      - apps/web/src/pages/Room/optimism.ts
      - apps/web/src/pages/Room/pendingPreviews.ts
      - apps/web/src/pages/Room/catchUp.ts
      - apps/web/src/pages/Room/joinQueue.ts
      - apps/web/src/pages/Room/joinError.ts
      - apps/web/src/pages/Room/snapshotGate.ts
      - apps/web/src/pages/Room/snapshotRestore.ts
      - apps/web/src/pages/Room/snapshotSync.ts
      - apps/web/src/pages/Room/socketRevival.ts
      - apps/web/src/pages/Room/syncStatus.ts
      - apps/web/src/pages/Room/connectionNotice.ts
      - apps/web/src/pages/Room/cursorThrottle.ts
      - apps/web/src/pages/Room/cursorController.ts
    adr: [002-collaborative-undo]
    tags: [сеть, надёжность]

  - id: room-tools
    title: Инструменты и их параметры
    layer: editor-logic
    owns: >-
      Реестр инструментов: какие ползунки у какого инструмента, как ключ перевода превращается
      в подпись, кривые отклика на нажим и наклон, раскладка горячих клавиш редактора.
    files:
      - apps/web/src/pages/Room/toolSchemas.ts
      - apps/web/src/pages/Room/toolTypeImages.ts
      - apps/web/src/pages/Room/pressureResponseCurves.ts
      - apps/web/src/pages/Room/tiltResponseCurves.ts
      - apps/web/src/pages/Room/editorKeys.ts
    adr: [003-liner-tool, 004-marker-tool, 005-charcoal-tool, 009-brush-pen, 010-fill-tool, 011-watercolor, 013-digital-brush]
    notes:
      - >-
        Реестр хранит TranslationKey, а не готовую подпись — иначе инструмент нельзя перевести.
    tags: [инструменты, реестр]

  - id: room-gestures
    title: Жесты и касания
    layer: editor-logic
    owns: >-
      Разбор ввода до того, как он станет рисованием: тапы, последовательности тапов, порог
      «клик или движение», жест линейки, жест выделения, индикатор рисования.
    files:
      - apps/web/src/pages/Room/tapSequence.ts
      - apps/web/src/pages/Room/tapTracker.ts
      - apps/web/src/pages/Room/clickTracker.ts
      - apps/web/src/pages/Room/useCanvasTap.ts
      - apps/web/src/pages/Room/useTapToggle.ts
      - apps/web/src/pages/Room/rulerGesture.ts
      - apps/web/src/pages/Room/selectionGesture.ts
      - apps/web/src/pages/Room/drawingIndicator.ts
    tags: [ввод, планшет]

  - id: room-editing
    title: Выделение и трансформация
    layer: editor-logic
    owns: >-
      Операции над содержимым, а не над кистью: математика трансформации, попадание в аннотацию,
      куда лечь вставке из буфера, какой слой сейчас активен.
    files:
      - apps/web/src/pages/Room/transformMath.ts
      - apps/web/src/pages/Room/annotationHitTest.ts
      - apps/web/src/pages/Room/pastePlacement.ts
      - apps/web/src/pages/Room/activeLayer.ts
    adr: [008-selection]
    tags: [редактирование]

  - id: room-diagnostics
    title: Диагностика комнаты
    layer: editor-logic
    owns: >-
      Отчёты о том, как прошли открытие и восстановление: тайминги входа, что именно
      восстановилось из снапшота, была ли потеряна работа. Это то, по чему мы узнаём о сбое
      раньше учителя.
    files:
      - apps/web/src/pages/Room/reportOpen.ts
      - apps/web/src/pages/Room/reportRestore.ts
      - apps/web/src/pages/Room/restoreReport.ts
      - apps/web/src/pages/Room/openTiming.ts
      - apps/web/src/pages/Room/lostWork.ts
    tags: [наблюдаемость]

  - id: room-participants
    title: Участники
    layer: editor-logic
    owns: >-
      Список участников комнаты и правила отображаемого имени.
    files:
      - apps/web/src/pages/Room/participants.ts
      - apps/web/src/pages/Room/displayName.ts
    tags: [совместность]

  # ------------------------------------------------------------------ компоненты

  - id: ui-layers
    title: Панель слоёв
    layer: ui-kit
    owns: >-
      Дерево слоёв и папок: перетаскивание на любую глубину, мультивыделение, слияние,
      видимость и блокировка, перенос в папку.
    files:
      - apps/web/src/components/LayerPanel/**
      - apps/web/src/components/MoveToDialog/**
    adr: [001-layer-panel-dnd]
    notes:
      - >-
        Правило «папка не может стать своим потомком» проверяется в applyMove, то есть при
        реплее, а не только в обработчике перетаскивания: операции сворачивает каждый клиент,
        и цикл повесил бы всю комнату разом.
    tags: [слои, dnd]

  - id: ui-color
    title: Цвет
    layer: ui-kit
    owns: >-
      Выбор цвета во всех режимах и палитра комнаты, общая для участников.
    files:
      - apps/web/src/components/ColorPicker/**
      - apps/web/src/components/PaletteBar/**
    tags: [цвет]

  - id: ui-tool-panel
    title: Плавающая панель и контролы
    layer: ui-kit
    owns: >-
      Плавающая панель инструментов со слотами и её выпадашки, плюс переиспользуемые контролы
      параметров: точный ползунок, радиальный диск, числовое поле, выбор из вариантов.
    files:
      - apps/web/src/components/FloatingToolPanel/**
      - apps/web/src/components/OptionPicker/**
      - apps/web/src/components/OptionGroup/**
      - apps/web/src/components/RadialDial/**
      - apps/web/src/components/PrecisionSlider/**
      - apps/web/src/components/NumberField/**
    notes:
      - >-
        Панель по умолчанию скрыта: для проверки мышью нужен `al_floating_panel='always'`,
        для настоящего касания — планшет с минимальным UI.
    tags: [инструменты, планшет]

  - id: ui-chrome
    title: Общая обвязка интерфейса
    layer: ui-kit
    owns: >-
      Всё, что не про рисование: шапка, меню аккаунта, логотип, иконки, меню и карточные меню,
      боковая панель, модалки и диалоги подтверждения, уведомления, пустые состояния, поля
      настроек, переключатели, ввод текста.
    files:
      - apps/web/src/components/AppHeader/**
      - apps/web/src/components/AccountNav/**
      - apps/web/src/components/Logo.*
      - apps/web/src/components/Icon.tsx
      - apps/web/src/components/Menu/**
      - apps/web/src/components/CardMenu/**
      - apps/web/src/components/SidePanel/**
      - apps/web/src/components/Modal/**
      - apps/web/src/components/ConfirmDialog/**
      - apps/web/src/components/Notice/**
      - apps/web/src/components/ListState/**
      - apps/web/src/components/SettingsPanel/**
      - apps/web/src/components/SettingField/**
      - apps/web/src/components/Switch/**
      - apps/web/src/components/TextInput/**
    tags: [ui]

  - id: ui-toolset
    title: Выбор набора инструментов
    layer: ui-kit
    owns: >-
      Какие инструменты вообще доступны в комнате. Это не настройка удобства, а учительский
      приём: «сегодня работаем карандашом». Компонент отдаёт наружу ровно то значение, которое
      несёт `Room.enabledTools`, без собственного кодирования.
    files:
      - apps/web/src/components/ToolSetPicker/**
    issues: [548]
    notes:
      - >-
