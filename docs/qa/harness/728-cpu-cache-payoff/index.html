<!doctype html><meta charset="utf-8"><title>CPU contact cache payoff</title>
<style>body{font:16px system-ui;margin:24px}canvas{max-width:100%}pre{white-space:pre-wrap}</style>
<h1>CPU contact cache payoff · brush 400</h1>
<select id="scenario"><option>zigzag</option><option>puddle</option></select><select id="paper"><option>fine</option><option>flat</option></select>
<button id="start">Run OFF/cache/workspace</button><button id="download">Download JSON</button><div id="surface"></div><pre id="output"></pre>
<script type="module">
import { runCpuCachePayoff } from './run.mjs';let result;
document.querySelector('#start').onclick=async()=>{const out=document.querySelector('#output');out.textContent='Running alternating canonical tapes…';try{result=await runCpuCachePayoff({engineUrl:new URLSearchParams(location.search).get('engine')||'../engine-webgl2-standalone/run.js',scenario:document.querySelector('#scenario').value,paper:document.querySelector('#paper').value});out.textContent=JSON.stringify(result,null,2)}catch(e){out.textContent=e.stack}};
document.querySelector('#download').onclick=()=>{if(!result)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download='cpu-cache-payoff.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
