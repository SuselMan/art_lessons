<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grafetto — QA owner FIFO</title><style>#owner-status{position:fixed;z-index:2147483647;left:12px;top:12px;background:#fff;padding:8px;border:1px solid #777;max-width:480px;font:14px sans-serif}#owner-status:empty{display:none}</style></head><body><div id="root"></div><div id="owner-status">Подготовка QA; рисование ещё недоступно</div><script type="module">
