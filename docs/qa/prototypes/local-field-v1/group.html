<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Акварель — общий пересчёт v1</title>
<style>body{height:100dvh;display:flex;flex-direction:column}header,footer{flex:none}main{flex:1;align-items:center!important;height:auto!important;min-height:0!important}canvas{flex:none}*{box-sizing:border-box}body{margin:0;background:#171719;color:#eee;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}button,input{accent-color:#8980e8}button{background:#313137;color:inherit;border:1px solid #555;border-radius:7px;padding:9px;cursor:pointer}label{display:flex;align-items:center;gap:6px}input[type=range]{width:95px}main{height:calc(100dvh - 150px);min-height:250px;display:flex;justify-content:center;padding:8px}canvas{background:#faf9f7;aspect-ratio:1;width:min(100%,calc(100dvh - 170px));height:auto;max-height:100%;touch-action:none;box-shadow:0 2px 20px #0008}footer{padding:8px 16px;color:#aaa;font-size:12px}#error{color:#ffa5a5}</style>
<header><h1>Акварель — общий пересчёт v1</h1><button id="clear">Новый лист</button><button id="undo">Отменить</button><button id="redo">Вернуть</button><button id="dry">Высушить</button><button id="save">Скачать рисунок</button><label>Краска <select id="paint"></select></label><label>Цвет <input id="color" type="color" value="#7030bd"></label><label>Кисть <input id="size" type="range" min="8" max="220" value="90"><output id="sizeValue">90</output></label><label>Вода <input id="water" type="range" min="0" max="100" value="100"></label><label>Пигмент <input id="pigment" type="range" min="0" max="100" value="69"></label></header>
<main><canvas id="paper" width="1024" height="1024"></canvas></main><footer>Экспериментальный лист. Рисунки здесь не сохраняются в комнате. Все мокрые мазки пересчитываются одной группой. Новое нанесение заменяет незавершённый расчёт. Это эксперимент; не версия комнат. <span id="error"></span></footer>
<script type="module">
import { createGroupWatercolor } from '/watercolor-local-v1/group-model.js';
import { WATERCOLOR_PIGMENTS } from '/src/engine/src/presets/watercolorPigments.ts';
const ids=['paper','color','size','sizeValue','water','pigment','clear','undo','redo','save','dry','paint','error'];const c=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
try{
c.error.textContent='Загружаю кисть…';const small=new URLSearchParams(location.search).get('smoke')==='1';const size=small?128:768;const model=await createGroupWatercolor(c.paper,{size,fieldSize:small?256:1536,auto:!new URLSearchParams(location.search).has('hold')});window.__wcGroup=model;window.__wcReviewVersion=model.version;c.error.textContent='';
for(const p of WATERCOLOR_PIGMENTS){const o=document.createElement('option');o.value=p.code;o.textContent=p.code+' — '+p.name;c.paint.append(o)}c.paint.value='PB15';const choosePaint=()=>{const p=WATERCOLOR_PIGMENTS.find(p=>p.code===c.paint.value);c.color.value='#'+p.color.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')};choosePaint();
const settings=()=>({size:Number(c.size.value)*(size/1024),water:Number(c.water.value)/100,pigment:Number(c.pigment.value)/100,color:c.color.value,code:c.paint.value});
const viewport=()=>{const main=c.paper.parentElement;const side=Math.max(1,Math.min(main.clientWidth-16,main.clientHeight-16));c.paper.style.width=c.paper.style.height=side+'px'};new ResizeObserver(viewport).observe(c.paper.parentElement);viewport();
let pointer=null;const point=e=>{const r=c.paper.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*size,y:(e.clientY-r.top)/r.height*size,pressure:e.pointerType==='pen'?Math.max(.05,e.pressure):.75,time:e.timeStamp}};
c.paper.onpointerdown=e=>{if(pointer!==null||e.button>0)return;e.preventDefault();pointer=e.pointerId;c.paper.setPointerCapture(pointer);model.begin(point(e),settings())};c.paper.onpointermove=e=>{if(e.pointerId!==pointer)return;e.preventDefault();const events=e.getCoalescedEvents?.();for(const sample of events?.length?events:[e])model.move(point(sample))};const end=e=>{if(e.pointerId!==pointer)return;model.end();pointer=null};c.paper.onpointerup=end;c.paper.onpointercancel=end;
c.size.oninput=()=>c.sizeValue.value=c.size.value;c.paint.onchange=choosePaint;
c.dry.onclick=()=>{model.dry();c.dry.disabled=true;c.dry.textContent='Высушиваю…';const check=()=>{if(model.drying){requestAnimationFrame(check);return}c.dry.disabled=false;c.dry.textContent='Высушить'};requestAnimationFrame(check)};
c.clear.onclick=()=>model.clear();c.undo.onclick=()=>model.undo();c.redo.onclick=()=>model.redo();c.save.onclick=async()=>{const blob=await model.exportPNG();if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='watercolor-group.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
c.paper.addEventListener('webglcontextlost',e=>{e.preventDefault();c.error.textContent='Графический контекст потерян. Обнови страницу.'});window.addEventListener('pagehide',()=>model.destroy(),{once:true});
}catch(e){c.error.textContent=e.message;console.error(e)}
</script></html>
