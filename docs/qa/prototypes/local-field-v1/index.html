<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Акварель — новая модель</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171719;color:#eee;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}button,input{accent-color:#8980e8}button{background:#313137;color:inherit;border:1px solid #555;border-radius:7px;padding:9px;cursor:pointer}label{display:flex;align-items:center;gap:6px}input[type=range]{width:95px}main{height:calc(100dvh - 150px);min-height:250px;display:flex;justify-content:center;padding:8px}canvas{background:#faf9f7;aspect-ratio:1;width:min(100%,calc(100dvh - 170px));height:auto;max-height:100%;touch-action:none;box-shadow:0 2px 20px #0008}footer{padding:8px 16px;color:#aaa;font-size:12px}#error{color:#ffa5a5}</style>
<header><h1>Акварель — новая модель</h1><button id="clear">Новый лист</button><button id="undo">Отменить</button><button id="redo">Вернуть</button><button id="save">Скачать рисунок</button><label>Цвет <input id="color" type="color" value="#7030bd"></label><label>Кисть <input id="size" type="range" min="8" max="220" value="90"><output id="sizeValue">90</output></label><label>Вода <input id="water" type="range" min="0" max="100" value="100"></label><label>Пигмент <input id="pigment" type="range" min="0" max="100" value="69"></label></header>
<main><canvas id="paper" width="1024" height="1024"></canvas></main><footer>Экспериментальный лист. Рисунки здесь не сохраняются в комнате. Сравни мокрые пересечения, чистую воду поверх краски и отпускание пера. <span id="error"></span></footer>
<script type="module">
import { createLocalWatercolor } from '/watercolor-local-v1/model.js';
const controls=Object.fromEntries(['paper','color','size','sizeValue','water','pigment','clear','undo','redo','save','error'].map(id=>[id,document.getElementById(id)]));
try{const model=createLocalWatercolor(controls.paper);window.__wcLocalV1=model;
const settings=()=>({size:Number(controls.size.value),water:Number(controls.water.value)/100,pigment:Number(controls.pigment.value)/100,color:controls.color.value});
let pointer=null,last=null;const point=e=>{const r=controls.paper.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1024,y:(e.clientY-r.top)/r.height*1024,pressure:e.pointerType==='pen'?e.pressure:0.75}};
controls.paper.onpointerdown=e=>{if(pointer!==null||e.button>0)return;e.preventDefault();pointer=e.pointerId;controls.paper.setPointerCapture(pointer);last=point(e);model.begin(last,settings())};
controls.paper.onpointermove=e=>{if(e.pointerId!==pointer)return;e.preventDefault();const samples=e.getCoalescedEvents?.();for(const sample of samples?.length?samples:[e]){const next=point(sample);model.move(last,next);last=next}};
const end=e=>{if(e.pointerId!==pointer)return;model.end();pointer=null;last=null};controls.paper.onpointerup=end;controls.paper.onpointercancel=end;
controls.size.oninput=()=>controls.sizeValue.value=controls.size.value;controls.clear.onclick=()=>model.clear();controls.undo.onclick=()=>model.undo();controls.redo.onclick=()=>model.redo();controls.save.onclick=()=>model.exportPNG();
controls.paper.addEventListener('webglcontextlost',e=>{e.preventDefault();controls.error.textContent='Графический контекст потерян. Обнови страницу; текущий рисунок не сохранён.'});window.addEventListener('pagehide',()=>model.destroy(),{once:true});
}catch(e){controls.error.textContent=e.message;console.error(e)}
</script></html>
