<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Акварель — наша кисть, очередь v8</title>
<style>body{height:100dvh;display:flex;flex-direction:column}header,footer{flex:none}main{flex:1;align-items:center!important;height:auto!important;min-height:0!important}canvas{flex:none}*{box-sizing:border-box}body{margin:0;background:#171719;color:#eee;font:15px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}button,input{accent-color:#8980e8}button{background:#313137;color:inherit;border:1px solid #555;border-radius:7px;padding:9px;cursor:pointer}label{display:flex;align-items:center;gap:6px}input[type=range]{width:95px}main{height:calc(100dvh - 150px);min-height:250px;display:flex;justify-content:center;padding:8px}canvas{background:#faf9f7;aspect-ratio:1;width:min(100%,calc(100dvh - 170px));height:auto;max-height:100%;touch-action:none;box-shadow:0 2px 20px #0008}footer{padding:8px 16px;color:#aaa;font-size:12px}#error{color:#ffa5a5}</style>
<header><h1>Акварель — наша кисть, очередь v8</h1><button id="clear">Новый лист</button><button id="undo">Отменить</button><button id="redo">Вернуть</button><button id="dry">Высушить</button><button id="save">Скачать рисунок</button><label>Краска <select id="paint"></select></label><label>Цвет <input id="color" type="color" value="#7030bd"></label><label>Кисть <input id="size" type="range" min="8" max="220" value="90"><output id="sizeValue">90</output></label><label>Вода <input id="water" type="range" min="0" max="100" value="100"></label><label>Пигмент <input id="pigment" type="range" min="0" max="100" value="69"></label></header>
<main><canvas id="paper" width="1024" height="1024"></canvas></main><footer>Экспериментальный лист. Рисунки здесь не сохраняются в комнате. Наша кисть; следующего мазка можно не ждать. Проверяем переход от мокрого штриха к рассчитанной краске. <span id="error"></span></footer>
<script type="module">
import { PencilEngine } from '/src/engine/index.ts';
import { WATERCOLOR_PIGMENTS } from '/src/engine/src/presets/watercolorPigments.ts';
import { watercolorPresetString } from '/src/engine/src/presets/watercolorPresets.ts';
const ids=['paper','color','size','sizeValue','water','pigment','clear','undo','redo','save','dry','paint','error'];
const c=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
try {
const small=new URLSearchParams(location.search).get('smoke')==='1';
const size=small?256:1024;c.paper.width=c.paper.height=size;
const prefix8=location.pathname==='/watercolor-native-front8';
const priority=!prefix8&&new URLSearchParams(location.search).get('priority')==='1';
const progressive=priority&&new URLSearchParams(location.search).get('progress')==='1';
const engine=new PencilEngine(c.paper,{userId:'native-local',pageWidth:size,pageHeight:size,paper:'fine',watercolorReview:true,watercolorCoarseTransport:!priority,reviewInputPriority:priority,reviewProgressivePresentation:progressive,joinedTouch:true,asyncFinish:true,materialPresentation:true,gradientFibres:!priority,reviewTouchDrawing:true});
window.__wcNative=engine;
let fastFront=null;
let dryPump=null;
if(prefix8){const {installFastFront,fastFrontSchedule}=await import('/watercolor-native-front-v1/fast-front.js');fastFront=installFastFront(engine,'prefix8');engine._settlePlan.diagnosticFrontSchedule=n=>fastFrontSchedule(n,'prefix8');window.__wcFastFront=fastFront;}
if(prefix8&&new URLSearchParams(location.search).get('dryTasks')!=='0'){const {installDryPump}=await import('/watercolor-native-front-v1/dry-pump.js');dryPump=installDryPump(engine);window.__wcDryPump=dryPump;}
if(!priority)engine._watercolorPasses.warmGradientFibres();
window.__wcReviewVersion=dryPump?"native-prefix8-drytasks-v2":prefix8?"native-prefix8-v1":progressive?"native-input-priority-v10":priority?"native-input-priority-v9":"native-queue-fibres-v8";
if(prefix8){document.title=dryPump?'Акварель — 8 клеток, сушка v2':'Акварель — фронт воды 8 клеток';document.querySelector('h1').textContent=document.title;}
if(priority){document.title=progressive?"Акварель — промежуточное растекание v10":"Акварель — приоритет пера v9";document.querySelector("h1").textContent=document.title;}
engine.appendOperation({id:'local-layer',type:'layer_add',userId:'native-local',timestamp:1,layerId:'local',name:'Акварель'});
engine.setCompositeOrder([{id:'local',opacity:1}]);engine.setActiveLayer('local');engine.setTool('watercolor');
for(const paint of WATERCOLOR_PIGMENTS){const option=document.createElement('option');option.value=paint.code;option.textContent=paint.code+' — '+paint.name;c.paint.append(option)}
c.paint.value='PB15';
const choosePaint=()=>{const p=WATERCOLOR_PIGMENTS.find(p=>p.code===c.paint.value);c.color.value='#'+p.color.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')};choosePaint();
const settings=()=>{engine.setSize(Number(c.size.value)*(small ? .25 : 1));engine.setColor([1,3,5].map(i=>parseInt(c.color.value.slice(i,i+2),16)/255));engine.setPencil(watercolorPresetString('normal',{water:Number(c.water.value)/100,pigment:Number(c.pigment.value)/100},c.paint.value))};
const viewport=()=>{const main=c.paper.parentElement;const side=Math.max(1,Math.min(main.clientWidth-16,main.clientHeight-16));c.paper.style.width=side+'px';c.paper.style.height=side+'px';const r=c.paper.getBoundingClientRect();engine.setViewport(r.x+r.width/2,r.y+r.height/2,r.width/size,0)};
new ResizeObserver(viewport).observe(c.paper.parentElement);window.addEventListener('scroll',viewport);viewport();settings();
for(const id of ['color','size','water','pigment'])c[id].oninput=()=>{c.sizeValue.value=c.size.value;settings()};
c.paint.onchange=()=>{choosePaint();settings()};
c.dry.onclick=()=>{
dryPump?.start();
engine.watercolorDryAll();c.dry.disabled=true;c.dry.textContent='Высушиваю…';
// A barrier belongs to the input already accepted at this click. Later
// drawing must not extend its completion indefinitely.
let reached=false;
engine._wcCanonical.enqueue({execute:function*(){reached=true},cancel:()=>{reached=true}});
const check=()=>{if(engine._destroyed)return;if(!reached){requestAnimationFrame(check);return}dryPump?.stop();setTimeout(()=>{if(engine._destroyed)return;c.dry.disabled=false;c.dry.textContent='Высушить'},300)};requestAnimationFrame(check);
};
c.clear.onclick=()=>location.reload();c.undo.onclick=()=>engine.undo();c.redo.onclick=()=>engine.redo();
c.save.onclick=async()=>{const blob=await engine.exportPNG();if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='watercolor-native-coarse.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
window.addEventListener('pagehide',()=>{try{engine.destroy()}finally{dryPump?.dispose();fastFront?.dispose()}},{once:true});
}catch(e){c.error.textContent=e.message;console.error(e)}
</script></html>
