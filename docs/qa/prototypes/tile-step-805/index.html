<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Шаги растекания по тайлам</title><style>*{box-sizing:border-box}body{margin:0;background:#20242b;color:#eee;font:16px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:24px}button,select{font:inherit;min-height:44px;padding:8px;background:#343b46;color:inherit;border:1px solid #626b78;border-radius:6px}header{display:flex;gap:12px;flex-wrap:wrap}canvas{width:100%;display:block;background:white;touch-action:none;user-select:none;-webkit-touch-callout:none}.frame{position:relative;margin-top:16px}#ink{position:absolute;inset:0;height:100%;background:transparent}#status{min-height:80px;white-space:pre-wrap;font-variant-numeric:tabular-nums}p{color:#bfc7d1}label{display:flex;gap:8px;align-items:center}</style><main><h1>Шаги растекания по тайлам</h1><p>Проверяется только поиск путей в неподвижной воде — этап 4. Это карта достижимости, не готовая акварель. Поверх можно рисовать во время расчёта; кисть здесь диагностическая.</p><header><label>Лист<select id="sheet"><option value="1024,1024">1024 × 1024</option><option value="3508,2480" selected>А2 · 3508 × 2480</option></select></label><label>Тайл<select id="tile"><option>256</option><option>512</option><option selected>1024</option></select></label><label>Режим<select id="mode"><option value="exchange">Обмен после каждого шага</option><option value="none">Без обмена — контроль швов</option><option value="whole">Целая область</option></select></label><button id="run">Рассчитать</button><button id="compare">Сравнить с целой областью</button></header><p id="status" role="status">Готов к запуску. Начальный холодный прогон включает компиляцию отдельно от расчёта.</p><div class="frame"><canvas id="result" width="1024" height="724"></canvas><canvas id="ink" width="1024" height="724"></canvas></div><script type="module" src="./tile-step.js"></script></main></html>
