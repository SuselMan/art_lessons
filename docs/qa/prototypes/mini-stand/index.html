<style>:root{color-scheme:dark;--bg:#171719;--panel:#202023;--line:#37373d;--text:#eeeef1;--muted:#aaaab5;--accent:#a59ae8}

body{overscroll-behavior:none;margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
#controlsPanel{display:flex;flex-direction:column;flex:none;max-height:46dvh;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--line);overscroll-behavior:none}
#controlsScroll{min-height:0;overflow:auto;flex:1;overscroll-behavior:none}header{flex:none;padding:12px 16px}h1{font-size:16px;line-height:1.3;margin:0;font-weight:600}
.panelGroup{border-top:1px solid var(--line)}summary{padding:12px 16px;cursor:pointer;font-weight:600;min-height:44px}
.groupBody{padding:0 16px 14px;display:grid;gap:12px}.field{display:grid;gap:5px}.field>select{width:100%;min-width:0}
select,button,input{font:inherit;accent-color:var(--accent)}select,button{border:1px solid #48484f;border-radius:7px;background:#2c2c31;color:inherit;min-height:42px;padding:8px}
button{cursor:pointer;line-height:1.2}button:hover{background:#38383f}button:disabled{opacity:.4;cursor:default}.primary{background:#514973;border-color:#8276ad}.primary:hover{background:#635887}
.colorField{display:flex;align-items:center;justify-content:space-between}.colorField input{width:56px;height:36px;background:none;border:0;padding:0}
.rangeField,#tuningControls label{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.rangeField input,#tuningControls input{grid-column:1/-1;width:100%;height:28px;margin:0}
output{font-size:12px;color:#ccc5ee;font-variant-numeric:tabular-nums}
.checkField{display:flex;gap:8px;align-items:center;min-height:36px}.checkField input{width:18px;height:18px}
input[type=range]{touch-action:none;margin-inline:12px!important;width:calc(100% - 24px)!important}#controlsScroll{touch-action:pan-y}#tuningControls{display:grid;gap:14px}#tuningControls label>span{font-size:13px;line-height:1.3}

.sheetControls{flex:none;padding:12px 16px;border-top:1px solid var(--line)}h2{font-size:14px;margin:0 0 10px}
.hint{display:block;margin:0;color:var(--muted);font-size:12px;line-height:1.45}
footer{flex:none;padding:8px 16px 14px;font-size:11px;color:var(--muted)}#error{display:block;color:#c7bfef;margin-top:5px}
main{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
#paper{flex:none;background:#faf9f7;aspect-ratio:1;max-height:100%;touch-action:none;box-shadow:0 2px 20px #0008}

</style>

<details class="panelGroup" id="brushControls"><summary>Кисть</summary><div class="groupBody">
<label class="field">Краска<select id="paint"></select></label>
<label class="colorField">Цвет<input id="color" type="color" value="#7030bd"></label>
<label class="rangeField"><span>Размер кисти</span><output id="sizeValue">90</output><input id="size" type="range" min="8" max="480" value="90"></label>
<label class="rangeField"><span>Вода</span><output id="waterValue">100%</output><input id="water" type="range" min="0" max="100" value="100"></label>
<label class="rangeField"><span>Пигмент</span><output id="pigmentValue">69%</output><input id="pigment" type="range" min="0" max="100" value="69"></label>
<label class="checkField"><input id="touchDrawing" type="checkbox">Рисовать пальцем</label>

<details class="panelGroup" id="tuning"><summary>Растекание</summary><div class="groupBody">
<div id="tuningControls"></div>
<div class="buttonGrid"><button id="authorTuning">Настройки автора</button><button id="resetTuning">Сбросить</button><button id="copyTuning" class="wide">Скопировать настройки</button></div>
<span id="tuningStatus" class="hint" role="status"></span>

</div></details>
</div><section class="sheetControls"><h2>Лист</h2><div class="buttonGrid">

</div><label class="checkField" title="Снимите галочку, чтобы намеренно уйти со стенда"><input id="protectExit" type="checkbox" checked>Защита от выхода</label></section>
