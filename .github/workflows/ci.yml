name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # (#322) Without this the 13 paperAssets tests skip silently — the bake
      # output is gitignored, so a fresh checkout has nothing for them to
      # check. See .github/actions/paper-bake.
      - name: Baked paper textures
        uses: ./.github/actions/paper-bake

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
