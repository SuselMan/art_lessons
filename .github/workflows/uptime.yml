name: Uptime

# (#178) Cheapest honest answer to "is prod up, and do we find out before a
# teacher does" — a scheduled probe of the public health endpoint, no external
# service and no account to keep alive. A failing run e-mails whoever last
# touched this file (GitHub's default for scheduled workflows), so the alert
# channel is one that already exists.
#
# What this deliberately is NOT: an SLA monitor. GitHub's cron is best-effort —
# runs get delayed under load and can be skipped entirely, so a *missing* run
# is not evidence of health, only a failing one is evidence of trouble. It also
# only runs from the default branch, and GitHub disables scheduled workflows
# after 60 days without repo activity. If prod ever needs sub-minute detection
# or a push/SMS alert, a free UptimeRobot-class monitor is the upgrade — it is
# independent of this repo, which is precisely its advantage.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Nothing here needs the repo token.
permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # A repo variable rather than a hardcoded host, so pointing this at the
      # brand domain later (#327) is a settings change, not a commit.
      - name: Resolve origin
        id: origin
        run: |
          origin="${{ vars.PROD_ORIGIN }}"
          [ -n "$origin" ] || origin="https://5ryx.l.time4vps.cloud"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "host=${origin#https://}" >> "$GITHUB_OUTPUT"

      # /api/health, not /health: nginx proxies the /api/ prefix, while
      # everything else falls through to the SPA's index.html fallback — a
      # probe of /health would answer 200 with an HTML page even with the
      # server container stopped (see deploy/nginx.conf).
      #
      # Three attempts because a deploy restarts the server container, and a
      # single blip landing inside that window is not an outage worth waking
      # anyone for. Three consecutive failures 20s apart is.
      - name: Probe /api/health
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 10 "$ORIGIN/api/health" || echo 000)
            body=$(cat body.json 2>/dev/null || true)
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"ok":true'; then
              echo "healthy (attempt $attempt): $body"
              echo "✅ $ORIGIN — healthy: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt failed — HTTP $code, body: ${body:-<empty>}"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          {
            echo "🚨 **$ORIGIN is not healthy**"
            echo ""
            echo "Last response: HTTP \`$code\`"
            echo ""
            echo '```'
            echo "${body:-<empty body>}"
            echo '```'
            echo ""
            echo "\`db: down\` with a 200 means Postgres is gone but the server lives;"
            echo "a 502/timeout means the server container or nginx is down."
            echo "Runbook: \`deploy/README.md\` → Manual redeploy / troubleshooting."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # (#415, трек #314 §1) Память. Пункт трека требует не только знать
      # потолок, но и узнать о подходе к нему раньше, чем в него упрётся живой
      # урок — а сервер до этого не сообщал о себе ничего, кроме аптайма.
      #
      # Порог считает сам сервер (`memory.pressure` в /api/health, см.
      # memory.ts): `warn` на 70% кучи, `critical` на 85%, и на 85% он уже
      # отказывает в холодной загрузке новых комнат. Решение живёт там, а не
      # здесь, чтобы отказ и письмо не разъехались на пару процентов — и чтобы
      # порог менялся переменной окружения на VPS, а не коммитом в CI.
      #
      # Отдельный шаг, а не условие внутри пробы выше: сервер с занятой
      # памятью **здоров** — он отвечает, рисует и сохраняет. Смешать это с
      # «прод лежит» значило бы либо будить по несрочному поводу тем же
      # письмом, либо, что хуже, привыкнуть к красному и пропустить настоящее
      # падение.
      - name: Check server memory and disk pressure
        if: always()
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
        run: |
          set -uo pipefail
          # Три попытки, как у пробы выше, и ровно по её причине: деплой
          # перезапускает контейнер, и запрос, попавший в это окно, получает от
          # nginx страницу 502. Тело при этом **непустое** — то есть проверка
          # «пусто ли» его не ловит, и первый же прогон после выкатки этого
          # шага дал ложную тревогу (run 31388259190, 10.08).
          body=''
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 10 "$ORIGIN/api/health" || echo '')
            # Признак, что ответил наш сервер, а не прокси перед ним: поле,
            # которое есть в обеих ветках health-хендлера, и в 200, и в 503.
            case "$body" in *'"db":'*) break ;; esac
            body=''
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          if [ -z "$body" ]; then
            # Сервер не ответил сам — это работа пробы выше, она уже
            # отчиталась (и, в отличие от нас, умеет отличать выкатку от
            # падения). Второе письмо об одном падении учит игнорировать оба.
            echo "no health JSON — covered by the health probe above"
            exit 0
          fi
          # `jq`, а не `sed`: он есть на ubuntu-latest из коробки, и разбор поля
          # по имени пути здесь не роскошь, а необходимость. Прежний шаблон
          # `.*"pressure":"..."` жадный, то есть брал **последнее** совпадение
          # в теле — и в тот день, когда рядом с `memory.pressure` появилось
          # `disk.pressure` (#415), проверка памяти начала бы молча читать
          # давление диска. Тревога, которая срабатывает не на то, хуже
          # отсутствующей: она выглядит работающей.
          #
          # Наличие jq проверяется отдельной строкой, а не подразумевается: без
          # него `get` вернул бы пустое на каждое поле, и шаг сообщил бы «поле
          # пропало, алерт ослеп» — про сервер, с которым всё в порядке. Ошибка
          # инструмента, замаскированная под ошибку наблюдаемого, — худший вид
          # ложной тревоги: чинить по ней будут не то. (Поймано при разработке
          # ровно так: локально jq нет, и проверка «прошла» по этой причине.)
          command -v jq > /dev/null || {
            echo "🚨 jq is not on this runner — the pressure alert cannot parse anything"
            echo "🚨 **\`jq\` is missing on the runner** — this alert cannot parse /api/health." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          get() { printf '%s' "$body" | jq -r "$1 // empty" 2>/dev/null || true; }
          mem=$(get '.memory.pressure')
          disk=$(get '.disk.pressure')
          if [ -z "$mem" ] || [ -z "$disk" ]; then
            # Наш сервер ответил, но поля нет — это не «всё хорошо», а «мы
            # больше не умеем это читать»: переименование поля выключило бы
            # алерт бесшумно, и именно так получается молчащий мониторинг.
            echo "🚨 /api/health is missing pressure fields — the alert is blind (memory='$mem' disk='$disk')"
            echo "body: $body"
            {
              echo "🚨 **/api/health is missing a \`pressure\` field** — the alert is blind."
              echo ""
              echo "Read: memory \`${mem:-<none>}\`, disk \`${disk:-<none>}\`"
              echo '```'
              echo "$body"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          rooms=$(get '.rooms | "resident \(.resident), idle \(.idle), ops \(.operations)"')
          heap="$(get '.memory.heapUsedMb')/$(get '.memory.heapLimitMb') MB"
          space="$(get '.disk.freeGb') GB free of $(get '.disk.totalGb') ($(get '.disk.usedPct')% used)"

          if [ "$mem" = "ok" ] && [ "$disk" = "ok" ]; then
            echo "✅ memory ok — heap $heap, $rooms"
            echo "✅ disk ok — $space"
            {
              echo "✅ memory \`ok\` — heap \`$heap\`, \`$rooms\`"
              echo ""
              echo "✅ disk \`ok\` — \`$space\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # И в лог тоже, не только в summary: разбирая упавший прогон,
          # первым делом открывают лог шага, и пустой лог при exit 1 — это
          # лишний круг (стоил одного при выкатке самого этого шага).
          if [ "$mem" != "ok" ]; then
            echo "🚨 memory pressure: $mem — heap $heap, $rooms"
            {
              echo "🚨 **Server memory pressure: \`$mem\`** — heap \`$heap\`"
              echo ""
              echo "Resident rooms: \`$rooms\`"
              echo ""
              if [ "$mem" = "critical" ]; then
                echo "At \`critical\` the server already **refuses to load new rooms** (\`server_busy\`)."
                echo "Lessons already in progress are unaffected — the gate only guards cold loads."
              else
                echo "Not an outage: everything works. This is the margin, before it stops being one."
              fi
              echo ""
              echo "Резидентная комната стоит ~11.2 КБ кучи на операцию (замер #415)."
              echo "Высокий \`idle\` при низком \`resident\` — течь, а не нагрузка."
              echo "Runbook: \`deploy/README.md\`; замер — \`apps/server/src/scripts/measureRoomMemory.ts\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Диск — отдельный текст, а не та же тревога другим числом: лечится
          # он другим и не лечится сервером вовсе. Гейта на диск нет намеренно
          # (отказ в комнате не освобождает ни байта), поэтому здесь письмо —
          # единственный механизм, и запас до стены должен измеряться неделями.
          if [ "$disk" != "ok" ]; then
            echo "🚨 disk pressure: $disk — $space"
            {
              echo "🚨 **Disk pressure: \`$disk\`** — $space"
              echo ""
              if [ "$disk" = "unknown" ]; then
                echo "The server could not read the filesystem at all — the disk alert is blind."
                echo "Not «there is room»: we do not know. See \`apps/server/src/disk.ts\`."
              elif [ "$disk" = "critical" ]; then
                echo "Postgres с некуда писать — это не деградация, а остановка: операции"
                echo "перестают сохраняться, и урок, который человек считает нарисованным,"
                echo "исчезнет при перезаходе. Действовать сейчас, а не завтра."
              else
                echo "Не авария: всё работает. Это запас, пока он ещё запас."
              fi
              echo ""
              echo "Что занимает место, в порядке убывания вероятности:"
              echo "1. образы docker — деплой оставляет три последних (#275), но проверить стоит:"
              echo "   \`docker system df\`;"
              echo "2. база — она растёт от самого рисования, ~6 МБ в день на активно рисующего,"
              echo "   и это место не возвращается никогда (#207 — перенос холодной истории);"
              echo "3. локальные бэкапы в \`/var/backups/art-lessons\` — ротация 14 дней (#315)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      # Certbot renews at 30 days remaining via its own systemd timer, entirely
      # unattended — which means a broken renewal is silent until the morning
      # every browser refuses to open the app. Under 14 days left is that
      # failure, caught with two weeks to spare.
      - name: Check TLS certificate expiry
        if: always()
        env:
          HOST: ${{ steps.origin.outputs.host }}
        run: |
          set -uo pipefail
          host="${HOST%%/*}"
          if ! openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null > cert.pem; then
            echo "could not fetch the certificate — covered by the health probe above"
            exit 0
          fi
          expiry=$(openssl x509 -in cert.pem -noout -enddate | cut -d= -f2)
          if openssl x509 -in cert.pem -noout -checkend $((14 * 86400)) >/dev/null; then
            echo "certificate valid until $expiry"
            exit 0
          fi
          {
            echo "🚨 **TLS certificate for $host expires in under 14 days** ($expiry)"
            echo ""
            echo "Certbot's unattended renewal has stopped working. On the VPS:"
            echo "\`sudo certbot certificates\` / \`sudo certbot renew --dry-run\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
