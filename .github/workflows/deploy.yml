name: Deploy

# On every push to main (i.e. every merge): the same typecheck/lint/test
# gate ci.yml already runs on PRs, then — only if that's green — build (in
# CI, not on the VPS — see #199) and ship the result. See deploy/README.md
# for the one-time VPS setup this assumes.
on:
  push:
    branches: [main]

# (#422) Одна выкатка за раз. Без этого три пуша в `main` в течение 90 секунд
# 10.08 дали три параллельных прогона, и третий упал ещё на `ssh-keyscan` —
# похоже, sshd отбросил лишнее одновременное соединение.
#
# Но упавшая выкатка тут — самый мягкий исход и самый громкий сигнал. Опасны
# те, что не падают: `deploy/deploy.sh` не атомарен и меняет общее состояние
# коробки в несколько приёмов, а две его копии ничем не разделены. Два rsync
# раскладывают в один каталог разные сборки (обнуляя ровно ту согласованность
# манифеста бумаги и её файлов, ради которой писался #322); два `up -d` с
# разными SERVER_IMAGE оставляют тот контейнер, чей раннер оказался быстрее, а
# не чей коммит новее; два `prisma migrate deploy` расходятся на advisory
# lock, который никто не проектировал как средство синхронизации. Худший
# исход — не «деплой упал», а «деплой прошёл, и на коробке фронтенд от одной
# сборки с сервером от другой».
#
# `cancel-in-progress: false` обязателен и не является осторожностью: оборвать
# деплой на середине — это и есть та половинчатая коробка, от которой мы здесь
# защищаемся. Ожидающие прогоны GitHub при этом отменит сам, оставив
# последний, и для выкатки это верное поведение — она переносит полное
# состояние, а не разницу, поэтому промежуточный коммит пропустить безопасно.
#
# Группа одна на весь workflow, а не по job'ам: конфликтует не сборка (она
# идёт на одноразовом раннере и ни с чем не пересекается), а то, что она
# делает с единственной живой коробкой.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # (#322) Same reason as ci.yml's copy: the paper assertions are only
      # real if something baked. See .github/actions/paper-bake.
      - name: Baked paper textures
        uses: ./.github/actions/paper-bake

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The architecture map is only worth having if it cannot quietly fall behind.
      # `map:check` fails when a source file belongs to no module in
      # docs/architecture/map.yaml; `map:rules` fails on a *new* crossing of a
      # documented boundary (the 39 existing ones are baselined and shown on the
      # map's "Здоровье" tab instead of blocking).
      - name: Architecture map
        run: |
          npm run map:check
          npm run map:rules

  # (#199) Builds happen here, on a runner with real RAM/CPU to spare — the
  # VPS (1 vCPU, 1GB RAM, no swap) was getting OOM-killed running `npm ci` +
  # the apps/web Vite build *and* a Docker build for apps/server, all at
  # once, on top of the already-live postgres+server containers. The `deploy`
  # job below now only ever pulls/rsyncs already-built output — no
  # compilation on the VPS at all.
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # (#300) Baked paper textures are no longer committed — the bake is
      # byte-reproducible, so keeping ~60 MB of binary blobs in git history
      # (and that much again on every re-tune) bought nothing. apps/web's
      # `prebuild` regenerates them, which takes ~3.5 minutes; the cache in the
      # action below means that only happens when the bake's inputs change.
      #
      # (#322) The cache key used to live here inline. It moved into a
      # composite action once the `test` jobs needed the same bake — the key is
      # the ONLY thing that notices a changed input, and three copies of it is
      # two copies that will not get updated. The reasoning for what belongs in
      # it lives with it.
      #
      # `npm run build` below runs `prebuild` again; it is a no-op by then.
      - name: Baked paper textures
        uses: ./.github/actions/paper-bake

      # (#177) The DSN is baked into the bundle at build time — it has to be,
      # a browser has nowhere else to read it from — hence a repo *variable*
      # rather than a secret: it ends up publicly readable in the shipped JS
      # by design, and a DSN can only send events, never read them. The auth
      # token is a real secret and is a different thing entirely: it uploads
      # source maps to our org (see apps/web/vite.config.ts). Missing token
      # simply skips the upload, so a fork or a PR build still builds.
      # (#515) The build identity a person can read off a screen — Settings
      # shows it, and the deploy report names it, so "is this tablet on the
      # build I just shipped?" is a comparison instead of a guess. Date first
      # because that is what makes staleness legible without knowing any sha:
      # `2026.08.28-7041f19`. The sha half is the same commit
      # VITE_SENTRY_RELEASE carries, just short — the two are deliberately the
      # same identity in two lengths rather than two identities.
      - name: Resolve app version
        id: version
        run: echo "value=$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build apps/web static bundle
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
        run: npm run build --workspace=apps/web

      # (#515) The same string, reachable without a browser: `curl
      # https://grafetto.com/version.json` answers "what is actually on prod
      # right now", which until now meant ssh plus grepping chunk hashes out of
      # the served index.html. nginx's `location /` already sends `no-cache`
      # for anything unhashed, so this is always revalidated and can never be
      # the stale thing it exists to detect. Deliberately not precached either:
      # swConfig's globPatterns has no `json` in it (see there), so a service
      # worker never answers this from a cache.
      - name: Write version.json
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          APP_SHA: ${{ github.sha }}
        run: |
          jq -n --arg version "$APP_VERSION" --arg sha "$APP_SHA" \
            '{version: $version, sha: $sha}' > apps/web/dist/version.json

      - name: Report the version being deployed
        run: echo "Deploying **${{ steps.version.outputs.value }}** (\`${{ github.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web build (handed to the deploy job below)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        # Docker/GHCR image refs must be all-lowercase — github.repository_owner
        # preserves the account's actual casing ("SuselMan"), which produces an
        # invalid ref if used directly.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/art-lessons-server:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/$owner/art-lessons-server:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push apps/server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Upload web build to the VPS
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            web-dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/web-dist-incoming/"

      # (#315) Backup credentials live here rather than in a file typed onto the
      # VPS by hand, so a rebuilt or migrated box gets working backups from the
      # first deploy instead of from remembering to redo a runbook.
      #
      # Written to backup.env, NOT appended to the stack's own .env: that file
      # holds POSTGRES_PASSWORD, which is baked into the Postgres volume at
      # initdb time. Rewriting it from CI on every deploy puts one character
      # between a normal push and a server that can no longer open its own
      # database.
      #
      # Piped over stdin instead of passed as arguments — an ssh command line
      # is visible in the VPS's process list while it runs; stdin is not.
      # `umask 077` means the file is 600 from the moment it exists, rather
      # than briefly world-readable before a chmod.
      - name: Install backup credentials on the VPS
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}
        run: |
          set -euo pipefail
          if [ -z "${B2_KEY_ID:-}" ] || [ -z "${B2_APPLICATION_KEY:-}" ]; then
            echo "B2 credentials not configured — skipping. Backups will fail loudly until they are."
            echo "Set B2_KEY_ID / B2_APPLICATION_KEY (secrets) and BACKUP_REMOTE (variable)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # rclone reads any remote's definition straight from the environment,
          # so there is no rclone.conf to generate or keep in sync: these four
          # lines *are* the `b2:` remote.
          printf 'RCLONE_CONFIG_B2_TYPE=b2\nRCLONE_CONFIG_B2_ACCOUNT=%s\nRCLONE_CONFIG_B2_KEY=%s\nBACKUP_REMOTE=%s\n' \
            "$B2_KEY_ID" "$B2_APPLICATION_KEY" "${BACKUP_REMOTE:-b2:Grafetto}" \
          | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'umask 077 && cat > /opt/art-lessons/backup.env'

      # The checkout is brought up to date here rather than inside deploy.sh,
      # and the order matters: a script that resets its own checkout rewrites
      # itself while bash is still reading it, so a change to deploy.sh landed
      # one deploy late — see that file's own comment for the two deploys of
      # missing backups that cost.
      # (#177) SENTRY_DSN rides along the same way SERVER_IMAGE does, rather
      # than being written into the VPS's .env: that file holds
      # POSTGRES_PASSWORD, which is baked into the Postgres volume at initdb
      # time, and rewriting it from CI puts one typo between a push and a
      # server that can't open its own database (same reasoning as the backup
      # credentials above, which is why those went to their own file). Unset
      # variable means a server that doesn't report — not a failed deploy.
      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/art-lessons \
             && git fetch origin main \
             && git reset --hard origin/main \
             && SERVER_IMAGE='${{ needs.build.outputs.image }}' \
                SENTRY_DSN='${{ vars.SENTRY_SERVER_DSN }}' \
                SENTRY_RELEASE='${{ github.sha }}' \
                RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' \
                EMAIL_FROM='${{ vars.EMAIL_FROM }}' \
                bash deploy/deploy.sh"
