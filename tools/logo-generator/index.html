<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастерская логотипа · Grafetto</title><style>
:root{font-family:system-ui,sans-serif;color:#272330;background:#f4f1ea}*{box-sizing:border-box}body{margin:0}header{padding:24px 5vw;border-bottom:1px solid #d8d2c8;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header small{color:#766c80}main{display:grid;grid-template-columns:minmax(280px,370px) 1fr;max-width:1500px;margin:auto;gap:32px;padding:30px 5vw}.controls{display:grid;gap:18px;align-content:start}fieldset{border:1px solid #ded8cd;border-radius:14px;background:#fffdf8;padding:18px;margin:0}legend{font-weight:700;padding:0 6px}label{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:10px 0;font-size:14px}input[type=range]{grid-column:1/-1;width:100%;accent-color:#594b99}input[type=color]{width:45px;height:32px;border:0;background:none}.color-inputs{display:flex;gap:6px;align-items:center}.hex{width:90px;padding:7px;border:1px solid #c8bfd1;border-radius:7px;font:inherit}input[type=checkbox]{accent-color:#594b99;width:18px;height:18px}button{border:1px solid #584a93;border-radius:9px;background:#594b99;color:white;padding:11px 16px;font:inherit;cursor:pointer}button.secondary{background:transparent;color:#594b99}button:hover{filter:brightness(.92)}.actions{display:flex;gap:8px;flex-wrap:wrap}.stage{min-width:0}.hero{background:#17161c;border-radius:18px;display:grid;place-items:center;min-height:420px;padding:30px}.hero svg{width:min(100%,460px)}.sizes{display:flex;align-items:end;flex-wrap:wrap;gap:24px;padding:24px 0}.size{text-align:center;color:#766c80;font-size:12px}.size div{background:#17161c;display:grid;place-items:center;border-radius:8px;padding:8px;margin-bottom:6px}.saved{display:flex;gap:12px;flex-wrap:wrap}.card{border:1px solid #ded8cd;border-radius:12px;background:white;padding:10px;width:130px}.card svg{background:#17161c;border-radius:6px;width:100%}.card button{font-size:12px;padding:6px;margin:4px 2px 0 0}.hint{color:#766c80;font-size:13px;line-height:1.5}h2{font-size:16px}@media(max-width:750px){main{grid-template-columns:1fr}.stage{grid-row:1}.hero{min-height:280px}.hero svg{width:min(100%,330px)}header{gap:15px}header small{text-align:right}}
</style></head><body><header><h1>Мастерская логотипа</h1><small>Grafetto · подбор формы</small></header><main><section class="controls" id="controls"><fieldset><legend>Звезда</legend><div id="shape"></div></fieldset><fieldset><legend>Вырез и уголок G</legend><div id="cut"></div><label>Вырезать окружность в центре <input id="clip" type="checkbox"></label></fieldset><fieldset><legend>Цвета</legend><div id="colors"></div></fieldset><div class="actions"><button id="save">Сохранить вариант</button><button class="secondary" id="export">Скачать SVG</button><button class="secondary" id="reset">Сбросить</button></div><p class="hint">Варианты хранятся в этом браузере на этом устройстве. SVG сохраняет текущую форму и цвета.</p></section><section class="stage"><div class="hero" id="hero"></div><div class="sizes" id="sizes"></div><h2>Сохранённые варианты</h2><div class="saved" id="saved"></div><p class="hint" id="empty">Здесь появятся варианты, которые ты сохранишь.</p></section></main><script>
const defaults={points:24,innerPoints:24,outer:256,border:32,inner:128,depth:12,innerDepth:6,outerRound:55,midRound:55,innerRound:55,cutStart:-45,cut:3,tipStart:0,tip:1.5,clipRadius:64,fill:'#f0dca3',edge:'#58499b',background:'#17161c',clip:true};let s={...defaults};const sliders=[['points','Внешние зубцы',8,48,1],['innerPoints','Внутренние зубцы',5,30,1],['outer','Внешний радиус, px',160,320,1],['border','Толщина границы, px',0,100,1],['inner','Радиус отверстия, px',50,175,1],['depth','Глубина внешних зубцов, px',0,34,1],['innerDepth','Глубина внутренних зубцов, px',0,34,1],['outerRound','Скругление внешней звезды, %',0,100,1],['midRound','Скругление границы, %',0,100,1],['innerRound','Скругление внутренней звезды, %',0,100,1],['cutStart','Начало выреза, °',-180,180,1],['cut','Вырез, зубцов',.5,8,.25],['tipStart','Поворот уголка, °',-90,90,1],['tip','Уголок G, зубцов',.5,5,.25],['clipRadius','Радиус обрезки уголка, px',0,200,1]];const colors=[['fill','Основной цвет'],['edge','Цвет границы'],['background','Фон']];
function star(r,count,depth,round){let a=[];for(let i=0;i<count*2;i++){let t=-Math.PI/2+i*Math.PI/count,rr=Math.max(0,r-(i%2?depth:0));a.push([256+rr*Math.cos(t),256+rr*Math.sin(t)])}let q=round/200;let mid=(p,v)=>[p[0]+(v[0]-p[0])*q,p[1]+(v[1]-p[1])*q];let f=p=>p.map(x=>x.toFixed(2)).join(' '),out='';for(let i=0;i<a.length;i++){let p=a[i],prev=a[(i+a.length-1)%a.length],next=a[(i+1)%a.length];out+=(i?' L ':'M ')+f(mid(p,prev))+' Q '+f(p)+' '+f(mid(p,next))}return out+' Z'}
let svgId=0;function svg(){let id='logo'+(++svgId);let step=2*Math.PI/s.points, angle=s.cut*step, start=s.cutStart*Math.PI/180, end=start+angle, tipStart=s.tipStart*Math.PI/180, tipAngle=s.tip*step, tipEnd=tipStart+tipAngle, xy=a=>[256+600*Math.cos(a),256+600*Math.sin(a)], [x0,y0]=xy(start),[x,y]=xy(end),[tx0,ty0]=xy(tipStart),[tx,ty]=xy(tipEnd), inner=star(s.inner,s.innerPoints,s.innerDepth,s.innerRound),outer=star(s.outer,s.points,s.depth,s.outerRound), middleRadius=Math.max(1,s.outer-s.border),middle=star(middleRadius,s.points,s.depth*middleRadius/s.outer,s.midRound),v=Math.max(264,s.outer+8),view=256-v;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view} ${view} ${v*2} ${v*2}"><defs><mask id="${id}cutout"><rect x="${view}" y="${view}" width="${v*2}" height="${v*2}" fill="white"/><path d="M256 256 L${x0} ${y0} A600 600 0 ${angle>Math.PI?1:0} 1 ${x} ${y} Z" fill="black"/></mask><clipPath id="${id}tipclip"><path d="${inner}"/></clipPath><mask id="${id}tipmask"><rect x="${view}" y="${view}" width="${v*2}" height="${v*2}" fill="white"/><circle cx="256" cy="256" r="${s.clip ? s.clipRadius : 0}" fill="black"/></mask></defs><g mask="url(#${id}cutout)"><path fill="${s.edge}" d="${outer}"/><path fill="${s.fill}" d="${middle}"/><path fill="${s.background}" d="${inner}"/></g><path fill="${s.edge}" clip-path="url(#${id}tipclip)" mask="url(#${id}tipmask)" d="M 256 256 L ${tx0} ${ty0} A 600 600 0 ${tipAngle>Math.PI?1:0} 1 ${tx} ${ty} Z"/></svg>`}
function render(){document.querySelector('#hero').innerHTML=svg();document.querySelector('#hero').style.background=s.background;document.querySelector('#sizes').innerHTML=[128,64,32,16].map(n=>`<div class="size"><div style="background:${s.background};width:${n+16}px;height:${n+16}px">${svg().replace('<svg ',`<svg width="${n}" height="${n}" `)}</div>${n} px</div>`).join('');for(const [k] of sliders){document.querySelector('#v-'+k).textContent=s[k];document.querySelector('#i-'+k).value=s[k]}for(const [k] of colors){document.querySelector('#i-'+k).value=s[k];document.querySelector('#hex-'+k).value=s[k]};document.querySelector('#clip').checked=s.clip}
for(const [k,label,min,max,step] of sliders){let el=document.createElement('label');el.innerHTML=`<span>${label}</span><output id="v-${k}"></output><input id="i-${k}" type="range" min="${min}" max="${max}" step="${step}">`;document.querySelector(['cutStart','cut','tipStart','tip','clipRadius'].includes(k)?'#cut':'#shape').append(el);el.querySelector('input').oninput=e=>{s[k]=Number(e.target.value);render()}}
for(const [k,label] of colors){let el=document.createElement('label');el.innerHTML=`<span>${label}</span><span class="color-inputs"><input id="i-${k}" type="color" aria-label="${label}"><input id="hex-${k}" class="hex" type="text" maxlength="7" aria-label="${label}, HEX" spellcheck="false"></span>`;document.querySelector('#colors').append(el);el.querySelector('input[type=color]').oninput=e=>{s[k]=e.target.value;render()};let hex=el.querySelector('.hex');hex.onchange=()=>{let v=hex.value.trim();if(/^#?[0-9a-f]{6}$/i.test(v)){s[k]=v.startsWith('#')?v:'#'+v}render()}}document.querySelector('#clip').onchange=e=>{s.clip=e.target.checked;render()};
const key='grafetto-logo-variants-v1';function getSaved(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function upgrade(item){let v={...defaults,...item};if(item.round!==undefined){v.outerRound=item.round;v.midRound=item.round;v.innerRound=item.round}if(item.innerPoints===undefined&&item.points!==undefined){v.innerPoints=item.points;v.innerDepth=item.depth*item.inner/item.outer}return v}function drawSaved(){let all=getSaved(),box=document.querySelector('#saved');box.innerHTML='';document.querySelector('#empty').hidden=all.length>0;all.forEach((item,i)=>{let old=s;s=upgrade(item);let preview=svg();s=old;let card=document.createElement('div');card.className='card';card.innerHTML=preview+`<button class="open">Открыть</button><button class="secondary delete" aria-label="Удалить вариант">×</button>`;card.querySelector('.open').onclick=()=>{s=upgrade(item);render()};card.querySelector('.delete').onclick=()=>{all.splice(i,1);localStorage.setItem(key,JSON.stringify(all));drawSaved()};box.append(card)})}document.querySelector('#save').onclick=()=>{let a=getSaved();a.unshift({...s});localStorage.setItem(key,JSON.stringify(a));drawSaved()};document.querySelector('#reset').onclick=()=>{s={...defaults};render()};document.querySelector('#export').onclick=()=>{let url=URL.createObjectURL(new Blob([svg()],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='grafetto-logo.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();drawSaved();
</script></body></html>
