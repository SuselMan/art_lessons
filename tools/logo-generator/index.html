<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастерская логотипа · Grafetto</title><style>
:root{font-family:system-ui,sans-serif;color:#272330;background:#f4f1ea}*{box-sizing:border-box}body{margin:0}header{padding:24px 5vw;border-bottom:1px solid #d8d2c8;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header small{color:#766c80}main{display:grid;grid-template-columns:minmax(280px,370px) 1fr;max-width:1500px;margin:auto;gap:32px;padding:30px 5vw}.controls{display:grid;gap:18px;align-content:start}fieldset{border:1px solid #ded8cd;border-radius:14px;background:#fffdf8;padding:18px;margin:0}legend{font-weight:700;padding:0 6px}label{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:10px 0;font-size:14px}input[type=range]{grid-column:1/-1;width:100%;accent-color:#594b99}input[type=color]{width:45px;height:32px;border:0;background:none}input[type=checkbox]{accent-color:#594b99;width:18px;height:18px}button{border:1px solid #584a93;border-radius:9px;background:#594b99;color:white;padding:11px 16px;font:inherit;cursor:pointer}button.secondary{background:transparent;color:#594b99}button:hover{filter:brightness(.92)}.actions{display:flex;gap:8px;flex-wrap:wrap}.stage{min-width:0}.hero{background:#17161c;border-radius:18px;display:grid;place-items:center;min-height:420px;padding:30px}.hero svg{width:min(100%,460px)}.sizes{display:flex;align-items:end;flex-wrap:wrap;gap:24px;padding:24px 0}.size{text-align:center;color:#766c80;font-size:12px}.size div{background:#17161c;display:grid;place-items:center;border-radius:8px;padding:8px;margin-bottom:6px}.saved{display:flex;gap:12px;flex-wrap:wrap}.card{border:1px solid #ded8cd;border-radius:12px;background:white;padding:10px;width:130px}.card svg{background:#17161c;border-radius:6px;width:100%}.card button{font-size:12px;padding:6px;margin:4px 2px 0 0}.hint{color:#766c80;font-size:13px;line-height:1.5}h2{font-size:16px}@media(max-width:750px){main{grid-template-columns:1fr}.stage{grid-row:1}.hero{min-height:280px}.hero svg{width:min(100%,330px)}header{gap:15px}header small{text-align:right}}
</style></head><body><header><h1>Мастерская логотипа</h1><small>Grafetto · подбор формы</small></header><main><section class="controls" id="controls"><fieldset><legend>Звезда</legend><div id="shape"></div></fieldset><fieldset><legend>Вырез и уголок G</legend><div id="cut"></div><label>Обрезать уголок окружностью <input id="clip" type="checkbox"></label></fieldset><fieldset><legend>Цвета</legend><div id="colors"></div></fieldset><div class="actions"><button id="save">Сохранить вариант</button><button class="secondary" id="export">Скачать SVG</button><button class="secondary" id="reset">Сбросить</button></div><p class="hint">Варианты хранятся в этом браузере на этом устройстве. SVG сохраняет текущую форму и цвета.</p></section><section class="stage"><div class="hero" id="hero"></div><div class="sizes" id="sizes"></div><h2>Сохранённые варианты</h2><div class="saved" id="saved"></div><p class="hint" id="empty">Здесь появятся варианты, которые ты сохранишь.</p></section></main><script>
const defaults={points:24,outer:256,border:32,inner:128,depth:12,round:55,cut:3,tip:1.5,clipRadius:64,fill:'#f0dca3',edge:'#58499b',background:'#17161c',clip:false};let s={...defaults};const sliders=[['points','Количество зубцов',12,48,1],['outer','Внешний радиус',170,256,1],['border','Толщина границы',0,64,1],['inner','Внутренний радиус',50,195,1],['depth','Глубина зубцов',0,35,1],['round','Скругление, %',0,100,1],['cut','Вырез, зубцов',1,8,.5],['tip','Уголок G, зубцов',.5,4,.25],['clipRadius','Радиус обрезки уголка',0,150,1]];const colors=[['fill','Основной цвет'],['edge','Цвет границы'],['background','Фон']];
function star(r){let a=[];for(let i=0;i<s.points*2;i++){let t=-Math.PI/2+i*Math.PI/s.points,rr=r-(i%2?s.depth*r/s.outer:0);a.push([256+rr*Math.cos(t),256+rr*Math.sin(t)])}let q=s.round/200;let mid=(p,v)=>[p[0]+(v[0]-p[0])*q,p[1]+(v[1]-p[1])*q];let f=p=>p.map(x=>x.toFixed(2)).join(' '),out='';for(let i=0;i<a.length;i++){let p=a[i],prev=a[(i+a.length-1)%a.length],next=a[(i+1)%a.length];out+=(i?' L ':'M ')+f(mid(p,prev))+' Q '+f(p)+' '+f(mid(p,next))}return out+' Z'}
let svgId=0;function svg(){let id='logo'+(++svgId);let step=2*Math.PI/s.points, angle=s.cut*step, x=256+500*Math.cos(-angle),y=256+500*Math.sin(-angle), tipAngle=s.tip*step, tx=256+(s.inner+25)*Math.cos(tipAngle),ty=256+(s.inner+25)*Math.sin(tipAngle);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 528 528"><defs><mask id="${id}cutout"><rect x="-8" y="-8" width="528" height="528" fill="white"/><path d="M256 256 L756 256 A500 500 0 ${angle>Math.PI?1:0} 0 ${x} ${y} Z" fill="black"/></mask><clipPath id="${id}tipclip"><circle cx="256" cy="256" r="${Math.max(0,s.clipRadius)}"/></clipPath></defs><g mask="url(#${id}cutout)"><path fill="${s.edge}" d="${star(s.outer)}"/><path fill="${s.fill}" d="${star(Math.max(1,s.outer-s.border))}"/><path fill="${s.background}" d="${star(s.inner)}"/></g><path fill="${s.edge}" ${s.clip?'clip-path="url(#${id}tipclip)"':''} d="M ${256+s.inner*.3} 256 L ${256+s.inner+45} 256 L ${tx} ${ty} Z"/></svg>`}
function render(){document.querySelector('#hero').innerHTML=svg();document.querySelector('#hero').style.background=s.background;document.querySelector('#sizes').innerHTML=[128,64,32,16].map(n=>`<div class="size"><div style="background:${s.background};width:${n+16}px;height:${n+16}px">${svg().replace('<svg ',`<svg width="${n}" height="${n}" `)}</div>${n} px</div>`).join('');for(const [k] of sliders){document.querySelector('#v-'+k).textContent=s[k];document.querySelector('#i-'+k).value=s[k]}for(const [k] of colors)document.querySelector('#i-'+k).value=s[k];document.querySelector('#clip').checked=s.clip}
for(const [k,label,min,max,step] of sliders){let el=document.createElement('label');el.innerHTML=`<span>${label}</span><output id="v-${k}"></output><input id="i-${k}" type="range" min="${min}" max="${max}" step="${step}">`;document.querySelector(['cut','tip','clipRadius'].includes(k)?'#cut':'#shape').append(el);el.querySelector('input').oninput=e=>{s[k]=Number(e.target.value);render()}}
for(const [k,label] of colors){let el=document.createElement('label');el.innerHTML=`<span>${label}</span><input id="i-${k}" type="color">`;document.querySelector('#colors').append(el);el.querySelector('input').oninput=e=>{s[k]=e.target.value;render()}}document.querySelector('#clip').onchange=e=>{s.clip=e.target.checked;render()};
const key='grafetto-logo-variants-v1';function getSaved(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function drawSaved(){let all=getSaved(),box=document.querySelector('#saved');box.innerHTML='';document.querySelector('#empty').hidden=all.length>0;all.forEach((item,i)=>{let old=s;s={...defaults,...item};let preview=svg();s=old;let card=document.createElement('div');card.className='card';card.innerHTML=preview+`<button class="open">Открыть</button><button class="secondary delete" aria-label="Удалить вариант">×</button>`;card.querySelector('.open').onclick=()=>{s={...defaults,...item};render()};card.querySelector('.delete').onclick=()=>{all.splice(i,1);localStorage.setItem(key,JSON.stringify(all));drawSaved()};box.append(card)})}document.querySelector('#save').onclick=()=>{let a=getSaved();a.unshift({...s});localStorage.setItem(key,JSON.stringify(a));drawSaved()};document.querySelector('#reset').onclick=()=>{s={...defaults};render()};document.querySelector('#export').onclick=()=>{let url=URL.createObjectURL(new Blob([svg()],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='grafetto-logo.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();drawSaved();
</script></body></html>
