# (#425) Kernel TCP tuning for the production VPS — installed at
# /etc/sysctl.d/99-bbr.conf by deploy.sh (see deploy/README.md).
#
# The path from this VPS to at least some clients drops 5-6% of packets.
# Measured on prod with `ss -tin`, on a live HTTPS connection serving the paper
# texture:
#
#   80.209.232.109:443 -> <client>
#     bytes_sent:9127364  bytes_retrans:556661   <- 6% retransmitted
#     cwnd:3  ssthresh:2  rtt:107ms
#     delivery_rate 264024bps                    <- 33 KB/s
#
# cubic reads every lost packet as congestion and halves the window, so on a
# lossy path it settles at cwnd:3 and never recovers. Three segments of 1394
# bytes per 100ms round trip is a hard ceiling of ~40 KB/s *per TCP stream*,
# no matter how much bandwidth the link actually has. Server-wide retransmits
# are 0.46%, so this is one route being bad, not the box.
#
# That ceiling is what made rooms take minutes to open: the room load ships
# ~13MB of layer snapshots and op log, plus a 7.3MB paper texture on a first
# visit. The server was idle throughout (load 0.07, Fastify answering in
# 5-185ms) — all of the time was on the wire.
#
# BBR models the pipe from bandwidth and RTT instead of treating loss as a
# congestion signal, so it keeps a lossy path full. Same file, same client,
# measured before and after: 46 KB/s -> 880 KB/s, a factor of 19. Room open
# went from "did not finish in 75s" to 11s.
#
# fq is BBR's companion qdisc — BBR paces its sends, and fq is what actually
# honours the pacing rate. Note that `default_qdisc` only applies to qdiscs
# created *after* it is set, so an already-up interface keeps whatever it had
# (fq_codel here) until something replaces it explicitly. deploy.sh does that
# for the default-route interface; this line covers everything created later.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
