# Production nginx site config (#111) — installed at
# /etc/nginx/sites-available/art-lessons on the VPS (see deploy/README.md).
# Serves apps/web's static build directly and reverse-proxies /api and
# /socket.io to the server container (published to 127.0.0.1:4000 only —
# see docker-compose.prod.yml) — the exact same same-origin shape
# apps/web/vite.config.ts's dev proxy already uses, so the built frontend
# needs no separate production config of its own (API_BASE = '' throughout,
# see lib/api.ts and Room/index.tsx's socket connection).
#
# The TLS block below (cert paths, http2, the :80 redirect server) was
# originally written in-place by certbot's nginx plugin (`certbot --nginx`)
# on first cert issuance, then captured back into this file so deploy.sh can
# sync it on every push instead of this file staying a TLS-less template
# forever. certbot's renewal timer only rewrites the cert files themselves
# at these same fixed paths — it doesn't touch nginx.conf again — so this
# stays accurate across renewals. A domain/cert change would need updating
# the paths below by hand.
server {
    # (#352) Three names on one block during the move to the brand domain:
    # `grafetto.com` is where the product lives from now on, `www` exists
    # because people type it, and the hoster's `5ryx.…` name stays answering
    # because links to rooms have already been handed out under it — turning
    # it off would kill them silently. Canonicalization (www and the old host
    # redirecting to the apex) comes after the certificate covers all three;
    # doing it before would redirect people onto a name whose TLS doesn't
    # validate yet.
    server_name grafetto.com www.grafetto.com 5ryx.l.time4vps.cloud;

    root /var/www/art-lessons/dist;
    index index.html;

    # ACME HTTP-01 challenge files (certbot --webroot). Needs its own root
    # outside the published bundle: deploy.sh rsyncs `--delete-after` into
    # /var/www/art-lessons/dist, so a challenge file living there would be
    # swept away by whatever deploy happens to land mid-issuance. `^~` so it
    # wins over the SPA fallback below — without it `try_files … /index.html`
    # would answer the validator with an HTML page and a cheerful 200, and
    # issuance would fail with no obvious reason.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # /etc/nginx/nginx.conf (Debian's default, not tracked in this repo) has
    # `gzip on` but leaves `gzip_proxied`/`gzip_types` at their defaults —
    # `gzip_proxied` defaults to `off` (never compress a proxied response at
    # all) and `gzip_types` defaults to just `text/html`. Net effect: every
    # proxied /socket.io/ response (room_state, operation relay — see
    # socketHandlers.ts) was going out completely uncompressed. Overriding
    # both here, in the tracked site config, rather than editing the
    # untracked global one. A single ~1MB stroke operation's JSON (a long
    # fill, thousands of dabs) gzips to ~225KB (~4.4x, measured against a
    # real one) — this is what actually fixed a room with 25MB of history
    # taking minutes to join, not (just) the buffer-size increases below.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types application/json text/plain application/octet-stream;

    # Socket.io needs the Upgrade/Connection headers for the WebSocket
    # transport, plus a long read timeout so an idle-but-open connection
    # (a participant just watching, not actively drawing) isn't killed by
    # nginx's default proxy timeout. client_max_body_size defaults to 1m —
    # a long stroke's operation packet (thousands of dabs, see engine/
    # index.ts's STROKE_DAB_CHUNK_LIMIT) could exceed that before the chunk
    # cap existed, and nginx would reject it with a 413 before it ever
    # reached the Node process — the operation just silently never arrived
    # (found via a live "long strokes vanish after reload" report). The
    # chunk cap now keeps any single operation well under even the old 1m
    # default, but this stays as a generous margin against anything else
    # (a big snapshot upload, a future larger chunk size) hitting the same
    # wall the same silent way.
    location /socket.io/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Fastify's own bodyLimit for the snapshot-upload route is already 20MB
    # (see snapshotRoutes.ts's SNAPSHOT_UPLOAD_BODY_LIMIT_BYTES) — pointless
    # without matching headroom here, since nginx's 1m default would 413 the
    # request before it ever reached Fastify.
    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's own bundle output — every filename is content-hashed
    # (index-<hash>.js etc), so a byte-identical URL can never change
    # meaning: safe to cache forever, no revalidation round-trip needed.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Offline-baked paper-grain textures (apps/web/scripts/bakePaperTextures.ts).
    #
    # (#322) Filenames are content-hashed now — <type>.<hash>.paper /
    # <type>.<hash>.preview — so a byte-identical URL can never change
    # meaning, same reasoning and same header as /assets/ above. Before that
    # these had fixed names and could only be given max-age=86400, which made
    # a returning user re-download 7.4 MB a day.
    #
    # (#342) `gzip off` is load-bearing, not a micro-optimisation. These files
    # are ALREADY gzip streams — the bake compresses them and paperLoader.ts
    # inflates them with an explicit DecompressionStream. `.paper`/`.preview`
    # are extensions nginx's mime.types has never heard of, so they go out as
    # application/octet-stream, which is in gzip_types above (added for the
    # proxied /socket.io/ and /api/ JSON — see that comment), and nginx was
    # re-compressing 7.4 MB of incompressible data on every cache miss.
    # Measured on prod: 7 404 317 B with gzip against 7 402 039 B without,
    # i.e. it came out 2 KB *larger* after a full comp_level 6 pass on a
    # 1-vCPU box. The real cost is not the CPU though: a compressed response
    # has no length known up front, so it lost Content-Length and
    # Accept-Ranges and got a weak ETag — and no Content-Length means no
    # honest progress bar on the room's loading screen, which is what this
    # actually blocks.
    #
    # Scoped here rather than by dropping application/octet-stream from
    # gzip_types on purpose: fixing it 50 lines away would be action at a
    # distance, and it would silently come back the moment anything gave
    # these files a different content type. A regex location beats the
    # /paper/ prefix location below outright (nginx tries `=`, remembers the
    # longest prefix, then tests regexes — a regex match wins unless the
    # prefix was `^~`), so nothing here is inherited from it and the
    # Cache-Control has to be restated.
    #
    # Deliberately NOT `always` here, unlike every other add_header in this
    # file. `always` is what extends a header to error responses, and a 404
    # carrying a year of explicit freshness is a cacheable 404: a browser is
    # entitled to reuse it, and this location's pattern matches the *old*
    # fixed names too (`/paper/coarse.paper`), which every client still running
    # a pre-#322 bundle requests for the few minutes after this deploy. Pinning
    # those 404s for a year would outlive any server-side fix, including
    # reverting #322. Without `always` the header still covers 200 and 304,
    # which is the entire set that wants it.
    location ~ ^/paper/.+\.(paper|preview)$ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else under /paper/ — today just the bake's manifest, which
    # maps paper type -> hashed filename and so cannot be hashed itself. Same
    # argument as index.html below: it is the one unhashed pointer into an
    # immutably-cached set. A stale manifest names a file the last deploy's
    # `rsync --delete` already removed, so the failure mode is a 404 and no
    # paper texture at all, not cosmetic staleness.
    #
    # Left as a prefix catch-all rather than `location = /paper/manifest.json`
    # so anything unhashed added here later is safe by default: a wrong
    # `no-cache` costs one 304, a wrong `immutable` is unrecoverable.
    #
    # Note there is deliberately no try_files here — it is not inherited from
    # `location /` (a location inherits from server/http level, never from a
    # sibling), so a missing file under /paper/ 404s instead of falling back
    # to index.html. That is the behaviour we want: paperLoader.ts checks
    # res.ok, and a 200 carrying an HTML body would otherwise be handed to
    # JSON.parse — or, worse, to DecompressionStream — as if it were the bake.
    location /paper/ {
        add_header Cache-Control "no-cache" always;
    }

    # (#47) nginx only added `application/manifest+json webmanifest` to its
    # bundled mime.types in 1.21.1; on an older build the manifest goes out
    # as application/octet-stream and Chrome logs a content-type warning
    # instead of installing cleanly. Fixing it per-location rather than with
    # a server-level `types { … }` block on purpose: that block *replaces*
    # the inherited type map wholesale rather than extending it, which would
    # silently turn every .css and .js here into octet-stream too. An empty
    # `types {}` plus `default_type` scoped to this one file has no such
    # blast radius.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # react-router (client-side routing) — any path that isn't a real static
    # file falls back to index.html so a deep link (e.g. /room/abc123)
    # doesn't 404 on a hard refresh.
    #
    # (#294) `no-cache` is not "don't cache" — it's "cache, but revalidate
    # every time", i.e. one cheap 304 per load. It has to be here because
    # index.html is the only *unhashed* entry point in the bundle: it names
    # which content-hashed /assets/ chunks to load, and those are cached
    # immutably for a year. Without an explicit header nginx sent only
    # ETag/Last-Modified, so browsers fell back to heuristic freshness and
    # happily kept serving yesterday's index.html — pinning a returning
    # visitor to the previous deploy's JS while the server had already moved
    # on. That is not cosmetic: #289 renamed a Socket.io event
    # (peer_operation -> operation_confirmed), and a client stuck on the old
    # bundle listens for an event the new server never emits, so peer strokes
    # simply never appear. Caught on 2026-07-26 while re-measuring #291 —
    # the measurement itself came back unchanged because the tab was running
    # the pre-deploy bundle.
    #
    # Applies to the real static files served from here too (favicon,
    # manifest, robots.txt) — none of those are content-hashed either, so
    # revalidating them is equally correct.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/5ryx.l.time4vps.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/5ryx.l.time4vps.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name grafetto.com www.grafetto.com 5ryx.l.time4vps.cloud;

    # Same exception as above, and for the same reason: the validator fetches
    # this over plain http first. Let's Encrypt does follow a redirect to
    # https, but only after the file is reachable at all, and a blanket
    # redirect on a name whose certificate is not issued yet is a worse first
    # step than simply serving the file.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else goes to https on the same host. `$host`, not a literal:
    # this block answers for three names and each should stay on its own
    # while the certificate is being extended.
    location / {
        return 301 https://$host$request_uri;
    }
}
